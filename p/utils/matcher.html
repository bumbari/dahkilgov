е воры не уводят."}, {"id": 888, "inh": "Къаьна бордз говзаг1а хул.", "rus": "Старый волк хитрее."}, {"id": 889, "inh": "Къаьнадар хоастаде, къонадар эца.", "rus": "Старое – похвали, молодое – купи."}, {"id": 890, "inh": "Къаьнача берзо ши устаг1а бихьаб.", "rus": "Старый (бывалый) волк двух овец уносит."}, {"id": 891, "inh": "Къаьначо ши никъ кхихьаб, къоначо цхьа никъ кхихьаб.", "rus": "Старый пройдет двуми путями, пока молодой идет одним."}, {"id": 892, "inh": "Къаьра биачох дув баханза 1ец.", "rus": "За ложную клятву бог наказывает."}, {"id": 893, "inh": "Къе маьчи лелаечул когаш берзан лелар тол.", "rus": "Лучше ходить босиком, чем в тесных чувяках."}, {"id": 894, "inh": "Къе саг миста берх1а кхоачабаларах кхийрав.", "rus": "Бедняк боялся, что рассол от сыра кончится (и придется чурек есть сухим)."}, {"id": 895, "inh": "Къе саг къушта а ва гоама.", "rus": "Бедного и воры не любят."}, {"id": 896, "inh": "Къе-в1аьхий вар, аьнна, т1еххьара марх1а доллар мерчи мара дац.", "rus": "Богач ли, бедняк ли – последнее его достояние – саван."}, {"id": 897, "inh": "Къевар сага везац: е дезала а, е наьха наха а.", "rus": "Бедного не любят ни в семье, ни в народе."}, {"id": 898, "inh": "Къел-моцал – цхьан юкъа хинна йоачан; майрал-денал – божаргбоаца Башлоам-корта.", "rus": "Голод и бедность – временная непогода; мужество и смелость – несокрушимый Казбек."}, {"id": 899, "inh": "Къечо мекхех думе лич хьийкхаб.", "rus": "Бедняк усы смазывал курдюком (чтобы посчитали его богатым)."}, {"id": 900, "inh": "Къечоа атта да: г1ув бетта безац цун.", "rus": "Хорошо бедняку: ему не надо хлев держать на запоре."}, {"id": 901, "inh": "Къечун пхьег1а ц1ена хул, ц1аг1а мозий а лелац.", "rus": "У бедняка и посуда чистая, и мух в доме не бывает."}, {"id": 902, "inh": "Къийвелча хов мала хиннав хьа бокъонцара доттаг1а.", "rus": "Лишь обеднев, узнаешь, кто был твоим истинным другом."}, {"id": 903, "inh": "Къинош доахка рузкъа хьарама да.", "rus": "Неправедно нажитое богатство греховно."}, {"id": 904, "inh": "Къинош 1оадар – жожаг1ата бода никъ тоабар.", "rus": "Накапливать грехи – мостить дорогу в ад."}, {"id": 905, "inh": "Къоала т1ехваьнна лелачун коа йоарх1аш яьннай.", "rus": "Двор вора бурьяном зарастает."}, {"id": 906, "inh": "Къоала ухачо къаьра дув буъ.", "rus": "Вор непременно становится клятвопреступником."}, {"id": 907, "inh": "Къоахка дале а дулх тол.", "rus": "Мясо лучше, даже если оно и жилистое."}, {"id": 908, "inh": "Къодаьча циско мотт бехьбаьб.", "rus": "Избалованная кошка постель измарала."}, {"id": 909, "inh": "Къона волаш ца хинна хьаькъал къавелча (модж к1айеннар аьнна) хиннадац.", "rus": "Не было ума в молодости, так и к старости (к седине) не прибавится."}, {"id": 910, "inh": "Къонавар къаьначох кхетац, къаьнавар къоначох кхет.", "rus": "Молодой старого не понимает, старый же молодого понимает."}, {"id": 911, "inh": "“Къонах ва” аларах хулаш вац къонах.", "rus": "Сколько ни тверди: “Я мужчина” – мужчиной не станешь."}, {"id": 912, "inh": "Къонах говраи сесагаи дикаг1а вовз.", "rus": "Конь и жена (лучше других) узнают (настоящего) мужчину."}, {"id": 913, "inh": "Къонах дезал 1алашбе г1ерташ ара лел, сесаг ц1аг1а шийна т1ехьа дезал боаккхаш яг1а.", "rus": "Пока мужчина где-то ходит, чтобы обеспечить семью, жена дома детей к себе приваживает."}, {"id": 914, "inh": "Къонах хила веза д1атехача бердах чакхваргволаш.", "rus": "Если метнется настояший мужчина, он даже сквозь скалу пролетит."}, {"id": 915, "inh": "Къонах ший метта к1ала воал.", "rus": "Мужчина находится во власти своего языка."}, {"id": 916, "inh": "Къонахчал долча даьна г1улакх ийшадац, зудал долча сага на1алт ийшадац.", "rus": "Мужественному всегда достойные дела достаются, а кокетливому (женоподобному) достаются проклятия."}, {"id": 917, "inh": "Къонахчоа товш дац хабараши йоахараши.", "rus": "Мужчине не приличествует болтать и сплетничать."}, {"id": 918, "inh": "Къанахчоа – топ-тур-шалта; кхалчоа – т1ор-маха-тай.", "rus": "Мужчине – ружье, сабля, кинжал; женщине – наперсток, игла, нитки."}, {"id": 919, "inh": "Къонахчоа эхь хета доаг1а шийна т1атуллача кийнах.", "rus": "Мужчина должен бояться осрамить (опозорить) свою папаху."}, {"id": 920, "inh": "Къонахчун дош болатах даь да.", "rus": "Слово настоящего мужчины из стали выковано."}, {"id": 921, "inh": "Къонахчун мах цо ше хьабаьр ба.", "rus": "Цена мужчины зависит от него самого."}, {"id": 922, "inh": "Къонахчун барзкъах йовзаргъя цун сесаг.", "rus": "По одежде мужчины можно узнать, что у него за жена."}, {"id": 923, "inh": "Къонахчун дош отташ хила деза.", "rus": "Мужское слово должно быть весомым (твердым)."}, {"id": 924, "inh": "Къоначоа нускал деза, къаьначоа маьнги беза.", "rus": "Молодому нужна невеста, а старику – кровать."}, {"id": 925, "inh": "Къорачунца цхьан минота къамаьл дечул б1арччача ден никъ бар тол.", "rus": "Лучше целый день идти пешком, чем одну минуту разговаривать с глухим."}, {"id": 926, "inh": "Къорга чу фуй ца ховш чуг1ертар чаво вохаваьев.", "rus": "Того, кто сунулся в берлогу, не осмотревшись, медведь разорвал."}, {"id": 927, "inh": "Къоталваьчо мара шалта 1оттаргъяц.", "rus": "Лишь ублюдок может ткнуть кинжалом (позорное действие)."}, {"id": 928, "inh": "Къу къуна оакхала водац.", "rus": "Вор на вора не доносит."}, {"id": 929, "inh": "Къувсаш ца диар даар а дац.", "rus": "Еда вкусна, когда ешь, опережая других."}, {"id": 930, "inh": "Къулбухьера йоаг1а йоачан – мар венна сийлг я, - г1ир-г1ир яьха соцаргья; г1инбухьера йоаг1а йоачан - воша венна йиша я, - йийлха 1аббалца соцаргьяц.", "rus": "Непогода с севера – жена, у которой умер муж, - слегка всплакнет и успокоится; непогода с юга – сестра, у которой умер брат, - не успокоится, пока не выплачется."}, {"id": 931, "inh": "Къуна говзалах говзал хиннаяц, къуна маькарлонах а маькарло хиннаяц.", "rus": "Мастерство вора – не мастерство, ловкость вора – не ловкость."}, {"id": 932, "inh": "Къуна дуне а готта хет.", "rus": "Вору и мир тесен."}, {"id": 933, "inh": "Къуна къу вовз.", "rus": "Вор вора узнает."}, {"id": 934, "inh": "Къуна тхов – сийна сигале; къуна мотт – 1аьржа лаьтта; къуна г1айба – пхьарса гола; къуна ювраг1а – хьекха мух; къуна совг1ат – наьха на1алт.", "rus": "Крыша для вора – синее небо; постель его – черная земля; подушка ему – локоть под головой; одеяло – быстрый ветер; награда ему – проглятие."}, {"id": 935, "inh": "Къуно вийна да вайнав, дас вийна къу вайнавац.", "rus": "Хозяин, убитый взломщиком, остался неотомщенным (т.к. вор скрывается); а грабитель, убитый хозяином, не остался неотомщенным (хозяин находится на своем дворе)."}, {"id": 936, "inh": "Къуно къу хоаставу.", "rus": "Вор вора хвалит."}, {"id": 937, "inh": "Къуно къуна къоал дича, Далла велавеннав, йоах.", "rus": "Бог рассмеялся, когда вор обворовал вора."}, {"id": 938, "inh": "Къуно сатувс беррига нах къоалага баларах.", "rus": "Вор мечтает, чтобы все пристрастились к воровству."}, {"id": 939, "inh": "Къухьигашца йоккха ц1и ювзаргъяц.", "rus": "Кизяками большой огонь не разжечь."}, {"id": 940, "inh": "К1азах 1омадаьр пхьарах дицденнадац.", "rus": "Пес не забывает то, что он щенком выучил."}, {"id": 941, "inh": "К1ай доаллача б1арга дуне 1аьржа хет.", "rus": "Глазу с бельмом весь мир черным кажется."}, {"id": 942, "inh": "К1ай яр, аьнна, 1аьржа яр, аьнна, хьакха ше маярра хьакха я.", "rus": "Что белая, что черная – свинья, она и есть свинья."}, {"id": 943, "inh": "К1айча кулгашта наьха къахьегам беза.", "rus": "Белые руки чужой труд любят."}, {"id": 944, "inh": "К1алхарчо зурма лекхача, т1авенар халхаваьннав.", "rus": "Когда встречающий на зурне заиграл, пришедший затанцевал."}, {"id": 945, "inh": "К1анат майра хиларх 1оажал (боршал) хьалхаяргъяц, к1ант зовза хиларах 1оажал т1ехьаяьргьяц.", "rus": "Сколь храбрым бы ни был молодец, мужского ему не прибавится (смерть не отодвинется); сколь трусливым бы ни был молодец, смертный час он не оттянет."}, {"id": 946, "inh": "К1арцхал ше хьат1адоаллашехьа а ира а долаш доаг1а.", "rus": "Колючка, лишь только пропастет, уже бывает острой."}, {"id": 947, "inh": "“К1езига кхы а д1ахо хол”, - оалаш, саг охка вахийтав.", "rus": "Частенько повторяя “чуточку подвинься”, человека в пропасть столкнули."}, {"id": 948, "inh": "К1езигачун мах бе ца ховчоа дукхачун хам бе хайнадац.", "rus": "Кто не знает цену малому, тот не сможет оценить большое."}, {"id": 949, "inh": "К1ерам боад берзалехьа сог.", "rus": "Свечу зажигают до наступления темноты."}, {"id": 950, "inh": "К1оага чу яьнна буц белгала я.", "rus": "Трава, выросшая в яме, не похожа на другую траву."}, {"id": 951, "inh": "К1оарга хий тайжа дода.", "rus": "Глубокая река плавно (величаво) течет."}, {"id": 952, "inh": "К1омала овла т1а к1омала эри йоал.", "rus": "Из корней конопли вырастают лишь коноплянные стебли."}, {"id": 953, "inh": "К1ур боаг1ача ц1и йоаг.", "rus": "Огонь горит там, откуда идет дым."}, {"id": 954, "inh": "К1ур боацаш кхуврч а хилац, г1алат доацаш нах а хилац.", "rus": "Без дыма очага не бывет, не ошибающихся людей также не бывает."}, {"id": 955, "inh": "Ла ца дувг1ача даь къамаьл – кашамашка лекха зурма.", "rus": "Говорить там, где тебя никто не слушает, все равно, что играть на зурне среди могил."}, {"id": 956, "inh": "Ладар соцаргда дог1а сецача; сагах йоалла ладарал д1аяргья, из велча.", "rus": "Крыша течь перестанет, когда дождь пройдет, а человек от своей никчемности избавится, только когда умрет."}, {"id": 957, "inh": "Ладувг1аш ваьг1ар коташаг1а хиннав лувш хинначох.", "rus": "Молчавший в выигрыше перед говорящим."}, {"id": 958, "inh": "Лазаро “ах1” оалийт.", "rus": "Болезнь заставляет охать."}, {"id": 959, "inh": "Лай саг, ше мел вах, цкъа мукъа 1ергвац е вирах ца 1аьхача, е демийле ца керчача.", "rus": "Неблагородный за всю свою жизнь хотя бы раз, но заорет по-ослиному или начнет валяться в пыли (совершит неблагородный поступок)."}, {"id": 960, "inh": "Лайна п1енда сотталургба, каглургбац.", "rus": "Ребро, вынесшее тяготы, гнется, но не ломается."}, {"id": 961, "inh": "Лайси дийттача, ц1и йоккхаг1а хул; дийшача, саг хьаькъал долашаг1а ху  "Счастье человека невозможно без счастья родной страны."}, {"id": 1063, "inh": "Мехках ваьнна лелачун каша хиннадац.", "rus": "Оторвавшийся от родны скинул без могилы."}, {"id": 1064, "inh": "Мехках ваьнначо мара бокъонца ший мехка хам баьбац.", "rus": "Истинную цену своей Родины узнает лишь тот, кто лишился ее."}, {"id": 1065, "inh": "Мехко баьккха б1арг байнаб.", "rus": "Глаз, выколотый всем миром, остался неотомщенным."}, {"id": 1066, "inh": "Мехко ваьккхар ваьннав, мехко воаваьр вайнав.", "rus": "За кем стояла родина, тот выжил; от кого она отреклась – сгинул."}, {"id": 1067, "inh": "Мехко дер ца дечун беркат хиннадац.", "rus": "Несчастлив тот, кто в делах и мыслях не со своей страною."}, {"id": 1068, "inh": "Мецача берзо лоам т1ара шо биаб.", "rus": "Голодный волк ел лед на горных вершинах."}, {"id": 1069, "inh": "Мецачоа говза хабараш эшац – шу хьаоттаде.", "rus": "Не нужны голодному твои умные речи – ты ему стол накрой."}, {"id": 1070, "inh": "Мецачо ду1ашка ладувг1ац – пхьерийга сатувс цо.", "rus": "Голодный не слышит молитвы – он думает об ужине."}, {"id": 1071, "inh": "Мецвенначоа укх дунен т1а мел долчул мерзаг1а хет ше хьалха т1акхаьчар.", "rus": "Для проголодавшегося самая вкусная на свете еда, которая первая ему подвернулась."}, {"id": 1072, "inh": "Мецвенначунга яах1ама а ма кийчаейта, шелвенначунга ц1и а ма лотаейта.", "rus": "Не позволяй готовить еду голодному, а печь разжигать промерзшему."}, {"id": 1073, "inh": "Миска бо ираз долашаг1а да мехках хаьда лелача сагал.", "rus": "Жалкий сирота счастливее того, кто родины лишился."}, {"id": 1074, "inh": "Мистаденнача хударо булкъаш бу (пайдан доацар дувцар).", "rus": "Прокисшая каша булькает (говорят о пустобрехе)."}, {"id": 1075, "inh": "Мистъеннача шуро къаръяьй керда яьккхар.", "rus": "Прокисшее молоко переспорило свежее."}, {"id": 1076, "inh": "Михо баьккха бихьа дом ба къа ца хьегаш даьккха рузкъа.", "rus": "Неправедно нажитое что пыль, унесенная ветром."}, {"id": 1077, "inh": "Миччахьа г1олла т1а  1262, "inh": "Рузкъа – б1аьсте дилла лоа – малх хьакхетташехьа деше д1адоал.", "rus": "Богатство – что весенний снег: лишь солнце глянет – тут и растает."}, {"id": 1263, "inh": "Рузкъа дар аьнна пайда бац, могаш-маьрша хьо веце.", "rus": "Нет толку от богаств, если нет здоровья и покоя."}, {"id": 1264, "inh": "Рузкъа – делкъелца, хьаькъал – валлалца.", "rus": "Богатство – до обеда, ум – до кончины."}, {"id": 1265, "inh": "Рузкъа долчаг1а малх а б1айхаг1а хьеж.", "rus": "Где богатство, там и солнце теплее светит."}, {"id": 1266, "inh": "Рузкъа д1а а хьа а лел, эхь-эздел цкъа д1адахача, дайна д1адоал.", "rus": "Богатство приходит и уходит, а благородство, если оно ушло, уже никогда не вернется."}, {"id": 1267, "inh": "Рузкъа ла халаг1а да къел ловчул.", "rus": "Труднее совладать с богатством, чем справиться с бедностью."}, {"id": 1268, "inh": "Рузкъа рузкъанга дода.", "rus": "Богатство к богатству идет."}, {"id": 1269, "inh": "Рузкъа ц1еца-хьацарца мара гулдаьдац.", "rus": "Лишь потом и кровью добывается богатство."}, {"id": 1270, "inh": "Рузкъа 1оаде 1омавеш санна рузкъана хьурмат де 1омаве веза.", "rus": "Учишь наживать богатство, учи его оберегать."}, {"id": 1271, "inh": "Рузкъах викъача сага б1арг куро хьеж.", "rus": "Пресытившийся богач смотрит на всех свысока."}, {"id": 1272, "inh": "Рузкъанца е хьаькъал а эхь-эздел а эцалургдац.", "rus": "Богатством ума, чести и благородства не купишь."}, {"id": 1273, "inh": "Рузкъа ма хьега, хьаькъалах хьега.", "rus": "Не завидуй богатству, завидуй уму."}, {"id": 1274, "inh": "Рузкъах хам бергбац, хьацарца из 1оа ца дича.", "rus": "Богатства не ценит тот, кто не добыл его своим потом."}, {"id": 1275, "inh": "Рузкъо б1аргаш кхаьла саг г1улакх-эзделах вехав.", "rus": "Ослепленный богатством забывает про стыд и благородство."}, {"id": 1276, "inh": "Са дезе, гош хьоабе.", "rus": "Хочешь спастись, ног не жалей."}, {"id": 1277, "inh": "Са доаллаш яларе, топо лоам а божабергбар.", "rus": "Если бы ружье обладало разумом оно бы и гору : "Цену человека люди знают."}, {"id": 1294, "inh": "Саг сага хьаьша ва, сага са дег1а хьаьша да.", "rus": "Человек – гость человека; душа человека – гость его тела."}, {"id": 1295, "inh": "Саг сигала а г1оргва, форда бухе а г1оргва – сага дегчу-м кхоачаргвац.", "rus": "И в небеса, и в морские глубины проникнет человек, но он не сможет проникнуть в человеческое сердце."}, {"id": 1296, "inh": "Саг 1емав кхоанарча диканга сатувса.", "rus": "Человек привык надеяться на лучшее завтра (живет надеждами)."}, {"id": 1297, "inh": "Саг 1овешшехьа а валара кхол.", "rus": "Человек рождается для будущей смерти."}, {"id": 1298, "inh": "Саг 1охьоча хана Эча 1ехаш хул.", "rus": "Река Асса ревет, когда она несет человека."}, {"id": 1299, "inh": "Сага б1арг астаро мара бузабаьбац.", "rus": "Человеческий глаз насытит лишь земля могильная."}, {"id": 1300, "inh": "Сага вахар – б1арга ног1ар тоххал мара юкъ яц.", "rus": "Жизнь человека – не более мига движения глазного века."}, {"id": 1301, "inh": "Сага вахар мишта дода? Ди д1адода, бийса т1айог1а; шу д1адода, шу т1адоаг1а, - иштта д1авода, кашага кхаччалца.", "rus": "Как течет жизнь человека? День проходит, ночь настает; год проходит, другой настает… и так до могилы."}, {"id": 1302, "inh": "Сага дега къайле йовзаргьяц, цун баге аькх ца йоде.", "rus": "Тайна остается в сердце, пока язык на нее не донесет."}, {"id": 1303, "inh": "Сага дег1ар молла юхадаккха йишъяц.", "rus": "То, что суждено, мулла не изменит."}, {"id": 1304, "inh": "Сага дешар эшаш да, лаьтта дог1а санна.", "rus": "Человеку нужна учеба, как дождь нужен иссохшей земле."}, {"id": 1305, "inh": "Сага дикал-вол цун ц1аг1ара йоаг1а.", "rus": "Все хорошее и плохое в человеке родом из его дома."}, {"id": 1306, "inh": "Сага майрал ж1алена дика хов.", "rus": "Собака различает труса и храбреца."}, {"id": 1307, "inh": "Сага тац цхьан кога т1а икх йолаш, вокхан т1а хулчи йолаш хилар.", "rus": "Негоже, когда на одной ноге сапог, а на другой – чувяк."}, {"id": 1308, "inh": "Сага хозал – волки темноты дожидаются, а черные вороны утра не дождутся."}, {"id": 1324, "inh": "Сайрийна вийлхар 1уйранна вийлав.", "rus": "Вечером плакавший утром смеялся."}, {"id": 1325, "inh": "“Сайна дикадар даь саг вийна воаг1а со”, - яхаш доккхал деш хиннав б1еха саг.", "rus": "“Я иду, убив сделавшего мне доброе дело”, - хвастался человек черной души."}, {"id": 1326, "inh": "“Саламга” хьежжа “ва1алейкум” а хул.", "rus": "По “саламу” бывает и ответный “алейкум”. (По привету и ответ)."}, {"id": 1327, "inh": "Сардам эггар хьалха баьккхачох бода.", "rus": "Проклятие в первую очередь настигает того, кто его произнес."}, {"id": 1328, "inh": "Сардамаш доахача ц1аг1ара беркат д1адахад.", "rus": "Благодать покидает дом, в котором звучат проклятия."}, {"id": 1329, "inh": "Сатехача салтечох эпсар хиннав.", "rus": "Терпеливый солдат офицером стал."}, {"id": 1330, "inh": "Сатийначох ма теша, сихачох ма кхера.", "rus": "Тихоне не верь и вспыльчивого не бойся."}, {"id": 1331, "inh": "Сатоха а деза; са кхоачаделча, сихвала а мегаргвац.", "rus": "Надо быть терпеливым; но если даже терпение кончилось, и тогда нельзя горячиться."}, {"id": 1332, "inh": "Сатоха ховш хиларца вайзав денал дола саг.", "rus": "Мужественного человека узнают по его умению быть терпеливым (сдержанным)."}, {"id": 1333, "inh": "“Сахьата болх ца бе к1ира наб ергъяр аз”, - яхад мекъачо.", "rus": "Лентяй говаривал: “Чем работать один час, лучше спать всю неделю”."}, {"id": 1334, "inh": "“Саца” аьлча, соцаш воацар б1еха соцаву.", "rus": "Кто не понял слова “перестань”, того остановили грубой силой."}, {"id": 1335, "inh": "Сашорта ваха безам бале, довнаш ма даха.", "rus": "Хочешь спокойной жизни – не ищи ссор и вражды."}, {"id": 1336, "inh": "Се йийна бож даькъаза йоал.", "rus": "Пропащий тот (козел), кто женщину убьет."}, {"id": 1337, "inh": "Села хаьшк борц миссел мара дац, бакъда, кхийттача, хи божабу.", "rus": "Головешка (молния) бога Селы величиною с просяное зерно, но валит огромное дерево."}, {"id": 1338, "inh": "Сесаг а хила еза к1езига-дукха зудал доаллаш.", "rus": "И жена должна быть слегка кокетливою."}, {"id": 1339, "inh": "Сесаг къона дика я, доттаг1а къаьнаг1авар дикаг1а ва.", "rus": "Жена хороша молодая, а друг – давний."}, {"id": 1340, "inh": "Сесага а к1ордаву дукха ц1аг1а ваг1а къонах.", "rus": "Домосед и жене надоедает."}, {"id": 1341, "inh": "Сесага дикал-вол йовзаргья маьрц1аьшцеи лоалахошцеи цо леладеча г1улакхах.", "rus": "Хорошая или плохая жена узнается по ее отношению к мужней родне и соседям."}, {"id": 1342, "inh": "Сесага дикал-вол цун маьра барзкъах ейзай.", "rus": "По одежде мужа можно узнать, какая у него жена."}, {"id": 1343, "inh": "Сесага – майра лом, майрача къонахашта – даца устаг1а.", "rus": "Против жены – храбрый лев, против мужчин – трусливый барашек."}, {"id": 1344, "inh": "Сесага т1ехьаваьнна къонах йо1ала хет.", "rus": "Муж, потакающий во всем жене, кажется женоподобным."}, {"id": 1345, "inh": "Сесаго шайт1а а къардзаьд, сесаго сармак а эккхабаьб (фаьлгашкара).", "rus": "Жена (женщина) и черта одолела, и дракона прогнала (из сказок)."}, {"id": 1346, "inh": "Сецача хих ма теша.", "rus": "Остерегайся стоячей (тихой) воды."}, {"id": 1347, "inh": "Сецца араваьннар садовлехьа д1акхоач.", "rus": "Кто рано утром отправился в путь, тот до темноты дошел (до места)."}, {"id": 1348, "inh": "Сигала хьал лоаме оттабеннабац, форда т1а т1ий тулладеннадац.", "rus": "Лестницу до неба не построишь, мост через море не наведешь."}, {"id": 1349, "inh": "Сий довш эг1аваьккхав арг1а йоацаш маг1аваьннар.", "rus": "Того, кто не по праву занял почетное место, с позором отправили на свое (непочетное) место."}, {"id": 1350, "inh": "Сий долча наха г1улакх де, - хьайна доттаг1ий безе. Сий доацача наха г1улакх дой, - хьайна моастаг1ий бу 1а.", "rus": "Сделай добро благородным людям, и ты приобретешь друзей. Сделай добро плохим людям, и ты приобретешь врагов."}, {"id": 1351, "inh": "Сийг боабе аттаг1а да яьнна ц1и йоаечул.", "rus": "Легче искру загасить, чем потушить пожар."}, {"id": 1352, "inh": "Сийг кхоачача й1овхал а кхоач.", "rus": "Куда долетит искра, туда дойдет и тепло."}, {"id": 1353, "inh": "Сила мерзаг1а х1ама дац, б1аргал массаг1а х1ама дац.", "rus": "Нет ничего слаще души; нет ничего быстрее глаз."}, {"id": 1354, "inh": "Сискало гаргало (доттаг1ал) хотта.", "rus": "Совместная трапеза людей сближает."}, {"id": 1355, "inh": "Сих а ма ле, виц а ма ле (пхьа лехарах).", "rus": "Не спеши и не забывай (о кровной мести)."}, {"id": 1356, "inh": "Сих лета эздел – бохоргбоаца лоаман берд.", "rus": "Внутреннее (не показное) благородство крепче скалистого берега."}, {"id": 1357, "inh": "Сиха волчунца эг1ар хургда.", "rus": "Дружить со вспыльчивым – только ссориться с ним."}, {"id": 1358, "inh": "Сиха даха хий фордах кхийттадац.", "rus": "Слишком быстрая река до моря не дотекла."}, {"id": 1359, "inh": "Сиха доаг1ача хиво бердаш х1алакду.", "rus": "Быстрая река берега разрушает."}, {"id": 1360, "inh": "Сиха дийлха дог1а дедда д1адахад, лаьг1о дийлхар – лаьттах ийнад.", "rus": "Быстрый дождь потоками ушел, а моросящий – землю пропитал."}, {"id": 1361, "inh": "Сиха урхе яьккхачун корта б1огора бенав.", "rus": "Голова кружится у того, кто быстро восходит на гору."}, {"id": 1362, "inh": "Сихал йохка, сабар эца.", "rus": "Горячность продай, спокойствие (рассудительность) купи."}, {"id": 1363, "inh": "Сихало са даьккхад, сабаро лоам (мохк) баьккхаб.", "rus": "Нетерпеливость (торопливость, суетливость) душу надорвала, а спокойствие гору одолело (страну покорило)."}, {"id": 1364, "inh": "Сихал – 1овдал, сабар – кхетам (хьаькъал).", "rus": "Несдержанность – глупость, сдержанность – разумность (ум)."}, {"id": 1365, "inh": "Сихвелча а дехке воал, сов дукха садетташ ваьг1ача а воал дехке.", "rus": "Поспешишь – пожалеешь, промедлишь – тоже пожалеешь."}, {"id": 1366, "inh": "Сихвенна даь х1ама балийна дийрзад.", "rus": "В спешке сделанное – горем обернулось."}, {"id": 1367, "inh": "Сихвеннача пхьаро даь г1анд ши ког болаш хиннад.", "rus": "У поспешившего плотника стул на двух ножках оказался."}, {"id": 1368, "inh": "Сигалара дошув 1очуделхаш хилча а, къе нах хургбар.", "rus": "Даже если бы с небес дождем сыпалось золото, все равно были бы бедные люди."}, {"id": 1369, "inh": "Сигала морх йоацаш, дог1а делхарг ма дац; дега т1а бала боацаш, б1арг белхарг ма бац.", "rus": "Без туч на небе дождь не пойдет, без горя на сердце слезы не польются."}, {"id": 1370, "inh": "Сийдоацача вала атта да, сийдолаш лела хала да.", "rus": "Легко лишиться чести, трудно ее сохранить."}, {"id": 1371, "inh": "Сийдолаш ваьха вале, валар а сийдолаш хургда хьа.", "rus": "Если ты жил в почете, то в почете же и скончаешься."}, {"id": 1372, "inh": "Сискал йоацача ц1енах цхьа дика доал – мозийи дехкийи хилац.", "rus": "Дом, в котором нет достатка, имеет одно преимущество: в нем не водятся мухи и мыши."}, {"id": 1373, "inh": "“Со” аьннача хана дов сага ираз.", "rus": "Несчастным становится якающий гордец."}, {"id": 1374, "inh": "“Со морг мичав?” – яха къонах а, кхыметтале, набаро эшаваьв.", "rus": "Сон одолевает даже того, кто считает себя самым сильным мужчиной."}, {"id": 1375, "inh": "“Со” яхаш, нахана сонта вийнар “хьо” яхаш, наха бег ваьхав.", "rus": "Того, кто “якает”, того люди “тыкают”."}, {"id": 1376, "inh": "Сов дукха дезаро к1езига дезийтад.", "rus": "Чрезмерная жадность привела к тому, что приходится довольствоваться самым малым."}, {"id": 1377, "inh": "Совг1ат денначо сатувс совг1атага.", "rus": "Подаривший рассчитывает на ответный подарок."}, {"id": 1378, "inh": "Сов дукха къамаьл деш вола саг г1алата воал.", "rus": "Болтливый обязательно сболтнет лишнее."}, {"id": 1379, "inh": "Сов дукха хестадеча х1амах ма теша.", "rus": "Не верь тому, то чрезмерно хвалят."}, {"id": 1380, "inh": "Сов кходеш леладаь дег1, боча дувла даьннад.", "rus": "Тело, которое чрезмерно оберегали, изнежилось."}, {"id": 1381, "inh": "Сов к1аьда ма хила, - 1ажах санна царгаш еттаргъя хьох; сов г1ожа ма хила – ж1али санна эккхоргва хьо.", "rus": "Не будь чрезмерно сладким – как яблоко, будут тебя кусать; не будь грубым – отовсюду будут гнать тебя, как собаку."}, {"id": 1382, "inh": "Сов лакха латтар 1окхет, сов д1аьхденнар хад.", "rus": "Слишком вознесшееся упадет, слишком растянувшееся порвется."}, {"id": 1383, "inh": "Сов мерза хьо хуле, т1а мел кхаьчачо вуаргва хьо, сов къахьа хуле, нах кхардаргба хьох.", "rus": "Будешь слишком сладок, всякий тебя съест; будешь слишком горьким (ершистым) – всякий отвернется от тебя."}, {"id": 1384, "inh": "Сои пирстопи в1ашаг1алетар: пирстопо сона тохаш, сона пирстопа тохаш.", "rus": "Подрались я и пристав: сначала пристав бил меня, потом меня бил пристав."}, {"id": 1385, "inh": "Сом ца латача гаьна тара ва цхьаккхача х1аманна пайданавоацар.", "rus": "Никчемный бездельник подобен бесплодному дереву."}, {"id": 1386, "inh": "Сурт-т1аьх ваьлча мара кхачац ялсамале.", "rus": "Чтобы попасть в рай, надо перейти по мосту Сурат."}, {"id": 1387, "inh": "Сутара саг къамарга думе этта веннав.", "rus": "Жадина подавился курдюком и умер."}, {"id": 1388, "inh": "Сутарча сагаца гаргало ма лелаелахь, - шин кепигал мах боацача меттиге цо вохкаргва хьо.", "rus": "Со скупцом не водись, потому что он продаст тебя за пару медных грошей."}, {"id": 1389, "inh": "Тайнача ца дитар, ийг1ача дитад.", "rus": "То, что не было прощено при примирении, простили при ссоре."}, {"id": 1390, "inh": "Талха доладенна х1ама талхаш-талхаш д1ачакхдалийта деза.", "rus": "Начало портиться (дело) – так пусть уж портится до конца."}, {"id": 1391, "inh": "Тараз т1а оттадича, бакъ долча дешал дезаг1а х1ама хиннадац.", "rus": "Когда правдивое слово положили на весы, ничто не смогло его перевесить."}, {"id": 1392, "inh": "Тарамий барт хуле, заохалол хургда.", "rus": "Если двойники-духи сговорятся, то свадебный сговор состоится."}, {"id": 1393, "inh": "Тахан ахчах ийцача новкъостах кхоана моастаг1а хиннав.", "rus": "Купленный сегодня друг (за деньги) уже завтра сделается врагом."}, {"id": 1394, "inh": "Тахан де йиш яр кхоаненга ма даккха: хоттаргда, аьнна, пхьидан (саь) ц1ог хоттанза дисад.", "rus": "Что можно сделать сегодня, не откладывай на завтра: отложили на завтра лягушке (оленю) хвост приладить, да так и осталась бесхвостой."}, {"id": 1395, "inh": "Тахан – к1аьнк, кхоана – къонах; кхоана – къонах, ломма – воккха саг; ломма – воккха саг, ц1улла – юха а бер.", "rus": "Сегодня - мальчик, завтра – мужчина; завтра – мужчина, послезавтра – старик; послезавтра – старик, поза-послезавтра – вновь ребенок."}, {"id": 1396, "inh": "Тахан лергволаш санна наха дикадар де, в1алла лергвоацаш санна дуне лаха.", "rus": "Спеши делать добро, словно уже завтра умрешь; спеши жить в свое удовольствие, словно не умрешь никогда."}, {"id": 1397, "inh": "Тахан харца аьннар (харца даьр) кхоана духьаладаьннад.", "rus": "Сегодня солгал (поступил дурно) – завтра поплатился."}, {"id": 1398, "inh": "Таьлми доаккха котам дикаг1а я бер ца деча сесагал.", "rus": "Наседка лучше бездетной жены."}, {"id": 1399, "inh": "Текхарго яьхад: “Со кхераш цхьа х1ама да: був ваьнначо сох муш тарбенна, се д1абахьарах”.", "rus": "Уж говорил: “Одного я боюсь: вдруг отделяемый от семьи женатый сын примет меня за веревку и унесет в свое хозяйство”."}, {"id": 1400, "inh": "Тенна котвала воша ма хилва, нийса ваха воша ма эшалва.", "rus": "Пусть не будет братьев богаче и сильнее тебя; пусть будет больше братьев, равных тебе во всем."}, {"id": 1401, "inh": "Тешам – сага юхь.", "rus": "Надежность во всем – лицо человека."}, {"id": 1402, "inh": "Тешаме воацар зуламе ва.", "rus": "Опасен тот, кому нельзя доверять."}, {"id": 1403, "inh": "Тешаме воацар хьа доттаг1а вац.", "rus": "Тот не друг, кому нельзя довериться."}, {"id": 1404, "inh": "Тийшаболх бекхам боацаш бисабац.", "rus": "Подлость не осталась без возмездия."}, {"id": 1405, "inh": "Тийшаболх лелабаьча коа нитташ баьннаб.", "rus": "Двор подлых (предательских) людей зарастет крапивой."}, {"id": 1406, "inh": "Тийшача балхах дикадар даьннадац.", "rus": "От подлости хорошего не жди."}, {"id": 1407, "inh": "Тиркал дехье ца къисача, сехье хиннаяц.", "rus": "Хочешь уберечь свой берег Терека – борись за противоположный."}, {"id": 1408, "inh": "Тирко 1охьоча ж1айрахочо яьхад: “Буро т1а вода со!”", "rus": "Терек уносил джейраховца, а тот говорил: “Направляюсь в Буро (Владикавказ)”."}, {"id": 1409, "inh": "Тиша барзкъа ц1енча барзкъа 1у ва.", "rus": "Старая одежда в услужении у новой (сохраняет новую)."}, {"id": 1410, "inh": "Тишъенна карти, гирдзъенна говри, ябакха зурмеи, селий фатеи цхьатарра я.", "rus": "Все едино: что старый плетень, что чесоточная лошадь, что волынка, что сулакский бубен."}, {"id": 1411, "inh": "Ткъам боаца лаьча къайгаша чувхадаьд.", "rus": "Бескрылого сокола и вороны гоняют."}, {"id": 1412, "inh": "Ткъамаш доацар – оалхазар дац, ший мохк боацар – адам дац.", "rus": "Птица без крыльев – не птица, человек без родины – не человек."}, {"id": 1413, "inh": "Ткъо шу даьннар берза тара хул – д1аверзар, хьаверзар кадай долаш; шовзткъа шу даьннар – ц1окъа лома тара ва – денал долаш, т1акхийтта шийна дезар хьадоаккхаш; кховзткъа шу даьннар чана тараверз – мекъвенна, вижара т1ера волаш.", "rus": "Двадцатилетний похож на волка – шустрый, быстрый; сорокалетний похож на барса – мужественный, своего не упустит; шестидесятилетний похож на медведя – ленивый и склонный к спячке."}, {"id": 1414, "inh": "Товр даьчунна ловр даьд.", "rus": "Дали желаемое тому, кто отнесся с почтением."}, {"id": 1415, "inh": "Товш доаца г1алаташ дукха дувцача сага къинош дукха хул. Къинош дукха долча сага эхь хетац. Эхь ца хета саг хьарамча х1амах къахкаш хилац.", "rus": "Много грехов у того, кто муссирует чужие недостатки. Накопивший грехи теряет стыд и совесть. Потерявший их может сделать любую пакость."}, {"id": 1416, "inh": "Топо къеставац шийвари наьхавари, - ше хьожаяьча кхет из.", "rus": "Ружье не разбирает своих и чужих – оно стреляет туда, куда его направляют."}, {"id": 1417, "inh": "Топо ца1 вийнав, метто ийс вийнав.", "rus": "Ружье убило одного, язык – десятерых."}, {"id": 1418, "inh": "Топ-тапчо бегаш бац.", "rus": "Ружье, пистолет (огнестрельное оружие) шуток не знают."}, {"id": 1419, "inh": "Топ-туро ца даьр сискало даьд.", "rus": "Чего не достигли силою (саблею и ружьем), того достигли хлебом-солью."}, {"id": 1420, "inh": "Топ-тур-шалто ца даьр метто даьд.", "rus": "Язык сделал то, чего не удалось ружью, сабле и кинжалу."}, {"id": 1421, "inh": "Тоха езача хана техача – топ, ца езача хана техача – тийшаболх.", "rus": "Стрельнул, когда надо, - ружье; стрельнул, когда не надо, - горе."}, {"id": 1422, "inh": "Тохаргйоаца шалта йоаккхачул тохаргбола бий бича тол.", "rus": "Чем зря вытаскивать саблю из ножен, лучше сжать кулак, который пойдет в дело."}, {"id": 1423, "inh": "Тураца модж яьша веннар корта боацаш висав.", "rus": "Кто использует саблю для бритья ,тот рискует остаться без головы."}, {"id": 1424, "inh": "Туро кхераваьр г1ажах кхийрав.", "rus": "Напуганный саблею, палки боялся."}, {"id": 1425, "inh": "Тух диачо хий мийнад.", "rus": "Поевший соленое воду пил."}, {"id": 1426, "inh": "Тух дукха техача а мегац, к1езига техача а мегац.", "rus": "Много соли – плохо, мало соли – тоже плохо."}, {"id": 1427, "inh": "Туха чам байначун хина чам хиннабац.", "rus": "Кто потерял вкус соли, тот забыл вкус воды."}, {"id": 1428, "inh": "Тухах яь г1ала дог1а йошаяьй.", "rus": "Башню из соли дождь размыл."}, {"id": 1429, "inh": "Тух-сискало гаргало ч1оаг1ъю.", "rus": "Хлеб да соль укрепляют родство."}, {"id": 1430, "inh": "Т1абенача дахкилго к1алхарабар эккхабаьб.", "rus": "Пришлая мышка местную изгнала."}, {"id": 1431, "inh": "Т1адена во ла хала дале а т1адена дика ла дуккха халаг1а да.", "rus": "Трудно вынести несчастье, но куда труднее вынести нежданно свалившееся счастье."}, {"id": 1432, "inh": "Т1адоацар леладечунга кхача ца дезар кхоач.", "rus": "Занимавшемуся не своим делом досталось то, чего он не ждал."}, {"id": 1433, "inh": "Т1аха ды лелабе, готанна д1абожа уст лелабе.", "rus": "Держи коня для верховой езды, а быка – для пахоты."}, {"id": 1434, "inh": "Т1ачовхарах кхера ма ле, хьастарах 1еха ма ле.", "rus": "Не страшись угроз и не обманись лестью."}, {"id": 1435, "inh": "Т1аьда болаш ца хьовзабаь саьрг бокъабелча хьовзабеннабац.", "rus": "Прут зеленый – гнется, высохший – ломается."}, {"id": 1436, "inh": "Т1ем т1а сенна вода ши сесаг йола к1ант: боккха т1ом беций цун ц1ен юкъе латтар (илле т1ара).", "rus": "Зачем двоеженцу идти на войну: ведь самая большая война у него дома (из народной песни)."}, {"id": 1437, "inh": "Т1ема духьала т1ом мара товргбац, тоама духьала тоам мара товргбац.", "rus": "Соответствуют друг другу: война – войне, мир – миру."}, {"id": 1438, "inh": "Т1ема майралца котваьнна паччахьа вац, т1ема говзалца мара.", "rus": "В войне цари побеждают не мужеством, а умением (военной хитростью)."}, {"id": 1439, "inh": "Т1емо во1 ваьвац, - во1 вийнав.", "rus": "Война не родила сына, она его убила."}, {"id": 1440, "inh": "Т1арадар к1алг1оргда, к1алхардар т1адаргда.", "rus": "Возвысившееся падет, падшее возвысится."}, {"id": 1441, "inh": "Т1ерачул кхоаччараг1а я чухьара коч.", "rus": "Нательная рубашка ближе верхней одежды."}, {"id": 1442, "inh": "Т1ехьа пандар боацаш, илли а оалалац; тохаш т1оараш доацаш халха а воалалац.", "rus": "Без гармошки песня не поется, без прихлопа не танцуется."}, {"id": 1443, "inh": "Т1ехьависачун дакъа циско (цискаша) диад.", "rus": "Долю опоздавшего кошка (кошки) съела (съели)."}, {"id": 1444, "inh": "Т1ехьаотта адам ца хилча, паччахьах а паччахь хиннавац.", "rus": "И падишах (царь…) не стал падишахом, если за ним народ не стоял."}, {"id": 1445, "inh": "Т1ехье йоаца нах ц1аьрмата (къиза) хул.", "rus": "Люди, не имеющие наследников, бывают жадными (жестокими)."}, {"id": 1446, "inh": "Т1ехьенна боккха боахам битарал дикаг1а да дика ц1и йитар.", "rus": "Наследникам лучше оставить доброе имя, чем большое богатство."}, {"id": 1447, "inh": "Т1ом лийхачоа каша корадаьд.", "rus": "Искавший войну нашел могилу."}, {"id": 1448, "inh": "Т1ехьаг1а дехкеваргвола х1ама ма де.", "rus": "Не делай того, в чем после раскаешься."}, {"id": 1449, "inh": "Уйла йий мара ара ма вала.", "rus": "Не отправляйся в путь, не обдумав предстоящее."}, {"id": 1450, "inh": "Уйла йоацаш даь х1ама бала боацаш къаьстадац.", "rus": "Необдуманный поступок влечет за собою беду."}, {"id": 1451, "inh": "Уйла ца еш, дош ма ала; аьнна ваьлча, юха а ма вала.", "rus": "Не подумав, не говори, а сказав, не отступай."}, {"id": 1452, "inh": "Уллача берзийла лийна цогал теннад.", "rus": "Рыскающая лиса добычливее волка-лежебоки."}, {"id": 1453, "inh": "Уллув вала доттаг1а воацаш наькъаг1а ма г1о.", "rus": "Не отправляйся в дальний путь без друга."}, {"id": 1454, "inh": "Уллув дика новкъост хилча, никъ лоацаг1а хул.", "rus": "Дорога становится короче, если рядом хороший товарищ."}, {"id": 1455, "inh": "Унах ведда б1оаг1а т1ехьашка эттар а унах ваннав.", "rus": "От заразной (чумной) болезни спасся даже тот, кто затаился за столбом."}, {"id": 1456, "inh": "Урсо техар ерзаргъя, метто яьр ерзаргъяц.", "rus": "Рана, нанесенная ножом, заживет, рана, нанесенная языком, не заживает."}, {"id": 1457, "inh": "Урхе йоаккхачоа ха деза мухале яьккха езаргйолга.", "rus": "Идущий в гору должен знать, что ему еще предстоит спуститься под гору."}, {"id": 1458, "inh": "Урхе йоаккхачо мара яьккхаяц мухале.", "rus": "Спуск одолевает лишь тот, кто одолел подъем."}, {"id": 1459, "inh": "Урхенгахьа вир хьаллалла хьай безам бале, мухаленгахьа озаде.", "rus": "Хочешь, чтобы ишак пошел в гору, - тяни его под гору."}, {"id": 1460, "inh": "Уст белча, дулх хиннад; ворда ехача, дахча хиннад.", "rus": "Пал бык – мясо, сломалась арба – дрова."}, {"id": 1461, "inh": "Уст хила г1ийрта пхьид яьтт1ай.", "rus": "Пыжилась лягушка стать быком и… лопнула."}, {"id": 1462, "inh": "Устаг1ан т1ера тха дукхаза лорг, ц1ока цкъа мара яьккхац.", "rus": "Овцу стричь можно много раз, но освежевать – лишь раз."}, {"id": 1463, "inh": "Укх дуне т1а массанел яькхаг1а сага гийг я.", "rus": "Самый жадный (ненасытный) на свете – это человеческий живот."}, {"id": 1464, "inh": "Ц1аьрматача фусам-дас яьхад: “Укх кхаба чу даларе, укх чаме чу а детташ, них меладергдар аз хьона”.", "rus": "Скупой хозяин приговаривал: “Если бы в этом кувшине была брага, я бы наливал ее в этот кубок и поил тебя”."}, {"id": 1465, "inh": "Ферта кхеллача а гуш хул т1абаьнна букъ.", "rus": "Даже буркой не скроешь горб."}, {"id": 1466, "inh": "Фата еттачул къулг бийттача тол.", "rus": "Чем бить в бубен, полезнее взбивать маслобойку."}, {"id": 1467, "inh": "Фийг д1а ца бийча, г1адам т1адаьннадац.", "rus": "Не посеешь зерно, не вырастет стебель."}, {"id": 1468, "inh": "Форда бухе кхача веннар форда бухе висав.", "rus": "Кто стремился попасть на морское дно, на дне и остался."}, {"id": 1469, "inh": "Фордала кхесса цу коана хила баха кхера мо байнаб.", "rus": "Горсть толокна, брошенная в море, пропала словно камень, брошенный в воду."}, {"id": 1470, "inh": "“Фу ала воал хьо?” – хаьттача, дов дезачо т1ачайхха аьннад: “Хьо фу ала воал?”.", "rus": "Когда склочника спросили о чем-то: “Что ты хочешь сказать?”, - он напустился: “А ты чего хочешь?”."}, {"id": 1471, "inh": "Фу ду хьох: эккхавича, лаца ц1ог а дац хьа; хьовзаве му1а а яц хьа.", "rus": "Что с тебя взять: у тебя и хвоста нет, чтобы за него ухватиться; у тебя и рогов нет, чтобы тебя крутануть."}, {"id": 1472, "inh": "Фуаши хийи мелла кхехкадарах в1аший эц.", "rus": "Сколько ни вари воду и яйца, они не смешиваются."}, {"id": 1473, "inh": "“Фуд цига?” – аьнна, хаьттача, - х1ама дац, хьалла вийна чувахьа тхавар ва из-м”, - яхад воча сесаго.", "rus": "Спросили: “Что случилось?”, - и плохая жена ответила: “Да ничего особенного, это несут убитого моего мужа”."}, {"id": 1474, "inh": "“Фунехк-минехк дергда аз!” – яхаш дукъа 1ийхачо цхьаккха а даьдац.", "rus": "Грозивший, что он сделает что-то страшное, необычное, - ничего не сделал."}, {"id": 1475, "inh": "Фусам-да вовзаргва, цун ков-картага хьежача.", "rus": "Каков хозяин узнаешь, обозрев его дом и двор."}, {"id": 1476, "inh": "Фусам-да – устаг1а, хьаьша – бордз.", "rus": "Хозяин – овца, гость – волк."}, {"id": 1477, "inh": "Фусам-да ший ц1аг1а аьла ва.", "rus": "Хозяин в своем доме – князь."}, {"id": 1478, "inh": "Фусам-дай дика хилча, фусам й1айхаг1а хул.", "rus": "Если хозяева хорошие, то и гостиная теплее."}, {"id": 1479, "inh": "Фусам-даь эздел – г1улакхаца; хьаьший г1улакх – эзделца.", "rus": "Благородство хозяина в услужливости гостю, услужливость гостя – в благородстве к хозяину."}, {"id": 1480, "inh": "Фусам-даьна худар де дага хиннадац, хьаьша дулх-хьалт1амга сатувсаш ваьг1ав.", "rus": "Хозяин даже кашу варить не собирался, а гость уже мечтал о мясе с галушками."}, {"id": 1481, "inh": "Фусам-да дика волча ц1аг1а хьаьший дукхаг1а ух.", "rus": "К хорошему хозяину гости чаще ходят."}, {"id": 1482, "inh": "Фусам-нана хьурмат деш хуле, беркат хургда.", "rus": "У бережливой хозяйки в доме достаток."}, {"id": 1483, "inh": "Ха йоацача хана кхайкхаш воа молла шайт1ашка кхайкх.", "rus": "Мулла, не вовремя призывающий к молитве, созывает шайтанов."}, {"id": 1484, "inh": "Ха яр пайда бац, цунна доал де хьона ца хой.", "rus": "Нет пользы от удачи, если ты не сумеешь ею воспользоваться."}, {"id": 1485, "inh": "Хабар дувца эттача, кхо оатхал еза: дирст, баргал, шод.", "rus": "Прежде чем начать разговор, нужно иметь три вещи: уздечку, путы, нагайку (чтобы обуздывать речь)."}, {"id": 1486, "inh": "Хабар хоза дувцаш, дош даьре дувцаш, хьаькъалах а оамалах а вай ма тувладолда.", "rus": "Да не собьют нас с толку красивыми речами, да шелковыми словами."}, {"id": 1487, "inh": "Хабара т1ера вола саг г1улакха пайданна хилац.", "rus": "Болтун в делах негож."}, {"id": 1488, "inh": "Хабарал худар тол.", "rus": "Лучше кашу есть, чем много болтать."}, {"id": 1489, "inh": "Хабарашта т1ера воаца 1овдал хьаькъал долаш хийтав.", "rus": "Молчаливого дурака приняли за умника."}, {"id": 1490, "inh": "Хабарца е саг а визавац, е г1ала а еттаяц.", "rus": "Пустой болтовней ни человека не накормишь, ни башню не построишь."}, {"id": 1491, "inh": "Хала дар, аьле, х1амах б1у ма къожабе; атта дар, аьле, тесса ма дита.", "rus": "Не пасуй перед трудным, не оставляй на самотек кажущееся легким."}, {"id": 1492, "inh": "Халаг1адар хьалхаг1а де, - аттаг1адар ше-шег1а хьахургда.", "rus": "Тяжелое дело делай в первую очередь, тогда легкое само собою сделается."}, {"id": 1493, "inh": "Хало ца 1ейшачоа оатто ейзаяц.", "rus": "Кто не прошел через трудности, тот не оценит легкого."}, {"id": 1494, "inh": "Халонех кхийрар диках кхийнавац.", "rus": "Боявшийся трудностей добра не заимел."}, {"id": 1495, "inh": "Халкъа низ – бух боаца 1ам.", "rus": "Сила народная – бездонное озеро."}, {"id": 1496, "inh": "Хам ца бича, х1ама карара доал.", "rus": "Если не бережешь, все из рук уходит."}, {"id": 1497, "inh": "Ханал хьалха даьтт1а зиза малхо матара дихьад.", "rus": "Солнце сожгло слишком рано распустившийся цветок."}, {"id": 1498, "inh": "Ханал хьалха кхайка борг1ал яь чу яхийтай.", "rus": "Не вовремя кукарекавший петух угодил в котел."}, {"id": 1499, "inh": "Ханнахьа д1адийнар ханнахьа т1адоал, бера хана 1омадаьр хьалкхийча накъадоал.", "rus": "Вовремя посеянное вовремя созрело, в детстве выученное на всю жизнь сгодилось."}, {"id": 1500, "inh": "Ханнахьа ца даьр шозза де дийзад.", "rus": "Вовремя не сделанное пришлось делать дважды."}, {"id": 1501, "inh": "Хано д1аэц дег т1ара бала.", "rus": "Время уносит горе из сердца."}, {"id": 1502, "inh": "Хар баьнна хи михо атта божабу.", "rus": "Дуплистое дерево легко ветер валит."}, {"id": 1503, "inh": "Харца аьнна дош шурийла керчадича а ц1енлургдац.", "rus": "Неправедное слово, хоть очищай его в молоке, все равно останется грязным."}, {"id": 1504, "inh": "Харца даь х1ама кхел йоацаш дисадац.", "rus": "Неправильно сделанное суда времени не избежит."}, {"id": 1505, "inh": "Харца леладу х1амеи гоама бетта пенни б1арга шаьра гу.", "rus": "Криво сложенная стена и неправедные дела очень хорошо видны."}, {"id": 1506, "inh": "Харца ма валийта саг; ваьлча, бакъахьа ваккха хала хул из.", "rus": "Не дай человеку оступиться: потом трудно вернуть его на правильный путь."}, {"id": 1507, "inh": "Харца лув саг топо мара къарвергвац.", "rus": "Лжеца лишь ружье остановит."}, {"id": 1508, "inh": "Харца лувча сагаца г1улакх ма леладе.", "rus": "Не водись с лжецом."}, {"id": 1509, "inh": "Харца ма ле – бакъдар х1аьта а т1адаланза дусаргдац.", "rus": "Не лги, правда ведь все равно выйдет наружу."}, {"id": 1510, "inh": "Харца 1оадаьча рузкъах хайреи пайдеи ханнабац.", "rus": "Ни пользы, ни счастья не было от неправедно нажитого богатства."}, {"id": 1511, "inh": "Харцахьа лувча метто корта лозабаьб.", "rus": "Врет язык, а достается голове."}, {"id": 1512, "inh": "Харцахьа хьайза хьастам нийсалургба, харцваьннар нийсве хала да.", "rus": "Погнувшийся гвоздь можно разогнуть, сошедшего с пути человека трудно исправить."}, {"id": 1513, "inh": "Харцахьа хьийжа б1арг б1аг1ара баьннаб.", "rus": "Глаз, смотревший куда не следует, окосел."}, {"id": 1514, "inh": "Харцдар – деша лоа, бакъдар – бутув кхера.", "rus": "Ложь – растаявший снег, правда – монолитный камень."}, {"id": 1515, "inh": "Харцдар дувцачоа дикадар хиннадац.", "rus": "Клеветнику добра не видать."}, {"id": 1516, "inh": "Харцдар дувце, лерг-м вац хьо, бакъда наьха тешамах-м варгва.", "rus": "От вранья не помрешь, но доверия людей лишишься."}, {"id": 1517, "inh": "Харцадолчо доттаг1ах а моастаг1а ву.", "rus": "Несправедливость и из друга делает врага."}, {"id": 1518, "inh": "Харцлеро сий доаду.", "rus": "Лживость приносит бесчестье."}, {"id": 1519, "inh": "Харцонна т1ехьаэтта дика хулачул, бокъонна т1ехьаэтта моастаг1а хилар тол.", "rus": "Чем идти неправедным путем, чтобы прослыть хорошим, лучше быть ославленным, но пойти по праведному пути."}, {"id": 1520, "inh": "Харцъяьнна нана во1о мара кхетаяьяц.", "rus": "Непутевую мать лишь ее сын вразумит."}, {"id": 1521, "inh": "“Хац” аьннар д1авахийтав, “хов” аьннар соцаваьв.", "rus": "Сказавшего “не знаю” отпустили, а сказавшего “знаю” задержали."}, {"id": 1522, "inh": "“Хац, дац” – цхьа дош, “хайра, дайра” – эзар дош.", "rus": "“Нет, не знаю” – одно слово, “знаю, видел” – тысяча слов."}, {"id": 1523, "inh": "“Хац” ма ала, “лац” ала.", "rus": "Не говори “не умею”, а говори “не хочу”."}, {"id": 1524, "inh": "Хачи лелаярах къонах хилац.", "rus": "Носить штаны – еще не значит быть мужчиной."}, {"id": 1525, "inh": "Хаьхочо къу зув, къуно хаьхо лараву.", "rus": "Сторож высматривает вора, вор следит за сторожем."}, {"id": 1526, "inh": "Хезачо ма теша, б1аргадайначох теша.", "rus": "Не верь тому, что услышал; верь тому, что видел."}, {"id": 1527, "inh": "Хестадаь лазар бочадаьннад.", "rus": "Болезнь, которую лелеяли, стала капризничать."}, {"id": 1528, "inh": "Хетташ волчоа дукхаг1а хов.", "rus": "Спрашивающий знает больше."}, {"id": 1529, "inh": "Хи божаш ца даьнна тата хи бежачул т1ехьаг1а даьннадац.", "rus": "Если не было шума при падении дерева, то его не было после падения."}, {"id": 1530, "inh": "Хи йисте ваг1арах чкъаьра хургбац, кхайна йисте ваг1арах ялат а хургдац.", "rus": "От сидения у реки рыба не появится, от сидения возле поля урожая не будет."}, {"id": 1531, "inh": "Хи йисте ваг1ачоа хина хам бовзац.", "rus": "Живущий у воды ее не ценит."}, {"id": 1532, "inh": "Хи йисте ваьхачоа хина гечув дайзад.", "rus": "Живущий у реки знает и брод через нее."}, {"id": 1533, "inh": "Хи йисте яг1ача бечох а алар ийшадац.", "rus": "Сплетничают даже про сваю, вбитую у реки."}, {"id": 1534, "inh": "Хи т1ара т1оа эцаргболаш ц1аьрмата хул цхьабараш.", "rus": "Бывают и такие жадные, что с воды сметану соберут (как с молока)."}, {"id": 1535, "inh": "Хиво хьайра кхестаю, хьаьрхочо боал ийбу.", "rus": "Вода мельницу крутит, а мельник гарнец (налог с помола) собирает."}, {"id": 1536, "inh": "Хиво чкъаьра лелабу, дег1о саг лелаву.", "rus": "Вода держит рыбу, тело держит человека."}, {"id": 1537, "inh": "Хий гича, чкъара хила; лоам гича, газа хила.", "rus": "Дошел до реки – стань рыбой, дошел до горы – стань козой."}, {"id": 1538, "inh": "“Хий дезе, виза ва; хий ца дезе, бага марха да”, - хьаьшах аьннад ц1аьрматача саго.", "rus": "“Попросит (гость) воды напиться – значит сыт, не попросит – значит уразу держит”, - сказал жадный хозяин."}, {"id": 1539, "inh": "Хий доацача хьайра оттаяц.", "rus": "Мельницу не ставят там, где нет воды."}, {"id": 1540, "inh": "Хий долчара мара эцац, хьаькъал долчунгара мара эцац.", "rus": "Воду берут там, где она есть; ум у того, у кого он есть."}, {"id": 1541, "inh": "Хийла денал дола къонах вехав 1оажала ди эттача.", "rus": "В смертный час нередко и мужественный человек проявляет слабость."}, {"id": 1542, "inh": "Хийла дикача даь коа во ж1али кхийнад.", "rus": "Нередко и на дворе хорошего хозяина вырастает плохая собака (плохой потомок)."}, {"id": 1543, "inh": "Хийла къайго лаьча 1ехадаьд.", "rus": "Случается, и ворона перехитрит сокола."}, {"id": 1544, "inh": "Хина йисте вахе а хина хьурмат де (кхом бе).", "rus": "Даже живя у реки, воду береги (цени)."}, {"id": 1545, "inh": "Хина чам хьогвенначоа мара бовзац.", "rus": "Вкус воды знает только испытывающий жажду."}, {"id": 1546, "inh": "Хиннар хиннад, д1адаьнар д1адаьннад.", "rus": "Что было, то было; что прошло, то прошло."}, {"id": 1547, "inh": "Хих вала йиш яц, хина т1адам дег1ах ца кхеташ.", "rus": "Нельзя перейти через реку, хотя бы капельку не намокнув."}, {"id": 1548, "inh": "Хица боацар чкъара бац, дынца воацар саг (баьре) вац.", "rus": "Без воды и рыба не рыба, без коня и человек (всадник) не всадник."}, {"id": 1549, "inh": "Ховр малав – хоаттар ва, хоаттар малав – ховр ва.", "rus": "Знает тот, кто спрашивает: спрашивает тот, кто знает."}, {"id": 1550, "inh": "Хоза йо1 сеттара т1ера хул.", "rus": "Красавица любит пококетничать."}, {"id": 1551, "inh": "Хоза йо1 тиша коч йийхача а товш хул.", "rus": "Красавица и в лохмотьях смотрится."}, {"id": 1552, "inh": "Хоза лер дика дале а, баге кхабар кхы а дикаг1а да.", "rus": "Речистым быть хорошо, но молчаливым быть лучше."}, {"id": 1553, "inh": "Хоза мотт бола саг наха дукха веза.", "rus": "Люди любят красноречивого человека."}, {"id": 1554, "inh": "Хозал – даьтта дац, - маькха т1ахьокхалургьяц.", "rus": "Красота – не масло, на хлеб не намажешь."}, {"id": 1555, "inh": "Хозалга ма хьежа, оамалга хьежа.", "rus": "Не смотри на красоту, а смотри на характер."}, {"id": 1556, "inh": "Хозача б1аьстенал йиза гуйре теннай.", "rus": "Богатая осень краше красивой весны."}, {"id": 1557, "inh": "Хозача г1улакхал дезаг1а х1ама дац.", "rus": "Нет ничего дороже красивых (благородных) дел."}, {"id": 1558, "inh": "Хозача дешаца къонахчал хьокха венначун базара дийнахьа шай миссел мах бац.", "rus": "Кто краснобайством пытается представить себя мужчиной, тому пятак цена в ярмарочный день."}, {"id": 1559, "inh": "Хозача дешо лакха лоам бошабаьб.", "rus": "Красивое слово и снежную гору растопит."}, {"id": 1560, "inh": "Хозача дешо 1урга чура текхарг баьккхаб.", "rus": "Ласковое слово и змею из норки выманило."}, {"id": 1561, "inh": "Хозача з1ако чкъаьра 1ехабаьб.", "rus": "Красивая удочка рыбку обманула."}, {"id": 1562, "inh": "Хозача къамаьло никъ лоацбаьб.", "rus": "Приятная беседа дорогу сократила."}, {"id": 1563, "inh": "Хозаяр езалац, езар хозлу.", "rus": "Нелюба красавица, красива любимая."}, {"id": 1564, "inh": "Хотташа б1ехваьр хиво ц1енвергва, метто б1ехваьр цхьаккхача х1амано ц1енвергвац.", "rus": "Испачканного грязью водой отмоют, испачканного клеветой ничем не очистить."}, {"id": 1565, "inh": "Хорже, дега дезаденнар харжа.", "rus": "Если выбирать, так только то, к чему душа лежит."}, {"id": 1566, "inh": "Хох – ийс дохьаж, саьмарсаькх ирс дарба (Хох ийс дохьажи цхьа дарбеи, саьмарсаькх – цхьа дохьажи ийс дарбеи).", "rus": "Лук – девять отрав, чеснок – девять лекарств (Лук – девять отрав и одно лекарство, чеснок – одна отрава и девять лекарств)."}, {"id": 1567, "inh": "Хулаш, хулаш хилар даьна вир.", "rus": "Становясь ишаком изо дня в день, стал настоящим ишаком плохой потомок."}, {"id": 1568, "inh": "Хургдоацар дийцар хургдолчох ваьннав.", "rus": "Погнавшись за несбыточным, лишился и того, что могло сбыться."}, {"id": 1569, "inh": "Хургдоацар ма дувца, аьннар кхоачашде.", "rus": "Не обещай несбыточного, исполняй обещанное."}, {"id": 1570, "inh": "Хургдоацача х1амах уйлаш ю саг долаш долчох ваьннав (парг1ата хиннавац).", "rus": "Думающий о несбыточном лишается имеющегося (не знает спокойствия)."}, {"id": 1571, "inh": "Хургдола оалхазар б1ена чура 1ах (кхайк).", "rus": "Будущая мощная птица еще птенчиком по крику узнается."}, {"id": 1572, "inh": "Х1ама далехьа, ший хьаькъалца саг дагавала веза.", "rus": "Прежде чем начать что-то делать, человек должен поразмыслить."}, {"id": 1573, "inh": "Х1ама диача, наб т1аг1орт; набарах ваьлча, х1ама яа дага отт, - бала ба-кха.", "rus": "Поешь – спать тянет; поспишь – есть охота – ох, как трудно жить."}, {"id": 1574, "inh": "Х1ама дуача наха 1аг лелабаьб.", "rus": "Ложки есть у тех, у кого еда водится."}, {"id": 1575, "inh": "Х1ама дукха дезаро 1овдалавоаккх.", "rus": "Жадность с ума сводит."}, {"id": 1576, "inh": "Х1ама тоаденнача даьна жа-1уй ийшаб.", "rus": "Разбогатевшему хозяину батраков не хватает."}, {"id": 1577, "inh": "Х1ама т1акхухьаш вола фусам-да хоза хет, ваьсса ухар – б1аг1ара хет.", "rus": "Добычливый хозяин красавцем кажется, а недобычливый – косоглазым."}, {"id": 1578, "inh": "Х1ама т1аяхьар нанна а дукхаг1а веза.", "rus": "Даже мать больше любит того, кто что-нибудь приносит в дом."}, {"id": 1579, "inh": "Х1ама ховр – нахага ладийг1ар.", "rus": "Мудрый тот, кто слушает людей."}, {"id": 1580, "inh": "Х1ама ховча нахах веттавеннар хьаькъала сов ваьннав.", "rus": "Умнее стал тот, кто вращался среди бывалых людей."}, {"id": 1581, "inh": "Х1ама хьаде хала дале а, даьр леладе кхы а халаг1а да.", "rus": "Трудно сделать что-то полезное, но куда труднее сохранить сделанное."}, {"id": 1582, "inh": "Х1ама ца хар эхь дац, эхь да х1ама ха ца г1ортар.", "rus": "Не стыдно чего-то не знать, стыдно не стремиться узнать."}, {"id": 1583, "inh": "Х1ама юаш валаре, шура юаргьяр аз; йист хулаш валаре, бер хьоастаргдар аз.", "rus": "Лучшее из того, что бы я поел, - молоко; лучшее, что я мог бы сказать – это слова ласки ребенку."}, {"id": 1584, "inh": "Х1анзале маьре г1оргъяц яхаш леле а, хьокха йодаш санна кийчле.", "rus": "Хоть и утверждаешь, что не скоро замуж пойдешь, всегда одевайся как на смотрины."}, {"id": 1585, "inh": "Х1арача баьцах дарба а дохьаж а доал, х1арача сагах, мелла дале а, дика а доал, во а доал.", "rus": "Каждая травинка заключает в себе и лекарство, и отраву: каждый человек – и хорошее, и плохое."}, {"id": 1586, "inh": "Х1арача дено хаькъала дакъа т1атох.", "rus": "Каждый день добавляет частицу ума."}, {"id": 1587, "inh": "Х1арача дено цхьацца лаьтта бел т1адулаш, бала гаьнабоал.", "rus": "Горе удаляется – каждый день на него ложится лопата земли."}, {"id": 1588, "inh": "Х1арача деша ший моттиг я.", "rus": "У каждого слова есть свое место."}, {"id": 1589, "inh": "Х1арача пхьара ший болх дикаг1а хов.", "rus": "Каждый мастер свою работу лучше знает."}, {"id": 1590, "inh": "Х1ара саг ший сина аьла ва.", "rus": "Любой человек – князь своей души."}, {"id": 1591, "inh": "Х1арача саго ше к1омду ший гирдз.", "rus": "Каждый сам чешет свою чесотку."}, {"id": 1592, "inh": "Х1арача хьазилга ший б1и ба.", "rus": "У каждой пташки свое гнездышко."}, {"id": 1593, "inh": "Хьа валарга хьежжа да хьона деша яьсий.", "rus": "Твоей смерти (жизни) соответствует читаемая тебе отходная молитва."}, {"id": 1594, "inh": "Хьа воша хулачул, хьа уст-воша хиннавалара со (аьннад воча вешийга).", "rus": "Чем быть твоим братом, лучше бы я стал твоим шурином (о плохом брате)."}, {"id": 1595, "inh": "Хьа дикал цкъа гу наха, хьа вол гу иттаза.", "rus": "Твои достоинства люди видят один раз, а недостатки – десятки раз."}, {"id": 1596, "inh": "Хьа дош дош деце, хьа дув а дув бац.", "rus": "Если не крепко твое слово, то и клятва твоя – не клятва."}, {"id": 1597, "inh": "Хьа мелал д1ахой, наха вуаргва хьо.", "rus": "Если люди узнают про твои слабости, тебя съедят."}, {"id": 1598, "inh": "“Хьада” яхар к1ордаваьв, “д1аэца” яхар вийзав.", "rus": "Просящий надоел, дающий любим."}, {"id": 1599, "inh": "В1аьхийча сагага аьннад: “Хьадаьннад хьона гарзашца маькх юалга!”.", "rus": "Богачу говорили: “Счастливчик, ты даже лапшу с хлебом ешь”."}, {"id": 1600, "inh": "“Хьаде” ала аттаг1а да, хьадечул.", "rus": "Сказать “сделай” легче, чем сделать самому."}, {"id": 1601, "inh": "Хьадехаш вале, д1алуш а хила.", "rus": "Любишь просить – умей и давать."}, {"id": 1602, "inh": "Хьаг1ах лораденна дог цхьалха хиннад, йоахарех лорабенна мотт ц1ена хиннаб.", "rus": "Чисто сердце, убереженное от черной зависти, как чист и язык, убереженный от сплетен."}, {"id": 1603, "inh": "Хьажац1а а бихьа юхабена хох ше болчча бесса к1ома хиннаб.", "rus": "Лук, хотя и побывал с паломниками в Мекке, каким был горьким, таким и остался."}, {"id": 1604, "inh": "Хьазилгий ираз да циск ткъамаш доацаш кхелла.", "rus": "К счастью птичек, кошка сотворена бескрылой."}, {"id": 1605, "inh": "Хьай дег чу 1очу а хьеже, е наха кхел.", "rus": "Прежде чем судить о людях, загляни в свою душу (в свое сердце)."}, {"id": 1606, "inh": "Хьай дош дувцаш бола кхелахой дикаг1а кхаба.", "rus": "Судей, ведущих твое дело, корми получше."}, {"id": 1607, "inh": "Хьай кетарга хьежже, кетар йолчун ц1аг1ара йоалае саг, даьре коарош долчун лаг1а т1а ког баккха ца герташ, - лайжжа чувена маьже ювргья хьа.", "rus": "Глядя на свою овчину, сватайся к овчине, а посватаешься к шелковым рукавам, - растянешься у порога и ногу сломаешь."}, {"id": 1608, "inh": "Хьай ц1аг1а хьаьша ма хила, наьха ц1аг1а фусам-да ма хила.", "rus": "Не будь дома гостем, а в гостях хозяином."}, {"id": 1609, "inh": "Хьай ц1енна хьо 1у веце, наха аьла хургвац хьох.", "rus": "Если ты не батрачишь на себя, ты не будешь княжить над другими."}, {"id": 1610, "inh": "Хьай чо 1а боаккхийте, т1ера корта хьоргба хьа.", "rus": "Если позволишь выдернуть волосок с головы, то потом и головы лишишься."}, {"id": 1611, "inh": "Хьайга аьлча халахетаргдола х1ама нахага ма ала.", "rus": "Не говори людям того, чего сам не хотел бы услышать."}, {"id": 1612, "inh": "Хьайга дулур нахага де ма ала.", "rus": "Не перекладывай на других то, что можешь сделать сам."}, {"id": 1613, "inh": "Хьайга рузкъа да аьле, кура ма вала; хье къе ва, аьле, миска ма хила.", "rus": "Став богатым – не возгордись, став бедным – не унижайся."}, {"id": 1614, "inh": "Хьайга ца кхайкхача ма г1о, д1аг1о алалца а ма ваг1а.", "rus": "Не ходи, куда не звали; не засиживайся, пока не попросили."}, {"id": 1615, "inh": "Хьайдар лораде, наьхадар ше уллача дита.", "rus": "Свое добро береги, чужое оставь в покое."}, {"id": 1616, "inh": "Хьайза ж1але ц1ог ц1аккха нийсаденнадац.", "rus": "Загнутый собачий хвост никогда не разогнется."}, {"id": 1617, "inh": "Хьайна дика даь дале, дувца; 1айха дика даь дале, лочкъаде.", "rus": "Сделали тебе добро – говори о нем; сам совершил добрый поступок – молчи о нем."}, {"id": 1618, "inh": "Хьайна мел ховр ма дувца, 1айха мел дувцар ха.", "rus": "Не говори всего, что знаешь, но знай все, а чем говоришь."}, {"id": 1619, "inh": "Хьайна т1адаг1а кер эцачул хье т1аваг1а къайг эца.", "rus": "Лучше возьми себе ворону, на которой сидишь, чем взять сокола, который сидит на тебе."}, {"id": 1620, "inh": "Хьайна хулача пайданна духьа сага водар ма де, - цу сага къайла хьо воде а, Даллана къайла г1оргвац хьо.", "rus": "Не вреди другому ради своей пользы: если он об этом и не узнает, то бог Дяла же все это видит."}, {"id": 1621, "inh": "Хьайра а ехка т1ем т1а вахар вийнав, хьаьр т1а ваьг1ар висав.", "rus": "Продавший мельницу и ушедший на войну погиб; оставшийся при мельнице уцелел."}, {"id": 1622, "inh": "Хьайро санна охь дунено адам.", "rus": "Жизнь перетирает (уносит) людей, словно зерно на мельнице."}, {"id": 1623, "inh": "Хьайх тийшача х1аманна доал деш хьо веце, венначул т1ехьаг1а хьай кашан да хургвац хьох.", "rus": "Если ты не хозяин дела, доверенного тебе, то по смерти ты не будешь даже хозяином своей могилы."}, {"id": 1624, "inh": "Хьакха керчача керч веха саг.", "rus": "Пьяница валяется в той же луже, что и свинья."}, {"id": 1625, "inh": "Хьакха хьакха хиларах Далла сигаленга хьажийтац из.", "rus": "Поскольку свинья и есть свинья, бог Дяла не дал ей увидеть небо."}, {"id": 1626, "inh": "Хьакха ушал корайоаг1а.", "rus": "Свинья всегда найдет грязную лужу."}, {"id": 1627, "inh": "Хьакха хоттала керч, воча сагах зуламаш хьерч.", "rus": "Свинья в грязи валяется, а плохой человек в черных делах мотается."}, {"id": 1628, "inh": "Хьакхашта ваьккха лай хьалмаг1а г1ийртав.", "rus": "Дай рабу послабление, он и тамадой захочет стать."}, {"id": 1629, "inh": "Хьакхеи чаи цхьан хьунаг1а яьже а, в1аший тац.", "rus": "Кабан и медведь в одном лесу пасутся, а вместе не уживаются."}, {"id": 1630, "inh": "Хьакхий даьтта хьакхий маьченна хьекхад.", "rus": "Чувяк из свиной кожи смазывают свиным жиром."}, {"id": 1631, "inh": "Хьакхий хурск яа дог эттача молла яьхад: “1а “виззаг1” яхе а, да налца воаллалва са, хьо лийга бухьига-м еце”.", "rus": "Задумал мулла съесть поросенка и говорит ему: “Хоть ты и визжишь, да будет мой отец лежать в могиле с кабаном, если ты не детеныш лани”."}, {"id": 1632, "inh": "Хьакхий шура мийначох хьакхий оамалаш йоахк.", "rus": "Вскормленный свиным молоком приобретает свинские повадки."}, {"id": 1633, "inh": "Хьал дола вир тхов т1а даьннад.", "rus": "Богатый ишак и на крышу взберется."}, {"id": 1634, "inh": "Хьал долчо аьннар эттад, къечо аьннар эттадац.", "rus": "Сказанное богачом принимается на веру, сказанное бедняком в расчет не берут."}, {"id": 1635, "inh": "Хьалаца хала да, д1ахеца атта да.", "rus": "Поймать – трудно, отпустить – легко."}, {"id": 1636, "inh": "Хьал-торо йолаш вола во саг а дика хет.", "rus": "И плохой человек слывет хорошим, если он богат."}, {"id": 1637, "inh": "Хьалха, т1ехьа мара доацаш – берригаш 1аьхарте кхоачаргба.", "rus": "Кто раньше, кто позже, но все будем на том свете."}, {"id": 1638, "inh": "Хьалха аьнначун да
