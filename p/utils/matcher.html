бац.", "rus": "Разумный баран не выскочит из своего стада и не запрыгнет в чужое."}, {"id": 1652, "inh": "Хьаькъал дола саг вовза хала да, 1овдал йистхуллашехьа вовз.", "rus": "Умного не сразу узнаешь, а дурака – по первым же его словам."}, {"id": 1653, "inh": "Хьаькъал дола саг – сатоха саг.", "rus": "Умный человек – сдержанный человек."}, {"id": 1654, "inh": "Хьаькъал дола саг сонта хургвац.", "rus": "Умный человек не будет чванливым."}, {"id": 1655, "inh": "Хьаькъал долаш ва, аьле, сонта ма вала; майра ва, аьле, кура ма вала.", "rus": "Посчитав себя умным, не становись чванливым; посчитав себя храбрым, не стань горделивым."}, {"id": 1656, "inh": "Хьаькъал долча денал хул, хьаькъали денали долча сий а хул.", "rus": "Где ум, там и мужество, а где ум да мужество, там и честь."}, {"id": 1657, "inh": "Хьаькъал долча моастаг1чох цкъа лорале, хьаькъала гаьна воацача доттаг1ачох иттаза лорале.", "rus": "Умного врага остерегайся один раз, а от недалекого друга – десятки раз."}, {"id": 1658, "inh": "Хьаькъал долчунца дагавала, 1овдалча сагах гаьнавала.", "rus": "С умным советуйся, дурака избегай."}, {"id": 1659, "inh": "Хаькъал ца хилча, ираз пайданна дац; ираз ца хилча, хьаькъал а пайданна дац.", "rus": "Счастье без ума – не счастье, ум без счастья – не ум."}, {"id": 1660, "inh": "Хьаькъала къе вар метта в1аьхий хул.", "rus": "Бедный умом бывает “богат” языком."}, {"id": 1661, "inh": "Хьаькъалга, эзделага хьежжа нахана везаргва хьо.", "rus": "Люди будут ценить тебя по уму и благородству."}, {"id": 1662, "inh": "Хьаьр кхера а сихаг1а мел кхест сихаг1а кхоачалу.", "rus": "Чем дольше жернов крутится, тем быстрее стирается."}, {"id": 1663, "inh": "Хьаьр кхера а кхастац ялат доацаш.", "rus": "Без зерна не крутятся и жернова."}, {"id": 1664, "inh": "Хьаьр т1а доккхаг1а дола шайт1а хьаьрхо ше ва.", "rus": "На мельнице самый большой шайтан – сам мельник."}, {"id": 1665, "inh": "Хьаьрваьнначоа дарба – вийхка из 1овиллар.", "rus": "Для сумасшедшего одно лечение – связать его."}, {"id": 1666, "inh": "Хьаьстача, 1атто а шура дуккхаг1а лу.", "rus": "Даже корова, если ее приласкать, больше молока дает."}, {"id": 1667, "inh": "Хьаьша веча, воча фусам-нанас бераш делхадаьд.", "rus": "У плохой хозяйки всегда дети плачут, когда приходит гость."}, {"id": 1668, "inh": "Хьаьша веча, хьалхе а г1атта; хьаьша веча т1ехьаг1а вижа.", "rus": "Пришел гость – раньше встань, пришел гость – позже ляг."}, {"id": 1669, "inh": "Хьаьша д1аваха тохавелча, фусам-да кхы а ч1оаг1аг1а г1улакхаца хул.", "rus": "Когда гость соберется уходить, хозяин становится еще любезнее."}, {"id": 1670, "inh": "Хаьша д1авода, бехк бус.", "rus": "Гость уходит – недостатки гостеприимства остаются."}, {"id": 1671, "inh": "Хьаьша т1аэца ховш вар, нахаца та ховш хиннав.", "rus": "Тот, кто умеет достойно принять гостя, тот умеет с людьми ужиться."}, {"id": 1672, "inh": "Хьаьша хьа г1алашка хьежац, хьаьша хьа шунага хьеж.", "rus": "Гость любуется не твоими башнями, а накрытым для него столом."}, {"id": 1673, "inh": "Хьаьша хьамара фусам-даьна пхьор хиннад.", "rus": "Прибыл гость – заодно и хозяин попировал."}, {"id": 1674, "inh": "Хьаьша ца везар, Даллана а наха а вийзавац.", "rus": "Ни бог Дяла, ни люди не любят того, кто не любит гостя."}, {"id": 1675, "inh": "Хьаьша ца ухача коага бода никъ йоарх1аша хьалбаьккхаб.", "rus": "Сорной травой заросла дорога к дому, в который не приходят гости."}, {"id": 1676, "inh": "Хьаьшана дикаг1а хет шун т1а ханнахьа оттадаь тух-сискал, хьийга енача котамал.", "rus": "Гость предпочитает хлеб-соль сразу же, чем долго ожидаемую курятину."}, {"id": 1677, "inh": "Хьаьшанна шу оттадеш санна цун говрана а фуъ билла.", "rus": "Накрыл гостю стол – и его лошади корму задай."}, {"id": 1678, "inh": "Хьаьшашта – сакъердам, фусам-нанна – бала.", "rus": "Гостям – веселье, хозяйке – горе (большие заботы)."}, {"id": 1679, "inh": "Хьаьший бага хьежаш ваг1аргва ц1аьрмата фусам-да.", "rus": "Жадный хозяин глаз не сводит со рта гостя."}, {"id": 1680, "inh": "Хье бордз яле, катоха, еце – сатоха.", "rus": "Если ты волк, хватай (налетай), если нет – терпи."}, {"id": 1681, "inh": "Хье вахача мехка лакха г1ала йог1а.", "rus": "Высокую башню воздвигай в своей стране."}, {"id": 1682, "inh": "Хье везачо хьайна даь хьехар д1а ца эццал даькъаза ма вала.", "rus": "Не будь настолько несчастным, чтобы не принять совет любящего (чтущего) тебя человека."}, {"id": 1683, "inh": "Хье воатт1авой а бакъдар мара ма ала.", "rus": "Хоть и разорвут тебя, говори только правду."}, {"id": 1684, "inh": "Хье г1отторгволча метте 1о ма ха.", "rus": "Не садись не на свое место – тебя с него поднимут."}, {"id": 1685, "inh": "Хье наькъа аравалалехьа новкъост лаха.", "rus": "Прежде чем выйти в путь, найди себе товарища."}, {"id": 1686, "inh": "Хье хьошалг1а вахача, хьай г1анд довза.", "rus": "Будучи в гостях, знай свое место."}, {"id": 1687, "inh": "Хьегар денадац, кхаьрдар денад.", "rus": "Чего желали – не получили; чего боялись, то и произошло."}, {"id": 1688, "inh": "“Хьежа ца везача ма хьежа”, - аьнна беннаб сага ши б1арг.", "rus": "Человеку даны глаза, с условием: “Не смотреть туда, куда не положено”."}, {"id": 1689, "inh": "Хьежаш денача дог1ан т1ехьа шо бетташ а нийчаденнад.", "rus": "Вослед за долгожданным дождем, бывает, и град приходит."}, {"id": 1690, "inh": "Хьехамашка ладувг1а, - бакъахьа хетар де.", "rus": "Советы слушай, но делай то, что считаешь правильным."}, {"id": 1691, "inh": "Хьийхар д1аэца ховр 1овдала вац.", "rus": "Тот не дурак, кто прислушивается к советам."}, {"id": 1692, "inh": "Хьо вижа уллашехьа а ираз т1адоаг1аш хул.", "rus": "Бывает, счастье и к лежебоке льнет."}, {"id": 1693, "inh": "Хьо вовзачо хьа сий ду, хьо ца вовзачо хьа кетара сий ду.", "rus": "Кто знает тебя, тот тебя и чтит; а кто тебя не знает, тот чтит твою шубу (одежду)."}, {"id": 1694, "inh": "Хьо лаьттанца дика – из хьоца дика.", "rus": "Ты к земле по-хорошему, и она тебя отблагодарит."}, {"id": 1695, "inh": "Хьо малав ховргда сона, хьа новкъост малав хайча.", "rus": "Я узнаю, кто ты, когда узнаю твоего друга."}, {"id": 1696, "inh": "Хьо сога отта, со нахага отта.", "rus": "Ты помоги мне, я помогу народу."}, {"id": 1697, "inh": "Хьо хье дика хуле, нах а хургба хьоца дика.", "rus": "Будь сам хорошим, тогда и люди будут к тебе хорошо относиться."}, {"id": 1698, "inh": "Хьо ца вовзача метте хьа кетар я сий долаш, хьо вовзача метте хьа корта ба сий долаш.", "rus": "Где тебя не знают, там чтят твою шубу, а где тебя знают, там чтят твою голову."}, {"id": 1699, "inh": "Хьоастаденна 1аса шин 1аттах декхад.", "rus": "Ласковый телок двух маток (молоко) сосет."}, {"id": 1700, "inh": "Хьоасташ, бакълув хьо, оалаш, 1овдала саг сихаг1а коара вахийта веза.", "rus": "Дурака хвали, ему поддакивай и поскорее со двора выпроваживай."}, {"id": 1701, "inh": "Хьошалг1а вахача г1алаташ ма леха.", "rus": "Будучи в гостях, не ищи недостатков у хозяев."}, {"id": 1702, "inh": "Хьаошалг1а вахача модзаца мара чай молаш вац, ший ц1аг1а маькха зирталг бац.", "rus": "В гостях пьет только чай с медом, хотя дома нет и хлебной крошки."}, {"id": 1703, "inh": "Хьоашалг1а воадаш, виза вода эзди саг.", "rus": "Благородный человек в гости идет сытым."}, {"id": 1704, "inh": "Хьоашалг1а иха воацачоа лертт1а хьаьша т1аэца ховргдац.", "rus": "Кто сам не бывал в гостях, тот не сумеет толком гостя принять."}, {"id": 1705, "inh": "Хьовла санна мерза ма хила, - т1а мел кхаьчачо вуаргва хьо; аьрга сом санна къахьа ма хила, - царг мел техачо д1акхоссаргва хьо.", "rus": "Не будь сладким, как халва, - иначе все будут есть тебя; не будь горьким, как недозрелый фрукт, - все будут выбрасывать тебя."}, {"id": 1706, "inh": "Хьога цо нах бувце, хьо нахага вувц цо.", "rus": "Знай: тот, кто сплетничает с тобой о других, с ними сплетничает о тебе."}, {"id": 1707, "inh": "“Хьо-м везацар сона, хьа кисилг (кепилг) дезар”, - яхад цхьанне.", "rus": "“Да не тебя я люблю, а твой кармашек (твою денежку)”, - шутя говорил некто."}, {"id": 1708, "inh": "Хьона везачоа хьо а везаргва.", "rus": "Кто люб тебе, тому и ты люб."}, {"id": 1709, "inh": "Хьона зе деш воацар хьона пайда беш ва.", "rus": "Если он не причиняет вреда, значит, уже этим приносит пользу."}, {"id": 1710, "inh": "Хьона мотт кхухьар хьона а аькх г1оргва.", "rus": "Кто идет к тебе с доносом, тот и на тебя будет доносить."}, {"id": 1711, "inh": "Хьона хала ди т1а ма отталда, эттача, бовзаргба хьона хьай доттаг1ий.", "rus": "Пусть у тебя не будет горьких дней, а если придут, тогда узнаешь своих друзей."}, {"id": 1712, "inh": "Хьонка маьче т1а хьонка з1ирг доаг1а.", "rus": "Из корешка черемши вырастает только росток черемши."}, {"id": 1713, "inh": "Хьох-м тешар со, хьо тешачох тешац.", "rus": "Тебе-то я верю, но не верю тому, кому ты веришь."}, {"id": 1714, "inh": "Хьувзаш бале а никъ тол.", "rus": "Пусть дорога и извилиста, все же она лучше, чем бездорожье."}, {"id": 1715, "inh": "Хьунаг1а д1алелар дац аькха, аькха да хьунаг1ара ц1аденар.", "rus": "Не та добыча, что в лесу находится, а та, которую домой принесешь."}, {"id": 1716, "inh": "Хьунаг1а тувлавеннар наькъ т1а варгва, хьаькъалах тувлавеннар хьакхетаргвац.", "rus": "Заблудившийся в лесу выйдет на дорогу, сошедшему с ума - ума не вернуть."}, {"id": 1717, "inh": "Ца дича даргдоаца х1ама гаьна ма даккха.", "rus": "Не откладывай то, что рано или поздно, а делать придется."}, {"id": 1718, "inh": "Ца дезар леладаьчунга кхача ца дезар кхоач.", "rus": "Делающий то, что ему не положено, получил то, чего получить не хотел бы."}, {"id": 1719, "inh": "Ца оалаш диса дош дошох даьд.", "rus": "Невысказанное слово сделано из золота."}, {"id": 1720, "inh": "Ца ховчун кхача ховчо биаьб.", "rus": "Ужин неумехи съедает умелец."}, {"id": 1721, "inh": "Цагена ц1и цкъа яьккхача, иттаза йоаккх.", "rus": "Если вспомнят о Цагене (фольклорный балагур) один раз, то уж потом упомянут его раз десять."}, {"id": 1722, "inh": "Цадийша саг – хьунсаг.", "rus": "Необразованный – “лесной мужчина” (мифический персонаж. – И.Д.)"}, {"id": 1723, "inh": "Цадийшар дийшачох массаза хьийгав.", "rus": "Неуч всегда завидует ученому."}, {"id": 1724, "inh": "Цадоаг1ар леладечунга кхача ца дезар кхоач.", "rus": "Кто ведет себя неправедно, к тому приходит то, чего он не хотел бы."}, {"id": 1725, "inh": "Цамогаш волчоа могаш хилар доккха рузкъа долга.", "rus": "Больной знает, что здоровье – величайшее богатство."}, {"id": 1726, "inh": "Цамогаш хилча бу унахц1енонна мах.", "rus": "Цену здоровья узнают только заболевши."}, {"id": 1727, "inh": "Царг йоацаш бордз хиннаяц, шелал йоацаш 1а хиннадац.", "rus": "Нет ни волка без зубов, ни зимы без морозов."}, {"id": 1728, "inh": "Царг лазачоа царг лазачунгара хьал хайнад.", "rus": "Лишь когда у самого начнет болет зуб, поймешь состояние мучающегося зубной болью."}, {"id": 1729, "inh": "Цаховчох хатта дукха хиннад.", "rus": "Непонятное вызывает много вопросов."}, {"id": 1730, "inh": "Цаховраш ховрачар даар да.", "rus": "Незнающие – пища для знающих."}, {"id": 1731, "inh": "Цаховш даьнна а г1алат ца доалаш саг хиннавац.", "rus": "Нет человека, который, хотя бы случайно, не ошибался."}, {"id": 1732, "inh": "Цаца чу хий кхахьа аттаг1а да 1овдала саг кхетавечул.", "rus": "Легче воду носить в сите, чем вразумлять дурака."}, {"id": 1733, "inh": "“Ца1 мара воаца во1 венна а укх наьха дагардар хайна дика болх ба-кха”, - цхьан сесаго аьннад, йоах.", "rus": "Говорят, некая женщина сказала: “Хоть это и похороны моего единственного сына, но хорошо, но хорошо, что они дали мне узнать, кто и что таил в своем сердце”."}, {"id": 1734, "inh": "Циск ж1алеца тац, ж1али берзаца тац, бордз сагаца тац.", "rus": "Кошке не уживается с собакой, собака – с волком, а волк – с человеком. Циска т1акхаччалца бах дахка. Мышь жива, пока не встретит кота."}, {"id": 1735, "inh": "Цисках кхерабенна 1ургара ца баьнна дахка моцала беннаб.", "rus": "Мышь, которая не покидала норы из страха перед кошкой, сдохла от голода."}, {"id": 1736, "inh": "Циско аьннад думех: “Аз-м буаргбацар хьо, хьалкхаьчача а”.", "rus": "Кошка сказала о курдюке: “Даже если б дотянулась, не стала бы тебя есть”."}, {"id": 1737, "inh": "Цкъа аьннар хоз дикача сесага.", "rus": "Хорошая жена услышит однажды сказанное."}, {"id": 1738, "inh": "Цкъа дахача г1олла хий дахадац.", "rus": "Вода дважды не течет по одному и тому же месту."}, {"id": 1739, "inh": "Цкъа д1акхийтта ког ийссаза кхет, цкъа оап лаьллачох оапашк хул.", "rus": "Раз споткнувшаяся нога споткнется девять раз, единожды совравший прослывет вруном."}, {"id": 1740, "inh": "Цкъа кхерах кхийтта ког ийссаза кхийттаб (цкъа лайжа ког ийссаза ловжаргба).", "rus": "Нога, раз споткнувшись, девять раз споткнется (раз поскользнувшаяся нога поскользнется девять раз)."}, {"id": 1741, "inh": "Цкъа сийдоацача ваьннар ц1аккха а сий долаш хургвац.", "rus": "Единожды совершивший бесчестный поступок, уже никогда не будет в чести."}, {"id": 1742, "inh": "Цкъа харца лийнача сагах тешам бов.", "rus": "Единожды солгавшему – никто больше не поверит."}, {"id": 1743, "inh": "Цкъа хаьда х1ама нийса хотаденнадац.", "rus": "Раз порвавшееся, уже без узла не соединить."}, {"id": 1744, "inh": "Цкъа яьннача топо ши пхьагал йийнаяц.", "rus": "Одним выстрелом двух зайцев не убить."}, {"id": 1745, "inh": "Цогалал говзаг1а да цогала ц1ог (е цогала к1ориг).", "rus": "Лисий хвост (или лисенок) хитрее самой лисы."}, {"id": 1746, "inh": "Цогало яьхад: “Дикаг1дар да – ж1алена ше галехьа, ж1али шийна гар”.", "rus": "Лиса сказала: “Самое лучшее увидеть собаку прежде, чем она увидит тебя”."}, {"id": 1747, "inh": "Цхьа аьттув а баьнна, в1аьхий хиннача дийнахьа а лампаш летаяьй.", "rus": "Случайно разбогатевший дурак даже днем лампу жжет, керосин переводит."}, {"id": 1748, "inh": "Цхьа дегабоалам боацаш саг вац.", "rus": "Нет человека, у которого не было бы каких-либо забот."}, {"id": 1749, "inh": "Цхьа сом денначунца доттаг1ал лаьцад, тума денначунца моастаг1ал лаьцад.", "rus": "Дав взаймы рубль, наживешь друга, а дав взаймы червонец, наживешь врага."}, {"id": 1750, "inh": "Цхьаволчун говза къамаьл чкъарий лувца з1ак санна да.", "rus": "Речь некоторых хитрецов подобна рыболовному крючку."}, {"id": 1751, "inh": "Цхьадола хьазилг лаьчан дог долаш хул.", "rus": "Бывает пичужка с соколиным сердцем."}, {"id": 1752, "inh": "Цхьаккха сунт дац хиво дохоргдоацаш.", "rus": "Нет такой плотины, какую бы вода со временем не снесла."}, {"id": 1753, "inh": "Цхьалха цхьа саг наха атта хетаргва, чухьа са доацаш из майра ца хуле.", "rus": "Трудно одиночке среди людей, если он не будет предельно храбрым."}, {"id": 1754, "inh": "Цхьан бе д1акховдадаьр вокха бе хьаийцад.", "rus": "Поданное одной рукой, забрали другой."}, {"id": 1755, "inh": "Цхьан бе ши харбаз таръеннаяц.", "rus": "В одной руке не удержать два арбуза."}, {"id": 1756, "inh": "Цхьан б1ехача т1адамо меза бога б1ехдаьд.", "rus": "Капля грязи перепортила лохань меда."}, {"id": 1757, "inh": "Цхьан йоахаро юрт в1ашаг1а лотаяьй.", "rus": "Из-за одной сплетни все село передралось."}, {"id": 1758, "inh": "Цхьан когаца халхавоалалац, цхьан кулгаца т1оараш в1ашкатохалац.", "rus": "Не танцуют на одной ноге, не хлопают в ладоши одной рукою."}, {"id": 1759, "inh": "Цхьан кулгах доахка п1елгаш а ца1 шоллаг1чоа тара дац.", "rus": "Даже пальцы одной руки не похожи один на другой."}, {"id": 1760, "inh": "Цхьан кхалсага дагадохар итт къонахчоа дагадохаргдац.", "rus": "Женщина придумает такое, что и десяти мужчинам на ум не придет."}, {"id": 1761, "inh": "Цхьан кхерах г1ала хиннаяц, цхьаьча баьречун саз хезаяц.", "rus": "Из одного камня башню не построить, голос одинокого никому не услышать."}, {"id": 1762, "inh": "Цхьан маьче чу ши ког боллалургбац.", "rus": "В один чувяк две ноги не засунешь."}, {"id": 1763, "inh": "Цхьан п1елгах бий хиннабац, цхьан баьречох б1ы хиннабац.", "rus": "Не сжать в кулак один палец, не создать дружину из одного всадника."}, {"id": 1764, "inh": "Цхьан сийго юрт лотаяьй (йоагаяьй).", "rus": "Одна искра все село спалила."}, {"id": 1765, "inh": "Цхьан церга т1а мара сецаяц ворда чарх.", "rus": "Сколь ни крутись колесо арбы, оно всегда остановится на одной из спиц."}, {"id": 1766, "inh": "Цхьан циско ийс етт биаьб.", "rus": "Одна кошка съела девять коров."}, {"id": 1767, "inh": "Цхьан ц1аг1а ши фусам-да хилча, ираз д1адахад.", "rus": "Счастье покидает ту семью, в которой два хозяина."}, {"id": 1768, "inh": "Цхьана новраш дийнача шин кхалсага гаргало – гаргало яц (юкъера карта йоагача хана шиннахьара бохьлуш баьг1ача кхалнаьха гаргало – гаргало яц).", "rus": "Родственны, подобно тем двум женщинам, что вместе веники сажали (родство двух соседок, которые грелись по обе стороны горящего межевого плетня)."}, {"id": 1769, "inh": "Цхьанна х1аманца ц1енлургдац сага б1еха дог.", "rus": "Ничем не очистить грязное человеческое сердце."}, {"id": 1770, "inh": "Цхьанне аьттув байнача кхычун аьттув боал.", "rus": "Где один терпит неудачу, там другой ее находит."}, {"id": 1771, "inh": "Цхьанне диках шиъ воахавеннавац.", "rus": "Добра (имущества) одного не хватает на двоих."}, {"id": 1772, "inh": "Цхьанне яьхад: “Фу де деза ховча хана, х1ама дика ду аз; фу де деза ца ховча хана, - наха ч1оаг1а дика хьехараш де ховш ва со”.", "rus": "Некто сказал: “Когда я знаю, что надо делать, я это хорошо делаю. Когда же не знаю, то умею давать очень хорошие советы”."}, {"id": 1773, "inh": "Цхьаннега хайта дог мехкага хайтад.", "rus": "Поделился тайной с одним – и она всему миру стала известна."}, {"id": 1774, "inh": "“Цхьаннена ма доккха а да хьо, шиннена ма готта а да хьо”, - аьннад кашах.", "rus": "Про могилу сказали: “Одному ты просторна, а двоим тесна”."}, {"id": 1775, "inh": "Цхьаннех кот воале а дукханех кот варгвац.", "rus": "Одного можно одолеть, но многих одолеть невозможно."}, {"id": 1776, "inh": "Цхьацца саьрг кагбеш, нув кагбаьб.", "rus": "По прутику переломили весь веник."}, {"id": 1777, "inh": "Цхьаькъа лелача саго г1ала йоттаргьяц.", "rus": "Одиночка башню не построит."}, {"id": 1778, "inh": "Цхьаьча сага топ яьннаяц.", "rus": "У одинокого и ружье не стреляет."}, {"id": 1779, "inh": "Цхьоалли къелли цхьатарра я.", "rus": "Одиночество и бедность одинаковы."}, {"id": 1780, "inh": "Ц1а даьгача, йокъ юс; саг кхелхача, бала бус.", "rus": "Дом сгорит – зола останется, умрет человек – останется горе."}, {"id": 1781, "inh": "Ц1аг1а барт бале, гаьннарча наькъаг1а ваха мегаргва.", "rus": "Если в доме согласие, то можно смело идти в дальний путь."}, {"id": 1782, "inh": "Ц1аг1а довнаш даха йо1 йолаелча, - сихаг1а маьре яхийта еза.", "rus": "Начала дочь дома скандалы устраивать – надо быстрее ее замуж выдавать."}, {"id": 1783, "inh": "Ц1аг1а ца даь сий арахьа даь дац.", "rus": "Нет уважения в семье – нет его и на людях."}, {"id": 1784, "inh": "Ц1аг1а чу довнаш кхухьа во1-воша хулачул коа лела эг1адаь ж1али дукхаза толашаг1а да.", "rus": "Намного лучше иметь во дворе бешеного пса, чем брата или сына, которые приносят в дом людскую вражду."}, {"id": 1785, "inh": "Ц1аг1ара воацар новкъост вац.", "rus": "Настоящим товарищем может быть лишь тот, кто из родных тебе мест."}, {"id": 1786, "inh": "Ц1аг1ара че фусам-наьна я, арахье фусам-даьга я.", "rus": "Все, что в доме – заботы хозяйки, вне дома – хозяина."}, {"id": 1787, "inh": "“Ц1аг1аравар лалва са, со харца луй!” – яьхад воча сесаго.", "rus": "“Пусть мой домашний (муж) умрет, если я лгу!” – говорила плохая жена (лгунья)."}, {"id": 1788, "inh": "Ц1аккха баха 1оховшаргбац бус 1о ца бувшаш фаткен доадергаш, 1уйранна хьал ца г1отташ, болх боабергаш.", "rus": "Никогда в достатке не будут жить те, кто переводит керосин (на лампу), поздно ложась спать, а встают к обеду, позабыв про работу."}, {"id": 1789, "inh": "Ц1аьрмата саг ахчанца эшавергва, хьаькъал дола саг хьаькъалца мара эшавергвац.", "rus": "Жадного можно одолеть деньгами, а умного только ум одолеет."}, {"id": 1790, "inh": "Ц1аьрмата саг кхыметтале нанна а гоама хул.", "rus": "Жадного даже родная мать не любит."}, {"id": 1791, "inh": "Ц1аьрмата саг ше керта т1ара хиндж божар кхер.", "rus": "Жадный боиться уронить даже гниду с головы."}, {"id": 1792, "inh": "Ц1аьрмата саг эхь дайна хул.", "rus": "Жадный человек не имеет стыда."}, {"id": 1793, "inh": "Ц1аьрмата хила, - х1ама доадечул.", "rus": "Лучше быть скупердяем, чем транжирой."}, {"id": 1794, "inh": "Ц1аьрматача сага каша цхьан шецца к1оаргаг1а оахк.", "rus": "Скупому могилу роют на пядь глубже."}, {"id": 1795, "inh": "Ц1аьрматача сага мерченна к1ада теадац.", "rus": "Жадному не хватало материи на саван."}, {"id": 1796, "inh": "Ц1аьрматача сага ши б1арг яькха хул.", "rus": "У скупого и глаз жадный."}, {"id": 1797, "inh": "Ц1аьрматача саго чо ахбаьккхаб.", "rus": "Жадина даже волос делит пополам."}, {"id": 1798, "inh": "Ц1аьрматача сагаца гаргало ма лелаелахь, - хьона х1ама эшача хана хьа юхь 1аьржъергья цо.", "rus": "С жадным не водись, ибо в тяжелый для тебя день он не поддержит."}, {"id": 1799, "inh": "Ц1аьрматача ц1еннанас оттадаь шу теза (къахьа) хул.", "rus": "Пища жадной хозяйки бывает пресной (горькой)."}, {"id": 1800, "inh": "Ц1аьрматача фусам-дас яьхад: “Модз дукха диача, дог лозадоал”.", "rus": "Скупой хозяин приговаривал: “Сердце начинает болеть у того, кто съест много меда”."}, {"id": 1801, "inh": "Ц1аьрматачун к1езика хул гаргара нахи доттаг1ийи.", "rus": "У жадного бывает мало друзей и родственников."}, {"id": 1802, "inh": "Ц1аьхха рузкъах визар хьаьрвоал: фарасташ санна ахчаш 1окхувс.", "rus": "Внезапно разбогатевший шалеет: деньги разбрасывает, словно овечий помет."}, {"id": 1803, "inh": "Ц1аьхха шурах йиза б1ийг ловзаийккхай.", "rus": "Нежданно насытившись молоком, ягненок взыгрался."}, {"id": 1804, "inh": "Ц1ена вац ший сина хьалха ц1ена воацар.", "rus": "Чист лишь тот, кто чист перед своей душою (сам перед собою)."}, {"id": 1805, "inh": "Ц1енвала вахар б1ехвенна венав.", "rus": "Пошел оправдываться, а вернулся очерненным."}, {"id": 1806, "inh": "Ц1енавар ц1ерала кхессача а ваьгавац.", "rus": "Правдивый и в огне не горит."}, {"id": 1807, "inh": "Ц1енах идда бежан берза бага дахад.", "rus": "Скотина, которая бегает со двора, угодила в пасть волка."}, {"id": 1808, "inh": "Ц1енах кхеташ воаца фусам-даи, ц1аг1ара ара ца воала фусам-даи шаккхе а сесага гоама ва.", "rus": "Что по селу без дела болтающийся муж, что муж, сиднем дома сидящий, - оба жене ненавистны."}, {"id": 1809, "inh": "Ц1енах ц1а дер ц1еннана я.", "rus": "Из дома делает дом (слаженную семью) хозяйка (жена)."}, {"id": 1810, "inh": "Ц1енача ший хьастара хий пхьида а дукхаг1а деза.", "rus": "И лягушка больше любит воду из своего чистого родника."}, {"id": 1811, "inh": "Ц1еноех ц1и яьлча а вохац къонах вола саг.", "rus": "Настоящий мужчина не запаникует, даже если загорится его дом."}, {"id": 1812, "inh": "Ц1енош далехьа карт оттаяьчо ц1енош дергда; карт оттаялехьа ц1енош де волавенначо ц1енош дергдац.", "rus": "Тот построит дом, кто вначале поставил забор; а кто же сразу начал строить дом без ограды, не построит его."}, {"id": 1813, "inh": "Ц1енош де этта саг парг1ата хургвац.", "rus": "Покоя лишится тот, кто начнет дом строить."}, {"id": 1814, "inh": "Ц1ерга г1ийрта циск мерцад.", "rus": "Кошка, которая жалась к очагу, опалилась."}, {"id": 1815, "inh": "Ц1еро дахча дуаш санна дунено адам дуъ.", "rus": "Жизнь пожирает людей, словно огонь – дрова."}, {"id": 1816, "inh": "Ц1ерца 1ема саг ц1ерах кхерац.", "rus": "Привыкший к огню, огня не боится."}, {"id": 1817, "inh": "Ц1еча 1аттагара е 1аьрчча 1аттагара, - хьона фу бе да шура к1ай хилча.", "rus": "От красной ли коровы или от черной – какая тебе разница, раз молоко белое."}, {"id": 1818, "inh": "Ц1и а хий а доацаш вай мегаргдац, царел кхерамег1а х1ама а дац.", "rus": "Мы не можем жить и без огня, и без воды, хотя нет ничего опаснее их."}, {"id": 1819, "inh": "Ц1и ца йоагача к1ур ихабац.", "rus": "Нет дыма там, где нет огня."}, {"id": 1820, "inh": "Ц1и ц1еро мара йийзаяц.", "rus": "Огонь только огнем зажигают."}, {"id": 1821, "inh": "Ц1ий хьайна хьакха лакха лоам бухье йийнай.", "rus": "Взбесившегося (ожиревшего) кабана убили на вершине высокой горы."}, {"id": 1822, "inh": "Ц1ийвала а к1айвала а ховш веце, эхь дайна ва хьона.", "rus": "Если краснеть и бледнеть не умеет, значит, у него нет совести."}, {"id": 1823, "inh": "Ц1ийдаь аьшки, шийла хийи мо мара в1аший товш дац.", "rus": "Не уживаются раскаленное железо и вода."}, {"id": 1824, "inh": "Ц1ог олла мара х1ама ца эшаш ж1алена тара хул цхьавар.", "rus": "Некоторым достаточно прицепить хвост, чтобы они стали настоящими собаками."}, {"id": 1825, "inh": "Ц1унала баьлла 1аг даьттала беллача, баьтт1аб.", "rus": "Когда вытащили ложку из навозной жижи и сунули в масло, она треснула."}, {"id": 1826, "inh": "Чаи борзи в1ашаг1алетад, даьтта кхабилг сона йисай.", "rus": "Передрались волк с медведем за кувшинчик масла, и мне он достался."}, {"id": 1827, "inh": "Чагаргаш яьнна корта к1ома ца белча 1ергбац.", "rus": "Плешивая голова не может не чесаться."}, {"id": 1828, "inh": "Чакхдаргдоаца х1ама д1а ма доладе.", "rus": "Не начинай дела, обреченного на провал."}, {"id": 1829, "inh": "Черсий чаккхала, наькъа б1оаххала - цкъа техача тоъаргья дикача дина шод; майдана йоккхала, наьха дукхала – цкъа аьлча тоъаргда къонахчун дош (харца хургдоаца дош).", "rus": "В длинной дороге, достаточно раз хлестнуть хорошего черкесского коня; как бы ни многолюдна была сельская площадь – достаточно раз сказать мужское слово (правдивое слово)."}, {"id": 1830, "inh": "Чехкачох ма кхера, к1аьдачох ма теша.", "rus": "Вспыльчивого не бойся, бойся тихони."}, {"id": 1831, "inh": "Чоажах 1оттаелча, хайнад берза истара му1 ч1оаг1а йолга.", "rus": "Волк узнал силу бычьих рогов, когда они ткнулись в его бок."}, {"id": 1832, "inh": "Чубеллар – низ, гибеллар – мухь.", "rus": "Что принял вовнутрь – сила, что взвалил на плечи – груз."}, {"id": 1833, "inh": "Чудисар – дошув, арадаьннар – дотув.", "rus": "Несказанное – золото, сказанное – серебро."}, {"id": 1834, "inh": "Чутеха 1аьржа гата да кер чу доалла 1аьржа дог.", "rus": "Черное сердце подобно черной подкладке."}, {"id": 1835, "inh": "Ч1оаг1а аьлча, кхераве аьлча санна хеташ; шортига аьлча, зовзала яхаш санна хеташ; в1алла ца оалаш 1ийча, 1овдала хеташ; аьлча, хьаькъал долаш хила г1ерташ санна хеташ… хул цхьавар.", "rus": "Иным кажется: громко кто-то сказал – напугать хочет; тихо сказал – трусит; промолчал – дурак; высказался – умника корчит."}, {"id": 1836, "inh": "Ч1оаг1а вац дулхаг1а воацар.", "rus": "Лишь мускулистый может быть крепким."}, {"id": 1837, "inh": "Ч1оаг1ачарца довнаш ма даха, б1аьхийчарца кхеле ма аха.", "rus": "С сильным не враждуй, с богатым не судись."}, {"id": 1838, "inh": "Ч1ондарга оаз ялсамалара йоаг1а.", "rus": "Звуки скрипки идут из рая."}, {"id": 1839, "inh": "Шайт1ана на1алт массаза оал дарст из.", "rus": "С каждым проклятием шайтан только жиреет."}, {"id": 1840, "inh": "Шайт1а 1ехадаьр шайт1а к1ориг я.", "rus": "Шайтана перехитрил лишь его детеныш."}, {"id": 1841, "inh": "Шайт1о аьннад, йоах: “Далла лорадолда со адама шайт1аех!”.", "rus": "Говорят, шайтан сказал: “Упаси меня бог от людей-шайтанов!”."}, {"id": 1842, "inh": "Шайхала вала веннар шайт1ала ваьннав.", "rus": "Кто пытался стать шейхом (провидцем), тот стал шайтаном."}, {"id": 1843, "inh": "Ше ваь, хьалкхийна мохк малхала б1айхаг1а ба.", "rus": "Родимая сторона теплее солнца."}, {"id": 1844, "inh": "Ше даь дика доадар да из т1ехьадетташ хилар.", "rus": "Доброе дело пропадает, если им попрекают."}, {"id": 1845, "inh": "Шалта г1улакх доацаш бетта чура ма яьккха, яьккхача, ма 1отта.", "rus": "Без нужды не вынимай кинжал из ножен, а вынув, не коли им (по обычаю кинжалом можно только рубить)."}, {"id": 1846, "inh": "Шалта дика я бетта чу йоаллаш.", "rus": "Хороший кинжал тот, что лежит в ножнах."}, {"id": 1847, "inh": "Шалта иръяьчо валар дихьад, лаьтта аьхачо балаш йиай.", "rus": "Точивший кинжал, нашел погибель, пахавший землю, ел булки."}, {"id": 1848, "inh": "Ше баьккха лоам боккха хет.", "rus": "Гора, которую сам одолел, кажется самой высокой."}, {"id": 1849, "inh": "Ше везачо аьннар д1а ца эцар харцахьа варгва.", "rus": "Кто не принимает советы любящих его, тот пойдет неверной дорогой."}, {"id": 1850, "inh": "Ше де воалла Не всегда танцуют там, где раздаются хлопки."}, {"id": 1864, "inh": "Ши фуъ де енна котам яьтт1ай.", "rus": "Захотелось курочке зараз снести два яичка, да и лопнула."}, {"id": 1865, "inh": "Ши шай миссел мара мах бац, аьнна, хийтта саг а накъавоалаш моттигаш нийсалу.", "rus": "Бывает, что в чем-то пригодится и человек, за которого в другой раз ты не дал бы и двух пятаков."}, {"id": 1866, "inh": "Ши 1овдал в1ашаг1тохарах, царех хьаькъал дола ца1 хургвац; хьаькъал дола ши саг в1ашаг1техача, царех кхоъ хул.", "rus": "Из двух дураков не сделаешь одного умного; а из двух умных получается трое."}, {"id": 1867, "inh": "Ший баге лораяьчо ший корта лорабаьб.", "rus": "Кто следил за своим языком, тот уберег свою голову."}, {"id": 1868, "inh": "Ший бедараш тхах хувца г1ийрта къайг ерзана йисай.", "rus": "Захотела ворона обменять перья на шерсть и осталась голой."}, {"id": 1869, "inh": "Ший б1арг – алмаза к1иг да.", "rus": "Свой глаз – алмазная крупинка."}, {"id": 1870, "inh": "Ший б1арг байначун наьха б1арга т1ара к1ай дайнад.", "rus": "Одноглазый в чужом глазу бельмо увидел."}, {"id": 1871, "inh": "Ший б1енах хьазилга а г1ала хет.", "rus": "Даже птичке свое гнездо кажется башней."}, {"id": 1872, "inh": "Ший б1еха б1и къайга а дикаг1а хет.", "rus": "Даже вороне свое грязное гнездо милее."}, {"id": 1873, "inh": "Ший воацачох во1 хиннавац.", "rus": "Неродной – сыном не станет."}, {"id": 1874, "inh": "Ший даь-наьнаца во хинначун во т1ехье кхийнай.", "rus": "У того, кто плохо обращался со своими родителями, выросло плохое потомство."}, {"id": 1875, "inh": "Ший даьнеи наннеи мут1ахьа дола во1-йиша Даллана дукха дийзад.", "rus": "Богом любимы и сын, и дочь, если они почитают своих родителей."}, {"id": 1876, "inh": "Ший дег1а тоам леха саг вай оарцана ма нийсалойла.", "rus": "Даже в большой опасности нам не нужен человек, пекущийся только о своих удовольствиях."}, {"id": 1877, "inh": "Ший дег1ах кхийтта саьрг бекъа санна хет.", "rus": "И прут тебе кажется оглоблей, если им ударили те d": 2095, "inh": "1ошершаш мо хьо хьалширша даларе, ц1акхаьча а хургдар вай.", "rus": "Если бы ты (волокуша) и вверх волоклась так же, как вниз, мы бы давно были дома."}, {"id": 2096, "inh": "“1оэккха” аьнначун йийнаяц фоарт, 1оийккхачун йийнай.", "rus": "Шею сломал не тот, кто сказал “прыгай”, а тот, кто прыгнул."}, {"id": 2097, "inh": "1у воаца 1ул – берзалой фос.", "rus": "Стадо без присмотра – волчья добыча."}, {"id": 2098, "inh": "1у воацаш жа мегаргдац, да т1а воацаш дезал мегаргбац.", "rus": "Овец нельзя оставить без пастуха, так и семье нужен отец (хозяин)."}, {"id": 2099, "inh": "1у фийла хилча, жена борал деза хул.", "rus": "У бдительного (хорошего) пастуха овцы тяжело ходят (овцы тучные)."}, {"id": 2100, "inh": "1уйранна г1айг1а еций еха маьчи, сайрийна г1айг1а еций ц1аг1ара во сесаг (дезал).", "rus": "Разве не горе – утром увидеть рваные чувяки; разве не горе – вечером увидеть свою плохую жену (семью)."}, {"id": 2101, "inh": "1уйре йоацаш сайре енаяц, цхьа дика т1ехьа доацаш во а денадац.", "rus": "Без утра не бывает вечера, за горем приходит хоть какое-то добро."}, {"id": 2102, "inh": "1уйре ц1ийелча, маша кийчбе; сайре ц1ийелча, кхача кийчабе.", "rus": "Заря красная – готовься к непогоде; закат красный – готовься в путь."}, {"id": 2103, "inh": "1уйрана вена хьаьша гайнавац.", "rus": "Утренние гости не задерживаются."}, {"id": 2104, "inh": "1уйранна хулчи леха т1ехье ма хийла вай.", "rus": "Да не будет у нас потомков, утром ищущих свои чувяки."}, {"id": 2105, "inh": "“1урден сарралца болх ца бе, яь худар дуаргдар аз”, - яхад мекъачо.", "rus": "“Лучше съесть котел каши, чем весь день работать”, - говорил лентяй."}, {"id": 2106, "inh": "1урденна сарралца къахьегарах я зунгата юкъ селлара йиткъа.", "rus": "У муравья талия так тонка потому, что он в трудах с утра до вечера."}, {"id": 2107, "inh": "1унал даь дег1 эзде хиннад.", "rus": "Благородно то тело, которое содержат в строгости."}];

// Index proverbs by id for fast lookup
const provIdx = {};
PROV_FULL.forEach(p => provIdx[p.id] = p);

const BATCH = 8; // parables per API call
let running = false;
let results = {}; // file -> [id, id, id]

// Try to load saved results
try {
  const saved = localStorage.getItem('parable_matches');
  if (saved) results = JSON.parse(saved);
} catch(e) {}

const log = document.getElementById('log');
const status = document.getElementById('status');
const bar = document.getElementById('progressBar');
const tbody = document.getElementById('tbody');

function addLog(msg) {
  log.innerHTML += msg + '<br>';
  log.scrollTop = log.scrollHeight;
}

function updateProgress() {
  const done = Object.keys(results).length;
  const pct = Math.round(done / PARABLES.length * 100);
  bar.style.width = pct + '%';
  status.textContent = `Обработано: ${done} / ${PARABLES.length}`;
  renderTable();
  if (done > 0) {
    document.getElementById('downloadBtn').disabled = false;
    document.getElementById('downloadCsvBtn').disabled = false;
  }
  try { localStorage.setItem('parable_matches', JSON.stringify(results)); } catch(e) {}
}

function renderTable() {
  tbody.innerHTML = '';
  PARABLES.forEach(p => {
    const ids = results[p.file];
    let provHtml = ids
      ? ids.map(id => {
          const pr = provIdx[id];
          return pr
            ? `<div class="inh">${pr.inh}</div><div class="rus">${pr.rus}</div><hr style="border-color:#2a0e00;margin:.3rem 0">`
            : `<div style="color:#f55">id ${id} not found</div>`;
        }).join('')
      : '<span style="color:#555">—</span>';
    tbody.innerHTML += `<tr>
      <td class="num">${p.num}</td>
      <td>${p.title_rus}<br><span style="color:#888;font-size:.78rem">${p.text_rus.substring(0,120)}…</span></td>
      <td class="prov">${provHtml}</td>
    </tr>`;
  });
}

async function callClaude(prompt) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  return data.content[0].text;
}

async function run() {
  running = true;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;

  const todo = PARABLES.filter(p => !results[p.file]);
  addLog(`Осталось обработать: ${todo.length} притч`);

  // Build proverbs reference string (ids + short russian)
  const provRef = PROV_PROMPT.map(p => `${p.id}:${p.r}`).join('\n');

  for (let i = 0; i < todo.length && running; i += BATCH) {
    const batch = todo.slice(i, i + BATCH);
    const parBlock = batch.map(p =>
      `[${p.file}] ${p.num} «${p.title_rus}»\n${p.text_rus.substring(0, 350)}`
    ).join('\n\n');

    const prompt = `Список ингушских поговорок (индекс:перевод на русском):\n${provRef}\n\nДля каждой притчи выбери РОВНО 3 поговорки, наиболее подходящих по смыслу. Используй только русские тексты для сравнения.\nОтвечай ТОЛЬКО JSON без пояснений:\n{"p_001.html":[12,345,678],...}\n\nПРИТЧИ:\n${parBlock}`;

    try {
      addLog(`Батч ${Math.floor(i/BATCH)+1}: притчи ${batch.map(p=>p.num).join(', ')}`);
      const resp = await callClaude(prompt);
      const m = resp.match(/\{[\s\S]*\}/);
      if (m) {
        const chunk = JSON.parse(m[0]);
        Object.assign(results, chunk);
        updateProgress();
        addLog(`  ✓ получено ${Object.keys(chunk).length} результатов`);
      } else {
        addLog(`  ✗ JSON не найден в ответе`);
      }
    } catch(e) {
      addLog(`  ✗ Ошибка: ${e.message}`);
      await new Promise(r => setTimeout(r, 3000));
    }
    await new Promise(r => setTimeout(r, 800));
  }

  running = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  addLog('Готово!');
  updateProgress();
}

document.getElementById('startBtn').onclick = run;
document.getElementById('stopBtn').onclick = () => { running = false; };

document.getElementById('downloadBtn').onclick = () => {
  // Build rich output with full proverb data
  const out = PARABLES.map(p => ({
    file: p.file,
    num: p.num,
    title_rus: p.title_rus,
    proverbs: (results[p.file] || []).map(id => provIdx[id] || {id})
  }));
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'parable_proverb_matches.json';
  a.click();
};

document.getElementById('downloadCsvBtn').onclick = () => {
  let csv = 'file,num,title_rus,prov1_inh,prov1_rus,prov2_inh,prov2_rus,prov3_inh,prov3_rus\n';
  PARABLES.forEach(p => {
    const ids = results[p.file] || [];
    const provs = ids.map(id => provIdx[id] || {inh:'',rus:''});
    while (provs.length < 3) provs.push({inh:'',rus:''});
    const esc = s => '"' + (s||'').replace(/"/g,'""') + '"';
    csv += [p.file, p.num, p.title_rus, provs[0].inh, provs[0].rus, provs[1].inh, provs[1].rus, provs[2].inh, provs[2].rus].map(esc).join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'parable_proverb_matches.csv';
  a.click();
};

// Render existing results on load
updateProgress();
</script>
