<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сопоставление притч и поговорок</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 1rem; background: #1a0a00; color: #f5d07a; }
  h1 { font-size: 1.2rem; }
  .controls { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin: 1rem 0; }
  button { background: #c8830a; color: #1a0a00; border: none; padding: .5rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
  button:disabled { opacity: .4; cursor: default; }
  .progress { background: #3a1a00; border-radius: 4px; height: 18px; width: 100%; margin: .5rem 0; }
  .progress-bar { background: #c8830a; height: 100%; border-radius: 4px; transition: width .3s; }
  .log { background: #0d0500; border: 1px solid #3a1a00; border-radius: 4px; padding: .5rem; height: 120px; overflow-y: auto; font-size: .8rem; color: #aaa; margin: .5rem 0; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 1rem; }
  th { background: #3a1a00; padding: .4rem .6rem; text-align: left; position: sticky; top: 0; }
  td { padding: .4rem .6rem; border-bottom: 1px solid #2a0e00; vertical-align: top; }
  td.num { color: #888; width: 3rem; white-space: nowrap; }
  td.prov { color: #ccc; font-size: .8rem; }
  .inh { color: #f5d07a; }
  .rus { color: #aaa; }
  #downloadBtn { margin-top: 1rem; }
  .status { font-size: .9rem; }
</style>
</head>
<body>
<h1>Сопоставление притч → поговорки (Claude API)</h1>
<div class="controls">
  <button id="startBtn">▶ Запустить</button>
  <button id="stopBtn" disabled>⏹ Остановить</button>
  <span class="status" id="status">Готово к запуску. 171 притча, 2108 поговорок.</span>
</div>
<div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
<div class="log" id="log"></div>
<button id="downloadBtn" disabled>⬇ Скачать результат (JSON)</button>
<button id="downloadCsvBtn" disabled style="margin-left:.5rem">⬇ Скачать CSV</button>
<div style="overflow-x:auto"><table id="resultsTable">
  <thead><tr><th>#</th><th>Притча (рус.)</th><th>Поговорки</th></tr></thead>
  <tbody id="tbody"></tbody>
</table></div>

<script>
const PARABLES = [{"file": "p_001.html", "num": "№ 1", "title_rus": "Его благородство сильнее моих слов", "text_rus": "В одном доме собрались люди. Они сидели и беседовали. В это время вошел пророк Мухаммед. Все встали, приветствуя его. Пророк попросил их сесть, и тогда все сели. Один юноша продолжал стоять. Пророк повторно предложил ему сесть. Юноша продолжал стоять. На него зашикали: \"Садись, тебе говорят. Для теб"}, {"file": "p_002.html", "num": "№ 2", "title_rus": "Гибель Пиръона", "text_rus": "Пиръон был неправедный человек. Где-то на краю света из латуни и меди он сделал своды в виде небес. По ним он с грохотом катал бочки и лил из них воду.\n- Я ли не могу греметь громом? Я ли не могу лить дождь? Я ли не являюсь богом? – говорил он при этом.\n\nЖил Пиръон пятьсот лет. Хотя все это время он"}, {"file": "p_003.html", "num": "№ 3", "title_rus": "Утерянную честь не вернуть", "text_rus": "Когда-то дружили Вода, Ветер, Огонь и Честь. Они всегда были вместе, но как-то им необходимо было на время разойтись, чтобы каждый мог заняться своими делами. При расставании стали они рассуждать, как им вновь найти потом друг друга. Вода сказала, что ее можно найти там, где растет камыш. Ветер сказ"}, {"file": "p_004.html", "num": "№ 4", "title_rus": "Кто любит меня, тот любит мой желудок", "text_rus": "Руки и ноги сказали:\n- Мы трудимся, не зная покоя, а живот все поедает и совершенно не трудится. Не будем дальше его кормить.\n\nГолова сказала:\n- Не глупите. Живот много трудится. Все, что вы ему даете, он перемалывает и отдает телу.\n\nНе послушались руки и ноги. Желудок опустел, тело стало худеть. Ру"}, {"file": "p_005.html", "num": "№ 5", "title_rus": "Сокол и ворона", "text_rus": "Подружились сокол и ворона. Как-то отправились они в путь. Летели далеко. Вот ворона села и сказала соколу: “Устала я, лететь не могу. Во-он вдали я вижу сдохшего бычка. Если ты не принесешь мне его мяса, я не смогу подняться”.\n\nА этот дохлый бычок был приманкой для птиц, - некий князь установил вок"}, {"file": "p_006.html", "num": "№ 6", "title_rus": "Неприкаянная ворона", "text_rus": "Увидела ворона, что люди кормят голубей. Решивши, зачем мне жить впроголодь, ворона насобирала голубиных перьев, облепила ими себя и пошла в голубиную стаю. Пасется она среди них, у вдруг увидела пролетающую в небе ворону. Забывшись, ворона закаркала. Хозяин голубей, узнав воронью хитрость, камнями "}, {"file": "p_007.html", "num": "№ 7", "title_rus": "Осел, стремившийся стать лошадью", "text_rus": "Надоело ослу, что все частят его словами “осел, осел!” и решил: “Больше не позволю надсмехаться надо мною. Стану-ка я лошадью”.\n\nДля начала осел решил научиться ржать по-лошадиному. Взошел он на пригорок и с утра до вечера пытался подражать лошадиному ржанию. Однако ничего из этого не вышло. Мало то"}, {"file": "p_008.html", "num": "№ 8", "title_rus": "Осел, захотевший стать львом", "text_rus": "Где-то осел наткнулся на мертвого льва, содрал его шкуру, накинул ее на себя и стал стращать других зверей. Возгордился осел настолько, что забылся и как-то заорал по-своему, по-ослиному. А в это время он находился среди волков. Все звери узнали осла. Тут волки накинулись и разодрали его."}, {"file": "p_009.html", "num": "№ 9", "title_rus": "Очень меня огорчило", "text_rus": "На окраине села понуро, одолеваемый большой печалью, стоял осел. Возвращавшаяся с пастбища корова спросила:\n- Чего это ты такой печальный? Что тебя гложет?\n- Да вот, услышал я как мой хозяин сегодня какого-то дурака обозвал “ослом”. Очень уж это меня огорчило."}, {"file": "p_010.html", "num": "№ 10", "title_rus": "Лошади прогнали мула", "text_rus": "Как-то паслись кони. Подошел к ним мул.\n- Ты чего к нам примазываешься? – возмутились кони, - тебе, мулу, не место среди нас, коней. Поди прочь!\n- Не гоните меня, - стал просить мул, - ведь мать моя, кобылица, является сестрою лошадиного племени.\n- Хотя мать твоя и была из нашего племени, но отец-то"}, {"file": "p_011.html", "num": "№ 11", "title_rus": "Жеребчиком выпитое молоко", "text_rus": "По селу ехал всадник. Вдруг на виду у всех его конь начал падать на колени. Всадник соскочил и остановился в сторонке. Там была грязная лужа. Конь начал кататься в ней. Кто-то из сельчан крикнул:\n- Что мы видим? Разве лошади валяются в грязи и в лужах. Удивительное дело!\n- Ничего удивительного в это"}, {"file": "p_012.html", "num": "№ 12", "title_rus": "За то, что вы ему потворствуете", "text_rus": "В некоем селе жил злодей, известный своими убийствами, воровством, клятвопреступлениями и прочими тяжкими злодеяниями.\n\nНа сельском майдане – площади – по каким-то делам собрались сельчане. С неба спустился ангел Джабраил и сказал им:\n- В вашем селе свободно живет лютый злодей. Меня послали сообщить"}, {"file": "p_013.html", "num": "№ 13", "title_rus": "Шесть лепешек", "text_rus": "Некая хозяйка ежедневно пекла по шесть лепешек. Ни больше ни меньше, а всегда шесть. Однажды соседка спросила ее:\n- Почему ты ежедневно печешь именно шесть лепешек: ни больше и ни меньше?\n\nХозяйка ответила:\n- Двумя я отдаю долг, другие две я даю в долг, одну выбрасываю, а шестую съедаю сама.\n- Тепер"}, {"file": "p_014.html", "num": "№ 14", "title_rus": "И я люблю своего сына", "text_rus": "Как-то старик, его сын и внук пошли на покос. День был жаркий, и нещадно палило солнце. Мальчик был без шапки, и солнце могло напечь ему голову. Тогда его отец снял свою шапку и надел на мальчика, а сам остался с непокрытой головою. Тут старик снял свою шапку и натянул ее на голову своего сына.\n\nВзр"}, {"file": "p_015.html", "num": "№ 15", "title_rus": "Любовь отца к сыну", "text_rus": "Когда у пророка Мухаммеда умер его сын Ибрахим, по городу Медине распостранился запах жареного мяса. Это очень задело зятя пророка Турпала Али. Он возмутился, что в день, когда в доме пророка траур, кто-то ублажает себя вкусной пищей. Решил Турпал Али рассправиться с этим человеком. Он оголил свою с"}, {"file": "p_016.html", "num": "№ 16", "title_rus": "Рука матери", "text_rus": "Когда-то жили мать и сын. Хорошо жили, но настало время, и мать померла. Тело ее положили в надземный склеп.\n\nШло время, и почему-то сын начал худеть день ото дня все больше и больше. Каких-то особенных забот у него не было, еды было вдоволь и ел он неплохо, однако, худел все больше. Ни одно лекарст"}, {"file": "p_017.html", "num": "№ 17", "title_rus": "Как отец сыну невесту выбрал", "text_rus": "Некий отец решил женить сына. Подыскал он ему невесту, но сын не был доволен этим выбором. Произошла размолвка. Отец заболел и слег. Все навещали его, интересовались, чтобы такое он хотел покушать. Он отвечал, что ничего не хочет. Но однажды утром он сказал сыну: “Сегодня я видел сон, что съел кусок"}, {"file": "p_018.html", "num": "№ 18", "title_rus": "Лучше бы удержал в голове", "text_rus": "Долг отца поучать своих сыновей, поэтому некий старик по разным случаям давал советы своему сыну, а ему это порядком надоело. Однажды отец сказал:\n- Не водись с этими людьми, - тут он назвал какую-то семью, - я их хорошо знаю. Они способны на любую подлость.\n\nТерпение сына иссякло, и он, рассердивши"}, {"file": "p_019.html", "num": "№ 19", "title_rus": "Тайный совет отца", "text_rus": "Некий отец отправил своего сына учиться в другую большую страну. Выучился он и стал там большим вельможей, разбогател и приобрел много друзей. От хорошей жизни он почти забыл своего состарившегося отца. Прошло несколько лет, сподвижники-друзья перестали слушать его указания, да и богатство его стало"}, {"file": "p_020.html", "num": "№ 20", "title_rus": "Из-за чего потомки Якуба лишились пророческого сана", "text_rus": "Известно, что в каждом новом потомстве рода пророка Якуба появлялся один новый пророк.\n\nСреди многих сыновей Якуба лишь один Юсуп удостоился пророческого сана. При дворе фараона пророк Юсуп стал весьма влиятельным, царственным вельможей. Он очень возгордился этим. Раз в покои Юсупа зашел его отец, п"}, {"file": "p_021.html", "num": "№ 21", "title_rus": "Мои снохи хорошие", "text_rus": "Некий мужчина женил своих сыновей, успокоился так, что начал совершать намаз. Между снохами и сыновьями случались потасовки, пересуды, но старик во все их тяжкие не вникал. Знай, молился себе.\n\nКак-то пришел давнишний друг проведать старика. Он спросил:\n- Прошло уже достаточно времени, чтобы узнать,"}, {"file": "p_022.html", "num": "№ 22", "title_rus": "Сосед дороже денег", "text_rus": "За неким мужчиной числился срочный долг. Делать было нечего, и он решил продать свой дом. По ингушскому обычаю, если человек продает дом или землю, он должен их прежде всего предложить своему соседу и спросить, купит ли он их. Когда мужчина так и поступил, сосед спросил его:\n- Почему ты продаешь сво"}, {"file": "p_023.html", "num": "№ 23", "title_rus": "Твои сыновья не сделают того, что ты не сделал", "text_rus": "У некоего мужчины подрастало несколько сыновей, чем он очень гордился. У этого мужчины был друг, с которым он всегда делился своими мыслями и делами. Гордясь своими сыновьями, он сказал этому другу:\n- Не много времени осталось, чтобы мои сыновья отомстили за своего деда, моего отца. Пройдет года два"}, {"file": "p_024.html", "num": "№ 24", "title_rus": "Во всем он виноват", "text_rus": "Некий мальчик где-то украл курицу и принес ее домой. Отец похвалил сына. Мальчику понравилось воровство. И года не прошло, как сын уже привел чужую корову. И тут отец всячески расхвалил сына. Шли годы, сын стал заправским вором. Обнаглев, он решил унести казну именитого князя и попался. Суд приговор"}, {"file": "p_025.html", "num": "№ 25", "title_rus": "Изгнание напавших", "text_rus": "У одного мужчины была очень ленивая жена-притворщица. Как только ей скажут, что нужно что-нибудь сделать, она тут же хваталась за голову или сердце и говорила: “Ой, на меня напало (болезнь напала)!” Но ела она сытно и была довольно-таки упитанной.\n\nКак-то муж привез прутья и стал в саду плести сапет"}, {"file": "p_026.html", "num": "№ 26", "title_rus": "Сделай корзину покрепче", "text_rus": "Некогда был обычай: глубоких стариков, неспособных передвигаться, сажали в корзину и скатывали в пропасть в определенном месте.\n\nТак, отец одного мужчины очень одряхлел. Начал мужчина для него плести корзину. Его малолетний сынок игрался рядом. Он спросил отца:\n- Дади (отец), для чего ты плетешь кор"}, {"file": "p_027.html", "num": "№ 27", "title_rus": "Жены обкорнали мужа", "text_rus": "Некий муж прожил с женою лет двадцать, а затем привел в дом вторую, молодую, жену. Старшая жена стыдила мужа, говоря, что он уже стар. Младшая же хотела, чтобы ее муж выглядел молодым. Через какое-то время голова мужчины совершенно облысела, будто все волосы у него повылазили. Случившимся поинтересо"}, {"file": "p_028.html", "num": "№ 28", "title_rus": "Оказывается, ты косоглазый", "text_rus": "Некий мужчина поворовывал на работе. Каждый раз, приходя домой, он что-нибудь да приносил. Все шло хорошо в их семье, но однажды он вернулся с пустыми руками. Удивленно глянула жена на его руки, а потом и в его глаза. Муж сказал:\n- Все, больше “гостинцев” не будет. Меня уволили с работы.\n\nПристально"}, {"file": "p_029.html", "num": "№ 29", "title_rus": "Мужчина, который храбр перед женой", "text_rus": "Некий умный, известный и богатый мужчина объявил:\n“Пусть явится ко мне тот, кто храбр перед своей женою. Если такой найдется, он получит подарок”.\n\nСтали приходить мужчины и хвастаться, что они храбры перед своими женами. После расспросов людей и самого пришедшего заявителя выяснялось, что это не со"}, {"file": "p_030.html", "num": "№ 30", "title_rus": "Настоящий мужчина с женами не дерется", "text_rus": "Известному мужчине Уциге Малсагу необходимо было поехать к шамилевским наибам. В этом опасном пути ему нужен был мужественный и храбрый попутчик. Начал он людей расспрашивать, и ему посоветовали:\n“Есть известный абрек Умарий Эла. В бранных делах он может уступить только тебе”.\n\nС помощью односельчан"}, {"file": "p_031.html", "num": "№ 31", "title_rus": "Мужчина, который не слушается жены", "text_rus": "Некий князь объявил: “Пусть явится ко мне тот, кто не слушается советов своей жены и делает только то, что сам считает нужным. Такому мужчине я на выбор дам любого коня из своего табуна”.\n\nМногие пытались получить такой ценный подарок. Но из них только один на поверку оказался тем, кто совершенно не"}, {"file": "p_032.html", "num": "№ 32", "title_rus": "Правда сильна", "text_rus": "Пророк Сулейман не только знал языки всего сущего на земле, но также обладал даром волшебника.\n\nСулейман, его жена и еще несколько человек сидели как-то в гостях. Хозяин дома приготовил барана и целиком поставил его на стол. Еще никто к барану не притронулся, и тут Сулейман сказал:\n- Если сидящие за"}, {"file": "p_033.html", "num": "№ 33", "title_rus": "О хорошей жене", "text_rus": "Некогда наши паломники пошли в Мекку. Паломничество закончилось, но один из них задержался в Мекке. Вскоре и ему захотелось вернуться домой. Об этом он заявил в Мекке святому человеку, который сказал: “В пятницу в мечеть войдет раньше всех и выйдет позже всех один человек. Попроси отвезти себя домой"}, {"file": "p_034.html", "num": "№ 34", "title_rus": "Вопросы Шамиля", "text_rus": "В войско Шамиля пришло письмо к какому-то воину с извещением, что его жена умерла. Письмо получил сам Шамиль. Решил он проверить того воина и послал за ним. Когда он пришел, Шамиль сказал:\n- Тебе пришло письмо с известием, что умер твой отец.\n- Если так, то свалилась крыша нашего дома, и мне необход"}, {"file": "p_035.html", "num": "№ 35", "title_rus": "Просите хорошего мужа", "text_rus": "Как-то две сестры пошли по воду. К роднику подошел некий старик, уставший от долгого пути. Сестры проявили к нему всяческое уважение и были предельно услужливы. Старик этот был не простым путником, а был волшебником. Об этом он поведал сестрам и добавил:\n- Не загадывайте мне ни два, ни три желания. "}, {"file": "p_036.html", "num": "№ 36", "title_rus": "Клятва волка", "text_rus": "Некий мальчик пас овец. Как-то подошел к нему волк и сказал:\n- Дай мне одну овцу. Я состарился и потому прошу. А так я и без спроса взял бы. Дашь овцу – отблагодарю.\n- Не могу дать без отцовского позволения.\n- Тогда иди и спроси, а я пока постерегу овец.\n- Как я могу их доверить волку? – удивился ма"}, {"file": "p_037.html", "num": "№ 37", "title_rus": "Возвращение Благодати", "text_rus": "Некто проснулся утром, вышел во двор и увидел, что по свежевыпавшему снегу идут следы из его дома, но во двор следы не вели. Задумался он и стал гадать: что бы это могло быть? Решив выяснить, отправился по следу, который и привел его к пещере. Он крикнул в нее:\n- Не оставляя следов к моему дому, но "}, {"file": "p_038.html", "num": "№ 38", "title_rus": "Это моя родина", "text_rus": "Пророк Сулейман, как известно, знал языки людей и всех животных. Однажды он решил очистить место, которое заросло буръяном и было загажено. Пророк Сулейман приказал всем проживавшим там тварям покинуть это место, так как он пустит по нему огонь, который все очистит. Все животные разбежались, и проро"}, {"file": "p_039.html", "num": "№ 39", "title_rus": "Советы Идриса", "text_rus": "Седьмого потомка пророка Адама звали Идрис. Был он пророком, и от него пошли науки. Он дал людям честь, благородство и счастье. Вот некоторые его советы:\n- Носилки для мертвых никогда не будут знать покоя, пока на земле живут люди.\n- Как бы долго ни смотрел глаз, он никогда не насытится.\n- Неиссякае"}, {"file": "p_040.html", "num": "№ 40", "title_rus": "Только человеку дан ум", "text_rus": "Бог создал человека, а затем создал разных животных. Человек пожаловался:\n- Боже, ты животных создал более сильными, чем я. Они обладают цепкими когтями, острыми клыками, длинными рогами, крепкими копытами. Ничего подобного ты мне не дал.\n- Ты не прав, - ответил Всевышний, - все то, что ты говоришь,"}, {"file": "p_041.html", "num": "№ 41", "title_rus": "Когда распределяли ум", "text_rus": "Прослышав, что где-то наделяют живые существа умом, свинья отправилась в путь. Выглянувшая из моря рыба попросила и ей принести ума.\n\nПридя на место распределения ума, свинья увидела огромную очередь.\n“Если земная твердь принадлежит мне, а морские просторы принадлежат рыбе, зачем нам нужен этот ум”,"}, {"file": "p_042.html", "num": "№ 42", "title_rus": "Я боюсь, что из-за тебя мне влетит", "text_rus": "Голова часто навещала язык и расспрашивала его:\n- Как поживаешь? Как твои дела?\n- Хорошо живу. Ем сладко и сытно, сплю в тепле и удобстве, - отвечал язык, - вот только ты докучаешь мне своими расспросами...\n- Ты думаешь, я навещаю тебя из любви? – не сдержалась голова. – Я пытаюсь ублажать тебя пото"}, {"file": "p_043.html", "num": "№ 43", "title_rus": "Содержание собаки в пещере", "text_rus": "Из-за своего языка, болтавшего когда не надо и о чем не надо, некий мужчина не ужился в своем селе. Он вынужден был его покинуть.\n\nПрошло пять-шесть лет. Раз односельчане на охоте, в горах, наткнулись на пещеру, в которой сидел какой-то мужчина. Хотя он оброс волосами и весь был в лохмотьях, они при"}, {"file": "p_044.html", "num": "№ 44", "title_rus": "Подушку положил в ногах", "text_rus": "Лежал на кровати некий мужчина, подложив подушку не под голову, а под ноги. Зашедший по делу сосед поинтересовался:\n- Что я вижу? Подушку, которую люди кладут под голову, ты положил под ноги. Почему так?\n- Да потому, что на подушке должны лежать у меня ноги, а не голова. Из дальнего селения пешком н"}, {"file": "p_045.html", "num": "№ 45", "title_rus": "Голова должна быть одна", "text_rus": "Жил некогда сармак-дракон с девятью головами и одним телом. Когда на него напали люди, то между этими головами произошел разлад, и люди легко убили это чудовище.\n\nЗатем люди встретили другого сармака, который имел десять тел, а голову имел только одну. Это чудовище сумело сохранить все свои десять т"}, {"file": "p_046.html", "num": "№ 46", "title_rus": "Делай то, чего не сделать нельзя", "text_rus": "Полюбили друг друга юноша и девушка. Ее родители были против их брака. Девушка же желала выйти замуж только за этого юношу. Она решила обхитрить своего отца. Вечером постелила она ему постель и спросила:\n- Ответь мне на один вопрос. Что лучше сделать? Или то, чего не сделать нельзя, или то, что можн"}, {"file": "p_047.html", "num": "№ 47", "title_rus": "А была ли у него голова?", "text_rus": "Раз пошли охотники на промысел. А среди охотников тоже бывают и умные, и умом недалекие. Увидели эти охотники в лесу нору, в которую вели свежие следы. Охотники порешили: раз сюда ведут следы, то там затаился какой-то зверь. Но как его взять? Один из охотников сказал:\n- Я заползу в нору. Если там бу"}, {"file": "p_048.html", "num": "№ 48", "title_rus": "Если бы в голове были мозги", "text_rus": "Хорошо, в достатке, жил себе некий мельник. Но как-то разбойники соблазнили его:\n“Что ты возишься в этой пыли? Мужское ли это занятие? Наши руки не дотрагиваются ни до какой работы, а глянь, какие мы молодцы, и какие мы богатые!”\n\nСоблазнился мельник, поверил им, продал свою мельницу, накупил оружия"}, {"file": "p_049.html", "num": "№ 49", "title_rus": "Зять, сходивший в горы", "text_rus": "Как-то сидела родня и что-то обсуждала. Невдалеке сидел и их услужливый зять. В конце беседы старший сказал:\n- Ну что ж, одному из нас надо пойти в горы.\n\nМолча встал зять и вышел. Где-то он пропадал целую неделю. Когда вернулся, его спросили:\n- Где же ты пропадал? Чем все это время занимался?\n- Как"}, {"file": "p_050.html", "num": "№ 50", "title_rus": "Сними с нее палас", "text_rus": "В холодный зимний вечер некая хозяйка подоила корову и накрыла ее паласом. Освободившись от дневных забот, хозяйка села ужинать. В доме печь была жарко натоплена. Ужин был горячий. Съев его, хозяйка выпила еще и горячего чаю. Разогрелась она, сняла с плеч пуховый платок и сказала своей дочери:\n“Наве"}, {"file": "p_051.html", "num": "№ 51", "title_rus": "Что стало с мухами", "text_rus": "В некий дом налетело много мух. Надоели они хозяйке. Она поставила чашечку с медом. Мухи обрадовались:\n“Смотрите, какая гостеприимная наша хозяйка. Она нас медом угощает. Слетайтесь сюда!”\n\nМухи жадно накинулись на мед. Лапка за лапкой стали они увязать в нем. Чем больше трепыхались, тем больше увяз"}, {"file": "p_052.html", "num": "№ 52", "title_rus": "Когда нет согласия", "text_rus": "У некоего хозяина были справные быки. Волки мечтали поживиться ими, но хозяин был бдительным и хорошо охранял своих быков. Тогда волки решили пуститься на хитрость. “Эй, быки! – сказали волки. – Жестокий человек ваш хозяин. Целыми днями он держит вас в ярме. Посмотрите на нас. Мы весело живем, как н"}, {"file": "p_053.html", "num": "№ 53", "title_rus": "Что случилось с ослом", "text_rus": "Состарился лев настолько, что уже не мог подняться с места. Все звери, хотя они и боялись близко подойти ко льву, издали оскорбляли и вышучивали его.\n\nВсе это прослышал осел и тоже решил поиздеваться над львом. Осел ходил вокруг льва, поносил его последними словами. Однако лев лежал неподвижно, с за"}, {"file": "p_054.html", "num": "№ 54", "title_rus": "Теперь можно скушать этот курдюк", "text_rus": "Бежала лисица по лесной опушке и увидела лежащий курдюк.\n“Клянусь, не зря он тут так открыто лежит. Видно, не с добрым умыслом его положили”, - решила лисица.\n\nТут она увидела бредущего невдалеке волка. Подбежала к нему лисица и сказала:\n“Волк, я тут неподалеку нашла для нас курдюк. Поскольку ты ста"}, {"file": "p_055.html", "num": "№ 55", "title_rus": "Когда лезешь не в свое дело…", "text_rus": "Больной лев слег в постель. Все звери наведывали его. Лиса же, надеясь, что вскоре лев помрет, не являлась. Волк об этом донес льву. Узнала лиса про донос и быстренько явилась ко льву. Он спросил ее:\n- Ты почему так долго не являлась? Уж, верно, ждала, пока я околею?\n- Как я могла ждать этого? Ведь "}, {"file": "p_056.html", "num": "№ 56", "title_rus": "Готов умереть в бою", "text_rus": "У некоего царя был знаменитый полководец. Как-то пировали они вдвоем и по пьянке заспорили крепко, чуть не до драки. Царь велел бросить полководца в глубокую яму. Бросили. Туда же опускали ему еду, питье.\n\nВскоре соседний царь начал войну против этого царства. А у того царя не было никого, кто мог б"}, {"file": "p_057.html", "num": "№ 57", "title_rus": "Из уст хорошего человека лишь доброе слово услышишь", "text_rus": "У одного известного мужчины выросла пригожая красавица-дочь. Начали к ее отцу наведываться почтенные мужчины и сватать эту девушку за своих сыновей. Как положено, при первом посещении сватов определенного ответа им не дают, но ведутся разговоры о разном.\n\nТак вот отец девушки, между прочим, расспраш"}, {"file": "p_058.html", "num": "№ 58", "title_rus": "Звероподобные", "text_rus": "Слепили из глины Адама. Ангел Джабраил привел из рая душу. Ее и вложили в первого человека.\n\nШайтан, всегда споривший с Всевышним, тоже решил создать человека и слепил не одного, а с десяток. А где взять души? Кто пустит шайтана в рай? Делать нечего, и шайтан стал брать души разных зверей: медведя, "}, {"file": "p_059.html", "num": "№ 59", "title_rus": "Я бы даже из ада огонь принес", "text_rus": "Стояли несколько мужчин и беседовали о разном. Среди них был один с неуживчивым и ершистым характером, из тех, кто всегда вносит в компанию ссору и раздор.\n\nВ разговоре распалился он и, решив показать себя бесстрашным мужчиной, хвастливо изрек:\n- Да я, если бы захотел, даже из ада принес бы огонь.\n-"}, {"file": "p_060.html", "num": "№ 60", "title_rus": "Решила ворона гнездо поменять", "text_rus": "Куда-то озабоченно летела ворона.\n- Эй! Куда это ты так заспешила? – спросила какая-то птица.\n- Мое гнездо все загажено, развонялось, как навозная жижа весною. Лечу новое гнездо строить, ответила ворона.\n- А скажи, кто же будет жить в том новом гнезде? – вновь спросила птица.\n- Я! А кто же еще? – бы"}, {"file": "p_061.html", "num": "№ 61", "title_rus": "Тебе самой не трудно?", "text_rus": "Некий горец спустился к реке Ассе. Она была очень бурливой. До этого дня горцу не приходилось переходить ее. Снял он с себя одежду и с большими трудностями кое-как перешел Ассу. Известно, что она холоднее льда в любое время года. Трясется продрогший горец. Чуточку придя в себя, он сказал:\n“Эй, Асса!"}, {"file": "p_062.html", "num": "№ 62", "title_rus": "Выстрелил в реку Фарту", "text_rus": "Некий горец отправился в путь. Подошел он к вспенившейся реке и сказал ей:\n“Река Фарта, ты всеми весьма почитаема, знаешься с настоящими мужчинами, хорошо принимаешь и провожаешь гостей. Я, Дунда, иду к тебе в гости. Без вреда переведи меня на другой берег”, - сказал горец и начал переходить реку.\n\n"}, {"file": "p_063.html", "num": "№ 63", "title_rus": "Как умер Буга", "text_rus": "Некогда жил горец по имени Буга. Он был бессердечным и жестоким разбойником и убийцей. Занимался Буга тем, что похищал людей, а затем требовал за них выкуп.\n\nКак-то он пленил мать с ребенком. Видимо, они были настолько безродными, что никто за них не заступился и не предложил выкупа. Тогда Буга маль"}, {"file": "p_064.html", "num": "№ 64", "title_rus": "Не буду больше никогда делать кольчуги", "text_rus": "В ауле Нелх жил человек по имени Мярше. Был он прославленным кузнецом. В то время мы еще не были под властью русского царя. Наши предки покупали в Грузии ткани, железо и прочие вещи. Мярше возил оттуда железо, вытягивал его в проволоку, затем свивал ее в кольца. Из них он делал кольчуги. Они были на"}, {"file": "p_065.html", "num": "№ 65", "title_rus": "Кощунство", "text_rus": "Один старик из Экажева рассказывал о случае, о котором ему поведал некий осетин.\n\nКогда нас выслали, то поселившиеся вместо нас люди разрушили наши кладбища, а из чуртов – надмогильных памятников – стали сооружать нужники и силосные ямы. Кто-то догадался употребить эти камни на постройку дома. Я тол"}, {"file": "p_066.html", "num": "№ 66", "title_rus": "Он отомстит за меня", "text_rus": "Один старик часами просиживал на лавочке у ворот. Какая-то печаль одолевала его. Он сажал на колени внучонка, поглаживал его по головке и при этом приговаривал:\n“Мой дорогой, скоро вырастешь, скоро отомстишь за своего деда”.\n\nИх семья не имела никаких кровников, что хорошо было известно в селе. Поня"}, {"file": "p_067.html", "num": "№ 67", "title_rus": "Что самое худшее", "text_rus": "Как-то были люди на сельских посиделках и вели разговоры о разном. Речь зашла и о том, что на свете самое худшее из всего, что может постичь человека. Судили, рядили о многом. Кто-то самым худшим назвал пожар, кто-то сказал, что самое худшее – это обеднеть… Спор разгорелся вовсю. Лишь некий старик с"}, {"file": "p_068.html", "num": "№ 68", "title_rus": "У тебя много друзей", "text_rus": "Некий мужчина был именит, богат и умен. Вокруг него роем вертелись разные друзья. Кто-то как-то спросил его:\n- У тебя много друзей, и они, словно мухи над медом, вертятся вокруг тебя. Почему это так?\n- Не много времени осталось, чтобы проверить этих друзей, - ответил он, - они не знают, что через па"}, {"file": "p_069.html", "num": "№ 69", "title_rus": "У тебя много друзей", "text_rus": "Двое решили проверить, наколько правильно сеьский кадий – судья – решает дела. Пришли они к нему и сказали:\n- Кадий, мы украли коня. Как нам откупиться от этого греха?\n- Возьмите палку с человеческий рост, поставьте ее вверх и насыпьте на нее зерна столько, чтобы палка скрылась полностью. Это зерно "}, {"file": "p_070.html", "num": "№ 70", "title_rus": "У тебя много друзей", "text_rus": "Некий именитый человек на мединском базаре совершил кражу. Посадили его в темницу и стали вершить суд. Постановили отрубить ему кисть руки. Нашлись ходатаи. Они побежали к пророку Мухаммеду и попросили его отменить это решение суда. При этом они сослались на то, что этот вор – знатного происхождения"}, {"file": "p_071.html", "num": "№ 71", "title_rus": "На нее не попало…", "text_rus": "Некий мужчина шел из одного села в другое. Нес он в сумке груши, чтобы съесть их в дороге. Идет он и ест груши. Прошел он половину пути, насытился и подумал: “Зачем мне тащить этот груз?” Взял он и вывалил груши на землю. Затем он оплевал их и высморкался на них, потому что не хотел, чтобы этими гру"}, {"file": "p_072.html", "num": "№ 72", "title_rus": "Ответная шутка", "text_rus": "Пришло время жатвы, и некий мужчина позвал к себе на помощь многих сельчан. Подошло время обеда. Когда все расселись, один из них решил подшутить над одним плешивцем. Шутник запустил в его плешивую голову арбузную корку. Плешивец же, недолго думая, заехал шутнику граблями по голове. Шутник потерял с"}, {"file": "p_073.html", "num": "№ 73", "title_rus": "Возмездие неминуемо", "text_rus": "Слепая, прикованная к постели больная старуха попросила у своей снохи приготовить курицу, надеясь, что ей полегчает. Сноха была жадная. Решив, что слепая ничего не узнает, она вместо курицы приготовила ей кошку. Старуха сразу же узнала, чем ее покормили, однако, ничего вслух не сказала. Она съела ко"}, {"file": "p_074.html", "num": "№ 74", "title_rus": "Большой вред", "text_rus": "У некоего мужчины выросла непослушная, капризная и своенравная дочь. К тому же с этим мужчиной враждовал какой-то человек. И надо же, сын этого недруга полюбил ту, дурно воспитанную девушку, и заставил отца послать сватов к ее отцу. Отец юноши, помня о своих отношениях с отцом той девушки и будучи у"}, {"file": "p_075.html", "num": "№ 75", "title_rus": "Дети рождаются в свою мать", "text_rus": "В давние времена бог удовлетворял просьбы пророков. Тогда люди еще не знали многих сегодняшних обычаев и законов. Например, не знали, что зять и тесть не должны вести друг с другом доверительно-интимные беседы.\n\nО случившемся в те времена рассказывают следующее:\n\nУ некоего пророка выросла красивая и"}, {"file": "p_076.html", "num": "№ 76", "title_rus": "Когда приходит Смерть, и сына забывают", "text_rus": "Жили старуха и ее сын. Как-то ночью к старухе пришла Смерть и сказала:\n- Вставай, пошли. Закончилось твое пребывание в этом мире, теперь уходишь ты в праведный мир.\n\nИспугалась старуха и сказала Смерти:\n- Да живи ты долго, ангел смерти, - запричитала она, - зачем я вам нужна такая старая и убогая? В"}, {"file": "p_077.html", "num": "№ 77", "title_rus": "Кого больше?", "text_rus": "Жил некогда Всевышним одаренный мужчина. Он давал мудрые советы, и поэтому люди ходили к нему за советами. Как-то пришли к нему и спросили:\n- Скажи, если считать отдельно мертвых и живых, то кого из них больше – мертвых или живых? И еще скажи: если считать отдельно мужчин и женщин, то кого больше на"}, {"file": "p_078.html", "num": "№ 78", "title_rus": "Длина жизни", "text_rus": "Как-то спросили пророка Сулеймана:\n- Как тебе кажется: много или мало ты прожил на свете? Чем бы ты отмерил свою столь долгую жизнь?\n- Сколько нужно времени, чтобы войти в одну дверь дома, а выйти – в другую. Вот столько и длилась моя жизнь, - ответил пророк Сулейман."}, {"file": "p_079.html", "num": "№ 79", "title_rus": "Сказал пророк Сулейман", "text_rus": "Спросили у пророка Сулеймана:\n- Тебя очень полюбил наш бог: он дал тебе огромное богатство и многочисленное потомство. Есть ли еще что-нибудь на свете, чего бы ты пожелал?\n\nПророк ответил:\n- Я не знаю, сколько у меня сыновей и дочерей, настолько их много. И все же, когда мне сообщают, что у меня род"}, {"file": "p_080.html", "num": "№ 80", "title_rus": "Тебе было много оповещений", "text_rus": "Некий мужчина дружил с ангелом смерти Мулкалмовтом, который спешил к нему в гости, как только у ангела выпадало свободное время. Они привязались друг к другу. Однажды они пировали, и мужчина сказал ангелу смерти: “Поскольку мы с тобою друзья, прошу тебя заранее оповестить меня о дне, когда соберешьс"}, {"file": "p_081.html", "num": "№ 81", "title_rus": "Завещание сына", "text_rus": "В далекий путь отправилась дружина молодцов, чтобы купить и пригнать табун коней. Гонят они их, но вдруг на молодцов напали разбойники. Загорелся бой, и враги смертельно ранили одного юношу. Вскоре от врагов отбились. Умирая, молодой человек завещал: “Мое тело везти слишком далеко. Похороните меня з"}, {"file": "p_082.html", "num": "№ 82", "title_rus": "За то, что высоко чтил гостей", "text_rus": "Некий горец не отличался богобоязненностью: не молился и пост не держал. Жил он в свое удовольствие. Однако после смерти горец попал прямо в рай. Ангел его спросил:\n- За что тебя определили в рай?\n- За то, - ответил горец, - что я высоко чтил гостей.\n- А как ты их чтил? – спросил ангел.\n- К примеру,"}, {"file": "p_083.html", "num": "№ 83", "title_rus": "Потаенное всегда становится явным", "text_rus": "Некий мужчина долго лежал прикованным к постели. Многие родственники и друзья навещали его. Но один давний товарищ больного, с которым вместе они съели немало хлеба-соли, за все это время ни разу не навестил его. Больной это тяжело переживал. Люди стали стыдить мужчину, не навещавшего больного: “Поч"}, {"file": "p_084.html", "num": "№ 84", "title_rus": "Надо заставить себя уважать", "text_rus": "Когда-то жили двое друзей. Они были очень привязаны друг к другу, но вместе с тем они едко вышучивали один другого. Как-то их позвали в гости. Когда они подошли к воротам хозяина, один из друзей прямиком пошел в дом, оставив на улице своего друга. Вошедшего хозяин дома спросил, почему его друг стоит"}, {"file": "p_085.html", "num": "№ 85", "title_rus": "Если друг хороший", "text_rus": "Двое неразлучных друзей полюбили одну девушку. Пошли они к ней и поведали о своих чувствах. Коварная девушка сказала, что она выйдет замуж за того, кто проведет ночь на горе Казбек и останется в живых.\n\nБросили друзья жребий, и тот, кому он достался, взяв охапку дров, взошел на гору, разжег костер и"}, {"file": "p_086.html", "num": "№ 86", "title_rus": "Кувшинчик с маслом мне достался", "text_rus": "Побратались волк с медведем. Все было хорошо, пока они не наткнулись на кувшинчик с маслом. Видимо, кто-то потерял его. Надо бы медведю и волку поровну поделить и полакомиться маслом. Однако из жадности каждый из них начал говорить про кувшин: “Я его нашел, он мой”. “Нет, он мой”. Не придя к согласи"}, {"file": "p_087.html", "num": "№ 87", "title_rus": "Несут наш рубль", "text_rus": "Шел по селу мужчина со своим сыночком. Повстречался им какой-то задиристый драчун. Прицепился он к мужчине с ребенком. Чем более дружелюбно вел себя мужчина, тем более распалялся драчун. Наконец, он дошел до того, что наотмашь ударил в грудь этого мирного мужчину. А тот, как ни странно, достал из ка"}, {"file": "p_088.html", "num": "№ 88", "title_rus": "Волки и вороны", "text_rus": "Из-за чего-то подрались два волка. Борьба была жестокой: по сторонам разлетались клочья, лилась кровь. На дерущихся наткнулся какой-то другой волк. Глянул он на них, потом посмотрел по сторонам и сказал:\n“Вы деретесь в кровь и не видите, что вокруг на деревьях сидит стая ворон, которая ждет не дожде"}, {"file": "p_089.html", "num": "№ 89", "title_rus": "Надо знать, с кем дружить", "text_rus": "Как-то подружились мышка и лягушка. Расставаясь, мышка сказала:\n- Заключили мы дружбу и расходимся по делам. А ежели возникнет срочное дело или захотим просто повидаться, как же мы найдем друг друга? Нам необходимо придумать, как оповещать один другого.\n- Хорошо, сказала лягушка, - давай к твоей и к"}, {"file": "p_090.html", "num": "№ 90", "title_rus": "Волчьи проклятия", "text_rus": "Когда-то давно побратались волк и собака. Однажды наступил голод. Они договорились, что собака сходит к человеку и попросит у него еды, потому что у человека много разного скота. Человек отказался дать им еды, а собаке он предложил: “Иди служить мне, и ты не будешь знать голода”.\n\nСобака согласилась"}, {"file": "p_091.html", "num": "№ 91", "title_rus": "Не буду учить своему языку", "text_rus": "В отдаленные времена встретились впервые волк и собака. Волк удивленно спросил:\n- Ты что за зверь? Уж очень на меня похож.\n- Я собака. А ты кто?\n- Волк.\n- Давай брататься, - предложила собака.\n- Волк согласился. Они решили обучить друг друга своему языку.\n- Начинай учить, - сказал волк собаке.\n- Гав"}, {"file": "p_092.html", "num": "№ 92", "title_rus": "Мы села не обоснуем", "text_rus": "Как-то подружились собака, петух и лиса. Отправились они в дорогу. В диком поле их настигла ночь. Продрогли они и утром начали советоваться. Собака предложила:\n- Мы не должны плутать по свету, словно бродяги. Давайте, подобно людям, обоснуем село.\n- А как это сделать? – поинтересовались друзья.\n- Вы"}, {"file": "p_093.html", "num": "№ 93", "title_rus": "О гостеприимстве", "text_rus": "Богатырь Али оказался в гостях у бедного горца. Хозяин поставил на стол кукурузный чурек и рассол от сыра. Затем хозяин сел в стороне, вытащил из ножен кинжал и положил его себе на колени.\n\nПриступая к еде, богатырь Али вытащил из ножен саблю и положил ее рядом. Гость закончил кушать, и тогда горец "}, {"file": "p_094.html", "num": "№ 94", "title_rus": "Гостеприимство превыше мести", "text_rus": "Некие братья пленили своего самого большого врага, который причинил им много вреда, и решили убить его, но сделать это каким-нибудь особым образом. Крепко связали они его веревками и заперли в доме. Отлучаясь по срочному делу из дома, наказали матери:\n- Мы уходим на три дня и три ночи. Вернувшись, м"}, {"file": "p_095.html", "num": "№ 95", "title_rus": "Гостей не разделяют", "text_rus": "Жили два брата – Хумазат и Лумазат. Это были времена пророков. У братьев было много овец. Со своими сподвижниками ехал как-то пророк Ибрахим. Они завернули к братьям. Те, чтобы не тратиться на гостей, поступили так: Лумазат нырнул в копну, а Хумазат лег, притворившись больным.\n\nПророк Ибрахим подъех"}, {"file": "p_096.html", "num": "№ 96", "title_rus": "Самый тяжкий день", "text_rus": "Овдовела некая старуха – умер ее муж. Пришедший на похороны брат старухи, сказал ей:\n- Пусть не будет у тебя более тяжкого дня, чем сегодняшний.\n- Бывают и более тяжкие дни, - ответила старуха.\n\nВскоре умерла ее дочь. Брат старухи и тут сказал:\n- Да не будет у тебя более тяжкого дня.\n\nНо старуха отв"}, {"file": "p_097.html", "num": "№ 97", "title_rus": "Живые должны жить и веселиться", "text_rus": "Смеркалось, когда в некое село явился неизвестный мужчина. Сам он шел пешим, а коня вел на поводу. На спине коня лежал “талс” – большая переметная сума. В один из дворов он заглянул и крикнул, примут ли хозяева гостя. Ему ответили, что в этом дворе всегда рады гостю, и ввели его в дом. Хозяева взяли"}, {"file": "p_098.html", "num": "№ 98", "title_rus": "Лев сказал волку", "text_rus": "Где-то на солнце люди вялили мясо. Лиса ухитрилась его унести. Бежала она с мясом по лесу и нежданно наткнулась на волка. Он отобрал мясо. Лиса села причитать, а волк радостно побежал далее. Но вдруг перед ним вырос лев. Он отобрал мясо. Волк возмутился:\n- Лев, мы почитаем тебя нашим царем, а ты пос"}, {"file": "p_099.html", "num": "№ 99", "title_rus": "Умирая, медведь сказал…", "text_rus": "Однажды зимою охотники наткнулись на медвежью берлогу. Чтобы выманить из нее медведя, охотники стали тыкать в нее большую палку. Когда она наткнулась на что-то мягкое, охотники поняли, что палка тычется в медведя.\n\nНаконец, медведь проснулся от спячки. С ревом и злой он выскочил из пещеры. Охотники "}, {"file": "p_100.html", "num": "№ 100", "title_rus": "Волчьи десны сильнее", "text_rus": "Состарился волк, лишился сил и лежит в норе. Прослышала об этом собака. До этих пор она тряслась при имени волка, а тут осмелела, пришла к волку и сказала:\n- Чего ты свернулся, как жалкий щенок? Теперь ты получил свое! К тому же, как я слышала, у тебя повыпадали все зубы. Теперь ты никого не сможешь"}, {"file": "p_101.html", "num": "№ 101", "title_rus": "Нехорошо ты поступил", "text_rus": "Жил некий неисправимый преступник. Надоел он людям. Они связали и положили его. А было это в жаркую пору. Нежданно откуда-то налетел рой мух, и они облепили преступника.\n\nЛежит он и не шелохнется. Проходил мимо какой-то сердобольный человек, и он согнал с преступника этих мух.\n“Нехорошо ты поступил,"}, {"file": "p_102.html", "num": "№ 102", "title_rus": "Я ему ничего хорошего не сделал", "text_rus": "Сидя среди своих сподвижников, пророк Мухаммед, говорят, сказал, что завтра, по такой-то дороге, он поедет в Мекку. Один из сподвижников предложил ему:\n- Лучше бы тебе не ехать по этой дороге, а избрать другой путь.\n- Почему ты так считаешь?\n- Потому что араб по имени Шаам, как мне стало известно, н"}, {"file": "p_103.html", "num": "№ 103", "title_rus": "Не различайте людей по их религии", "text_rus": "Пророк Ибрахим шел дальнею дорогою. Он устал и сел под деревом отдохнуть, достал свои припасы и начал обедать. В это время по дороге шел изголодавшийся язычник. Увидел он обедающего Ибрахима и попросил у него еды, сославшись на то, что третий день, как он ничего не ел и вот-вот может свалиться и уме"}, {"file": "p_104.html", "num": "№ 104", "title_rus": "Благородство весьма почитается", "text_rus": "Пророк Мухаммед через вестовых начал созывать с разных мест своих сподвижников в Мекку на утреннюю молитву. Богатырь Али находился вдали и от сподвижников, и от самой Мекки. Когда он получил эту весть, у него оставалось мало времени, чтобы домчаться туда.\n\nИ вот скачет богатырь Али на призыв пророка"}, {"file": "p_105.html", "num": "№ 105", "title_rus": "Самим заработанное дороже", "text_rus": "У некоего отца вырос сын-лентяй. Как-то отец сказал ему: “Где хочешь поработай, что можешь сделай, но без рубля-копейки домой не возвращайся”.\n\nЛентяй, как обычно, прогулял весь день. Вечером он тайно выпросил у матери рубль и отдал его отцу. Отец тут же кинул его в очаг, но сын и бровью не повел. Н"}, {"file": "p_106.html", "num": "№ 106", "title_rus": "Ты нужнее всех", "text_rus": "Как-то оптравились в путь трое мужчин. Повстречали они некоего старого мудреца. Разговорились и мудрец спросил их:\n- Каким ремеслом или умением обладает каждый из вас?\n- Я храбрец и опытный воин, - ответил один.\n- А я умелый торговец, - сказал второй.\n- Ну а я, по бедности своей, работаю то в поле, "}, {"file": "p_107.html", "num": "№ 107", "title_rus": "Мышка сказала лягушке", "text_rus": "Все лето беззаботная лягушка только и делала, что квакала на все болото. А мышь все это время с утра до вечера трудилась, делала запасы на зиму.\n\nЗимою же лягушка стала попрошайничать у мышки. Та раза два накормила лягушку, а потом сказала так:\n“Ты все лето жила беззаботно, а я была в постоянных тру"}, {"file": "p_108.html", "num": "№ 108", "title_rus": "Не возьмешь того, чего нет", "text_rus": "Зимой, посреди ярмарки стоял некий горец. На нем была длинная шуба. Наткнулся на него некий гордый всадник. Он окликнул горца:\n- Эй! Посторонись! Чего стоишь, как пугало?\n- Я тебе не пугало и с места не сдвинусь, объезжай, если тебе надо, - был ответ.\n- Я тебе покажу! – пригрозил всадник, взмахнув н"}, {"file": "p_109.html", "num": "№ 109", "title_rus": "Все ем с медом", "text_rus": "По какому-то поводу собрались мужчины. За беседою у них разговор зашел о том, кто что ест. Один похвалялся, что часто кушает курдюки. Другой говорил, что он любит жаркое. Третий отметил, что ему больше по душе вареное мясо.\n\nСреди присутствующих один мужчина отмалчивался. По всему было видно, что он"}, {"file": "p_110.html", "num": "№ 110", "title_rus": "Ты попадешь в рай", "text_rus": "Как-то в месяц уразы ехали сподвижник пророка Мухаммеда по имени Умар и некий его воин. Умар увидел кусок хлеба, лежащий в пыли. Он попросил воина поднять его с земли. Ехали они весь день. Смеркалось, но жилья никакого не было видно. Умар сказал:\n- Теперь давай съедим этот кусок хлеба.\n- Не серчай н"}, {"file": "p_111.html", "num": "№ 111", "title_rus": "Бережливость", "text_rus": "Увидев муравья, пророк Сулейман воскликнул:\n- Какая у тебя большая голова!\n- Значит есть место, куда много мозгов поместится.\n- А почему же у тебя такая тонкая талия?\n- У благородного талия всегда тонкая. Я ем лишь столько, сколько нужно для поддержания жизни.\n- Сколько же ты ешь?\n- Мне на год хвата"}, {"file": "p_112.html", "num": "№ 112", "title_rus": "Цена хлеба", "text_rus": "Некий человек весьма пренебрежительно относился к хлебу кукурузному или пшеничному. Но сам он в остальном был порядочный человек. Поэтому бог решил не карать его, но проучить.\n\nКак-то этому горцу надо было отправиться в далекий путь. Он прихватил с собою еду и пошел в дорогу. На пути встретилась ему"}, {"file": "p_113.html", "num": "№ 113", "title_rus": "Пастух сказал", "text_rus": "Некоему горцу от дяди досталась в наследство большая отара овец… Наследник сам не справился бы с нею и потому нанял пастуха. Когда утром пастух выгонял отару на пастбище, хозяин дал ему всего-навсего один посох. Тогда пастух сказал ему:\n“Как видно, ты никогда не нанимал пастуха, а я же давно занимаю"}, {"file": "p_114.html", "num": "№ 114", "title_rus": "Ты будешь свистеть", "text_rus": "Раз собрался горец поехать в Буро – Владикавказ. Узнав об этом, детвора окружила его и начала просить: привези мне то, привези это, купи то-то… Он же, избавляясь от их наседаний, всем отвечал: “Привезу, привезу…”.\n\nНо тут один карапуз протянул ему двугривенный и сказал:\n- Купи мне свистульку.\n- Вот "}, {"file": "p_115.html", "num": "№ 115", "title_rus": "Сначала надо воду подвести", "text_rus": "Трое глупцов решили: “Давайте, построим мельницу, но так, чтобы никто о нашей постройке не знал”.\n\nПо утрам они незаметно уходили в горы и там строили мельницу. Люди стали интересоваться: куда и зачем они ходят. Глупцы отделывались от них разными небылицами. Но жена одного из них была весьма дотошно"}, {"file": "p_116.html", "num": "№ 116", "title_rus": "Я больше не хожу на собрания", "text_rus": "Этот случай произошел не так давно. В каком-то селе, утром, с улицы стал окликать мужчину какой-то мальчик.\n- Чего тебе? – спросил мужчина, выглянув в окно.\n- Из города приехало какое-то начальство. Всех мужчин просят явиться в правление. Тебя тоже туда приглашают.\n- Вот также, утром, 23 февраля 194"}, {"file": "p_117.html", "num": "№ 117", "title_rus": "Если бы это сделал я", "text_rus": "Пастухи свежевали овцу. Издали за ними наблюдал волк. Наконец, он сказал:\n“Посмотрите на этих преступных людей. Зарезали мирную, слабую и бессловесную овечку. А если бы это сделал я… ох, как они начали бы шуметь, стрелять, напускать собак. Нет у них ни стыда ни совести”.\n\t</div>\n\t<hr />\n</section>\n<"}, {"file": "p_118.html", "num": "№ 118", "title_rus": "Раззявила пасть", "text_rus": "На базаре продавали лошадь. В течение всего дня подходили покупатели, осматривали лошадь, открывали ей пасть и присматривались к зубам. Наверное, за день ее уже осмотрело девяносто девять человек. Лошаденка настолько свыклась с тем, что каждый вновь подходящий осматривает ее зубы, что к вечеру, при "}, {"file": "p_119.html", "num": "№ 119", "title_rus": "Баран научился", "text_rus": "Был некогда красивый баран: крупный, с длинной, белой и волнистой шерстью, большими рогами и увесистым курдюком. Настолько он был необыкновенен, что его возили как подарок по разным случаям. Скажем, подарят его кому-то по поводу торжества, а новый хозяин его потом ведет на рынок, потому что, продав "}, {"file": "p_120.html", "num": "№ 120", "title_rus": "Мышь спасла волка", "text_rus": "Сытно пообедал волк и идет себе довольный. Вдруг, перед ним пробежала мышка, и волк по привычке схватил ее.\n- Сыт я, и ты, мышка, мне не еда. Лучше прибью-ка я тебя, - сказал волк.\n- Убьешь, и что пользы? – отвечала мышь. – Отпусти, кто знает, может, когда-нибудь сгожусь тебе.\n- Чем может помочь так"}, {"file": "p_121.html", "num": "№ 121", "title_rus": "Красивые рога и некрасивые ноги", "text_rus": "В ясный, солнечный день, на водопое, олень увидел свое отражение и сказал:\n“Какая у меня красивая крона рогов, и какие у меня безобразныые и тонкие ноги”.\n\nУшел олень с водопоя. Тут на него накинулись охотники. Они стали преследовать и стрелять в него. Олень убежал в густой лес. А там его ветвистые "}, {"file": "p_122.html", "num": "№ 122", "title_rus": "Даже Бог не сможет угодить всем", "text_rus": "Ангел Джабраил сошел на землю. В облике простого смертного стал он ходить повсюду и наблюдать за людьми. Увидел он какого-то крестьянина и спросил его:\n- Если бы можно было, чего ты попросил бы у бога?\n- Я попросил бы дождя, - ответил крестьянин, - тогда у меня вырос бы хороший урожай пшеницы.\n\nПопр"}, {"file": "p_123.html", "num": "№ 123", "title_rus": "Молиться надо с душою", "text_rus": "Ехал богатырь Али на пятничную молитву и увидел молящегося на лужайке какого-то человека. Молился он слишком быстро, и это не понравилось богатырю Али. Он подъехал, подождал, пока человек не закончит молитву, а затем сказал:\n- Твори вновь молитву и молись медленно, иначе я снесу тебе голову.\n\nЧелове"}, {"file": "p_124.html", "num": "№ 124", "title_rus": "Именно ты настоящий хаджи", "text_rus": "Раньше, когда совершали паломничество (хадж) в Мекку на лошадях и пешком, двое наших отправились к этому святому месту. Далеко они ушли от родного дома. До Мекки им оставалось несколько дней пути, когда они проходили через некое тамошнее село. В это время была неслыханная засуха, и в том селе люди г"}, {"file": "p_125.html", "num": "№ 125", "title_rus": "Грех не дать подаяния", "text_rus": "Жили двое мужчин. Один из них ел, пил, веселился, радуясь жизни. Другой был очень набожным, настолько, что на камне, на котором он молился, образовалась ямка от прикосновений его головы.\n\nВ день Суда на том свете того, гуляку и бражника, отправили в рай, а набожного фанатика – в ад. Это его возмутил"}, {"file": "p_126.html", "num": "№ 126", "title_rus": "Скрывай свои недостатки", "text_rus": "На ветке спокойно сидела сова. Подлетел коршун и сел рядом. Разговорились о том, о сем, и коршун поинтересовался:\n- Сова, что это у тебя перо столь мягкое?\n- Да это бы еще ничего, вот сердце у меня еще мягче, - ответила сова.\n- Чего это глаза у тебя столь большие? – поинтересовался коршун.\n- Что тол"}, {"file": "p_127.html", "num": "№ 127", "title_rus": "Есть и трусливее нас", "text_rus": "Зайцы устроили собрание. Разговор велся о заячьей трусости. Говорили, что медведь, волк, лиса, другие звери храбрые, а они, зайцы, всех их боятся, живут в постоянном страхе перед ними.\n“Нет на свете тварей, трусливее нас, - сказал старший из зайцев, - нам надо уйти из этого мира”.\n\nЗайцы согласились"}, {"file": "p_128.html", "num": "№ 128", "title_rus": "Она ходит по харчевням", "text_rus": "Некий мужчина пожаловался родственникам своей жены:\n- Совсем взбесилась ваша сестра. Каждый день ходит по всему этому большому городу и не пропускает ни одной харчевни, закусочной, кафе, чтобы не наведаться в них.\n- Как так, - удивились родственники жены, - разве когда-нибудь и кто-нибудь сказал, чт"}, {"file": "p_129.html", "num": "№ 129", "title_rus": "Она ищет пустое место", "text_rus": "Один выпивоха пожаловался другу:\n- Не знаю, что и делать. Как выпью водки, так она сразу же идет мне в голову.\n\nЕго друг был умнее и был трезвенником. Он ответил:\n- Так и должно быть. Разве ты не знаешь, что водка всегда ищет пустое место?\n\t</div>\n\t<hr />\n</section>\n<section id=\"text_eng\">\n\t<div cla"}, {"file": "p_130.html", "num": "№ 130", "title_rus": "Грех пророка Дауда", "text_rus": "Пророк и царь Дауд имел много жен. Тем не менее он стал заглядываться на невиданной красоты жену одного из своих воинов. Дауд не знал, как его извести, чтобы жениться на той красавице. В это время началась война, и Дауд отправил воевать мужа той красавицы, причем послал его в самую гущу сражений. На"}, {"file": "p_131.html", "num": "№ 131", "title_rus": "Выбирай", "text_rus": "Шел по лесу охотник и угодил в руки скопища чертей. Никакого выхода у него не было. Завели они его в один дом и сказали:\n- Видишь, в этом доме красавицу-женщину, видишь, во-он бегает ребенок, видишь, на столе стоит бутылка водки?\n- Вижу, - ответил пленник.\n- Тогда, если хочешь уйти с миром и невреди"}, {"file": "p_132.html", "num": "№ 132", "title_rus": "Пить надо в меру", "text_rus": "Некий хозяин, оказывая гостю всяческие почести, раз за разом наливал ему водки. Пьянеет гость и говорит:\n- По нашему обычаю ты не спросил, кто я. Так знай же, я племянник самого Байсара Мочки, основателя села Базоркина.\n- Славно, - ответил хозяин, - ты, оказывается, являешься родственником именитых "}, {"file": "p_133.html", "num": "№ 133", "title_rus": "Кудахтают там, где несутся", "text_rus": "Во дворе некоего хозяина раскудахталась курица, которая перед тем снесла яйцо в чужом курятнике. Хозяин схватил ее и сказал:\n“Хватит! Долго тебя терпели. Надоело. Ходишь нестись в чужой курятник, а кудахтать возвращаешься в свой двор. Кудахтают там, где несутся, а несутся всегда в своем дворе. Тепер"}, {"file": "p_134.html", "num": "№ 134", "title_rus": "Ты своим языком убьешь человека", "text_rus": "На базаре некий горец продавал серебряный кинжал. Подошел к нему балагур Цаген и спросил, сколько просят за кинжал. Горец ответил, что он просит двенадцать червонцев. Тогда Цаген спросил:\n- А не продал бы ты его мне за три рубля?\n- Зачем тебе кинжал? – поинтересовался горец.\n- Я должен убить кровник"}, {"file": "p_135.html", "num": "№ 135", "title_rus": "Превратилась в голубку", "text_rus": "Как-то вернувшись к себе во двор богатырь Сеска Солса протянул повод коня молодой снохе, жене своего сына. Она в это время подшивала чувяки. Сеска Солса вошел в дом, а невестка, кинув повод коня себе на подол, решила быстро завершить свою работу. Однако конь незаметно отошел, вышел со двора, а затем"}, {"file": "p_136.html", "num": "№ 136", "title_rus": "Упаси нас от сытых муталимов", "text_rus": "Муталимы – учащиеся исламского богословия – в праздник уразы стали ходить по дворам и лакомиться праздничными угощениями. Среди них был один, которого они постоянно допекали вопросом, когда же он пригласит их к себе в гости. Ходили муталимы по многим дворам, и в каждом доме угощались. Тот муталим, к"}, {"file": "p_137.html", "num": "№ 137", "title_rus": "Хоть немножко, но и самому надо постараться", "text_rus": "В медресе жила группа муталимов. Поскольку они ничего своим трудом не добывали, то ходили по селу и выпрашивали жертвенное подаяние. Вдруг один из муталимов решил не ходить за подаянием.\n- Почему ты так решил? – спросили его.\n- Проси не проси, будет только то, что суждено, - ответил он.\n- Если и суж"}, {"file": "p_138.html", "num": "№ 138", "title_rus": "Не делай другому плохого", "text_rus": "На каком-то пиршестве мюридам прислуживал молодой человек. Один мюрид попросил его принести чашку бульона. Когда юноша принес, он его отпил и сказал, что бульон остыл. Юноша принес вторую чашку бульона, налив его прямо из кипящего котла. От чашки валил пар. Мюрид взял в рот кусок хлеба, отхлебнул бу"}, {"file": "p_139.html", "num": "№ 139", "title_rus": "За подлость воздается подлецу", "text_rus": "Некий мужчина стоял на высоком берегу болота и, обращаясь к Богу, говорил:\n“Пусть за подлость воздастся тому, кто ее совершит, пусть за подлость воздастся тому, кто ее совершит!..”\n\nПроходил мимо некий подлючий человек. Услышав молящегося, он про себя сказал:\n“Я покажу тебе, что подлость остается бе"}, {"file": "p_140.html", "num": "№ 140", "title_rus": "Медведь сказал", "text_rus": "Шли по лесу двое товарищей. Вдруг из-за кустов выскочил медведь. Один из товарищей испугался настолько, что, быстро, как белка, взобрался на дерево. Зная, что одному ему с медведем не справиться, второй товарищ тут же упал и растянулся, словно мертвец. Он когда-то слышал, что медведь ест трупы лишь "}, {"file": "p_141.html", "num": "№ 141", "title_rus": "Его несут к тебе", "text_rus": "Некий мужчина оказался в гостях в доме, в котором царили бедность и убогость; не было ни еды, ни света, ни очага. Голодным лег гость в холодную постель. Утром к хозяину дома пришли с вестью, что в селе скончался какой-то его родственник. Хозяин дома прихватил с собою гостя и пошел на похороны.\n\nКогд"}, {"file": "p_142.html", "num": "№ 142", "title_rus": "Вскоре мы узнаем его", "text_rus": "Стояли и беседовали двое друзей. Мимо проходил некий мужчина. Он подошел к беседующим и, как положено, стал расспрашивать их о житье-бытье и оказывать им всяческое внимание. Все это подкупило одного из друзей, и когда тот человек покинул их и пошел далее своей дорогою, сказал:\n“Очень приятно было с "}, {"file": "p_143.html", "num": "№ 143", "title_rus": "Невозможно наполнить желудок человека", "text_rus": "Устав в походе, дружина нартов остановилась у родника, чтобы отдохнуть и попить воды. Но пить было не из чего, не было никакой посуды. Младший из нартов начал искать что-нибудь такое, чем можно было бы зачерпнуть воды. Он нашел какую-то мягкую вещицу, помыл ее, дважды набрал ее воды и напился. Набра"}, {"file": "p_144.html", "num": "№ 144", "title_rus": "Безмерна человеческая жадность", "text_rus": "Когда-то, во времена пророков, решили проверить, насколько жадны люди. С неба вылили очень много меда. Он бы залил всю землю, но этого не произошло, так как люди начали брать мед ведрами, тазами, бочками и весь подчистую выбрали.\n\nТогда пустили воду из земли. Забила она фонтанами и потекла по всей з"}, {"file": "p_145.html", "num": "№ 145", "title_rus": "Спор из-за земли", "text_rus": "Спустил Бог Адама на землю. Осмотрелся он, и увидел бескрайние земные просторы. “Слава Всевышнему, - воскликнул он, - что вся эта земля принадлежит мне одному!”.\n\nАнгел Джабраил решил проверить, насколько Адам жаден или щедр. Ангелам земля совершенно ни к чему. Чтобы испытать Адама, ангел спустился "}, {"file": "p_146.html", "num": "№ 146", "title_rus": "Как появились крысы", "text_rus": "Некогда жил один бедняк. Дойдя до крайней нужды, он попросил у Бога хоть чуточку богатства. Бог сжалился над ним и дал ему большое богатство. Зажил он припеваючи. Бог решил проверить, щедр ли тот человек и призвал к себе ангела Джабраила, поручил ему спуститься на землю в облике нищего и попросить п"}, {"file": "p_147.html", "num": "№ 147", "title_rus": "Как появились крысы", "text_rus": "Некий мужчина имел чудесную курицу: она ежедневно приносила по одному золотому яичку. Понятно, ее хозяин был домовит и жил зажиточно.\n\nВ народе говорят: “Чем богаче человек, тем он жаднее”. Хозяин курицы умом не отличался. Как-то он прикинул: “Что за блажь у моей курицы носить в день всего-навсего о"}, {"file": "p_148.html", "num": "№ 148", "title_rus": "Черное сердце и сладкие речи", "text_rus": "Пророк Иса шел долгим и изнурительным путем. Шел, шел и дошел до удивительной воды. Зной его разгорячил, и он выпил этой воды. Она оказалась слаще меда. Удивился пророк Иса и решил узнать, откуда вытекает эта вода.\n\nОтправился он вверх по ручью. День шел, ночь шел, наконец, дошел до истока и увидел "}, {"file": "p_149.html", "num": "№ 149", "title_rus": "Река Асса и ручеек", "text_rus": "В горах в реку Ассу впадал ручеек не шире локтя. Он постоянно завидовал реке, поскольку она намного шире, многоводнее. Однажды в горах прошли большие дожди. Ручеек превратился в реку и заполнил все ущелье. Прорезался у ручейка голос, и ручей стал заноситься перед Ассою:\n- Ну, как я тебе? Видишь, я н"}, {"file": "p_150.html", "num": "№ 150", "title_rus": "Два брата-горца", "text_rus": "Вконец обеднели двое братьев-горцев, взяли свои скудные пожитки, перекинули через плечи переметные сумы и начали спускаться с гор. Они решили поселиться на равнине. Подошли к ручейку, который как бы разделял горы и равнину. Через ручей был перекинут узенький мосток, рассчитанный на одного человека. "}, {"file": "p_151.html", "num": "№ 151", "title_rus": "Возмездие будет", "text_rus": "Некий старик ехал на иноходце, приглянувшемся какому-то вору. Старик остановился под деревом, привязал коня и начал молиться. Тут подъехал к нему этот вор на своей кляче. После взаимных приветствий вор спросил:\n- Вижу, старик, что ты ученый-праведник. Скажи мне: “Когда постигает человека возмездие з"}, {"file": "p_152.html", "num": "№ 152", "title_rus": "Сидяший наверху все поправит", "text_rus": "Ночью двое воров остановились под деревом и решили поделить свою добычу. Один из них был прожженный вор, а второй в этот день впервые пошел на воровство. Начался дележ, и этот, второй, сказал:\n- Говорят, воровать – большой грех. Что же теперь с нами будет?\n- Да брось ты, о каких это грехах ты говори"}, {"file": "p_153.html", "num": "№ 153", "title_rus": "Если бы цари не сменялись", "text_rus": "В полном достатке и богатстве, в огружении льстивых приближенных жил в свое удовольствие некий царь. Как-то он спросил их:\n“Как бы было хорошо, если бы мое царствование было бесконечным, вечным. Что вы об этом думаете?”\n\nПридворные начали хвалить царя, приговаривая: “Верно сказано. Мудрое изречение."}, {"file": "p_154.html", "num": "№ 154", "title_rus": "О чем взмолился старик", "text_rus": "Ехал на коне некий старик. Настало время совершить намаз. Привязал он коня, повернулся к югу и стал молиться.\n\nЗавершил он молитву, повернулся к коню, а его нет. Пропал конь. И тут старик взмолился:\n- Великий и славный бог Дяла, если похититель моего коня из тех людей, которые сами знают, о чем они "}, {"file": "p_155.html", "num": "№ 155", "title_rus": "Могила ответила", "text_rus": "Когда умерла дочь пророка Петимат, ее понесли на кладбище хоронить. Спустился ангел Джабраил и сказал могиле:\n- Ты принимаешь в себя дочь пророка, жену богатыря Али, мать праведных Хасана и Хусейна, поэтому будь к ней милостивее.\n\nМогила ответила:\n- Здесь не место говорить о пророке, не место говори"}, {"file": "p_156.html", "num": "№ 156", "title_rus": "Могила ответила", "text_rus": "Бог послал ангела на Землю, сказав при этом:\n- Принеси мне земли с того места, где с нею не смешался прах человека.\n\nАнгел опустился на Землю и начал свои поиски. Он просмотрел все горы, равнины, реки и озера… Нигде ангел не мог отыскать такой земли. Наконец, ангел стал осматривать дно моря в его гл"}, {"file": "p_157.html", "num": "№ 157", "title_rus": "Такого человека быть не может", "text_rus": "Жил некогда очень богомольный человек. Он и намазы совершал, и посты держал, и все ритуалы соблюдал. С небес спустился ангел и сказал:\n- Из-за того, что ты столь верен установлениям Аллаха, мне поручено наградить тебя чем-нибудь одним, чего ты пожелаешь. Загадай одно желание.\n- Я прошу сделать так, "}, {"file": "p_158.html", "num": "№ 158", "title_rus": "Чинара заплакала", "text_rus": "Что было сил били по сваленной чинаре топором. Однако никак бревно расколоть не могли. Тогда из поленьев какой-то другой чинары нарубили клинья и стали их забивать в бревно. Теперь оно начало трескаться, клинья забивали все глубже, и наконец, бревно раскололось надвое. Тогда, говорят, чинара в слеза"}, {"file": "p_159.html", "num": "№ 159", "title_rus": "Благородное поведение и спокойствие", "text_rus": "По приказу Всевышнего ангел Джабраил вместе с другими ангелами соорудил рай. После этого ангелы спросили:\n- Чем мы огородим рай?\n- Благородным поведением и добрыми делами, - ответил Бог.\n- А из чего мы сделаем замок и ключи? – вновь спросили ангелы.\n- Из спокойствия и собранности, - был ответ.\n\nС те"}, {"file": "p_160.html", "num": "№ 160", "title_rus": "Ответ девушки", "text_rus": "Одному юноше посоветовали жениться на некоей девушке, сказав, что, помимо красоты, она обладает еще умом и благородным поведением. “Я проверю, насколько все это верно”, - ответил юноша и пошел на вечеринку, где была и та девушка. Когда юноша пришел, вечеринка была в самом разгаре, и юноши, по обычаю"}, {"file": "p_161.html", "num": "№ 161", "title_rus": "За ним мы стояли", "text_rus": "Прошло немало времени после того, как наш пророк ушел в лучший мир. Во главе мусульман стал богатырь Али. Кто-то его спросил:\n- О-о, Али, во времена пророка мы все были дружны, преданы вере, а теперь все это рушится. Между нами пошел разлад. Почему все это так происходит?\n- Я скажу тебе, в чем причи"}, {"file": "p_162.html", "num": "№ 162", "title_rus": "Уважение к благородству", "text_rus": "Мчался по дороге всадник. Издали увидел он идущую навстречу женщину с ребенком. Она тоже заметила всадника. Женщина быстро сошла с дороги, невдалеке положила ребенка на траву, вернулась на дорогу и стала боком к приближающемуся всаднику. Подскакал он, соскочил с коня и подошел к ребенку. Высоко подн"}, {"file": "p_163.html", "num": "№ 163", "title_rus": "Наша, ваша", "text_rus": "Некая старуха вышла вечером за село, чтобы встретить свою корову, которая возвращалась с сельским стадом. С нею были двое ее внучат. Один был от сына, а другой от дочери. Внука от сына она держала за руку, а внука от дочери держала на руках. Когда появилось стадо, внук от сына сказал: “Бабушка, во-о"}, {"file": "p_164.html", "num": "№ 164", "title_rus": "Маленьких хороним по двое-трое", "text_rus": "В некий дом пришел гость. Хозяйка была бесстыдной и жадной. Она наготовила гостю весьма маленькие галушки.\n\nКогда их поставили перед гостем, он остался недоволен таким отношением к себе. Назло жадной хозяйке он стал цеплять вилкой зараз по две-три галушки и отправлять их в рот. Хозяйка, видя это, за"}, {"file": "p_165.html", "num": "№ 165", "title_rus": "Пусть отец не забудет", "text_rus": "Некий гость поинтересовался у хозяина:\n- Ну, каков твой сын? Помогает он своим родителям или нет?\n- Клянусь Всевышним, портится на глазах. Бездельник, все его мысли только о том, как погулять и повеселиться. Не знаю, что с ним делать. Думаю, может, незамедлительно женить его и отделить от себя, - по"}, {"file": "p_166.html", "num": "№ 166", "title_rus": "Хотя и есть мать, но без жены не обойтись", "text_rus": "Отец и сын ежедневно ходили в лес на заготовку строительного леса.Утром, когда им надо было идти на работу, сыромятные чувяки отца бывали вымыты и смазаны жиром, а чувяки сына были грязные и потрескавшиеся. И так бывало ежедневно. Наконец, не вытерпел сын и сказал:\n“Клянусь, отец, хотя и есть у меня"}, {"file": "p_167.html", "num": "№ 167", "title_rus": "Тяжелый день", "text_rus": "Две жены многоженца бежали в лес. В разгоревшейся большой войне убило их мужа, сгорел их дом. Сами они еле унесли ноги. Бежали они, пока не уверились, что за ними нет погони. От усталости они попадали на траву под деревом. Когда отдышались, младшая жена произнесла:\n- Несчастные мы, какой тяжелый ден"}, {"file": "p_168.html", "num": "№ 168", "title_rus": "Коварный завет", "text_rus": "В любви и достатке жили молодые муж и жена, но внезапно муж заболел и слег в постель. Настал его смертный час. Жена спросила его:\n- Какой завет ты мне оставляешь?\n- Каждое утро, - отвечал муж, - вспоминая меня, испеки и съешь горячий кукурузный чурек, запивая его водою из нашего родника. Больше нече"}, {"file": "p_169.html", "num": "№ 169", "title_rus": "Как мужчине завоевать уважение в своей стране", "text_rus": "Некий мужчина пришел к зираку (ведуну) и спросил его:\n- Ведун, я не имею веса среди людей, и меня мало кто почитает. Ответь, что мне надо сделать, чтобы я заслужил уважение всей нашей страны?\n- Скажи, чтут ли тебя дома и в твоем селе? – спросил ведун.\n- Я бы не сказал, что меня чтут в семье и в селе"}, {"file": "p_170.html", "num": "№ 170", "title_rus": "Мужество Сурхо, сына Ады", "text_rus": "Славный Сурхо, сын Ады, был весьма известным в народе мужчиной. Желая подружиться с ним, отправились в путь тринадцать всадников. Расспрашивая людей, они доехали до его дома. Во дворе они увидели мужчину среднего роста, одетого в рабочую одежду. Он ловко орудовал лопатой и убирал навоз. Когда всадни"}, {"file": "p_171.html", "num": "№ 171", "title_rus": "О любви к своей родине", "text_rus": "Некий мужчина сказал своим товарищам: “В том месте, где пасутся наши стада, объявился волк. Надо его уничтожить, пока он не начал резать наших овец”.\n\nСобрались охотники, вооружились и двинулись к тому лесу, в котором объявился волк. Длинной цепью они стали прочесывать лес. Охотники подняли большой "}];
const PROV_PROMPT = [{"id": 0, "r": "Кто против народа идет, того и бог Дяла не любит."}, {"id": 1, "r": "Когда спросили: “Кто из людей самый бессовестный?” – ответили: “Лгун”."}, {"id": 2, "r": "Единство народа крепче камня."}, {"id": 3, "r": "“Я”, “я” твердившего заставили говорить “мы”, “мы”."}, {"id": 4, "r": "Взлетевший вверх свалился в яму, вознесся тот, кто скромно жил."}, {"id": 5, "r": "Девушка, постоянно твердившая “нет”, осталась старой девой."}, {"id": 6, "r": "Вовремя сказанное слово – по делу выстрелившее ружье."}, {"id": 7, "r": "Скажи (что-то сделать) дочери, но чтобы услышала сноха."}, {"id": 8, "r": "Умер зять – горе вне дома, умерла сноха – горе в доме; и то и другое – беда."}, {"id": 9, "r": "Плоха та арба, которая возвращается во двор пустою."}, {"id": 10, "r": "Лучше одна перепелка в руках, чем сотня в небесах."}, {"id": 11, "r": "Рассердился невпопад – нажил горя на год."}, {"id": 12, "r": "Беспутно проведенное время добра не приносит."}, {"id": 13, "r": "Во время пахоты руками не машут."}, {"id": 14, "r": "Легко чужими руками крапиву рвать."}, {"id": 15, "r": "Легко нажитое добро ветер унес."}, {"id": 16, "r": "Отложи то, что легче сделать, и сделай то, что сделать труднее."}, {"id": 17, "r": "Пазарь всегда ждет хорошей погоды."}, {"id": 18, "r": "Безденежному кошелек не нужен, бесстыдному молва не страшна."}, {"id": 19, "r": "Богатому забот хватало, интригану проклятий хватало."}, {"id": 20, "r": "Добыть деньги не сложно, куда сложнее их удержать."}, {"id": 21, "r": "С деньгам и ничтожество мнит себя величиною, но стать ею ему не дано."}, {"id": 22, "r": "Деньги сплачивают родство, и они же рвут узы родства."}, {"id": 23, "r": "От людей, ничего, кроме богатства, не видящих, надо бежать, как от самой большой"}, {"id": 24, "r": "Деньги нашли дорогу на небеса."}, {"id": 25, "r": "Деньги ума не добавляют, его приумножает учение."}, {"id": 26, "r": "Двор без семьи (большой), что мельница без зерна."}, {"id": 27, "r": "Без помола мельница не останется."}, {"id": 28, "r": "Доносчик похож на сороку."}, {"id": 29, "r": "Проклятие подстреленного зверя настигает охотника."}, {"id": 30, "r": "Сев на стог, князем не станешь (игра на созвучии слов “князь”, “стог”)."}, {"id": 31, "r": "Пусть княжеский сын не выйдет из люльки, пусть волчонок не выползет из логова, п"}, {"id": 32, "r": "Над князем князь не нужет (не приличествует)."}, {"id": 33, "r": "Приходит время, когда и сплетника лишают языка."}, {"id": 34, "r": "Слушать сплетни – болезнь, не сплетничать – лекарство."}, {"id": 35, "r": "Не молви слово, о котором потом пожалеешь."}, {"id": 36, "r": "Пусть не вырастет у нас непослушный сын или брат и неуживчивая в замужестве дочь"}, {"id": 37, "r": "Да не вырастут у нас непослушные сыновья и братья."}, {"id": 38, "r": "Слово, которое не сдерживают, – ветры."}, {"id": 39, "r": "Гнездо орла всегда железом пахнет."}, {"id": 40, "r": "Сова объвила себя орлом и стала летать днем, да тут же и угодила в орлиные когти"}, {"id": 41, "r": "Отступись от того, чего не одолеешь (не победишь), и начни искать свою удачу."}, {"id": 42, "r": "Летом напуганный змеею, зимой испугался травяного жгута."}, {"id": 43, "r": "Кто летом отсиживался, тот зимою бегал (в поисках пищи)."}, {"id": 44, "r": "Кто летом отсиживался, у того зимой походка бывает шустрой."}, {"id": 45, "r": "Кто летом прятался от дождя, тот зимою убегал от снега."}, {"id": 46, "r": "Кому летом легко, тому зимой тяжело."}, {"id": 47, "r": "Кто летом был в заботах, тот зимою отсыпался."}, {"id": 48, "r": "У кого летом голова варила, у того зимою в котле варилось."}, {"id": 49, "r": "Летом отлеживавшийся в тени холодной зимою ходил просить чашку муки."}, {"id": 50, "r": "Железные ворота пошли (на поклон) к плетню."}, {"id": 51, "r": "Случается, что деревянный клин крепче железного топора."}, {"id": 52, "r": "У кузнеца борода всегда опалена."}, {"id": 53, "r": "Пройдя из уст в уста, маленькая сплетня вырастает с гору."}, {"id": 54, "r": "Непроизнесенное слово в твоей власти, а произнес – и ты уже раб его."}, {"id": 55, "r": "Лишь произнеси слово, оно тут же обрело крылья."}, {"id": 56, "r": "Кто плодовит речами, у того руки бесплодные."}, {"id": 57, "r": "Понурился (побледнел) продавец на базаре, когда цены упали."}, {"id": 58, "r": "Базар – шайтановы игрища."}, {"id": 59, "r": "Только правдолюбец бывает настоящим другом."}, {"id": 60, "r": "Чист язык, говорящий правду, а неправедный язык – грязный."}, {"id": 61, "r": "Бывает, что между правдой и кривдой расстояние не толще пленки."}, {"id": 62, "r": "Упаси нас от тех, кто на работу ленив, а кашу есть прыток."}, {"id": 63, "r": "Грязную одежду можно почистить, но грязное сердце – никогда."}, {"id": 64, "r": "Красивая одежда и лопату украсила."}, {"id": 65, "r": "Язык и одежда ведут человека на почетное место; язык и ум сгоняют с него."}, {"id": 66, "r": "Не дай нам быть главою семьи, в которой царит разлад."}, {"id": 67, "r": "Семья без взаимного согласия – разрушившийся дом."}, {"id": 68, "r": "Холодно в сакле, в которой нет согласия."}, {"id": 69, "r": "Благодать нисходит туда, где есть согласие."}, {"id": 70, "r": "Недружную волчью стаю одолели дружные кошки."}, {"id": 71, "r": "В семью (двор), в которой нет согласия, добро не приходит."}, {"id": 72, "r": "Задиравший нос, споткнувшись, в грязи оказался."}, {"id": 73, "r": "Влюбленный не разбирает красоты; одолевающий сон не разбирает подушек."}, {"id": 74, "r": "Очистится (от туч) Казбек, и погода хорошая устанавливается."}, {"id": 75, "r": "Если всадник умелый, то и ленивая лошадь становится иноходцем."}, {"id": 76, "r": "Мужчина становится умнее, чем был в молодечестве, но в старости он умнее не стан"}, {"id": 77, "r": "Шуточки – начало ссоры."}, {"id": 78, "r": "Не уживчивы между собою шутки и разговор всерьез."}, {"id": 79, "r": "Шутки до добра не доводят."}, {"id": 80, "r": "Ощипанная ворона красивее зятя, живущего у родни своей жены."}, {"id": 81, "r": "Вареной говядине соответствует говяжий бульон, свиному мясу – свиной."}, {"id": 82, "r": "Любовь – воспламенившееся сердце."}, {"id": 83, "r": "Не будь, как лопата (рубанок), всегда “от себя”; не будь, как тяпка, всегда “к с"}, {"id": 84, "r": "Бездетный дом – тюрьма (зиндан) для души."}, {"id": 85, "r": "Лучше несущаяся курица, чем бездетная жена."}, {"id": 86, "r": "Мать не даст груди ребенку, пока он не заплачет."}, {"id": 87, "r": "Детское сердце запоминает навечно."}, {"id": 88, "r": "Если бить ребенка, то он теряет чувство собственного достоинства."}, {"id": 89, "r": "Девять частей крови ребенка – от матери, лишь одна часть – от отца."}, {"id": 90, "r": "Дети сказали: “Хитра наша мать, стала в сметану молоко подливать, да и мы не дур"}, {"id": 91, "r": "И скалистый берег река подтачивает."}, {"id": 92, "r": "Волчьи десна крепче собачьих зубов."}, {"id": 93, "r": "Разбитая морда волка научила лису добычу делить."}, {"id": 94, "r": "Если бы волк не имел резвых ног и острых зубов, его бы и волком не назвали."}, {"id": 95, "r": "Волчий вой все узнают, потому что это воет волк."}, {"id": 96, "r": "Волчий вой идет туда, куда ему заблагорассудится."}, {"id": 97, "r": "Испугался волка и забрался на дерево, а там – медведь сидит."}, {"id": 98, "r": "Не было овец у того, кто боялся волка."}, {"id": 99, "r": "Волк не станет псом, но пес может стать волкодавом."}, {"id": 100, "r": "Подрался баран с волком, у него рога и отпали."}, {"id": 101, "r": "Волк сказал: “Где вижу победу – иду в бой, где вижу поражение – отступаю”."}, {"id": 102, "r": "Потягавшаяся с волком лисица шею свернула."}, {"id": 103, "r": "Напуганный волком бежал от собаки."}, {"id": 104, "r": "Волк овцу начинает поедать с курдюка."}, {"id": 105, "r": "Чего не смог унести волк, унесла лиса."}, {"id": 106, "r": "Волк предлагал барану: “Давай побратаемся”."}, {"id": 107, "r": "Дружили волк и осел – волк осла и съел."}, {"id": 108, "r": "Если все станут хаджи (святошами), то кто будет землю пахать?"}, {"id": 109, "r": "Имеющий дойную корову имел сытную пищу."}, {"id": 110, "r": "Бьешь, бьешь, глядишь, и камень разобъешь."}, {"id": 111, "r": "До краев наполненная чаша непременно прольется."}, {"id": 112, "r": "За ночь даже каша выучилась говорить."}, {"id": 113, "r": "Поздно встают и плохо трудятся те, кто заполночь ложатся и тратят на топку дрова"}, {"id": 114, "r": "Лишь волк оценит ночную тьму."}, {"id": 115, "r": "Красящийся старик похох на кокетку."}, {"id": 116, "r": "Веревка рвется там, где тонко."}, {"id": 117, "r": "Попавшая в капкан мышь готова броситься в любую дырочку."}, {"id": 118, "r": "И в работе, и в веселии – везде нужна мера."}, {"id": 119, "r": "Если кто тебя хвалит безмерно, значит, ему что-то от тебя нужно."}, {"id": 120, "r": "Большое хозяйство – не хозяйство, если хозяин не крепок."}, {"id": 121, "r": "Трудно сколотить хозяйство, легко его разбазарить."}, {"id": 122, "r": "Хочешь сохранить свое добро – ставь крепкий засов."}, {"id": 123, "r": "Упаси нас, чтобы наше хозяйство обратилось в деньги."}, {"id": 124, "r": "У совы глаза большие, да сырые (подслеповатые)."}, {"id": 125, "r": "Чем старее козел, тем крепче его рога."}, {"id": 126, "r": "Мужчина не должен терять мужества, даже если его голову будут клещами откручиват"}, {"id": 127, "r": "При пахоте не помогший (кому-то) своим быком лишил (просившего) дойной коровы."}, {"id": 128, "r": "Козла бойся спереди, коня – сзади, а плохого человека – со всех сторон."}, {"id": 129, "r": "Выросший в большой семье уживчив."}, {"id": 130, "r": "Крупная корова крупных телят приносит."}, {"id": 131, "r": "Без дела брешущую собаку волки унесли."}, {"id": 132, "r": "У умельца тяжелая работа легка, у неумехи и легкая работа – горе."}, {"id": 133, "r": "Начал работу – трудись усердно; сел за стол – ешь досыта."}, {"id": 134, "r": "Тот любит жизнь, кто любит труд."}, {"id": 135, "r": "Для работающего день короток, а для лентяя долог."}, {"id": 136, "r": "Лишь только умельца боится работа."}, {"id": 137, "r": "Работу можно одолеть лишь тем, что делаешь ее."}, {"id": 138, "r": "У лентя
