яь саг г1аттара мекха хул.", "rus": "Невестка из богатого дома бывает соней."}, {"id": 170, "inh": "Б1еха лелаяьча можах хинжий деннад.", "rus": "В грязной бороде гниды заводятся."}, {"id": 171, "inh": "Б1ехала дег чу дохьаж доал, къизача сага кер чу кхера боал.", "rus": "У змеи нутро ядовитое, у жестокого (черствого) человека нутро каменное."}, {"id": 172, "inh": "Б1ехала дохьаж кхийтта ба аькх ухачун мотт.", "rus": "Язык доносчика пропитан змеиным ядом."}, {"id": 173, "inh": "Б1ехача багара б1еха 1и, - б1ехача дег чура б1еха дош.", "rus": "Из грязного рта – противная вонь, из черного сердца – подлое слово."}, {"id": 174, "inh": "Б1ехача дагара хьаг1 йоаг1а, ц1енача дагара яхь йоаг1а.", "rus": "Из черного сердца – черная зависть, из чистого сердца – благородное соперничество."}, {"id": 175, "inh": "Б1ехалца дикаг1а бола машар – бийна из д1абаккхар.", "rus": "Самая лучшая дружба со змеею – убить ее."}, {"id": 176, "inh": "Б1оржех ца ийцар иккех ийцад.", "rus": "Чему не научился, когда в детских бурках ходил, тому научишься, когда сапоги наденешь."}, {"id": 177, "inh": "“Б1ук” яхаш лелачоа а духьала ваьннав цхьа “Б1ук”.", "rus": "Задира непременно наткнется на другого задиру."}, {"id": 178, "inh": "Б1ы боккха хилча, фос к1езига хул.", "rus": "Чем больше дружина, тем меньше доля добычи каждого."}, {"id": 179, "inh": "Ва а вий-те шийх аьла ца хетар?", "rus": "Есть ли такой мужчина, который себя князем не считает?"}, {"id": 180, "inh": "Ва ца везаш венар дахьа ца дезар ийца вахав.", "rus": "Пришедший туда, куда ему не положено, унес оттуда то, чего не хотел бы иметь."}, {"id": 181, "inh": "Вай илли ца аьлча, вай са ца къийрдача, готтача лаьхьта чу илли аьннар малав, илли аргдар малав?", "rus": "Если в этом мире не будем петь и веселиться, то кто же пел или будет петь в тесной могиле?"}, {"id": 182, "inh": "Вай ца даьр дикача т1ехьено дергда; вай даьр воча т1ехьено дохоргда.", "rus": "Хорошее потомство продолжит начатое нами, а плохое его разрушит."}, {"id": 183, "inh": "Вайна везачунна Далла хьехалда, вайна ца везачунна наха хьехалда.", "rus": "Пусть бог Дяла советует тому, кого мы любим; пусть люди советуют тому, кого мы не любим."}, {"id": 184, "inh": "Вайна дика лоалахо – вай ц1ен бола бутув оаг1о.", "rus": "Хорош наш сосед – из камня стена нашего дома."}, {"id": 185, "inh": "Вайна товр хулаш а ца хулаш а хул, дег1ар тайча а ца тайча а хул.", "rus": "Наши желания могут исполниться, а могут и нет, но то, что суждено – исполнится помимо нашего желания."}, {"id": 186, "inh": "Валарах кхийрар турпала хиннавац.", "rus": "Смерти бояться – героем не стать."}, {"id": 187, "inh": "Валарах ма кхера, къелах кхера.", "rus": "Не бойся смерти (она неизбежна), а бойся бедности."}, {"id": 188, "inh": "Валлалца нохчо хилва со, венначул т1ехьаг1а г1алг1а хилва со.", "rus": "Пока жив, пусть буду чеченцем, а когда помру – ингушом (смысл: ингуш к ингушу щедр на похвалу лишь после смерти хвалимого)."}, {"id": 189, "inh": "Варгвоаца унахо 1уйранга ма валва.", "rus": "Обреченный на смерть да не дотянет до утра (о прекращении страданий)."}, {"id": 190, "inh": "Ват1ал вузаваьча хударо валлал мецву.", "rus": "Каша хорошо насыщает, но после нее скоро есть хочется."}, {"id": 191, "inh": "Ватт1алца ца а юаш, виззалца яа.", "rus": "Не ешь столько, что можешь лопнуть, а ешь досыта."}, {"id": 192, "inh": "Ваха ваьннача хьаьшаца дика хиннав во фусамда.", "rus": "Плохой хозяин становится любезнее с гостем, покидающим его дом."}, {"id": 193, "inh": "Ваза во во1 хулачул, вала дика во1 хилча тол.", "rus": "Пусть будет лучше погибший, но хороший сын, чем живой, но плохой."}, {"id": 194, "inh": "Ваха г1алеи волла кашеи дале, саг яла мегаргъя.", "rus": "Можно отдавать замуж за того, кто при жизни имеет место в башне, а после смерти – долю в родовом склепе."}, {"id": 195, "inh": "Вахар дац пхьа боаллачун, - валар да-кха.", "rus": "У кровника жизнь – не жизнь, а смерть (в постоянном страхе смерти)."}, {"id": 196, "inh": "Вахар дезачоа къахьегам (болх) беза.", "rus": "Кто любит жизнь, тот любит труд (работу)."}, {"id": 197, "inh": "Вахар хьаденначо валар а хьалу.", "rus": "Кто дает жизнь, тот дает и смерть."}, {"id": 198, "inh": "Вахара санна валара а эш ираз.", "rus": "Счастье одинаково нужно и для жизни и для смерти."}, {"id": 199, "inh": "Вахаран валаран юкъе киси миссел юкъ яц.", "rus": "Расстояние между жизнью и смертью не толще кисеи."}, {"id": 200, "inh": "Вахарга хьежжа валар а хул.", "rus": "Как жил, так и умрешь."}, {"id": 201, "inh": "Вежарашта юкъе а хул хьамсараг1а воша.", "rus": "И среди братьев бывает более любимый."}, {"id": 202, "inh": "Везаш воа саг веча, б1арг г1озбоал.", "rus": "Глаз радуется, когда приходит тобою почитаемый человек."}, {"id": 203, "inh": "Везавеннача сага б1аг1ара б1арг а хоза хет.", "rus": "Полюбившийся красив, даже если он и косоглазый."}, {"id": 204, "inh": "Везар кертага хьийжав, ца везар когашка хьийжав.", "rus": "Кому ты люб, тот смотрит тебе в лицо, кому нет – под ноги."}, {"id": 205, "inh": "Везачоа далари ца везачох алари ийшадац.", "rus": "Всегда найдется, что дать тому, кто тебе нравится, и найдется, что сказать (плохого) про того, кто не нравится."}, {"id": 206, "inh": "Везачунца (езачунца) эрий ара а воахалу.", "rus": "С любимым (любимой) и в дикой степи проживешь."}, {"id": 207, "inh": "Вела а велаш доаг1аш дола во – ца1 да, велха в велхаш доаг1аш дола во – шиъ да.", "rus": "Горе, принимаемое без уныния, - одно горе, а принимаемое с плачем – дважды горе."}, {"id": 208, "inh": "Велча дика хул сийдоацаш воа саг а.", "rus": "И бессовестный становится хорошим, когда умрет."}, {"id": 209, "inh": "“Велча-ма, сога виталахь”, - яхад зовзачо.", "rus": "“Если умрет, то я с ним справлюсь”, - говаривал трус."}, {"id": 210, "inh": "Веннавар аьнна 1ергвац шийна т1адоацар леладе 1емар.", "rus": "Даже умерев, не бросит своих вредных привычек тот, кто привык лезть не в свои дела."}, {"id": 211, "inh": "Веннача сага зурма эшац.", "rus": "Зурна покойнику не нужна."}, {"id": 212, "inh": "Венначоа цхьа къахетам бийхача, дийначоа итта беха беза.", "rus": "Если о покойнике один раз скажут “за упокой”, то о живом надо десять раз сказать “во здравие”."}, {"id": 213, "inh": "Веха саг – ша т1а баьккха етт.", "rus": "Пьяный что корова на льду."}, {"id": 214, "inh": "Веший вонах а ваьннавац, веший диках а кхийнавац.", "rus": "Не уйти от дурных поступков брата, а до его хороших – не дотянуться."}, {"id": 215, "inh": "Вешийна воша эш, йишийна йиша эш.", "rus": "Брату нужен брат, а сестре – сестра."}, {"id": 216, "inh": "Веший доттаг1а – йиший везарг.", "rus": "Друг брата – жених (потенциальный) сестры."}, {"id": 217, "inh": "Вешийна воша эшаш санна, лоалахочоа лоалахо а эш.", "rus": "Как брату нужен брат, так и соседу нужен сосед."}, {"id": 218, "inh": "Вешийна ший воша вицлургвац.", "rus": "Брат не забудет брата (совершит кровную месть)."}, {"id": 219, "inh": "Вижа уллачоа хьалт1амаш бага лелхаргьяц.", "rus": "Лежебоке в рот галушки не летают."}, {"id": 220, "inh": "Визача хьаьший б1арг на1аргахьа берз.", "rus": "Насытившийся гость на дверь поглядывает."}, {"id": 221, "inh": "Виззача къонахчох кхалсаг хиннаяц, йиззача кхалсагах къонах лаьрх1а моттигаш хиннай.", "rus": "Настоящий мужчина не станет женщиной, но настоящая женщина, случается, приравнивается к мужчине."}, {"id": 222, "inh": "Визачоа берригаш биза хет, мецачоа берригаш меца хет.", "rus": "Сытый всех считает сытыми, голодный всех считает голодными."}, {"id": 223, "inh": "Визачул т1ехьаг1а йиар шайт1ана кхаьчай.", "rus": "То, что едят после насыщения, достается шайтану (черту)."}, {"id": 224, "inh": "Виззалца диар мара дац даар.", "rus": "Лишь вдоволь поевши, можно сказать, что насытился."}, {"id": 225, "inh": "Вийлачул т1ехьаг1а вийлхар вийлхачул т1ехьаг1а велалургва.", "rus": "Кто, насмеявшись, плакал, тот, выплакавшись, будет смеяться."}, {"id": 226, "inh": "Вийлахча, бала совбалар мара х1ама дац.", "rus": "Плакать – лишь горе увеличивать."}, {"id": 227, "inh": "Вийста саг тешаме вац оале а, вийстачул кхерамег1а ва верста саг.", "rus": "Говорят, что опухший не жилец, но еще более ненадежен ожиревший."}, {"id": 228, "inh": "Вир бада т1а даккха аттаг1а да 1овдала саг кхетавечул.", "rus": "Легче осла поднять на крышу, нежели дурака вразумить."}, {"id": 229, "inh": "Вир 1еха даьлча, говра а соц.", "rus": "Когда орет осел, и конь замолкает."}, {"id": 230, "inh": "Вира т1ахайначох “вир” оал.", "rus": "Называют “ишаком” того, кто ездит на ишаке."}, {"id": 231, "inh": "Вира хоза г1а дийцад – виро ц1ог лестадаьд (таташ даьд).", "rus": "Ишаку рассказывали красивый сон, а он хвостом вертел (ветры пускал)."}, {"id": 232, "inh": "Вира ц1ог лаьцар – хиво вихьав, дына ц1ог лаьцар – хих ваьннав.", "rus": "Кто при переправе держался за хвост осла, утонул, а кто за хвост коня – переплыл."}, {"id": 233, "inh": "Вира ше вир долга хайнад кодж шийна т1айилача.", "rus": "Надели на ишака вьючное седло, и тогда он понял, что он поистину ишак."}, {"id": 234, "inh": "Вирала вирб1арз тол, вирб1арзала алача тол, алачал хохка ды тол, баьре дика вале.", "rus": "Мул лучше ишака, лошадь лучше мула, верховой конь лучше лошади, если на нем хороший всадник."}, {"id": 235, "inh": "Виран бакъалг хоза хул, кхийча, ше мадарра вир хул.", "rus": "Ишачонок бывает красивым, но вырастет – ишак ишаком."}, {"id": 236, "inh": "Виран говраца яхь хиннай, говран вираца хиннаяц.", "rus": "Ишак (неблагородный) завидовал коню (благородному), а конь не знает к нему зависти."}, {"id": 237, "inh": "Вирах пайда боал, вир-сагах зе доал.", "rus": "От ишака – польза, от человека-ишака (неблагородного) – вред."}, {"id": 238, "inh": "Вирах ды хиннабац, вирий оамал йолчох саг а хиннавац.", "rus": "Из ишака не сделаешь коня, из человека с ишачьим норовом не сделаешь благородного человека."}, {"id": 239, "inh": "Вираца къувса даьннача ломах вир хиннад.", "rus": "Стал лев спорить с ишаком (как с ровней) и сам им стал."}, {"id": 240, "inh": "Вираца лаьтта 1аса вирах 1ийхад.", "rus": "Теленок, выросший с ишаком, стал кричать по-ишачьи."}, {"id": 241, "inh": "Вирб1арзах ды хиннабац.", "rus": "Мул не станет верховым конем."}, {"id": 242, "inh": "Виреи хьакхеи хиннаяц Далла хьаькъал декъача.", "rus": "Ни ишак, ни свинья не явились к богу Дяла, когда он раздавал ум-разум (о неблагородных людях)."}, {"id": 243, "inh": "Виро вир хестадаьд: “Лергаш доккхий да хьа”, - яхаш.", "rus": "Ишак хвалил ишака, приговаривая: “Уши у тебя длинные”."}, {"id": 244, "inh": "Виро вирага “вир” аьлча, вира ахка дахад; эг1аваьчо 1овдалга “1овдал” аьлча, вокхо шалтах кайийттай.", "rus": "Когда ишак сказал другому, что он “ишак”, тот от обиды в пропасть бросился; когда дурак сказал дураку, что он “дурак”, тот за кинжал хватался."}, {"id": 245, "inh": "Виро “кхахь” аьлча, кхеравенна веннав зовзавар.", "rus": "Трус умирает даже от ослиного кашля."}, {"id": 246, "inh": "Виро хьор говрага йохьалургья, говро хьор вирага йохьлургьянц.", "rus": "Груз осла лошадь осилит, лошадиный же груз осел никогда не осилит."}, {"id": 247, "inh": "“Ви1ийл а дукхаг1а мала веза хьона? – хаьттача, - ви1ий-во1 веза”, - аьннад.", "rus": "Когда спросили, кто милее сына, ответили: “Внук”."}, {"id": 248, "inh": "Во арадаьннача дика чудена моттиг яц.", "rus": "Еще не бывало, чтобы добро приходило туда, откуда выходит зло."}, {"id": 249, "inh": "Во доацаш дика а хиннадац, нана йоацаш вой а хиннавац.", "rus": "Не бывает худа без худа, как не бывает сына без матери."}, {"id": 250, "inh": "Во сесаг – лард йоаца ц1а.", "rus": "Плохая жена – дом без основы (фундамента)."}, {"id": 251, "inh": "Во хила атта да, дика ва алийта хала да.", "rus": "Легко быть плохим, трудно быть хорошим."}, {"id": 252, "inh": "Во баьри нуврах лет, во къонах сесагах лет.", "rus": "Плохой всадник седло бьет (коня боится), плохой муж – жену бьет."}, {"id": 253, "inh": "Во дош къорачоа а хоз.", "rus": "Плохое слово и глухой услышит."}, {"id": 254, "inh": "Во ж1али ший коа латаш хул.", "rus": "Плохая собака кусуча на своем дворе."}, {"id": 255, "inh": "Во къайг во 1ах.", "rus": "Плохая ворона каркает противно."}, {"id": 256, "inh": "Во оамал 1омае атта да, дикаяр лелае хала да.", "rus": "Легко заиметь плохую привычку (черту характера), но трудно хорошую черту уберечь."}, {"id": 257, "inh": "Во сесаг ц1аг1а лелаечул циск леладича тол.", "rus": "Лучше иметь кошку в доме, чем плохую жену."}, {"id": 258, "inh": "Во лоалахо вола дика ц1а ца эца, дика лоалахо вола ц1а ийцача тол.", "rus": "Чем покупать хороший дом с плохим соседом, лучше купить плохой дом с хорошим соседом."}, {"id": 259, "inh": "Во нах боабе г1о вай, аьлча, эггар вог1авар тур ирде хайнав.", "rus": "Решили на сходе избавиться от плохих людей, и тут самый худший сел точить саблю (чтобы уничтожать плохих)."}, {"id": 260, "inh": "Воаг1ача хьаьшийла юхьала хозаг1а х1ама дац, водача хана цун букъ беце.", "rus": "Красивее лица пришедшего гостя может быть лишь спина гостя уходящего."}, {"id": 261, "inh": "Воаг1аш-водаш доацаш лелаяь гаргало хийраяьле д1айоал.", "rus": "Исчезает тепло родства без взаимных посещений и встреч."}, {"id": 262, "inh": "Воаллашехьа а валац когабухьара.", "rus": "Танец не начинают с бурного перепляса."}, {"id": 263, "inh": "Воацачох а дика къонах ву дикача сесаго; воча сесаго дикача къонахчун сий дожадаьд.", "rus": "Из никчемного мужчины хорошая жена сделала достойного мужа; плохая жена обесславила достойного мужа."}, {"id": 264, "inh": "Вобараш а дикабараш а, - берригаш а цхьан кашамашка ухк.", "rus": "И хорошие, и плохие – все лежат на одном кладбище."}, {"id": 265, "inh": "Водаш-лелаш, - т1еххьара а кхача везача д1акхаоач.", "rus": "Кто ходит и ищет, тот свое находит."}, {"id": 266, "inh": "Водаш яьр чет яц, воаг1аш яьр мара.", "rus": "Счет не тот, который мы предполагали, приступая к делу, а тот, который получился по завершении дела."}, {"id": 267, "inh": "Водашвар гаьнаваьннав.", "rus": "Идущий осиливает большой путь."}, {"id": 268, "inh": "Водаш лаьрх1ар вахача хиннадац.", "rus": "На что надеялся, когда шел, не оправдалось (не получилось), когда дошел."}, {"id": 269, "inh": "Воккхаг1чох эхь хета, з1амаг1чох къахета.", "rus": "Стыдись старшего, жалей младшего."}, {"id": 270, "inh": "Воккхаг1чун сий де, з1амаг1чун хьехам бе.", "rus": "Старшего чти, младшего поучай."}, {"id": 271, "inh": "Воккхаг1чунга ийс пхьа ба.", "rus": "За старшим (как ответчиком за деяния младших) числится девять случаев кровной мести."}, {"id": 272, "inh": "Воккхаг1чунца бегаш ма бе, з1амаг1чунца эйхьаза ма вала.", "rus": "Не шути со старшим, не панибратствуй с младшим."}, {"id": 273, "inh": "Воккхаг1чунца воккхаг1ал леладе, з1амаг1чунга з1амаг1ал леладайта.", "rus": "Старшего чти сам, а младшего заставь чтить себя."}, {"id": 274, "inh": "Воккхаг1чо аьннар ца даьр доккхача вон т1а кхаьчав.", "rus": "Несчастье постигло того, кто не послушался совета старшего."}, {"id": 275, "inh": "Волчоа – белхам, воацачоа – белам.", "rus": "Для родных (ты, он) – горе, для чужих – посмешище."}, {"id": 276, "inh": "Воча денах дика ди хиннад, воча сагах дика саг хиннавац.", "rus": "Ненастный день станет погожим; плохой человек хорошим не станет."}, {"id": 277, "inh": "Воча дешо берза йорт йихьай.", "rus": "Плохое слово волчьей рысью бежит."}, {"id": 278, "inh": "Воча вордо никъ бохабаьб, гирдз даьннача говро рема толхаяьй, воча сесаго ц1а дохадаьд.", "rus": "Плохая арба дорогу портит, чесоточный конь портит табун, а плохая жена разваливает семью."}, {"id": 279, "inh": "Воча сага дика дечул дикача сага 1унал де.", "rus": "Лучше прислуживать хорошему человеку, чем делать добро плохому."}, {"id": 280, "inh": "Воча сагагара дикадар хиннадац, дикача сагах бийтта оаг1ув байнабац.", "rus": "Не жди добра от плохого человека; а дружба с хорошим человеком не пропадет."}, {"id": 281, "inh": "Воча сагах оал: “Ц1аг1а бала ба хьо, пхьегий т1а белам ба хьо”.", "rus": "Про плохого мужчину говорят: “Дома – ты горе, на людях – посмешище”."}, {"id": 282, "inh": "Воча сагаца г1улакх леладар – вонна т1авала лоами ба.", "rus": "Водиться с плохим человеком – возводить лестницу к несчастьям."}, {"id": 283, "inh": "Воча сагацарча машарал дикача сагацара дов тол.", "rus": "Чем жить в мире с плохим человеком, лучше жить во вражде с человеком порядочным."}, {"id": 284, "inh": "Воча саго даь хьехар д1аэцац, дикача саго даьр д1аэцаш а хул.", "rus": "Совета дурного человека не приемлют, а совет доброго человека, бывает, и приемлют."}, {"id": 285, "inh": "Воча саго деча ламазал тол дикача къонахчо ю наб.", "rus": "Сон хорошего человека лучше, чем молитва плохого человека."}, {"id": 286, "inh": "Воча саго дийша 1илма – 1овдалча сага бе кхаьча тур да.", "rus": "Науки, постигнутые плохим человеком, - сабля в руках дурака."}, {"id": 287, "inh": "Воча саго яьхад: “Сайна дика даьчоа, цкъа во далцца вахалва со”.", "rus": "Плохой человек говорил: “Дай бог мне еще прожить, пока я не сделаю хоть одну пакость тому, от кого я видел лишь добро”."}, {"id": 288, "inh": "Воча сесагал воккхаг1а моастаг1а вац, воча маьрал йоккхаг1а доакъазал яц.", "rus": "Нет большего врага, чем плохая жена; нет большего несчастья, чем плохой муж."}, {"id": 289, "inh": "Воча т1ехьенал вог1а х1ама хила йиш яц.", "rus": "Ничто не может быть хуже плохого потомства."}, {"id": 290, "inh": "Воча т1ехьено ший да-нана ханал хьалха каша бахтаб.", "rus": "Плохое потомство раньше времени отправляет родителей в могилу."}, {"id": 291, "inh": "Воча х1амах хьадж ца кхетача сагах хьо ветталой, дег1ах хьадж ухаргья хьа.", "rus": "Если будешь общаться с человеком, не чувствующим дурного запаха (плохих поступков), сам начнешь вонь издавать."}, {"id": 292, "inh": "Воча чарахьа даиман топ харцахьа ювл.", "rus": "У плохого охотника ружье в цель не попадает."}, {"id": 293, "inh": "Воча фусамдас бийда дулх увттаду.", "rus": "Плохой хозяин ставит на стол недоваренное мясо (чтобы меньше съели)."}, {"id": 294, "inh": "Воча фусамнаьна на1ар т1ехьашка массаза б1еха хул.", "rus": "У плохой хозяйки за порогом всегда много мусора."}, {"id": 295, "inh": "Вочох хьадж ца кхетача сагах бийтта оаг1ув б1еха хиннаб.", "rus": "Плечо, которое подставлял бессовестному человеку, загрязнилось."}, {"id": 296, "inh": "Вочун дикачунца массе хана хьаг1 (инкарал) хиннай.", "rus": "Плохой человек всегда с тайной злостью завидует хорошему человеку."}, {"id": 297, "inh": "Воша а воша вац хьа, хьа из доттаг1а веце.", "rus": "И брат твой тебе не брат, если он еще и не друг тебе."}, {"id": 298, "inh": "Воша – вешийна, пхьу – берза.", "rus": "Брат – брату, пес – волку (на съедение)."}, {"id": 299, "inh": "Воша воаца саг наха г1ийла б1арахьийжав.", "rus": "Не имеющий брата грустно смотрел на чужую родню."}, {"id": 300, "inh": "Воша воаца воша – ткъам боаца лаьча; воша воаца йиша – йокъаеннача гаьна ткъовро.", "rus": "Юноша без брата – сокол без крыла; девушка без брата – ветка на засохшем дереве."}, {"id": 301, "inh": "Воша воаца йиша г1ийла яьг1ай.", "rus": "Печальна участь девушки, не имеющей брата."}, {"id": 302, "inh": "Воша воацача йиший дог ма дохаде, нана йоацача йи1ий дог ма делхаде.", "rus": "Не разбивай сердце девушки, не имеющей брата; не огорчай девушку, не имеющую матери."}, {"id": 303, "inh": "Воша воаца саг – аьтта пхьарс боаца саг.", "rus": "Не имеющий брата, что человек без правой руки."}, {"id": 304, "inh": "Воша дика вахалва, т1ехь а ма вахалва.", "rus": "Пусть хорошо живет брат, но не богаче тебя (зазнается…)."}, {"id": 305, "inh": "Воша хинна а доттаг1а хинна а оаг1ув боаца саг наха даькъаза воаккх.", "rus": "Человека, не имеющего ни брата, ни друга, люди обездолят."}, {"id": 306, "inh": "Вошас велхаваьр шучас велаваьв.", "rus": "Бывает, родной брат доведет до слез, а двоюродный обрадует."}, {"id": 307, "inh": "Во1 воаца да пхьегий т1а г1ийла лаьттав.", "rus": "Мужчина, не имеющий наследника, понуро стоял при народе."}, {"id": 308, "inh": "Во1 воаца да – бухь бийна хи; воша воаца йиша – ткъам боаца лаьча; ткъам боаца лаьча лаца атта да, бухь бийна хи божабе атта ба.", "rus": "Отец без потомка – надломившееся дерево; девушка без брата – сокол без крыла; сокола без крыла изловить легко, надломившееся дерево свалить просто."}, {"id": 309, "inh": "Во1 воацачун тхов хиннабац.", "rus": "Нет сына – нет крыши над головой."}, {"id": 310, "inh": "Во1-вошеи кхеваьвац дов леладаьчо.", "rus": "Враждовавший (воевавший) с людьми не вырастил ни сына, ни брата (значение: погибли в кровавых делах)."}, {"id": 311, "inh": "Во1о саг йоалайича, цунна: наьна юхь хьакхий муц1ара тара хет, уст-наьна бат шафран 1ажа тара хет.", "rus": "Женился сын – и лицо матери показалось ему свиным рылом, а лицо тещи – яблоком шафрановым."}, {"id": 312, "inh": "В1алла ха ца йоаг1ар – ж1али, еча, яа ца ховр – пхьу.", "rus": "Тот, кому ни разу в жизни не повезет, - собака; а если повезет и он не воспользуется этим – пес он."}, {"id": 313, "inh": "В1ашаг1акхийттача шин сага юкъе ца1 тхьамада хила воаг1а.", "rus": "Если соединились двое, один из них должен быть тамадой."}, {"id": 314, "inh": "В1аший товш ца хинна ши эгар тайнай шоашта кхоалаг1ъяр т1айоалайича.", "rus": "Две жены многоженца перестали ссориться, когда муж привел третью."}, {"id": 315, "inh": "В1аьхий саг саг1а далара т1ера хилац.", "rus": "Богач бывает скуп на подаяние."}, {"id": 316, "inh": "В1аьхий саг, 1овдала из вале а, хьаькъал долаш хет.", "rus": "И дурак кажется умником, если он богат."}, {"id": 317, "inh": "В1аьхийчоа къечун хьал довзаргдац, къечоа в1аьхийчун хьал дика гу.", "rus": "Богачу не понять жизненные тяготы бедняка, бедняк же знает, насколько состоятелен богач."}, {"id": 318, "inh": "Га дика я, сом латаш яле; саг дика ва, г1уллакхаца вале.", "rus": "Дерево хорошо плодами, а человек – делами."}, {"id": 319, "inh": "Га йоаца саьрг хоада атта ба.", "rus": "Легко переломить прутик, оторвавшийся от родного ствола."}, {"id": 320, "inh": "Газа ийккхача б1ийг ийккхай.", "rus": "Куда прыгнет коза, туда и козленок."}, {"id": 321, "inh": "Газага думи а хиннабац, эхь доацачунга г1улакх-эздел а хиннадац.", "rus": "Как у козы нет курдюка, так у бесстыжего – благородства."}, {"id": 322, "inh": "Газа му1аех мукх хинабац, нанас ца ваьчох воша хиннавац.", "rus": "Как из козлиного рога не получить ячменя, так и рожденному не твоей матерью не стать тебе братом."}, {"id": 323, "inh": "Гайна-ганза бакъдар т1адаланза дусаргдац. Фу пайда ба мичча ханна из т1адаьннадар, аьнна?", "rus": "Рано или поздно, правда выйдет наружу. А какой толк, что она когда-то выйдет?"}, {"id": 324, "inh": "Гамажа шура мийна бакъилг колдийла кийрчай.", "rus": "Жеребчик, вскормленный буйволицей, любит валяться в грязи."}, {"id": 325, "inh": "Гаргара кха а, мехкара йиша-воша а дика да.", "rus": "Поле лучше ближе к дому, родственники – из родных мест."}, {"id": 326, "inh": "Гаргарча аьлан зурмал хозаг1а хийттай гаьнарча 1уна зурма.", "rus": "Далекая трель пастушьей дудки милее трелей близкой княжеской зурны."}, {"id": 327, "inh": "Гаъ шерадар аьнна хилац ды дика, корта боккха бар аьнна хилац саг хьаькъал долаш.", "rus": "Конь хорошим бывает не потому, что у него круп широкий, а человек умным – не потому, что у него голова большая."}, {"id": 328, "inh": "Гаьго яьхар даьр бакъахьа ваьннавац.", "rus": "Желудку потакать – добра не видать."}, {"id": 329, "inh": "Гаьнара доттаг1а – ег1а латта г1ала санна ва.", "rus": "Друг в дальнем краю, что воздвигнутая там башня."}, {"id": 330, "inh": "Гаьнара лекха зурма хоза хийттай.", "rus": "Издали слышная мелодия приятней на слух."}, {"id": 331, "inh": "Гаьннара сибатах вовзаш хила везар опаш бувца (сийдоацаш вола) саг.", "rus": "Хорошо бы еще издали по облику узнавать вруна (бесчестного человека)."}, {"id": 332, "inh": "Гаьнарча вешел юхера лоалахо тол.", "rus": "Близкий сосед лучше далекого брата."}, {"id": 333, "inh": "Гаьннарча наькъах ваьнна вале, говра ший ма та яхийта.", "rus": "Если выехал в дальний путь, не торопи коня."}, {"id": 334, "inh": "Гийг ца езачоа корта бийзабац.", "rus": "Кто не заботится о желудке, тот не любит и голову."}, {"id": 335, "inh": "Гирдз даьнна говра ремах къоастаяьй.", "rus": "Шелудивую лошадь (чесоточную) изгнали из табуна."}, {"id": 336, "inh": "Гирдзагара гирдз мара далац.", "rus": "От чесоточного лишь чесотку получишь."}, {"id": 337, "inh": "Гирдздаьнна говраш шоайла в1аший хьийрчай.", "rus": "Чесоточные лошади любят кучковаться."}, {"id": 338, "inh": "Гирдз даьннача говро шийна лостае йоаца ц1ог ремийна лестаяьй.", "rus": "Чесоточная лошадь, не имея хвоста сгонять мух с себя, пыталась гнать их со всего табуна."}, {"id": 339, "inh": "Говза саг, т1ошта из хоавича а, вахаргва.", "rus": "Умелец (хитрец), хоть посади его на голые камни, выживет."}, {"id": 340, "inh": "Говзача-ма шайт1а а эшаду.", "rus": "Хитрец и шайтана надует."}, {"id": 341, "inh": "Говра дикал боларах хов, сага дикал сабарах хов.", "rus": "Коня узнаешь по его бегу, человека – по его спокойствию (терпеливости)."}, {"id": 342, "inh": "Говра дирст еза, сесага шиш беза.", "rus": "Лошадь сдерживают уздечкой, а жену – уважением к себе."}, {"id": 343, "inh": "Говра йоаца баьри - тхов боаца ц1а.", "rus": "Молодец без коня что дом без крыши."}, {"id": 344, "inh": "Говра йорг1а хилча, т1аьнашха я оал; йо1 хоза хилча, кхахьпа я оал; з1амсаг майра хилча, 1овдала ва ол.", "rus": "Если (говорят сплетники) конь идет иноходью, скажут, что у него ноги больные; если девица красива, скажут – кокетка; если парень храбрый, скажут – дурак."}, {"id": 345, "inh": "Говра чоаболах къоастае, саг сабарах къоаставе.", "rus": "Коня выбирай по галопу, человека – по спокойствию (сдержанности)."}, {"id": 346, "inh": "Говра чураяьккхача г1ув беттарах пайда бац, - из говран даь бехк ба.", "rus": "Поздно закрывать на засовы, когда увели коня, - хозяин сам во всем виноват."}, {"id": 347, "inh": "Говра эцалехьа нувра эца.", "rus": "Прежде чем покупать коня, купи седло."}, {"id": 348, "inh": "Говрабаьри г1аш водачох теннав.", "rus": "У всадника преимущество перед пешеходом."}, {"id": 349, "inh": "Говрана нувр тов, вирана кож тов.", "rus": "Коню идет верховое седло, а ослу приличествует грузовое седло – кож."}, {"id": 350, "inh": "Говрана фуъ беннар гаьнаг1а ваьннав.", "rus": "Кто сытно коня накормил, дальше других уехал."}, {"id": 351, "inh": "Говрахи кхалсагахи ма теша.", "rus": "Не верь коню и женщине."}, {"id": 352, "inh": "Говраца водачох г1аш водар кхийнавац.", "rus": "Пешеходу не угнаться за всадником."}, {"id": 353, "inh": "Говро болар де ца тигача, шийна шод еттийт.", "rus": "Ленивый конь заставляет себя плеткою бить."}, {"id": 354, "inh": "Гота йодаш, сирг1алго “баь т1а ловза йода со” яхад, готара йоаг1аш, яьхад “жожаг1атара йоаг1а со”.", "rus": "Впервые вели бычка на пахоту, и он говорил: “Иду резвиться на лугах”; возвращаясь же, сказал: “Иду из ада!”."}, {"id": 355, "inh": "“Гота сацийта – мел1а ловзае!” – яьхад мекъачо.", "rus": "Лентяй призывал бросить пахоту и порезвиться с ящерицей."}, {"id": 356, "inh": "Гуйран михо кхо во денад, б1аьстан михо кхо дика денад.", "rus": "Осенний ветер принес три вреда, весенний – три добра."}, {"id": 357, "inh": "Гуйрана даьккха таьлми эсала хул.", "rus": "Осенний выводок бывает слабым."}, {"id": 358, "inh": "Гуйранара малх да т1авоацача жерочунга хьеж.", "rus": "Осенне солнце смотрит на сирую вдову."}, {"id": 359, "inh": "Гуйре йиза хул, б1аьсти меца хул.", "rus": "Осень сыта, а весна голодна."}, {"id": 360, "inh": "Гурахьарча саьл карара лекъ тол.", "rus": "Лучше перепелка в руках, чем надежда поймать осенью оленя."}, {"id": 361, "inh": "Гучаха мерзадараш дувцаш, къайлаг1а тийшар лелабеш.", "rus": "В лицо льстит, за спиной – подличает."}, {"id": 362, "inh": "Г1ажа т1ехьаедача, Беке а вехавац: йоккха шалта а яьккха, кхаь картах дехьа а ийккха, аьннад: “Дадала хьа, ма бирса аьккха а да-кха хьо!”", "rus": "Когда за ним побежал гусь, Бека не испугался: выхватил огромный кинжал, перемахнул через три плетня и воскликнул: “Ну и грозный же ты зверь, черт тебя побери!”"}, {"id": 363, "inh": "Г1ажах 1аха енна боабашк яь чу яхай.", "rus": "Попыталась утка гоготать по-гусиному, да в котел угодила."}, {"id": 364, "inh": "Г1айг1ано г1айг1а т1аяхь: дикачо дика дахь.", "rus": "Грусть влечет за собою печаль; добро за собою добро ведет."}, {"id": 365, "inh": "Г1алат даларца мара саг тоалац.", "rus": "Совершая ошибки, человек совершенствуется."}, {"id": 366, "inh": "Г1алат доацаш воша а короргвац.", "rus": "Без недостатков даже брата не бывает."}, {"id": 367, "inh": "Г1алг1ай мотт хьона хой, моллаг1ча наха юкъе товргва хьо.", "rus": "Если ты знаешь ингушский язык (и обычай), уживешься с любым народом."}, {"id": 368, "inh": "Г1алг1ачунгара эздел доаккхалургдац.", "rus": "По этике и благородству ингуша никому не обойти."}, {"id": 369, "inh": "Г1алме ловзаву, Фартас лувчаву, 1арамхево вожаву, Тирко 1охьу, Эсо х1алакву.", "rus": "С человеком Камбелеевка (река) играет, Фартанга купает, Арамхи сбивает, Терек уносит, а Асса губит."}, {"id": 370, "inh": "Г1анашта юкъе а хул дикаг1а (хозаг1а) дола г1а.", "rus": "И среди снов бывает лучший (красивейший)."}, {"id": 371, "inh": "Г1араг1ура к1оригаш а йиа, цогало яьхад: “Вай доттаг1ий долаш фу бе я уж ейнараш, хьа к1оригаш е са к1оригаш яр аьнна”.", "rus": "Съела лиса журавлят и сказала: “Раз мы друзья, что за разница, твои ли, мои ли детеныши пропали!”"}, {"id": 372, "inh": "Г1ийлача мехкарий оасар кадай хул, берстача мехкарий – мекъа хул.", "rus": "Стройные девушки шустро пропалывают, а толстухи – лениво."}, {"id": 373, "inh": "Г1овтал лелаечунга со йодац, чокхе дувхачо со йигац.", "rus": "За юношу в бешмете я не хочу выйти замуж, а юноша в черкеске меня не берет."}, {"id": 374, "inh": "Г1ойсета болар сетта хул.", "rus": "Кривляка и ходит вихляво."}, {"id": 375, "inh": "Г1омара т1а г1ала оттаяьяц.", "rus": "На песке башню не ставят."}, {"id": 376, "inh": "Г1омарал а кхерийл а безаг1а ба 1овдалча сага корта.", "rus": "Голова дурака тяжелее и песка, и камня."}, {"id": 377, "inh": "Г1ув б1еха хилча, хьогал йовргъянц; дог 1аьржа хилча, 1имерза хургьяц.", "rus": "Как из грязного колодца жажаду не утолить, так не жди добра от грязного сердца (от жестокосердного)."}, {"id": 378, "inh": "Г1ув ч1оаг1а беттачу къу кховдац.", "rus": "Вор не идет туда, где засовы крепки."}, {"id": 379, "inh": "Г1улакх геттар телхалга мара ха дезац, 1овдала саг хьеха эттача.", "rus": "Знай, что дела твои совсем плохи, когда дурак начнет тебя поучать."}, {"id": 380, "inh": "Г1улакхах мара хац йо1 мел дика я.", "rus": "Девушку узнаешь по ее делам (а не по внешности)."}, {"id": 381, "inh": "Г1улакх – з1амаг1чунгара, чет – воккхаг1чунгара.", "rus": "Дела – от младшего, расчеты – от старшего."}, {"id": 382, "inh": "Г1улакх тоаденнад аьнна, корта кура ма кхаба, телхад аьле, 1о а ма олла.", "rus": "Не задирай голову, когда дела идут хорошо, и не опускай, когда они идут плохо."}, {"id": 383, "inh": "Да велча, дег т1ара цхьа зиза 1одож; нана елча, дег т1ара ши зиза 1одож.", "rus": "Умрет отец – с сердца упадет цветок, умрет мать – упадут два цветка."}, {"id": 384, "inh": "Да воацача дезала дай дукха хиннаб, пайда к1езига хиннаб.", "rus": "У осиротевшей семьи много хозяев, да мало пользы."}, {"id": 385, "inh": "Да дика – дезал дика.", "rus": "Хорош хозяин, хороша и семья (двор)."}, {"id": 386, "inh": "Да ловзаваьлча – кха ловзадоал, кха ловзадаьлча, 1у ловзавоал, 1у ловзаваьлча, пхьу ловзабоал.", "rus": "Взыграл хозяин – поле расцвело, расцвело поле – батрак разыгрался, разыгрался батрак – зарезвился пес."}, {"id": 387, "inh": "Да маькара, - дезал маькара.", "rus": "Хозяин трудолюбив, - трудолюбива и семья."}, {"id": 388, "inh": "Да ца вийлхача дакъах нах бийлхабац.", "rus": "Если ты сам не оплакиваешь своего покойника, то чужие и подавно не заплачут."}, {"id": 389, "inh": "Даа пхьор доацача бус дулх-хьалт1ам нийсаденнад.", "rus": "Нечем было поужинать, да вдруг мясо с галушками бог дал."}, {"id": 390, "inh": "Даа хала дале а, худар д1айха хила деза.", "rus": "Хотя и труднее ее кушать, а все же каша должна быть горячей."}, {"id": 391, "inh": "Даар – дег1ан кхача, наб – сина кхача.", "rus": "Еда – пища для тела, сон – пища для души."}, {"id": 392, "inh": "Дагадоаллар диста лелх.", "rus": "Потаенное постоянство наружу вылезает."}, {"id": 393, "inh": "Даггара бийлхача б1аргах ц1ий даьннад.", "rus": "Из глаза, плакавшего от души, кровь пошла."}, {"id": 394, "inh": "Дагара аьнна дош Башлам-керте а кхаьчад (шахьара а хезад).", "rus": "Искреннее слово до вершины Казбека долетело (весь город услышал)."}, {"id": 395, "inh": "Дагаро ца боатт1абаь хи дахчан загало боат1абаьб.", "rus": "Бревно, которое не смог расколоть железный топор, расколол деревянный клин."}, {"id": 396, "inh": "Дайна сий меттаденадац.", "rus": "Утерянная честь – не вернулась."}, {"id": 397, "inh": "Дакъа менге к1ала а диле, хьаьшана г1улакх де.", "rus": "Спрячь покойника под кровать, но с почестями прими гостя."}, {"id": 398, "inh": "Дакъа – нийса, хьинар – т1ехь.", "rus": "Трудись больше других, но долю получай равную."}, {"id": 399, "inh": "“Далла аьннар хургда”, - яхаш ваг1арах пайда хургбац, гош хьоадеш веце.", "rus": "Если будешь бездельничать и только уповать на Всевышнего, - пользы не будет."}, {"id": 400, "inh": "Далла аьнначоа раьза хила веза, Даьла раьза хургвола х1ама а де деза.", "rus": "Будь доволен богом данной судьбою, заслужи божью милость своими делами."}, {"id": 401, "inh": "Дала дезача денна сом толашаг1а да дала ца дезача деннача тумал.", "rus": "Потраченный по делу рубль лучше, чем сотня, потраченная не по делу."}, {"id": 402, "inh": "Дала ца дезача денна саг1а – хила баха кхера.", "rus": "Подаяние ненуждающемуся – камень, брошенный в воду."}, {"id": 403, "inh": "Даллаи паччахьаи дезалда вай: паччахьа везачун вахар дика хургда, даллана везачун валар дика хургда (ялсамала г1оргва).", "rus": "Пусть любят нас бог и царь: кого любит царь – тот будет жить хорошо; кого любит бог – умрет легко (в рай попадет)."}, {"id": 404, "inh": "Далла ше малейкийла везаг1а лаьрх1а хиннав Адам-пайхамар, цудухьа адамал дезаг1а х1ама а дац.", "rus": "Сам бог Дяла вознес пророка Адама над ангелами, поэтому человек (адам) – лучшее из божьих творений."}, {"id": 405, "inh": "Да-нана ца лоарх1аш лийна саг ялсамала чувитавац.", "rus": "В рай не пустили того, кто не чтил своих родителей."}, {"id": 406, "inh": "Данза даргдоаца х1ама сихаг1а д1адоладе; ала дезача дош ала.", "rus": "Быстрее начинай то, что сделать необходимо; а там, где надо сказать, немедля скажи свое слово."}, {"id": 407, "inh": "Дар дайна лела саг наха кхераме ва.", "rus": "Бездельние опасен для людей."}, {"id": 408, "inh": "Дар дайначо яьхад: “Ширткъа д1а а хийце, мел1а ловзае вай”.", "rus": "Бездельник говорил: “Давайте отпустим ласку (мышевидный зверек) и начнем играть с ящерицей”."}, {"id": 409, "inh": "Дарбашка даьнна дег1 пайданна доацача даьннад.", "rus": "Тело, приученное к лекарствам, никуда не годится."}, {"id": 410, "inh": "Дардайначо даьр дийцад, воча т1ехьено дай бийцаб.", "rus": "Бездельник прошлыми заслугами хвалился; никчемное потомство хвалилось предками."}, {"id": 411, "inh": "Дарег1а йохкача х1аманга кхозза хьажа.", "rus": "То, что продается дешево, осмотри трижды."}, {"id": 412, "inh": "Дас аьннар де ца тига уст даь яь чу бахаб.", "rus": "Непослушный бык угодил в котел хозяина."}, {"id": 413, "inh": "Дас во1 вахалва яьхад, во1о да лалва яьхад.", "rus": "Отец приговаривал: “Пусть живет мой сын!” Сын же говорил “Пусть умрет мой отец!”"}, {"id": 414, "inh": "Дас д1айийнача гаьнех во1а сомаш хиннаб.", "rus": "Сыну достались фрукты от дерева, которое посадил его отец."}, {"id": 415, "inh": "Дас хестаяь говра хьалха яьннаяц.", "rus": "Лошадь, которую расхваливал хозяин, проиграла на скачках."}, {"id": 416, "inh": "Дахкана – бала, цискана – ловзар.", "rus": "Что для кошки игра, то для мышки горе."}, {"id": 417, "inh": "Дахко хий техача, форд а болабеннаб.", "rus": "Помочилась мышка, и море перелилось через край."}, {"id": 418, "inh": "Дахча кхатуллаш ца хилча, ц1и йов; лелаеш ца хилча, гаргало а йов.", "rus": "Огонь гаснет, если не подкладывать дров; родство угасает, если его не поддерживать."}, {"id": 419, "inh": "Дахчан вале а, да тол; б1ег1инга яле а, нана тол.", "rus": "Лучше иметь отца – хоть из дерева; лучше иметь мать – хоть из войлока."}, {"id": 420, "inh": "Даь дагара воаца хьаьша 1ай пхьег1а т1а ваьннав.", "rus": "Гость, не приглянувшийся хозяину, зимой на майдане оказался."}, {"id": 421, "inh": "Даь дика мекъа вир санна дода, даь во – масса ды санна хехка дода.", "rus": "Добро идет, словно ленивый ишак, зло несется скакуном."}, {"id": 422, "inh": "Даь доахан – ви1ий фос.", "rus": "Скот (богатство) отца – добыча сына."}, {"id": 423, "inh": "Даь-сесага дега т1а башаргбоаца ша улл.", "rus": "Сердце мачехи покрыто нетающим льдом."}, {"id": 424, "inh": "Даь сесага корта къемата дийнахьа хьайро йохьаргба.", "rus": "Голову мачехи в судный день будут на мельнице молоть."}, {"id": 425, "inh": "Даь хьехамашка ладийг1ар атта г1алата варгвац.", "rus": "Кто прислушивается к советам отца, тот редко ошибается."}, {"id": 426, "inh": "Даьй сий дечо ший сий хьалдоаккх.", "rus": "Кто чтит предков, тот возвышает свою честь."}, {"id": 427, "inh": "Даь-йиша – тух, наьна-йиша – модз.", "rus": "Отцова сестра что соль, сестра матери – мед."}, {"id": 428, "inh": "Даькъазачоа даь-ц1аг1ара а енай энгар.", "rus": "На горе несчастной жене муж второй женою привел одну из ее сестер."}, {"id": 429, "inh": "Даькъазчунга маьчеш хилча, пезгаш хилац, пезгаш хилча, маьчеш хилац.", "rus": "У несчастного если есть чувяки, то нет ноговиц; а если есть ноговицы, - нет чувяк."}, {"id": 430, "inh": "Даьла къайле сага ха йиш яц.", "rus": "Никому не дано проникнуть в тайны божьи."}, {"id": 431, "inh": "Даьла сабаре вале а, кхел ца еш х1ама дуташ вац.", "rus": "Бог терпелив, но за все воздает сполна."}, {"id": 432, "inh": "Даьна тайча, - ворда етта декъий.", "rus": "Если хозяина устраивает, пусть получит полную арбу покойников."}, {"id": 433, "inh": "Даь-наьнага хьежжа хул т1ехьа т1айоаг1а т1ехье.", "rus": "Потомство вырастает похожим на своих родителей (предков)."}, {"id": 434, "inh": "Даь-нана г1озали доакъазали т1ехьенах йоал.", "rus": "И счастье, и несчастье родителей в их детях."}, {"id": 435, "inh": "Даьнеи наннеи доккхаг1а дола совг1ат да яхь йола во1 кхийча, эхь долу йо1 кхийча.", "rus": "Самый большой подарок для родителей – гордый сын и скромная дочь."}, {"id": 436, "inh": "Даьр доаде дика саг везац, доацар т1ада дика саг вез.", "rus": "Не нужно быть хорошим, чтобы уничтожить доброе дело; сотворить его – это и есть добрый поступок."}, {"id": 437, "inh": "Даьре хабар дувцачох пайда баргбац (лорале).", "rus": "От краснобая не будет пользы (берегись его)."}, {"id": 438, "inh": "Даьсса гали уралаттац.", "rus": "Пустой мешок не стоит."}, {"id": 439, "inh": "Даьссача хабарал дикъа худар тол.", "rus": "Густая каша лучше пустой болтовни."}, {"id": 440, "inh": "Даьтта ца хьекхача, чарх кхестаяц.", "rus": "Не смажешь и колесо не крутится."}, {"id": 441, "inh": "Даьттала 1ема 1аг мистача берх1ала 1еттача, баьтт1аб.", "rus": "Привыкшая к маслу ложка в прокисшем рассоле треснула."}, {"id": 442, "inh": "Даьттаца-ма вирнахча а юаеннай.", "rus": "С маслом съешь и “ишачий сыр” (одна из пород большого гриба)."}, {"id": 443, "inh": "Даьттеи хийи мелла цхьана кхехкадарах в1ашаг1ийнадац.", "rus": "Сколько бы в одном котле ни варили воду и масло, они никогда не смешиваются."}, {"id": 444, "inh": "Даьца, наьнаца во волчун т1ехье а хургъя къиза.", "rus": "Кто плох со своими родителями, у того вырастет жестокое потомство."}, {"id": 445, "inh": "Даь-ц1аг1а ца товр, маьр-ц1аг1а товргъяц.", "rus": "Строптивая девушка в замужестве не уживется."}, {"id": 446, "inh": "Де ца дезар даьчоа да ца дезар денад.", "rus": "Кто делает неположенное, получит нежелаемое."}, {"id": 447, "inh": "Дег т1ара вежар дегаза воал.", "rus": "Выпавший из сердца стал отвратительным."}, {"id": 448, "inh": "Дег1 боча даккха а мегаргдац, х1ичий даккха а мегаргдац.", "rus": "Тело нельзя ни баловать, ни изнурять."}, {"id": 449, "inh": "Дег1ар хургда, яхаш ваьг1ачун кхай т1а йоарх1аш яьннай.", "rus": "Пока ленивый уповал на то, что суждено, его поле сорняками заросло."}, {"id": 450, "inh": "Дег1 – пилалла, хьаькъал – хьазалгалла.", "rus": "Телом – слон, умом – пташка."}, {"id": 451, "inh": "Дег1ага хьежача, - буг1а, дегага хьежача – жий.", "rus": "Посмотреть на внешность – бугай, посмотреть в душу – овца."}, {"id": 452, "inh": "“Дег1ар хургда” яхарах а де1ар хургда, 1а маьже хьоайой.", "rus": "Говоря “будет, что суждено”, забываем сами потрудиться."}, {"id": 453, "inh": "Дег1аца низ болаш вар цхьаннех котвоал, хьаькъал долаш вар иттанех котвоал.", "rus": "Сильный телом побеждает одного, сильный умом побеждает десятерых."}, {"id": 454, "inh": "Дег1-кеп йолаш вар аьнна пайда бац, хьаькъал долаш веце.", "rus": "Нет проку от внушительной внешности, коли ума недостает."}, {"id": 455, "inh": "Дежа даьтта санна хила еза йо1.", "rus": "Девушка должна быть чиста, как топленое масло."}, {"id": 456, "inh": "Дезал во кхийча, наьна юхь т1а буж, даь моса т1а а буж.", "rus": "Если вырастет плохая семья, то это отражается на морщинах матери и на сединах отца."}, {"id": 457, "inh": "Дезал дика – беркат дукха.", "rus": "Хороша семья – много благодати в доме."}, {"id": 458, "inh": "Дезал кхийча, сесаг майрайоал.", "rus": "Жена становится смелее, когда вырастут дети."}, {"id": 459, "inh": "Дезала вийзар Даллана а вийзав.", "rus": "Кого любит семья, того и бог любит."}, {"id": 460, "inh": "Дезала даь корта к1айбеннаб дезал кхийча.", "rus": "У отца семейства голова поседела тогда, когда выросли дети."}, {"id": 461, "inh": "Дезала доккхаг1а дола рузкъа – барт хилар.", "rus": "Главное богатство семьи во взаимном согласии."}, {"id": 462, "inh": "Дезала ираз-беркат барт-безамах доал.", "rus": "Счастье и благополучие семьи – в любви и согласии."}, {"id": 463, "inh": "Дезала ца вийзар наха вийзавац.", "rus": "Кого не любят в семье, того и в народе не любят."}, {"id": 464, "inh": "Дезарах ватт1ар хиннад.", "rus": "Лопнул позарившийся на многое."}, {"id": 465, "inh": "Декхар доалла саг парг1ата хургвац, декхар д1адаллалца.", "rus": "Должник не знает покоя, пока долг не вернет."}, {"id": 466, "inh": "Декхар к1ира т1ехьадаьлча, бетта т1ехьадоал, бетта т1ехаьдаьлча, шера т1ехьадоал.", "rus": "Долг, просроченный на неделю, вернули только через месяц; просроченный на месяц – через год."}, {"id": 467, "inh": "Декхара да вайнавац.", "rus": "Хозяин долга (кредитор) не пропадет (всегда сыщется)."}, {"id": 468, "inh": "Декхарийна т1ехьа харцо йоаг1а, харцонна т1ехьа доакъазал йоаг1а.", "rus": "Долг тащит за собою неправедное, а оно влечет за собою несчастье."}, {"id": 469, "inh": "Декъа дахча а лоталац ц1и т1а ца йихьача.", "rus": "Не поднесешь огня – и сухие дрова не загорятся."}, {"id": 470, "inh": "Декъанца моастаг1ал леладе мегаргдац.", "rus": "Нельзя враждовать с трупом."}, {"id": 471, "inh": "Делаш д1адахар делхаш юхаденад; делхаш д1адахар делаш юхаденад.", "rus": "Родостно ушедшее вернулось печальным, печально ушедшее вернулось радостным."}, {"id": 472, "inh": "Делкъал т1ехьаг1а ди дац, 1ай хьежар малх бац, саг йоалаяь к1ант дош дац.", "rus": "День после обеда – уже не день, зимнее солнце – не солнце, женатый – уже не парень."}, {"id": 473, "inh": "Денал дола саг къахетамег1а ва, зовза саг къизаг1а ва.", "rus": "Мужественный человек жалостлив, трусливый человек – жесток."}, {"id": 474, "inh": "Денал – са ч1оаг1а хилар.", "rus": "Мужество – умение сдерживать себя."}, {"id": 475, "inh": "Денал – тешамег1а вола доттаг1а.", "rus": "Мужество – вернейший друг."}, {"id": 476, "inh": "Деналои майролои къанахчун сий доаккх.", "rus": "Мужество и храбрость возвышают честь мужчины."}, {"id": 477, "inh": "Деннар къег1а хиннавац, дийхар в1аьхег1а хиннавац.", "rus": "Отдающий не обеднел, просящий не разбогател."}, {"id": 478, "inh": "Денача диканна хам беш хила, денача вонна сатохаш хила.", "rus": "Пришло добро – цени его, случилось несчастье – терпи его."}, {"id": 479, "inh": "Денача хана – нускал, эттача хана – 1у.", "rus": "На свадьбе – невеста, после свадьбы – прислуга."}, {"id": 480, "inh": "Деррига Даланна мара ха йиш яц.", "rus": "Все может знать только единый бог Дела."}, {"id": 481, "inh": "Дехар – аг1а хет, сесаг наьхаяр дикаг1а хет.", "rus": "Свой конь кажется лучше других, чужая жена кажется краше своей."}, {"id": 497, "inh": "Дийна воллашехьа веннар ва наха юкъе сий дайнар.", "rus": "Кто принародно лишился чести, тот живой мертвец."}, {"id": 498, "inh": "Дийнахьа бага а сеге, е гаргалол.", "rus": "Роднись днем или при свете факела."}, {"id": 499, "inh": "Дийлха даьлча, дог1а соцаргда; б1арг бийлха баьлча бокъалургба.", "rus": "Дождь перестанет, когда прольется; глаза высохнут, когда выплачутся."}, {"id": 500, "inh": "Дика а во а в1аший т1ехьадаьнна лел.", "rus": "И хорошее, и плохое ходят цепочкой."}, {"id": 501, "inh": "Дика а во а ц1аг1ара доаг1а.", "rus": "Все хорошее и плохое идет из дома."}, {"id": 502, "inh": "Дика болат мукх дуаш хилац, дика саг вицлуш хилац.", "rus": "Хорошая сталь не ржавеет, хороший человек не забывается."}, {"id": 503, "inh": "Дика болх ба б1ехала дохьаж довзача а аькх ухачун ц1и йовзача а.", "rus": "Хорошо знать, что змея ядовита, хорошо знать и имя доносчика."}, {"id": 504, "inh": "Дика-вонга хьо оттарга хьежжа хьога а нах оттаргба.", "rus": "Если ты будешь делить с людьми их горе и радость, они ответят тебе тем же."}, {"id": 505, "inh": "Дика вонца хувцалу, во диканца хувцалу.", "rus": "Хорошее сменяется злом, зло – добром."}, {"id": 506, "inh": "Дика во1 – хьалъетта г1ала, во во1 – качбенна бала.", "rus": "Хороший сын – воздвигнутая башня, плохой сын – камень на шее."}, {"id": 507, "inh": "Дика дагалацар а маьл ба.", "rus": "Иметь хорошие помыслы – уже благо."}, {"id": 508, "inh": "Дика даьчоа – дика де, техачоа – тоха, 1еттачоа – 1отта.", "rus": "На добро ответь добром, на удар – ударом, а ткнули (кинжалом), ткни в ответ."}, {"id": 509, "inh": "Дика даьчоа – дика шийна; во даьчоа – во шийна.", "rus": "Сделал добро – для себя, сделал зло – тоже для себя."}, {"id": 510, "inh": "Дика дин йорг1ах бовз, эзди саг г1улакхах вовз.", "rus": "Хороший конь узнается по иноходи, благородный человек – по делам."}, {"id": 511, "inh": "Дика доттаг1а воча вешел тол.", "rus": "Хороший друг лучше плохого брата."}, {"id": 512, "inh": "Дика ди д1аберзабаьча бода, дика сесаг мара аьннача йода.", "rus": "Хороший конь слушается всадника, хорошая жена слушается мужа."}, {"id": 513, "inh": "Дика йо1 юртара араялийтац.", "rus": "Хорошую девушку в родном селе замуж берут."}, {"id": 514, "inh": "Дика къонахий хила г1ийртараш нохара т1аьнаш бе доахкадаьчар д1абийхкаб.", "rus": "Кичащихся мужчин одолели и связали простые пахари."}, {"id": 515, "inh": "Дика лоалахо – тешам, во лоалахо – эшам.", "rus": "Хороший сосед – прибыток, плохой – убыток."}, {"id": 516, "inh": "Дика малав, аьлча, сона дикавар – дика ва, яхад.", "rus": "Спросили: “Кто хороший?” Ответили: “Тот, кто мне хорошее делает”."}, {"id": 517, "inh": "Дика сесаг – боахам, во сесаг – бохам.", "rus": "Хорошая жена – богатсво, плохая жена – разорение."}, {"id": 518, "inh": "Дика сесаг – дунен чу ялсамале я; во сесаг – дунен чу жожаг1ате я.", "rus": "Хорошая жена – рай на земле; плохая – ад на земле."}, {"id": 519, "inh": "Дика т1ехье кхеяьчун 1оажал мерза хиннай.", "rus": "Спокойно (с чувством исполненного долга) умирает тот, кто вырастил хорошее потомство."}, {"id": 520, "inh": "Дика хилар – саг хилар.", "rus": "Хорошим быть – человеком быть."}, {"id": 521, "inh": "Дика хьаким – мохк, во хьаким – дохк.", "rus": "Хорошее руководство – цветущая страна, плохое руководство – туманный мрак."}, {"id": 522, "inh": "Дика яьккха нийсахо – лар т1а ена юхь1аьржо.", "rus": "Позор смывается полной победой справедливости."}, {"id": 523, "inh": "Дика 1унал даьча 1аждакха т1а а 1ажа латаш хул.", "rus": "И на березе вырастет яблоко, если за ней хорошо ухаживать."}, {"id": 524, "inh": "Дикадар дечо ше къонах хиларах ду, водар дечо ше эсала йовсар хиларх ду.", "rus": "Творящий добро творит его потому, что он мужчина, а творящий зло творит его потому, что он ничтожество."}, {"id": 525, "inh": "Дикан т1а д1авехе, хьай йиш еце, ца вахача а х1ама дац; вон т1а хьо вехе, хьай йиш е никъ юхавог1аш накъабаьннаб.", "rus": "Если ты ехал по дороге и заодно чинил ее, дорога эта сгодится тебе на обратном пути."}, {"id": 659, "inh": "Д1адахарга хьежжа мара хьат1а а даг1ац.", "rus": "Сколько приобретешь зависит от того, сколько отдашь."}, {"id": 660, "inh": "Д1адаьннар кердадаьккха дувцарах бала совбалар мара х1ама дац.", "rus": "Ворошить прошлое – вновь горе мыкать."}, {"id": 661, "inh": "Д1адилар накъадаьннад, дехкар дайнад.", "rus": "Отложил – пригодилось, продал – пропало."}, {"id": 662, "inh": "Д1адилари къайладихьари хьай да хьа.", "rus": "Припасенное и припрятанное – твое."}, {"id": 663, "inh": "Д1адийнар т1едаланза дисадац.", "rus": "Посаженное в землю обязательно взойдет."}, {"id": 664, "inh": "Д1аийначунца хьаийнаб.", "rus": "Сближаются с тем, кто сам идет на сближение."}, {"id": 665, "inh": "Д1айхача аьхки ца менна шовда сенна деза? Ше кхийнача хана ца биаь безам хьанна беза?", "rus": "Кому нужен источник, из которого не пьют в жаркий день? Кому нужна любовь, которую не познают в расцвете молодости?"}, {"id": 666, "inh": "Д1атекхаечоа мара т1ехьайодац ворда.", "rus": "Арба катится только за тем, кто ее тянет."}, {"id": 667, "inh": "“Д1атоха!” аьнначун бат я хьалхаг1а йохо езар.", "rus": "Сначала нужно набить морду тому, кто первым сказал: “Бей!”"}, {"id": 668, "inh": "Д1атоха вахар хьакхийтта венав.", "rus": "Пошедший бить вернулся битым."}, {"id": 669, "inh": "Д1атохалехьа ха деза юхатохоргйолга.", "rus": "Прежде чем ударить, вспомни, что можешь получить сдачи."}, {"id": 670, "inh": "Д1аяьнна гаргало а дагайох, бочача метте хий дахача.", "rus": "Когда придет несчастье, тогда вспоминается и забытое родство."}, {"id": 671, "inh": "Д1аьхача хабарал худар тол. Д1аьхача хабарал лоаца муш (охк) тол.", "rus": "Лучше есть кашу, чем вести длинные пустые разговоры. Короткая веревка (шнур) лучше пустой болтовни."}, {"id": 672, "inh": "Е гаргара саг а хургвац хьа, е доттаг1а а хургвац хьа, цар г1алаташ лехаш хьо хуле.", "rus": "У тебя не будет ни родственников, ни друзей, если ты будешь выискивать их недостатки."}, {"id": 673, "inh": "Е къавелча е цамогаш хилча мара дагайохац 1оажал.", "rus": "О смерти вспоминают или при болезни, или в старости."}, {"id": 674, "inh": "Е хьа дикага сатувсаш, е хьа вонах кхераш хилча мара, наха ларх1ац хьо.", "rus": "Люди уважают тебя, если только ждут от тебя чего-то хорошего или боятся твоего зла."}, {"id": 675, "inh": "Езачунна эрий ара а воахалу.", "rus": "С любимой и в дикой степи проживешь."}, {"id": 676, "inh": "Езаш вале – хьожаш хила.", "rus": "Любишь – присмотрись (внимательно)."}, {"id": 677, "inh": "Езаш хилча, астаг1а яле а йоалаю, б1аг1ара яле а йоалаю.", "rus": "Хоть хромоножка, хоть косоглазка…, если полюбится, замуж возьмут."}, {"id": 678, "inh": "Еккъа лоаттайича, пхьег1а а ятт1.", "rus": "Без употребления и посуда трескается."}, {"id": 679, "inh": "Екхан йолча хана йоачанга хьеж; йоачан хилча, екханга сатувс.", "rus": "В засушливое время дождя ждут, а в дождливое – о солнце мечтают."}, {"id": 680, "inh": "Екхан эттача, малхо воагаву; оапаш бийцича, эхьо воагаву.", "rus": "Если погода жаркая, солнце печет; если соврешь, совесть мучает."}, {"id": 681, "inh": "Елхача сесагах ма теша.", "rus": "Не верь плачущей жене."}, {"id": 682, "inh": "Енна вир уллача къайгаш гуллу.", "rus": "К трупу ишака вороны слетаются."}, {"id": 683, "inh": "“Ер де сона хац”, оалараш нийсалу, “дуаш-молаш вац со” оалараш нийсалац.", "rus": "Есть говорящие – “это не умею делать”, но нет говорящих – “я не пью и не ем”."}, {"id": 684, "inh": "Ер деррига дуне дизза уллача лайх бий бизал мара боаца дом бала мегаргбацар.", "rus": "За весь снег, что на этом свете, нельза отдать и горсти пыли."}, {"id": 685, "inh": "Ет бахкаш истара юкъ лезаяц.", "rus": "Когда корова телится, у быка спина не болит."}, {"id": 686, "inh": "Ет бахкалца 1е а 1ийна, пкъи ца юаш вахар санна.", "rus": "Как тот, кто дождался отела и ушел, не попив молозива."}, {"id": 687, "inh": "Ет шамара дикаг1бар харжа, сесаг оамала дикаг1ъяр харжа.", "rus": "Корову ищи с хорошим выменем, а жену с хорошим характером."}, {"id": 688, "inh": "Еттарах вирах говра хиннаяц, еттарах 1овдалла саг хьаькъала чу венавац.", "rus": "Как ни лупи ишака, конем он не станет; сколь ни бей дурака, он умнее не будет."}, {"id": 689, "inh": "Етташ лелабу ды х1аманна пайданна бац.", "rus": "Конь, привыкший к плетке, уже не конь."}, {"id": 690, "inh": "Жа 1ул са дале, жа согахьа хьаллахка.", "rus": "Если я хозяин овечьего стада, то и овец гоните ко мне."}, {"id": 691, "inh": "Жаг1ий т1а бахь хьекахарах пайда бац, дукха лувш хиларах пайда бац.", "rus": "Нет пользы от вождения лопатой по гравию, как нет ума от длинной болтовни."}, {"id": 692, "inh": "Жена мотт латтача гонахьа бертий хьувз.", "rus": "Волки рыщут там, где стоит овечий загон."}, {"id": 693, "inh": "Жена хьалха а, кхыметтел, бодж лелаш хул.", "rus": "Даже в овечьем стаде есть вожак-козел."}, {"id": 694, "inh": "Жена юкъе ийккъача берзо устаг1а дика-во къестабац.", "rus": "Нагрянув в овчарню, волку некогда разбираться в овцах."}, {"id": 695, "inh": "Жена юкъе лийнар 1овдала хул, наха юкъе лийнар хьаькъал долаш хул.", "rus": "Кто живет среди овец – глупеет, а кто среди людей – умнеет."}, {"id": 696, "inh": "Жена 1унал де бордз ма оттийла.", "rus": "Упаси нас дать овцам волка в пастухи."}, {"id": 697, "inh": "Жерал доалла ма1абараш д1алаьрх1ача кхалнах дукхаг1а ба.", "rus": "Если посчитать и женоподобных мужчин, то женщин больше."}, {"id": 698, "inh": "Жерочоа г1анахьа ши мар гу: венна д1аваьннари т1ахургвари.", "rus": "Вдовушка во сне видит двух мужей: умершего и будущего."}, {"id": 699, "inh": "Жерочох йоахараш ийшадац.", "rus": "О вдове сплетен всегда с избытком."}, {"id": 700, "inh": "Жерочун во1 лерах вовзаргва.", "rus": "Сына вдовы узнают по болтливости."}, {"id": 701, "inh": "Ж1але к1аза массанена хьесталу, кхийча, даьне хьесталу.", "rus": "Щенок ко всем ластится, а вырастет – только к хозяину."}, {"id": 702, "inh": "Ж1алена а дукхаг1а веза шийна деш доттар.", "rus": "Даже собака больше любит того, кто ей похлебку наливает."}, {"id": 703, "inh": "Ж1али а соц ше кхоабача.", "rus": "Даже собака остается служить там, где ее кормят."}, {"id": 704, "inh": "Ж1али а гаьна да аьнна ма хета, йоагаш йола ц1и а гаьна я аьнна ма хета.", "rus": "Не полагайся на то, что собака и огонь далего от тебя."}, {"id": 705, "inh": "Заг1а д1аденначоа дукха хет, д1аийцачоа к1езига хет.", "rus": "Подающему на похоронах кажется, что много дал, а получившему – что мало получил."}, {"id": 706, "inh": "Заг1ашка яьнна гаргало яц, дарбашка даьнна дег1 а дег1 дац.", "rus": "Родство, держащееся на деньгах, - не родство; тело, держащееся на лекарствах, - не тело."}, {"id": 707, "inh": "Зама хувцаяларга хьежжа цунца тайнар котваьннав.", "rus": "Кто поспевает за изменениями в жизни, тот выигрывает."}, {"id": 708, "inh": "Зе меттаотт, хинна баьнна эхь-бехк оттац.", "rus": "Убыток (материальный) можно возместить, утерянную же честь (совесть) никогда не возродить."}, {"id": 709, "inh": "Зийча – гу, лийхача – коро.", "rus": "Наблюдай – увидишь, ищи – найдешь."}, {"id": 710, "inh": "Зоахалол лувцарах баркал хиннадац.", "rus": "Неблагодарное занятие – заниматься сватовством."}, {"id": 711, "inh": "Зовза вир лома ц1оках къаьхкад.", "rus": "Трусливый ишак испугался львиной шкуры."}, {"id": 712, "inh": "Зовза къонах сесага майра хул.", "rus": "Трусливый мужчина перед женою храбрится."}, {"id": 713, "inh": "Зовза саг ж1алена а дика вовз.", "rus": "Трусливого собака сразу признает."}, {"id": 714, "inh": "Зовзал совъяьлча, къизал котйоал; денал котдаьлча, сабар совдоал.", "rus": "Где много трусости, там много жестокости; где много мужества, там больше спокойствия (достоинства)."}, {"id": 715, "inh": "Зовзачун кий наха йихьай.", "rus": "Папаху срывают (и уносят) только с трусливого."}, {"id": 716, "inh": "Зудала ваьнна воккха саг а, сов ц1имхара лела з1амига саг а – шаккхе а чамаза ва.", "rus": "Неприятны кокетливый старик и старчески серьезный юноша."}, {"id": 717, "inh": "Зудала ваьннача сага керта т1а шайт1а хов.", "rus": "На голову похотливого шайтан садится."}, {"id": 718, "inh": "Зудал дика деце а, цхьа бахьан зудал доаллаш хила еза кхалсаг.", "rus": "Кокетничать нехорошо, но все же женщина должна быть чуть-чуть кокетливой."}, {"id": 719, "inh": "Зудал доалла ийрча йо1 сихаг1а маьре йигай.", "rus": "Кокетливая дурнушка ранее других замуж выскакивает."}, {"id": 720, "inh": "Зудал доаллар даь-ц1аг1а дукха яьг1аяц.", "rus": "Кокетка в девках не засиживается."}, {"id": 721, "inh": "Зудал яьнна лелачо нахах “зовдамаш” яхад.", "rus": "Потаскуха всех женщин называла “потаскухами” (блудницами)."}, {"id": 722, "inh": "Зунгата б1аргаш, б1ехала когаш, молла денна саг1а дайна саг вац.", "rus": "Никто не видел глаз муравья, ног змеи и подаяния муллы."}, {"id": 723, "inh": "Зуд-саг шин б1аргах вовзаргва.", "rus": "По глазам узнается похотливый человек."}, {"id": 724, "inh": "З1амаг1чун низ дукхаг1а бале а хьаькъал к1езигаг1а да, воккхаг1чун низ к1езигаг1а бале а хьаькъал дукхаг1а да.", "rus": "У молодого сил больше, да ума меньше; у старшего сил поменьше, но ума куда больше."}, {"id": 725, "inh": "З1амигача к1аьдигача метто болата тур къардаьд.", "rus": "Маленький, мягкий язык победил булатную саблю."}, {"id": 726, "inh": "З1амигача сийго юрт йоагаяьй.", "rus": "Маленькая искорка все село спалила."}, {"id": 727, "inh": "Ийрчача дешо дега чов ю, хозача дешо дега тоам бу.", "rus": "Скверное (некрасивое) слово сердце ранит, хорошее (доброе) слово сердце радует."}, {"id": 728, "inh": "Ижонна араяьнна бордз кхераме я.", "rus": "Страшен волк, вышедший на охоту."}, {"id": 729, "inh": "“Из д1ара уст буаргбар аз, - яхад циско, - цун му1аш къамарга оттарах со ца кхераре”.", "rus": "“Я бы съела во-он того быка, - сказала кошка, - да боюсь его рогами подавиться”."}, {"id": 730, "inh": "Иккаш хулчех яьшаяц.", "rus": "Сапоги презирают чувяки."}, {"id": 731, "inh": "Икко къаръяьй нахьара маьчи.", "rus": "Сапог обошел чувяк."}, {"id": 732, "inh": "Илли аьлча мара гота йолаеннаяц.", "rus": "Пахота начинается с песни."}, {"id": 733, "inh": "Ира з1ок долча кхалсаго аьннар базар т1а д1адахьа дезац.", "rus": "Сказанное злоязычной женщиной все равно, что оглашенное на базаре."}, {"id": 734, "inh": "Ираз а доакъазал а цхьатарра ахчах доал.", "rus": "С деньгами связаны как счастье, так и несчастье."}, {"id": 735, "inh": "Ираз а хул мекъа, - хьинар долчоа т1ехьа ада к1ордадий, мекъачох хьарчаш.", "rus": "И счастье бывает ленивым: устанет бегать за дельным человеком и прилепится к лентяю."}, {"id": 736, "inh": "Ираз-беркат хургдац нахаца ийна воацачун.", "rus": "Не будет жить счастливо и благополучно тот, кто сторонится людей."}, {"id": 737, "inh": "Ирази хьаькъали в1аши дика тов.", "rus": "Дружно уживаются счастье и ум."}, {"id": 738, "inh": "Истара букъ т1а хайнача къайга техар истара кхийттай.", "rus": "Бросили камень в ворону, севшую на быка, а попали в самого быка."}, {"id": 739, "inh": "Истара дег1 а долаш, пхьагала дог а долаш хул цхьабараш.", "rus": "Есть такие: тело бычье, а душа заячья."}, {"id": 740, "inh": "Истара му1а т1а баьг1ача мозо яьхад: “Готара боаг1а со”.", "rus": "Сидя на роге возвращающегося с пахоты быка, муха гордилась: “Я еду с пахоты!”"}, {"id": 741, "inh": "Истара фоарт санна ч1оаг1а я эхь доацача сага бат.", "rus": "Лицо бессовестного человека каменно, как шея быка."}, {"id": 742, "inh": "Исташа вежарий барт а бу, барт боха а бу.", "rus": "Жены и ссорят братьев, и мирят их."}, {"id": 743, "inh": "Истий метташ – йоккхий топаш.", "rus": "Женские языки, что пушки."}, {"id": 744, "inh": "Итт сага дикадар де: хьо к1алвисача, царех ца1 мукъа короргва хьона.", "rus": "Сделай десятерым добро: в трудный час хотя бы один из них придет тебе на помощь."}, {"id": 745, "inh": "Иттанена 1а дикадар дича, царех ийссане хьона юха во дарах, дикадар дергдола ца1 коравоаг1аргва хьона из ийссе во д1адоаккхаш.", "rus": "Сделай добро десятерым. Если в ответ девять из них сделают тебе зло и лишь один – добро, это одно добро одолеет те девять зол."}, {"id": 746, "inh": "Йиаь вахар яанза вахачул теннав.", "rus": "Кто поел и пошел в путь, тот обошел того, кто вышел в путь натощак."}, {"id": 747, "inh": "Йийначо йиай пхьагал.", "rus": "Зайца ест тот, кто его убьет."}, {"id": 748, "inh": "Йиза кит сонта ювл. Йиза газа берзах летай.", "rus": "Сытый живот (толстое пузо) становится чванливым. Сытая коза волка бодает."}, {"id": 749, "inh": "Йис кхийтта ябакх мерза хул.", "rus": "Тронутая инеем тыква бывает слаще."}, {"id": 750, "inh": "Йист ца хилар тол хьона, хьай дош оттаргдоацача.", "rus": "Лучше промолчи там, где твое слово не будет весомым."}, {"id": 751, "inh": "Йисте лийначоа йис кхийттай.", "rus": "Того, кто ходит с краю, иней накрыл."}, {"id": 752, "inh": "“Йича, хиннай дарш”, - аьннад дас, г1адж техха газа му1аш д1аяхийта.", "rus": "“Если пожелать, и козу можно сделать безрогой”, - сказал хозяин и палкою сшиб рога козы."}, {"id": 753, "inh": "Йиша ялар – кор дохар, воша валар – пен саг1ун чубахар, да валар – тхов т1акхетар, нана ялар – ц1а бухдалар.", "rus": "Умерла сестра – окна нет; умер брат – рухнула стена дома; умер отец – крыша обрушилась; умерла мать – рухнул весь дом."}, {"id": 754, "inh": "Йиший дог вешийца, веший дог хьунаг1а.", "rus": "Сестра сердцем жалостлива к брату, а сердце брата тянется в лес."}, {"id": 755, "inh": "Йоархш лакх яр аьнна, баа сом хилац: модж й1аьха яр аьнна, хьаькъал совнаг1а хилац.", "rus": "Сорняк вырастает высоким, да плодов на нем не бывает; борода отрастает длинной, да ума она не прибавляет."}, {"id": 756, "inh": "Йоахарех мотт лорабе, къоалах кулг лораде.", "rus": "Береги язык от сплетен, а руки от воровства."}, {"id": 757, "inh": "Йоацачунгара яьккха веннар шийчох ваьннав.", "rus": "Пытаясь отнять у неимущего, потеряешь, что сам имеешь."}, {"id": 758, "inh": "Йоачан а дика я йокъала т1ехьа йоаг1аш, екхан а дика я йоачана т1ехьайоаг1аш.", "rus": "Дождливая погода хороша, когда идет вслед за засухой; солнечная погода хороша, когда она идет вслед за дождливой."}, {"id": 759, "inh": "Йоачан а екхан а боарамаг1а дика я.", "rus": "И солнце, и дождь – все хорошо в меру."}, {"id": 760, "inh": "Йоачана т1ехьа екхан йоаг1аш санна баланна т1ехьа ираз а доаг1а.", "rus": "Как после непогоды устанавливается ясный день, так и за горем следует счастье."}, {"id": 761, "inh": "Йовсара т1ехьа кхерий детт.", "rus": "В бродячую собаку камни швыряют."}, {"id": 762, "inh": "Йоккха г1ала а цхьацца кхера булаш мара еттаяц.", "rus": "И большую башню складывают по камню."}, {"id": 763, "inh": "Йоккхача майдана барт бохабе тоъаргва мотт бетташ вола цхьа саг.", "rus": "В большой сельский сход может внести разлад один сплетник."}, {"id": 764, "inh": "Йоккхача шахьара хезад дег чура доаг1а дош.", "rus": "От души сказанное услышал весь город."}, {"id": 765, "inh": "Йолаенна хьайра сецаяц, болабенна болх а сецабац.", "rus": "Как не останавливают завертевшуюся мельницу, так не прерывают и начатую работу."}, {"id": 766, "inh": "Йохкаенна г1ишло тоае хьашт дац.", "rus": "Нет проку ремонтировать прогнившее строение."}, {"id": 767, "inh": "Йо1 мел йолча наьна йо1 дика хул, нус мел йолча маьрнаьна нус во хул.", "rus": "У всех матерей дочери хорошие, у всех свекровей снохи плохие."}, {"id": 768, "inh": "Йо1а г1анахьа аьла гу, сомаг1а топпар хьув.", "rus": "Во сне девушка князя видит, а днем глину месит (шутка)."}, {"id": 769, "inh": "Йо1 йоалае, цун наьнага а хьеже; ц1аг1ара маьре йо1 яхийта хургволча маьр-даьга а хьеже.", "rus": "Сватайте девушку, у которой мать хорошая; выдавайте дочь за того, у кого отец хороший."}, {"id": 770, "inh": "Йо1 маьре йохийташ бийна наьна букъ во1а саг йоалаеш хьалнийсабеннаб.", "rus": "Спина, которая согнулась у матери после выдачи дочери замуж, выпрямилась, когда сын женился."}, {"id": 771, "inh": "Йо1а цу лаха, во1а фу лаха.", "rus": "Дочери ищи сытное место (замужем), сыну ищи невесту из хорошего рода."}, {"id": 772, "inh": "Йо1 яьчо во1 а ву.", "rus": "Родившая дочь родит и сына."}, {"id": 773, "inh": "Й1овхалах модж мустаялар тов шелалах п1елг бохьабечул.", "rus": "Пусть (лучше) от жары борода повылезет, чем от холода палец отморозить."}, {"id": 774, "inh": "Ка ца йоала т1ом беций барт ийг1а дезал.", "rus": "Семья без согласия, что поражение в бою."}, {"id": 775, "inh": "Ка яьлча кура а ма вала, ка ехача сагота а ма хила.", "rus": "Повезет – не возгордись, не повезет – не переживай."}, {"id": 776, "inh": "Камаьрша д1аденначо эшаденна к1оаг а баьккхабац, сутара ваьнна чу дитачунна совдаьнна бог а яьккхаяц.", "rus": "У щедрого отдающего не убыло, у скупого от сбереженного не прибыло."}, {"id": 777, "inh": "Кара фуъ мо боча леладе деза эхь-эздел.", "rus": "Честь и благородство надо оберегать, словно яйцо в руке."}, {"id": 778, "inh": "Карт ехача, ков дох.", "rus": "Свалился забор – пропал двор."}, {"id": 779, "inh": "Карт какъелча, кердаяр хьалъю; сий дайна сан х1алакву.", "rus": "Сломался забор – можно новый поставить; потерявший честь – уничтожен."}, {"id": 780, "inh": "Картах букъа хьекхаш латтачул (х1ама ца деш латтачул) халхаваьлча тол.", "rus": "Уж лучше хотя бы станцевать, чем стоять без дела, подперев плетень."}, {"id": 781, "inh": "Каяннача истаро бордз эшаяьй.", "rus": "Удачливый бык волка одолел."}, {"id": 782, "inh": "Кепиг кепига т1а дуллаш, 1оаду рузкъа.", "rus": "Богатство создают, складывая копейку к копейке."}, {"id": 783, "inh": "Кера б1ена чу къайг тайнаяц, къайга б1ена чу кер а тайнадац.", "rus": "Гнездо сокола не для вороны, воронье гнездо не для сокола."}, {"id": 784, "inh": "Керда (дика) кий тиллачоа деррига адам шийга хьежаш санна хет.", "rus": "Надевшему новую (хорошую) папаху кажется, что все на него и смотрят."}, {"id": 785, "inh": "Керда коч ийца йо1 хи т1а кадайг1а ух.", "rus": "Когда девушке купили новое платье, она стала чаще ходить по воду."}, {"id": 786, "inh": "Керо ше хьош, - “Маьре юг со!” – яхаш ц1ог1а дийттад 1овдалча моашас.", "rus": "Коршун нес в когтях куропатку, а она кричала: “Я за него замуж выхожу!”"}, {"id": 787, "inh": "Кертага хаьтте мара ма де дего яхар; дегага ладийг1е мара ма де керто яхар а.", "rus": "Не делай того, что подсказывает сердце, не посоветовавшись с головой; и не делай того, что подсказывает голова, не посоветовавшись с сердцем."}, {"id": 788, "inh": "Керто болх ца бича, когаша никъ кхихьаб.", "rus": "Если голова не работает, ногам работы прибавляется."}, {"id": 789, "inh": "Кий, икк дика хилийта: доттаг1а хьа кертага хьежандаь моастаг1а когашка хьежандаь.", "rus": "Носи хорошие шапку и сапоги, ибо друг осматривает тебя с головы, а враг – с ног."}, {"id": 790, "inh": "Киса даьсса хилча, дуар дуне дац.", "rus": "И жизнь не в жизнь, когда карман пуст."}, {"id": 791, "inh": "Киса диза долчун корта а хьаькъалах бизи хет.", "rus": "Тот, у кого карман полон денег, кажется людям и умным."}, {"id": 792, "inh": "Киса доккхаг1а долаш вар дукхаг1а веза.", "rus": "Толстосума больше любят."}, {"id": 793, "inh": "Кит юзае атта да, б1арг бузабе хала да.", "rus": "Легко наполнить живот, трудно насытить глаза."}, {"id": 794, "inh": "Китай мехка вахий а хьаькъал хьаэца.", "rus": "Хоть в Китай поезжай, но ума прибавляй."}, {"id": 795, "inh": "Китаца эйхьаза ма вала.", "rus": "Не потакай своему желудку."}, {"id": 796, "inh": "Киса чу доаллар д1аг1оргда, керта чу доаллар дусаргда.", "rus": "То, что в кармане, - уйдет, а то, что в голове, - останется."}, {"id": 797, "inh": "Кица доаладича, харцдар а т1ехьа бакъ хет.", "rus": "Если произнести “кицу” (пословицу…), то даже ложь за правду сходит."}, {"id": 798, "inh": "Кицо дош дохаду, кицо дош тоаду.", "rus": "“Кица” (пословица…) может разрушить сказанное, “кица” может закрепить сказанное."}, {"id": 799, "inh": "Коа (беша) йоарх1аш яьннар хьунаг1а эстеш лехьаш лийнав.", "rus": "У кого сад зарос сорняком, тот в лесу кизил собирал."}, {"id": 800, "inh": "Коана йизза бала ийца, даьц1а яхаяр со, морх1 бизза бала бахьаш маьрц1а йийрзар со.", "rus": "Пошла я навестить родителей, имея с горсточку горя, вернулась оттуда с целой охапкой."}, {"id": 801, "inh": "Когах даха к1арцхал д1адоаккхалургда, меттах доаллар доаккхалургдац.", "rus": "Занозу из ноги можно вытащить, а занозу из языка – невозможно."}, {"id": 802, "inh": "Когаш кхола даьхкачун кулгаш даьттала даьхкад.", "rus": "У кого обувь бывает в навозе, у того руки бывают в масле."}, {"id": 803, "inh": "Когаша наьна шамарах гаьна воаккх.", "rus": "Ноги далеко уводят человека от материнской груди."}, {"id": 804, "inh": "Кома жий тов, майрача к1анта хоза йо1 тов.", "rus": "Кочкару (барану) пристала хорошая овца, храброму молодцу – красавица."}, {"id": 805, "inh": "Комаца дов даьккха а хьай денал гойта.", "rus": "Покажи свое мужество, хотя бы пободавшись с бараном."}, {"id": 806, "inh": "Корта боккха хилар пайда бац, из баьсса хуле.", "rus": "Нет толку от большой головы, если она пустая."}, {"id": 807, "inh": "Корта боккха-м истара а гамажа а хул.", "rus": "Голова-то большою бывает и у быка, и у буйвола."}, {"id": 808, "inh": "Котам а хинна вахачул борг1ал а хинна велча тол.", "rus": "Чем жить курицею, лучше умереть петухом."}, {"id": 809, "inh": "Котамо а доккхал ду ше фуъ дича.", "rus": "Даже курочка гордится, когда яичко снесет."}, {"id": 810, "inh": "Коч кетарал дег1а кхоаччараг1а я.", "rus": "Рубашка ближе к телу, чем шуба."}, {"id": 811, "inh": "Кочъярг хуларе, качъерг-м йолаш яр.", "rus": "Лишь бы было, из чего сшить рубаху, а из чего сделать воротник, у нас найдется."}, {"id": 812, "inh": "Кулгах шонкаш йоахкачун меттах шонкаш яьхкац.", "rus": "У кого руки в мозолях, у того язык без мозолей."}, {"id": 813, "inh": "Кулгашца мух соцалургбац.", "rus": "Руками ветер не остановишь."}, {"id": 814, "inh": "Кура хила, сонта ма хила.", "rus": "Будь гордым, но не будь кичливым."}, {"id": 815, "inh": "Курачох оал: “Пехк йолча а дог доал цун”.", "rus": "Про гордеца говорят: “И там, где легкие, у него тоже сердце”."}, {"id": 816, "inh": "Кха д1аьха – дика, мотт лоаца – дика.", "rus": "Хорошо, когда пашня длинная (большая); хорошо, когда язык короткий."}, {"id": 817, "inh": "Кхаанга хьежжа хул судахочун кхел.", "rus": "Решение судьи зависит от взятки."}, {"id": 818, "inh": "Кхаанга 1омадаь бежан т1ехьара д1адалац.", "rus": "Приученная к лакомствам скотина не отстает от хозяина."}, {"id": 819, "inh": "Кхай т1а хьай корта лелабар дикаг1а да хьона говра корта оллачул.", "rus": "Лучше свою голову держи в поле, чем у поля вешать лошадиный череп от сглаза."}, {"id": 820, "inh": "Кхай т1ара болх – сагагара, дог1а дайтар – Даллагара.", "rus": "Труд на поле – от человека, дождь с неба – от бога Дялы."}, {"id": 821, "inh": "Кхайканза бена пхьу доттанза бахаб.", "rus": "Незванного пса отправили голодным."}, {"id": 822, "inh": "Кхалаж баьккха бале а б1ехале ший мохк дикаг1а хийттаб.", "rus": "И змее милее свой край, даже если это мусорная куча."}, {"id": 823, "inh": "Кхали ма1еи, шин сага, рузкъа в1аший хьожадар духьа, йоах, Далла, сов дукха лелаш, ийс аьшка маьчи йохаяьй.", "rus": "Говорят, чтобы соединить судьбу мужчины и женщины, богу Дяле пришлось износить девять железных чувяк."}, {"id": 824, "inh": "Кхалсаг хозача хабаро 1ехаю.", "rus": "Красивые речи женщину обманывают."}, {"id": 825, "inh": "Кхалсага бахьан хьахинна дов ийс ма1ача сагага кхаьчад.", "rus": "Из-за одной женщины вражда постигает девятерых мужчин."}, {"id": 826, "inh": "Кхачанза баьккха сом миста хиннаб.", "rus": "Плод, сорванный раньше срока, бывает кислым."}, {"id": 827, "inh": "Кхаь кхерах т1ехадаьнна хий ц1ена хул.", "rus": "Если вода перекатилась через три камня, значит, она очистилась."}, {"id": 828, "inh": "Кхаь шера цкъа моцал отташ а хул, ворх1 шера цкъа у доаг1аш а хул.", "rus": "Бывает, раз в три года приходит голод, а раз в семь лет – зараза."}, {"id": 829, "inh": "Кхаьча сом баа беза, кхийна йо1 маьре яхийта еза.", "rus": "Созревшие фрукты подавай на стол; выросшую дочь выдавай замуж."}, {"id": 830, "inh": "Кхел йоацаш хиннар рузкъа доацаш хад.", "rus": "То, чего не было суждено, ушло впустую."}, {"id": 831, "inh": "Кхела т1ехьа декхар доаг1а, декхарийна т1ехьа харцо йоаг1а, харцонна т1ехьа даькъазало йоаг1а.", "rus": "Решение суда (местного, медиаторского) влечет за собою долг, долг влечет кривду, кривда влечет позор."}, {"id": 832, "inh": "Кхелага даьнна дош – ловзадаьнна пилхьа.", "rus": "Дело, переданное в суд (местный), - шут, пляшущий на канате."}, {"id": 833, "inh": "Кхело байнаб аьнна б1арг са гуш хинаб.", "rus": "Глаз, местным судом объявленный незрячим, оказался видящим."}, {"id": 834, "inh": "Кхеравелча хургдар кхера ца велча а хургда.", "rus": "Бойся не бойся, а что должно случится, все равно случится."}, {"id": 835, "inh": "Кхерий т1а баг1ача наьха дегаш 1аьржа хул.", "rus": "У людей, живущих на камнях, сердца бывают завистливыми."}, {"id": 836, "inh": "Кхехкача хиво а ший “бур-бур” ду.", "rus": "Даже кипящая вода о чем-то бормочет."}, {"id": 837, "inh": "Кхийна дезал фусам-наьнага боале, фусам-да ц1аг1ара ваха мара везац.", "rus": "Если мать будет в союзе с выросшими детьми, отцу остается только дом покинуть."}, {"id": 838, "inh": "Кхийрар ваьгавац.", "rus": "Осторожный не обжегся."}, {"id": 839, "inh": "Кхийрачун нана йийлахаяц, дукха елаш а хиннаяц.", "rus": "У оберегавшего себя мать не плакала, но и не смеялась много."}, {"id": 840, "inh": "Кхо во1 воаца да – во1 воаца да.", "rus": "Не имеет сына тот, у кого нет хотя бы трех сыновей."}, {"id": 841, "inh": "“Кхоана кампеташ яхьаргья, ломма б1араш дахьаргда” яхарах пайда бац, кара хьа ца кхаьчача х1аман.", "rus": "Нет пользы в том, что завтра обещают привезти конфеты, а послезавтра – орехи, пока их не будешь иметь."}, {"id": 842, "inh": "Кхоана лергвале а, тахан ваха веза.", "rus": "Даже когда знаешь, что завтра умрешь, сегодня ты должен жить."}, {"id": 843, "inh": "Кхоана хургъя яхача котамал таханар цхьа фуъ тол.", "rus": "Лучше одно яичко сегодня, чем курица, обещанная на завтра."}, {"id": 844, "inh": "Кхоанара ди дага кхоабаш вола саг тахан к1алвусаргвац.", "rus": "Постоянно думающий о завтрашнем дне не пропадет сегодня."}, {"id": 845, "inh": "Кх ют высокими и низкими."}, {"id": 858, "inh": "Кхыча ж1але багара т1ехк яьккха деннача ж1але ший багара т1ехк ежай.", "rus": "Собака, бросившаяся отнимать кость у другой (собаки), обронила свою."}, {"id": 859, "inh": "Кхыъ-кхе саг эсала хийттар г1алата воал.", "rus": "Может ошибиться тот, кто другого человека посчитает ничтожным."}, {"id": 860, "inh": "Къа т1а ца лаьцача тол, - ламаз дарах т1ерадалац из.", "rus": "Лучше не бери грех на душу – молитвами его не замолишь."}, {"id": 861, "inh": "Къа хьегаш яьккха маькх мишта яа еза хац.", "rus": "Кому достался дармовой хлеб, тот не знает, как его есть."}, {"id": 862, "inh": "Къавалар – валар, къе хилар – шозза валар.", "rus": "Постарел – считай умер, обеднел – умер дважды."}, {"id": 863, "inh": "Къавенна тишвеннача сага кхо ког эш.", "rus": "Старому и немощному нужны три ноги (посох нужен)."}, {"id": 864, "inh": "Къаденнача ломах пхьу хиннаб.", "rus": "Постаревший барс становится собакой."}, {"id": 865, "inh": "Къаеннача аьрзи пхьидашка яьннай.", "rus": "Состарившись, орел стал питаться лякушками."}, {"id": 866, "inh": "Къайг т1аеча, к1ала яьг1ар г1от.", "rus": "Даже ворона привстает, когда другая подлетает."}, {"id": 867, "inh": "Къайга б1ы ц1аккха ц1ена хиннабац.", "rus": "Гнездо вороны чистым никогда не бывает."}, {"id": 868, "inh": "Къайгаца доттаг1ал даьр дохкаденнача ж1алена т1а вигав.", "rus": "Подружился с вороной и очутился у дохлой собаки."}, {"id": 869, "inh": "Къайгаца доттаг1ал тесса кер “варкъ” яза даьннад.", "rus": "Коршун, побратавшийся с вороною, стал каркать."}, {"id": 870, "inh": "Къайгашта топаш етташ хилац, кара г1адж (кхера) хилча.", "rus": "По воронам не стреляют, когда в руках имеется палка (камень)."}, {"id": 871, "inh": "Къайгашта юкъе кер тац.", "rus": "Не пристало коршуну быть в стае ворон."}, {"id": 872, "inh": "Къайго а хьалхаг1а б1ы бий мара таьлми даккхац.", "rus": "Даже ворона сначала гнездо строит и лишь затем воронят выводит."}, {"id": 873, "inh": "Къайлаг1а аьннар гайна-ганза дист эккх
