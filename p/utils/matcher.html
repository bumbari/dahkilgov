я, который от работы отлынивал, говоря “голова болит”, и в самом деле она"}, {"id": 139, "r": "Потому-то и зовут волка ВОЛКОМ, что он воистину волк."}, {"id": 140, "r": "Все наши умершие тоже в свое время говаривали: “Волк, волк” (т.е. страшали)."}, {"id": 141, "r": "Лишь ружье может насытить волка."}, {"id": 142, "r": "Волк только в лесу считает себя дома."}, {"id": 143, "r": "Коза, не встретившая волка, совершила паломничество (дошла до Мекки) и вернулась"}, {"id": 144, "r": "Пыжилась курица кукарекать, да и лопнула."}, {"id": 145, "r": "Продававший (корову…) хвалил, восклицая “хай”, покупавший неодобрительно говорил"}, {"id": 146, "r": "Отделившийся от общего хозяйства становится жадным."}, {"id": 147, "r": "Бывает, сам с бугая, а умом – теленок."}, {"id": 148, "r": "Пропойца ни семьи не вырастил, ни богатств не накопил."}, {"id": 149, "r": "Сиротское сердце ущемленное."}, {"id": 150, "r": "Того, что не слышал, ложась спать, услышишь, проснувшись."}, {"id": 151, "r": "Корни горели – крона радовалась."}, {"id": 152, "r": "И трава краше, когда в ней попадается цветочек."}, {"id": 153, "r": "Глаз радует красота, сердце радует доброта."}, {"id": 154, "r": "Надо знать: почему глаз и ушей по двое, а язык всего один."}, {"id": 155, "r": "Как бы глаз не был велик, а бельмо на нем все равно видно."}, {"id": 156, "r": "Что любо глазу, то до вечера; что любо сердцу, то на всю жизнь."}, {"id": 157, "r": "Любая глазу стала сердцем любима."}, {"id": 158, "r": "То, чего не видит глаз, чувствует сердце."}, {"id": 159, "r": "Увиденное вернее услышанного."}, {"id": 160, "r": "Слепой осуждал имеющего бельмо в глазу."}, {"id": 161, "r": "Глаза – доносчики сердечных тайн."}, {"id": 162, "r": "Пустое, что нравится глазу; дело, что принято сердцем."}, {"id": 163, "r": "Глаза видят то, что перед ними, ум же видит (предугадывает) последствия."}, {"id": 164, "r": "Лучше иметь многочисленную родню, чем сотню голов скота."}, {"id": 165, "r": "Весенний день зимний месяц кормит."}, {"id": 166, "r": "Сказанное весною услышали осенью. (Сказанному весной ответ был дан осенью)."}, {"id": 167, "r": "Весна истощила скот, а лето его насытило."}, {"id": 168, "r": "Сделанное весною (летом) зимою съедено."}, {"id": 169, "r": "Невестка из богатого дома бывает соней."}, {"id": 170, "r": "В грязной бороде гниды заводятся."}, {"id": 171, "r": "У змеи нутро ядовитое, у жестокого (черствого) человека нутро каменное."}, {"id": 172, "r": "Язык доносчика пропитан змеиным ядом."}, {"id": 173, "r": "Из грязного рта – противная вонь, из черного сердца – подлое слово."}, {"id": 174, "r": "Из черного сердца – черная зависть, из чистого сердца – благородное соперничеств"}, {"id": 175, "r": "Самая лучшая дружба со змеею – убить ее."}, {"id": 176, "r": "Чему не научился, когда в детских бурках ходил, тому научишься, когда сапоги над"}, {"id": 177, "r": "Задира непременно наткнется на другого задиру."}, {"id": 178, "r": "Чем больше дружина, тем меньше доля добычи каждого."}, {"id": 179, "r": "Есть ли такой мужчина, который себя князем не считает?"}, {"id": 180, "r": "Пришедший туда, куда ему не положено, унес оттуда то, чего не хотел бы иметь."}, {"id": 181, "r": "Если в этом мире не будем петь и веселиться, то кто же пел или будет петь в тесн"}, {"id": 182, "r": "Хорошее потомство продолжит начатое нами, а плохое его разрушит."}, {"id": 183, "r": "Пусть бог Дяла советует тому, кого мы любим; пусть люди советуют тому, кого мы н"}, {"id": 184, "r": "Хорош наш сосед – из камня стена нашего дома."}, {"id": 185, "r": "Наши желания могут исполниться, а могут и нет, но то, что суждено – исполнится п"}, {"id": 186, "r": "Смерти бояться – героем не стать."}, {"id": 187, "r": "Не бойся смерти (она неизбежна), а бойся бедности."}, {"id": 188, "r": "Пока жив, пусть буду чеченцем, а когда помру – ингушом (смысл: ингуш к ингушу ще"}, {"id": 189, "r": "Обреченный на смерть да не дотянет до утра (о прекращении страданий)."}, {"id": 190, "r": "Каша хорошо насыщает, но после нее скоро есть хочется."}, {"id": 191, "r": "Не ешь столько, что можешь лопнуть, а ешь досыта."}, {"id": 192, "r": "Плохой хозяин становится любезнее с гостем, покидающим его дом."}, {"id": 193, "r": "Пусть будет лучше погибший, но хороший сын, чем живой, но плохой."}, {"id": 194, "r": "Можно отдавать замуж за того, кто при жизни имеет место в башне, а после смерти "}, {"id": 195, "r": "У кровника жизнь – не жизнь, а смерть (в постоянном страхе смерти)."}, {"id": 196, "r": "Кто любит жизнь, тот любит труд (работу)."}, {"id": 197, "r": "Кто дает жизнь, тот дает и смерть."}, {"id": 198, "r": "Счастье одинаково нужно и для жизни и для смерти."}, {"id": 199, "r": "Расстояние между жизнью и смертью не толще кисеи."}, {"id": 200, "r": "Как жил, так и умрешь."}, {"id": 201, "r": "И среди братьев бывает более любимый."}, {"id": 202, "r": "Глаз радуется, когда приходит тобою почитаемый человек."}, {"id": 203, "r": "Полюбившийся красив, даже если он и косоглазый."}, {"id": 204, "r": "Кому ты люб, тот смотрит тебе в лицо, кому нет – под ноги."}, {"id": 205, "r": "Всегда найдется, что дать тому, кто тебе нравится, и найдется, что сказать (плох"}, {"id": 206, "r": "С любимым (любимой) и в дикой степи проживешь."}, {"id": 207, "r": "Горе, принимаемое без уныния, - одно горе, а принимаемое с плачем – дважды горе."}, {"id": 208, "r": "И бессовестный становится хорошим, когда умрет."}, {"id": 209, "r": "“Если умрет, то я с ним справлюсь”, - говаривал трус."}, {"id": 210, "r": "Даже умерев, не бросит своих вредных привычек тот, кто привык лезть не в свои де"}, {"id": 211, "r": "Зурна покойнику не нужна."}, {"id": 212, "r": "Если о покойнике один раз скажут “за упокой”, то о живом надо десять раз сказать"}, {"id": 213, "r": "Пьяный что корова на льду."}, {"id": 214, "r": "Не уйти от дурных поступков брата, а до его хороших – не дотянуться."}, {"id": 215, "r": "Брату нужен брат, а сестре – сестра."}, {"id": 216, "r": "Друг брата – жених (потенциальный) сестры."}, {"id": 217, "r": "Как брату нужен брат, так и соседу нужен сосед."}, {"id": 218, "r": "Брат не забудет брата (совершит кровную месть)."}, {"id": 219, "r": "Лежебоке в рот галушки не летают."}, {"id": 220, "r": "Насытившийся гость на дверь поглядывает."}, {"id": 221, "r": "Настоящий мужчина не станет женщиной, но настоящая женщина, случается, приравнив"}, {"id": 222, "r": "Сытый всех считает сытыми, голодный всех считает голодными."}, {"id": 223, "r": "То, что едят после насыщения, достается шайтану (черту)."}, {"id": 224, "r": "Лишь вдоволь поевши, можно сказать, что насытился."}, {"id": 225, "r": "Кто, насмеявшись, плакал, тот, выплакавшись, будет смеяться."}, {"id": 226, "r": "Плакать – лишь горе увеличивать."}, {"id": 227, "r": "Говорят, что опухший не жилец, но еще более ненадежен ожиревший."}, {"id": 228, "r": "Легче осла поднять на крышу, нежели дурака вразумить."}, {"id": 229, "r": "Когда орет осел, и конь замолкает."}, {"id": 230, "r": "Называют “ишаком” того, кто ездит на ишаке."}, {"id": 231, "r": "Ишаку рассказывали красивый сон, а он хвостом вертел (ветры пускал)."}, {"id": 232, "r": "Кто при переправе держался за хвост осла, утонул, а кто за хвост коня – переплыл"}, {"id": 233, "r": "Надели на ишака вьючное седло, и тогда он понял, что он поистину ишак."}, {"id": 234, "r": "Мул лучше ишака, лошадь лучше мула, верховой конь лучше лошади, если на нем хоро"}, {"id": 235, "r": "Ишачонок бывает красивым, но вырастет – ишак ишаком."}, {"id": 236, "r": "Ишак (неблагородный) завидовал коню (благородному), а конь не знает к нему завис"}, {"id": 237, "r": "От ишака – польза, от человека-ишака (неблагородного) – вред."}, {"id": 238, "r": "Из ишака не сделаешь коня, из человека с ишачьим норовом не сделаешь благородног"}, {"id": 239, "r": "Стал лев спорить с ишаком (как с ровней) и сам им стал."}, {"id": 240, "r": "Теленок, выросший с ишаком, стал кричать по-ишачьи."}, {"id": 241, "r": "Мул не станет верховым конем."}, {"id": 242, "r": "Ни ишак, ни свинья не явились к богу Дяла, когда он раздавал ум-разум (о неблаго"}, {"id": 243, "r": "Ишак хвалил ишака, приговаривая: “Уши у тебя длинные”."}, {"id": 244, "r": "Когда ишак сказал другому, что он “ишак”, тот от обиды в пропасть бросился; когд"}, {"id": 245, "r": "Трус умирает даже от ослиного кашля."}, {"id": 246, "r": "Груз осла лошадь осилит, лошадиный же груз осел никогда не осилит."}, {"id": 247, "r": "Когда спросили, кто милее сына, ответили: “Внук”."}, {"id": 248, "r": "Еще не бывало, чтобы добро приходило туда, откуда выходит зло."}, {"id": 249, "r": "Не бывает худа без худа, как не бывает сына без матери."}, {"id": 250, "r": "Плохая жена – дом без основы (фундамента)."}, {"id": 251, "r": "Легко быть плохим, трудно быть хорошим."}, {"id": 252, "r": "Плохой всадник седло бьет (коня боится), плохой муж – жену бьет."}, {"id": 253, "r": "Плохое слово и глухой услышит."}, {"id": 254, "r": "Плохая собака кусуча на своем дворе."}, {"id": 255, "r": "Плохая ворона каркает противно."}, {"id": 256, "r": "Легко заиметь плохую привычку (черту характера), но трудно хорошую черту уберечь"}, {"id": 257, "r": "Лучше иметь кошку в доме, чем плохую жену."}, {"id": 258, "r": "Чем покупать хороший дом с плохим соседом, лучше купить плохой дом с хорошим сос"}, {"id": 259, "r": "Решили на сходе избавиться от плохих людей, и тут самый худший сел точить саблю "}, {"id": 260, "r": "Красивее лица пришедшего гостя может быть лишь спина гостя уходящего."}, {"id": 261, "r": "Исчезает тепло родства без взаимных посещений и встреч."}, {"id": 262, "r": "Танец не начинают с бурного перепляса."}, {"id": 263, "r": "Из никчемного мужчины хорошая жена сделала достойного мужа; плохая жена обесслав"}, {"id": 264, "r": "И хорошие, и плохие – все лежат на одном кладбище."}, {"id": 265, "r": "Кто ходит и ищет, тот свое находит."}, {"id": 266, "r": "Счет не тот, который мы предполагали, приступая к делу, а тот, который получился"}, {"id": 267, "r": "Идущий осиливает большой путь."}, {"id": 268, "r": "На что надеялся, когда шел, не оправдалось (не получилось), когда дошел."}, {"id": 269, "r": "Стыдись старшего, жалей младшего."}, {"id": 270, "r": "Старшего чти, младшего поучай."}, {"id": 271, "r": "За старшим (как ответчиком за деяния младших) числится девять случаев кровной ме"}, {"id": 272, "r": "Не шути со старшим, не панибратствуй с младшим."}, {"id": 273, "r": "Старшего чти сам, а младшего заставь чтить себя."}, {"id": 274, "r": "Несчастье постигло того, кто не послушался совета старшего."}, {"id": 275, "r": "Для родных (ты, он) – горе, для чужих – посмешище."}, {"id": 276, "r": "Ненастный день станет погожим; плохой человек хорошим не станет."}, {"id": 277, "r": "Плохое слово волчьей рысью бежит."}, {"id": 278, "r": "Плохая арба дорогу портит, чесоточный конь портит табун, а плохая жена развалива"}, {"id": 279, "r": "Лучше прислуживать хорошему человеку, чем делать добро плохому."}, {"id": 280, "r": "Не жди добра от плохого человека; а дружба с хорошим человеком не пропадет."}, {"id": 281, "r": "Про плохого мужчину говорят: “Дома – ты горе, на людях – посмешище”."}, {"id": 282, "r": "Водиться с плохим человеком – возводить лестницу к несчастьям."}, {"id": 283, "r": "Чем жить в мире с плохим человеком, лучше жить во вражде с человеком порядочным."}, {"id": 284, "r": "Совета дурного человека не приемлют, а совет доброго человека, бывает, и приемлю"}, {"id": 285, "r": "Сон хорошего человека лучше, чем молитва плохого человека."}, {"id": 286, "r": "Науки, постигнутые плохим человеком, - сабля в руках дурака."}, {"id": 287, "r": "Плохой человек говорил: “Дай бог мне еще прожить, пока я не сделаю хоть одну пак"}, {"id": 288, "r": "Нет большего врага, чем плохая жена; нет большего несчастья, чем плохой муж."}, {"id": 289, "r": "Ничто не может быть хуже плохого потомства."}, {"id": 290, "r": "Плохое потомство раньше времени отправляет родителей в могилу."}, {"id": 291, "r": "Если будешь общаться с человеком, не чувствующим дурного запаха (плохих поступко"}, {"id": 292, "r": "У плохого охотника ружье в цель не попадает."}, {"id": 293, "r": "Плохой хозяин ставит на стол недоваренное мясо (чтобы меньше съели)."}, {"id": 294, "r": "У плохой хозяйки за порогом всегда много мусора."}, {"id": 295, "r": "Плечо, которое подставлял бессовестному человеку, загрязнилось."}, {"id": 296, "r": "Плохой человек всегда с тайной злостью завидует хорошему человеку."}, {"id": 297, "r": "И брат твой тебе не брат, если он еще и не друг тебе."}, {"id": 298, "r": "Брат – брату, пес – волку (на съедение)."}, {"id": 299, "r": "Не имеющий брата грустно смотрел на чужую родню."}, {"id": 300, "r": "Юноша без брата – сокол без крыла; девушка без брата – ветка на засохшем дереве."}, {"id": 301, "r": "Печальна участь девушки, не имеющей брата."}, {"id": 302, "r": "Не разбивай сердце девушки, не имеющей брата; не огорчай девушку, не имеющую мат"}, {"id": 303, "r": "Не имеющий брата, что человек без правой руки."}, {"id": 304, "r": "Пусть хорошо живет брат, но не богаче тебя (зазнается…)."}, {"id": 305, "r": "Человека, не имеющего ни брата, ни друга, люди обездолят."}, {"id": 306, "r": "Бывает, родной брат доведет до слез, а двоюродный обрадует."}, {"id": 307, "r": "Мужчина, не имеющий наследника, понуро стоял при народе."}, {"id": 308, "r": "Отец без потомка – надломившееся дерево; девушка без брата – сокол без крыла; со"}, {"id": 309, "r": "Нет сына – нет крыши над головой."}, {"id": 310, "r": "Враждовавший (воевавший) с людьми не вырастил ни сына, ни брата (значение: погиб"}, {"id": 311, "r": "Женился сын – и лицо матери показалось ему свиным рылом, а лицо тещи – яблоком ш"}, {"id": 312, "r": "Тот, кому ни разу в жизни не повезет, - собака; а если повезет и он не воспользу"}, {"id": 313, "r": "Если соединились двое, один из них должен быть тамадой."}, {"id": 314, "r": "Две жены многоженца перестали ссориться, когда муж привел третью."}, {"id": 315, "r": "Богач бывает скуп на подаяние."}, {"id": 316, "r": "И дурак кажется умником, если он богат."}, {"id": 317, "r": "Богачу не понять жизненные тяготы бедняка, бедняк же знает, насколько состоятеле"}, {"id": 318, "r": "Дерево хорошо плодами, а человек – делами."}, {"id": 319, "r": "Легко переломить прутик, оторвавшийся от родного ствола."}, {"id": 320, "r": "Куда прыгнет коза, туда и козленок."}, {"id": 321, "r": "Как у козы нет курдюка, так у бесстыжего – благородства."}, {"id": 322, "r": "Как из козлиного рога не получить ячменя, так и рожденному не твоей матерью не с"}, {"id": 323, "r": "Рано или поздно, правда выйдет наружу. А какой толк, что она когда-то выйдет?"}, {"id": 324, "r": "Жеребчик, вскормленный буйволицей, любит валяться в грязи."}, {"id": 325, "r": "Поле лучше ближе к дому, родственники – из родных мест."}, {"id": 326, "r": "Далекая трель пастушьей дудки милее трелей близкой княжеской зурны."}, {"id": 327, "r": "Конь хорошим бывает не потому, что у него круп широкий, а человек умным – не пот"}, {"id": 328, "r": "Желудку потакать – добра не видать."}, {"id": 329, "r": "Друг в дальнем краю, что воздвигнутая там башня."}, {"id": 330, "r": "Издали слышная мелодия приятней на слух."}, {"id": 331, "r": "Хорошо бы еще издали по облику узнавать вруна (бесчестного человека)."}, {"id": 332, "r": "Близкий сосед лучше далекого брата."}, {"id": 333, "r": "Если выехал в дальний путь, не торопи коня."}, {"id": 334, "r": "Кто не заботится о желудке, тот не любит и голову."}, {"id": 335, "r": "Шелудивую лошадь (чесоточную) изгнали из табуна."}, {"id": 336, "r": "От чесоточного лишь чесотку получишь."}, {"id": 337, "r": "Чесоточные лошади любят кучковаться."}, {"id": 338, "r": "Чесоточная лошадь, не имея хвоста сгонять мух с себя, пыталась гнать их со всего"}, {"id": 339, "r": "Умелец (хитрец), хоть посади его на голые камни, выживет."}, {"id": 340, "r": "Хитрец и шайтана надует."}, {"id": 341, "r": "Коня узнаешь по его бегу, человека – по его спокойствию (терпеливости)."}, {"id": 342, "r": "Лошадь сдерживают уздечкой, а жену – уважением к себе."}, {"id": 343, "r": "Молодец без коня что дом без крыши."}, {"id": 344, "r": "Если (говорят сплетники) конь идет иноходью, скажут, что у него ноги больные; ес"}, {"id": 345, "r": "Коня выбирай по галопу, человека – по спокойствию (сдержанности)."}, {"id": 346, "r": "Поздно закрывать на засовы, когда увели коня, - хозяин сам во всем виноват."}, {"id": 347, "r": "Прежде чем покупать коня, купи седло."}, {"id": 348, "r": "У всадника преимущество перед пешеходом."}, {"id": 349, "r": "Коню идет верховое седло, а ослу приличествует грузовое седло – кож."}, {"id": 350, "r": "Кто сытно коня накормил, дальше других уехал."}, {"id": 351, "r": "Не верь коню и женщине."}, {"id": 352, "r": "Пешеходу не угнаться за всадником."}, {"id": 353, "r": "Ленивый конь заставляет себя плеткою бить."}, {"id": 354, "r": "Впервые вели бычка на пахоту, и он говорил: “Иду резвиться на лугах”; возвращаяс"}, {"id": 355, "r": "Лентяй призывал бросить пахоту и порезвиться с ящерицей."}, {"id": 356, "r": "Осенний ветер принес три вреда, весенний – три добра."}, {"id": 357, "r": "Осенний выводок бывает слабым."}, {"id": 358, "r": "Осенне солнце смотрит на сирую вдову."}, {"id": 359, "r": "Осень сыта, а весна голодна."}, {"id": 360, "r": "Лучше перепелка в руках, чем надежда поймать осенью оленя."}, {"id": 361, "r": "В лицо льстит, за спиной – подличает."}, {"id": 362, "r": "Когда за ним побежал гусь, Бека не испугался: выхватил огромный кинжал, перемахн"}, {"id": 363, "r": "Попыталась утка гоготать по-гусиному, да в котел угодила."}, {"id": 364, "r": "Грусть влечет за собою печаль; добро за собою добро ведет."}, {"id": 365, "r": "Совершая ошибки, человек совершенствуется."}, {"id": 366, "r": "Без недостатков даже брата не бывает."}, {"id": 367, "r": "Если ты знаешь ингушский язык (и обычай), уживешься с любым народом."}, {"id": 368, "r": "По этике и благородству ингуша никому не обойти."}, {"id": 369, "r": "С человеком Камбелеевка (река) играет, Фартанга купает, Арамхи сбивает, Терек ун"}, {"id": 370, "r": "И среди снов бывает лучший (красивейший)."}, {"id": 371, "r": "Съела лиса журавлят и сказала: “Раз мы друзья, что за разница, твои ли, мои ли д"}, {"id": 372, "r": "Стройные девушки шустро пропалывают, а толстухи – лениво."}, {"id": 373, "r": "За юношу в бешмете я не хочу выйти замуж, а юноша в черкеске меня не берет."}, {"id": 374, "r": "Кривляка и ходит вихляво."}, {"id": 375, "r": "На песке башню не ставят."}, {"id": 376, "r": "Голова дурака тяжелее и песка, и камня."}, {"id": 377, "r": "Как из грязного колодца жажаду не утолить, так не жди добра от грязного сердца ("}, {"id": 378, "r": "Вор не идет туда, где засовы крепки."}, {"id": 379, "r": "Знай, что дела твои совсем плохи, когда дурак начнет тебя поучать."}, {"id": 380, "r": "Девушку узнаешь по ее делам (а не по внешности)."}, {"id": 381, "r": "Дела – от младшего, расчеты – от старшего."}, {"id": 382, "r": "Не задирай голову, когда дела идут хорошо, и не опускай, когда они идут плохо."}, {"id": 383, "r": "Умрет отец – с сердца упадет цветок, умрет мать – упадут два цветка."}, {"id": 384, "r": "У осиротевшей семьи много хозяев, да мало пользы."}, {"id": 385, "r": "Хорош хозяин, хороша и семья (двор)."}, {"id": 386, "r": "Взыграл хозяин – поле расцвело, расцвело поле – батрак разыгрался, разыгрался ба"}, {"id": 387, "r": "Хозяин трудолюбив, - трудолюбива и семья."}, {"id": 388, "r": "Если ты сам не оплакиваешь своего покойника, то чужие и подавно не заплачут."}, {"id": 389, "r": "Нечем было поужинать, да вдруг мясо с галушками бог дал."}, {"id": 390, "r": "Хотя и труднее ее кушать, а все же каша должна быть горячей."}, {"id": 391, "r": "Еда – пища для тела, сон – пища для души."}, {"id": 392, "r": "Потаенное постоянство наружу вылезает."}, {"id": 393, "r": "Из глаза, плакавшего от души, кровь пошла."}, {"id": 394, "r": "Искреннее слово до вершины Казбека долетело (весь город услышал)."}, {"id": 395, "r": "Бревно, которое не смог расколоть железный топор, расколол деревянный клин."}, {"id": 396, "r": "Утерянная честь – не вернулась."}, {"id": 397, "r": "Спрячь покойника под кровать, но с почестями прими гостя."}, {"id": 398, "r": "Трудись больше других, но долю получай равную."}, {"id": 399, "r": "Если будешь бездельничать и только уповать на Всевышнего, - пользы не будет."}, {"id": 400, "r": "Будь доволен богом данной судьбою, заслужи божью милость своими делами."}, {"id": 401, "r": "Потраченный по делу рубль лучше, чем сотня, потраченная не по делу."}, {"id": 402, "r": "Подаяние ненуждающемуся – камень, брошенный в воду."}, {"id": 403, "r": "Пусть любят нас бог и царь: кого любит царь – тот будет жить хорошо; кого любит "}, {"id": 404, "r": "Сам бог Дяла вознес пророка Адама над ангелами, поэтому человек (адам) – лучшее "}, {"id": 405, "r": "В рай не пустили того, кто не чтил своих родителей."}, {"id": 406, "r": "Быстрее начинай то, что сделать необходимо; а там, где надо сказать, немедля ска"}, {"id": 407, "r": "Бездельние опасен для людей."}, {"id": 408, "r": "Бездельник говорил: “Давайте отпустим ласку (мышевидный зверек) и начнем играть "}, {"id": 409, "r": "Тело, приученное к лекарствам, никуда не годится."}, {"id": 410, "r": "Бездельник прошлыми заслугами хвалился; никчемное потомство хвалилось предками."}, {"id": 411, "r": "То, что продается дешево, осмотри трижды."}, {"id": 412, "r": "Непослушный бык угодил в котел хозяина."}, {"id": 413, "r": "Отец приговаривал: “Пусть живет мой сын!” Сын же говорил “Пусть умрет мой отец!”"}, {"id": 414, "r": "Сыну достались фрукты от дерева, которое посадил его отец."}, {"id": 415, "r": "Лошадь, которую расхваливал хозяин, проиграла на скачках."}, {"id": 416, "r": "Что для кошки игра, то для мышки горе."}, {"id": 417, "r": "Помочилась мышка, и море перелилось через край."}, {"id": 418, "r": "Огонь гаснет, если не подкладывать дров; родство угасает, если его не поддержива"}, {"id": 419, "r": "Лучше иметь отца – хоть из дерева; лучше иметь мать – хоть из войлока."}, {"id": 420, "r": "Гость, не приглянувшийся хозяину, зимой на майдане оказался."}, {"id": 421, "r": "Добро идет, словно ленивый ишак, зло несется скакуном."}, {"id": 422, "r": "Скот (богатство) отца – добыча сына."}, {"id": 423, "r": "Сердце мачехи покрыто нетающим льдом."}, {"id": 424, "r": "Голову мачехи в судный день будут на мельнице молоть."}, {"id": 425, "r": "Кто прислушивается к советам отца, тот редко ошибается."}, {"id": 426, "r": "Кто чтит предков, тот возвышает свою честь."}, {"id": 427, "r": "Отцова сестра что соль, сестра матери – мед."}, {"id": 428, "r": "На горе несчастной жене муж второй женою привел одну из ее сестер."}, {"id": 429, "r": "У несчастного если есть чувяки, то нет ноговиц; а если есть ноговицы, - нет чувя"}, {"id": 430, "r": "Никому не дано проникнуть в тайны божьи."}, {"id": 431, "r": "Бог терпелив, но за все воздает сполна."}, {"id": 432, "r": "Если хозяина устраивает, пусть получит полную арбу покойников."}, {"id": 433, "r": "Потомство вырастает похожим на своих родителей (предков)."}, {"id": 434, "r": "И счастье, и несчастье родителей в их детях."}, {"id": 435, "r": "Самый большой подарок для родителей – гордый сын и скромная дочь."}, {"id": 436, "r": "Не нужно быть хорошим, чтобы уничтожить доброе дело; сотворить его – это и есть "}, {"id": 437, "r": "От краснобая не будет пользы (берегись его)."}, {"id": 438, "r": "Пустой мешок не стоит."}, {"id": 439, "r": "Густая каша лучше пустой болтовни."}, {"id": 440, "r": "Не смажешь и колесо не крутится."}, {"id": 441, "r": "Привыкшая к маслу ложка в прокисшем рассоле треснула."}, {"id": 442, "r": "С маслом съешь и “ишачий сыр” (одна из пород большого гриба)."}, {"id": 443, "r": "Сколько бы в одном котле ни варили воду и масло, они никогда не смешиваются."}, {"id": 444, "r": "Кто плох со своими родителями, у того вырастет жестокое потомство."}, {"id": 445, "r": "Строптивая девушка в замужестве не уживется."}, {"id": 446, "r": "Кто делает неположенное, получит нежелаемое."}, {"id": 447, "r": "Выпавший из сердца стал отвратительным."}, {"id": 448, "r": "Тело нельзя ни баловать, ни изнурять."}, {"id": 449, "r": "Пока ленивый уповал на то, что суждено, его поле сорняками заросло."}, {"id": 450, "r": "Телом – слон, умом – пташка."}, {"id": 451, "r": "Посмотреть на внешность – бугай, посмотреть в душу – овца."}, {"id": 452, "r": "Говоря “будет, что суждено”, забываем сами потрудиться."}, {"id": 453, "r": "Сильный телом побеждает одного, сильный умом побеждает десятерых."}, {"id": 454, "r": "Нет проку от внушительной внешности, коли ума недостает."}, {"id": 455, "r": "Девушка должна быть чиста, как топленое масло."}, {"id": 456, "r": "Если вырастет плохая семья, то это отражается на морщинах матери и на сединах от"}, {"id": 457, "r": "Хороша семья – много благодати в доме."}, {"id": 458, "r": "Жена становится смелее, когда вырастут дети."}, {"id": 459, "r": "Кого любит семья, того и бог любит."}, {"id": 460, "r": "У отца семейства голова поседела тогда, когда выросли дети."}, {"id": 461, "r": "Главное богатство семьи во взаимном согласии."}, {"id": 462, "r": "Счастье и благополучие семьи – в любви и согласии."}, {"id": 463, "r": "Кого не любят в семье, того и в народе не любят."}, {"id": 464, "r": "Лопнул позарившийся на многое."}, {"id": 465, "r": "Должник не знает покоя, пока долг не вернет."}, {"id": 466, "r": "Долг, просроченный на неделю, вернули только через месяц; просроченный на месяц "}, {"id": 467, "r": "Хозяин долга (кредитор) не пропадет (всегда сыщется)."}, {"id": 468, "r": "Долг тащит за собою неправедное, а оно влечет за собою несчастье."}, {"id": 469, "r": "Не поднесешь огня – и сухие дрова не загорятся."}, {"id": 470, "r": "Нельзя враждовать с трупом."}, {"id": 471, "r": "Родостно ушедшее вернулось печальным, печально ушедшее вернулось радостным."}, {"id": 472, "r": "День после обеда – уже не день, зимнее солнце – не солнце, женатый – уже не паре"}, {"id": 473, "r": "Мужественный человек жалостлив, трусливый человек – жесток."}, {"id": 474, "r": "Мужество – умение сдерживать себя."}, {"id": 475, "r": "Мужество – вернейший друг."}, {"id": 476, "r": "Мужество и храбрость возвышают честь мужчины."}, {"id": 477, "r": "Отдающий не обеднел, просящий не разбогател."}, {"id": 478, "r": "Пришло добро – цени его, случилось несчастье – терпи его."}, {"id": 479, "r": "На свадьбе – невеста, после свадьбы – прислуга."}, {"id": 480, "r": "Все может знать только единый бог Дела."}, {"id": 481, "r": "Просящий – раб, дающий – князь."}, {"id": 482, "r": "Пожалеет тот, кто недооценит врага."}, {"id": 483, "r": "Не говори того, о чем пожалеешь; не делай того, о чем тоже пожалеешь."}, {"id": 484, "r": "Надо заранее беречь себя от дурных поступков."}, {"id": 485, "r": "У труженика (запас) накапливается, у бездельника – оскудевает."}, {"id": 486, "r": "Учение – напильник для заточки ума."}, {"id": 487, "r": "Смысл учебы в уме, смысл ума в воздержанности, смысл воздержанности – это ключ о"}, {"id": 488, "r": "Если бы слово могло превращаться в шелк (золото), бедных людей не было бы."}, {"id": 489, "r": "Слово влечет за собою другое слово."}, {"id": 490, "r": "Не давай слова, если не можешь сдержать его."}, {"id": 491, "r": "Учение – компас (меч) эпохи."}, {"id": 492, "r": "Если конь хромает, то и всадник кажется хромым."}, {"id": 493, "r": "Что коня увели – небольшая беда, если увел его разумный человек."}, {"id": 494, "r": "Нередко случается, что конь в осла превращается."}, {"id": 495, "r": "В дальнюю дорогу бери, чем накрыться, хотя бы и было солнечно, возьми припасы, х"}, {"id": 496, "r": "Свой конь кажется лучше других, чужая жена кажется краше своей."}, {"id": 497, "r": "Кто принародно лишился чести, тот живой мертвец."}, {"id": 498, "r": "Роднись днем или при свете факела."}, {"id": 499, "r": "Дождь перестанет, когда прольется; глаза высохнут, когда выплачутся."}, {"id": 500, "r": "И хорошее, и плохое ходят цепочкой."}, {"id": 501, "r": "Все хорошее и плохое идет из дома."}, {"id": 502, "r": "Хорошая сталь не ржавеет, хороший человек не забывается."}, {"id": 503, "r": "Хорошо знать, что змея ядовита, хорошо знать и имя доносчика."}, {"id": 504, "r": "Если ты будешь делить с людьми их горе и радость, они ответят тебе тем же."}, {"id": 505, "r": "Хорошее сменяется злом, зло – добром."}, {"id": 506, "r": "Хороший сын – воздвигнутая башня, плохой сын – камень на шее."}, {"id": 507, "r": "Иметь хорошие помыслы – уже благо."}, {"id": 508, "r": "На добро ответь добром, на удар – ударом, а ткнули (кинжалом), ткни в ответ."}, {"id": 509, "r": "Сделал добро – для себя, сделал зло – тоже для себя."}, {"id": 510, "r": "Хороший конь узнается по иноходи, благородный человек – по делам."}, {"id": 511, "r": "Хороший друг лучше плохого брата."}, {"id": 512, "r": "Хороший конь слушается всадника, хорошая жена слушается мужа."}, {"id": 513, "r": "Хорошую девушку в родном селе замуж берут."}, {"id": 514, "r": "Кичащихся мужчин одолели и связали простые пахари."}, {"id": 515, "r": "Хороший сосед – прибыток, плохой – убыток."}, {"id": 516, "r": "Спросили: “Кто хороший?” Ответили: “Тот, кто мне хорошее делает”."}, {"id": 517, "r": "Хорошая жена – богатсво, плохая жена – разорение."}, {"id": 518, "r": "Хорошая жена – рай на земле; плохая – ад на земле."}, {"id": 519, "r": "Спокойно (с чувством исполненного долга) умирает тот, кто вырастил хорошее потом"}, {"id": 520, "r": "Хорошим быть – человеком быть."}, {"id": 521, "r": "Хорошее руководство – цветущая страна, плохое руководство – туманный мрак."}, {"id": 522, "r": "Позор смывается полной победой справедливости."}, {"id": 523, "r": "И на березе вырастет яблоко, если за ней хорошо ухаживать."}, {"id": 524, "r": "Творящий добро творит его потому, что он мужчина, а творящий зло творит его пото"}, {"id": 525, "r": "Пригласили на торжества – не ходи, если не можешь; сообщили о беде – иди, даже е"}, {"id": 526, "r": "Хороший всадник проджигитует там, где муравью не развернуться."}, {"id": 527, "r": "Добрый конь хорошего седока нашел; умная девушка пригожего жениха нашла."}, {"id": 528, "r": "Добрый поступок раба князем делает; дурной характер князя рабом делает."}, {"id": 529, "r": "Хороший конь узнает своего всадника, лишь только он сядет в седло."}, {"id": 530, "r": "Хороший конь не дает себя стегать плетью."}, {"id": 531, "r": "Хорошему коню найдется хозяин, хорошему человеку найдется друг."}, {"id": 532, "r": "В хорошем дворе лучше иметь доброго пса, чем плохое потомство."}, {"id": 533, "r": "От хорошей кобылицы и жеребенок хорош."}, {"id": 534, "r": "Настоящий мужчина не имеет цены."}, {"id": 535, "r": "На достойного мужчину всегда хулу возводят, высокому дереву всегда достается вет"}, {"id": 536, "r": "Кто дружит с хорошими людьми, становится лучше; кто водится с плохими, становитс"}, {"id": 537, "r": "Горе и беда твоего лучшего друга – твои горе и беда."}, {"id": 538, "r": "От хорошего человека – добро, от плохого – одно зло."}, {"id": 539, "r": "Бок о бок с хорошим человеком – пригодится, с плохим – только бока обдерешь."}, {"id": 540, "r": "От хорошего человека – хорошее наследство."}, {"id": 541, "r": "Нет ничего лучше хорошей жены, нет ничего хуже плохой жены; но хорошая ли, плоха"}, {"id": 542, "r": "Хорошая жена из никчемного мужчины делает именитого мужа."}, {"id": 543, "r": "Хорошее потомство сердце радует, от плохого потомства сердце плачет."}, {"id": 544, "r": "Из всех пожертвований лучшее – добрый совет."}, {"id": 545, "r": "Один достойный мужчина может поднять честь всего худого рода."}, {"id": 546, "r": "Хорошей хозяйке корова молока больше дает."}, {"id": 547, "r": "У хорошей хозяйки и ужин вкусен."}, {"id": 548, "r": "Не обманывайся, когда придет хорошее, и не огорчайся, когда придет плохое."}, {"id": 549, "r": "Обжегшийся горячим бульоном дул на холодную воду."}, {"id": 550, "r": "Не успокаивайся, пока не сделаешь неотложное."}, {"id": 551, "r": "Сытость – это когда еще остается недоеденная пища."}, {"id": 552, "r": "Не делай того, о чем позднее пожалеешь."}, {"id": 553, "r": "И счастье, и несчастье приходят, когда их не ждешь."}, {"id": 554, "r": "Хозяйство без хозяина – богатство посторонних."}, {"id": 555, "r": "Семья без надзора – свора бродячих собак."}, {"id": 556, "r": "“У вас на печи что-то горит”, - намекал гость."}, {"id": 557, "r": "Ничтожен тот мужчина, который любит сплетни."}, {"id": 558, "r": "Ничтожен человек, кичащийся силой, которой у него нет."}, {"id": 559, "r": "Пала скотина – остались кости; умер человек – остались его дела."}, {"id": 560, "r": "Кто держит скот, у того на столе достаток."}, {"id": 561, "r": "Соврет человек, а ему правду врежут."}, {"id": 562, "r": "Всегда не хватает того, чего нет, а всего никогда и ни у кого не бывало."}, {"id": 563, "r": "И царь нуждался в том, чего у него нет."}, {"id": 564, "r": "У неимущего не просят, а просят у имущего."}, {"id": 565, "r": "Лучше иметь, чем не иметь."}, {"id": 566, "r": "Вражда далеко заводит."}, {"id": 567, "r": "Войну остановит лишь война."}, {"id": 568, "r": "Легко начать вражду, трудно ее остановить."}, {"id": 569, "r": "Даже не желающему вражды ее не избежать."}, {"id": 570, "r": "Живущий во вражде – остер на язык, видевшая много горя мать легка на слезы."}, {"id": 571, "r": "Кто постоянно враждует, семью не вырастит."}, {"id": 572, "r": "У любителя вражды потомство немногочисленно."}, {"id": 573, "r": "Наживешь много врагов, если будешь распространяться о чужих недостатках."}, {"id": 574, "r": "Газават не бывает без боев и потерь."}, {"id": 575, "r": "Кто ищет ссору и войну, тот находит смерть."}, {"id": 576, "r": "Кто оберегает себя от вражды и войны, тот крепит узы родства."}, {"id": 577, "r": "Хоть и горит сердце, а любовь желанна."}, {"id": 578, "r": "Равнодушная ко всему корова отелилась бесхвостым теленком."}, {"id": 579, "r": "У кого черное сердце, у того желчный пузырь лопается."}, {"id": 580, "r": "Зловредный говорил: ”Отрадно, когда у кого-то неприятность, пусть хоть такая мал"}, {"id": 581, "r": "Пусть лицо почернеет у того, кто таит черные мысли, - чтобы его можно было узнат"}, {"id": 582, "r": "Без дождя распутицы не бывает, без гармошки пляски не бывает."}, {"id": 583, "r": "Бежавший от дождя попал под водопад."}, {"id": 584, "r": "Самый большой недостаток – собирать чужие недостатки."}, {"id": 585, "r": "Большая родня – глубоко уходящие корни."}, {"id": 586, "r": "Если ты в чести у народа, ты самый богатый человек."}, {"id": 587, "r": "Малое дело лучше больших (длинных) речей."}, {"id": 588, "r": "Если, имея что-то, скажешь: “Его нет”, то оно достается шайтану."}, {"id": 589, "r": "Ненадежный друг – не друг."}, {"id": 590, "r": "Друга легко потерять, друга трудно найти."}, {"id": 591, "r": "С другом бывает откровеннее, чем с братом."}, {"id": 592, "r": "Прежде чем произнести слово, трижды переверни его во рту."}, {"id": 593, "r": "Слово принадлежит тому, кто первый его произнес; он же и прав."}, {"id": 594, "r": "Не спеши давать слово, спеши его сдержать."}, {"id": 595, "r": "Сказанное (нехорошее) слово можно вернуть (одолеть) словом, но вылетевшую пулю в"}, {"id": 596, "r": "Слово (враждебное) побеждают словом, оружие побеждают оружием."}, {"id": 597, "r": "Как ни черни золото, оно не почернеет."}, {"id": 598, "r": "Золото и серебро покупаются и продаются, благородство и воспитанность (этикет) н"}, {"id": 599, "r": "Согласие в семье лучше золота."}, {"id": 600, "r": "Золото не насыщает человека, а чурек насыщает."}, {"id": 601, "r": "По одежке посади гостя во главу стола, а по уму пересади в конец."}, {"id": 602, "r": "Как нет пользы от разговоров без дела, так нет пользы и от знаний без дела."}, {"id": 603, "r": "Много детей в доме – базар; дом без детей – пустая могила."}, {"id": 604, "r": "Долго жить – людей узнать."}, {"id": 605, "r": "Засидевшийся гость непременно ошибется (проштрафится)."}, {"id": 606, "r": "Спрашивай не у того, кто долго жил, а у того, кто много повидал."}, {"id": 607, "r": "Желание иметь чрезмерно многое научило довольствоваться малым."}, {"id": 608, "r": "Приучившегося к подаяниям можно остановить лишь тем, что не станешь ему подавать"}, {"id": 609, "r": "И мед горчит, когда его съешь слишком много."}, {"id": 610, "r": "Правда, о которой твердят постоянно, становится кривдой."}, {"id": 611, "r": "Гордеца (кичливого…) люди быстро ставят на свое место."}, {"id": 612, "r": "Долго стоявшая каша прокисла, долго обговариваемое дело не выгорело."}, {"id": 613, "r": "Много говорить – ошибку допустить."}, {"id": 614, "r": "Конь, долго простоявший в конюшне, стал колченогим."}, {"id": 615, "r": "Много играли с оружием – оно и выстрелило невпопад."}, {"id": 616, "r": "Уши глохнут от болтливого языка."}, {"id": 617, "r": "Болтливый и смешливый мужчина кажется женоподобным."}, {"id": 618, "r": "Болтливый человек похож на брехливого пса."}, {"id": 619, "r": "Болтуну – горячую картофелину прямо в рот."}, {"id": 620, "r": "У матери, имеющей много дочерей, костный мозг почернел."}, {"id": 621, "r": "Слишком доверчивому когда-нибудь подлость сделают."}, {"id": 622, "r": "Зачастивший гость надоедает, а редко приходящему рады."}, {"id": 623, "r": "На вращающемся (в воде) камне мох не нарастает."}, {"id": 624, "r": "Много по воду носили кувшин, он у ручья и остался."}, {"id": 625, "r": "Не зарастает травою дорога, по которой часто приходят гости."}, {"id": 626, "r": "Долго мятый чувяк на ноге хорошо сидит."}, {"id": 627, "r": "Любивший орать осел замолк, когда его кастрировали."}, {"id": 628, "r": "Много кукарекавший петух угодил в пасть лисицы."}, {"id": 629, "r": "Много мяукающая кошка мышей не ловит. Много брещущая собака зайцев не ловит."}, {"id": 630, "r": "У того, кто много сидит, штаны протерлись."}, {"id": 631, "r": "А много – и кабанов в лесу, и ворон в небе."}, {"id": 632, "r": "Лишь быку известна тяжесть ярма."}, {"id": 633, "r": "От хорошего мяса и бульон хороший."}, {"id": 634, "r": "Черви в мясе соль уничтожит, а черви в соли лишь любовь уничтожит."}, {"id": 635, "r": "Все едино: что нюхать запах мяса, что слушать шелесть денег."}, {"id": 636, "r": "Кошка, которая не дотянулась до курдюка, сказала: “Сегодня у меня пост”."}, {"id": 637, "r": "Для неумеющего жить – этот мир пыточная камера."}, {"id": 638, "r": "Много странствовавший всегда перехитрит домоседа."}, {"id": 639, "r": "Тот не живет настояшей жизнью, кто хлеб не ест (не растит)."}, {"id": 640, "r": "Мир красит солнце, человека красит ум (благородное поведение)."}, {"id": 641, "r": "Мир состоит из десяти частей, девять из них – это умение держать язык за зубами."}, {"id": 642, "r": "Имя, ставшее известным всему миру, не забудется."}, {"id": 643, "r": "Плешивого утешали, а он отвечал: “Если при жизни голова плешивая, по смерти (в р"}, {"id": 644, "r": "Когда в кармане пусто, на белый свет смотреть грустно."}, {"id": 645, "r": "Околеет конь – уздечка останется; помрет человек – имя останется."}, {"id": 646, "r": "Если ты мужественный, то и ошибки твои прощаются, если нет – и твои добрые дела "}, {"id": 647, "r": "Не всегда идет дождь, когда гром гремит."}, {"id": 648, "r": "Коня узнают в пути, молодца узнают на чужбине."}, {"id": 649, "r": "Всадник лисицу поймал, пеший поймал лишь лягушку."}, {"id": 650, "r": "Достоинство коня узнается, когда он устанет от долгой дороги."}, {"id": 651, "r": "Всаднику нужна плеть, а аробщику – прут."}, {"id": 652, "r": "Не жнут того, чего не посеют."}, {"id": 653, "r": "Сказать (посоветовать, усовестить…) – твой долг; принять или не принять (совет) "}, {"id": 654, "r": "Хотя и говорят “слово – серебро, молчание – золото”, но и слово, сказанное к мес"}, {"id": 655, "r": "Несказанное принадлежит одному, сказанное – уже троим."}, {"id": 656, "r": "Если кто-то не поймет твои слова (увещевания), того бесполезно бить и тыкать."}, {"id": 657, "r": "Наблюдательный в пути вернулся без помех."}, {"id": 658, "r": "Если ты ехал по дороге и заодно чинил ее, дорога эта сгодится тебе на обратном п"}, {"id": 659, "r": "Сколько приобретешь зависит от того, сколько отдашь."}, {"id": 660, "r": "Ворошить прошлое – вновь горе мыкать."}, {"id": 661, "r": "Отложил – пригодилось, продал – пропало."}, {"id": 662, "r": "Припасенное и припрятанное – твое."}, {"id": 663, "r": "Посаженное в землю обязательно взойдет."}, {"id": 664, "r": "Сближаются с тем, кто сам идет на сближение."}, {"id": 665, "r": "Кому нужен источник, из которого не пьют в жаркий день? Кому нужна любовь, котор"}, {"id": 666, "r": "Арба катится только за тем, кто ее тянет."}, {"id": 667, "r": "Сначала нужно набить морду тому, кто первым сказал: “Бей!”"}, {"id": 668, "r": "Пошедший бить вернулся битым."}, {"id": 669, "r": "Прежде чем ударить, вспомни, что можешь получить сдачи."}, {"id": 670, "r": "Когда придет несчастье, тогда вспоминается и забытое родство."}, {"id": 671, "r": "Лучше есть кашу, чем вести длинные пустые разговоры. Короткая веревка (шнур) луч"}, {"id": 672, "r": "У тебя не будет ни родственников, ни друзей, если ты будешь выискивать их недост"}, {"id": 673, "r": "О смерти вспоминают или при болезни, или в старости."}, {"id": 674, "r": "Люди уважают тебя, если только ждут от тебя чего-то хорошего или боятся твоего з"}, {"id": 675, "r": "С любимой и в дикой степи проживешь."}, {"id": 676, "r": "Любишь – присмотрись (внимательно)."}, {"id": 677, "r": "Хоть хромоножка, хоть косоглазка…, если полюбится, замуж возьмут."}, {"id": 678, "r": "Без употребления и посуда трескается."}, {"id": 679, "r": "В засушливое время дождя ждут, а в дождливое – о солнце мечтают."}, {"id": 680, "r": "Если погода жаркая, солнце печет; если соврешь, совесть мучает."}, {"id": 681, "r": "Не верь плачущей жене."}, {"id": 682, "r": "К трупу ишака вороны слетаются."}, {"id": 683, "r": "Есть говорящие – “это не умею делать”, но нет говорящих – “я не пью и не ем”."}, {"id": 684, "r": "За весь снег, что на этом свете, нельза отдать и горсти пыли."}, {"id": 685, "r": "Когда корова телится, у быка спина не болит."}, {"id": 686, "r": "Как тот, кто дождался отела и ушел, не попив молозива."}, {"id": 687, "r": "Корову ищи с хорошим выменем, а жену с хорошим характером."}, {"id": 688, "r": "Как ни лупи ишака, конем он не станет; сколь ни бей дурака, он умнее не будет."}, {"id": 689, "r": "Конь, привыкший к плетке, уже не конь."}, {"id": 690, "r": "Если я хозяин овечьего стада, то и овец гоните ко мне."}, {"id": 691, "r": "Нет пользы от вождения лопатой по гравию, как нет ума от длинной болтовни."}, {"id": 692, "r": "Волки рыщут там, где стоит овечий загон."}, {"id": 693, "r": "Даже в овечьем стаде есть вожак-козел."}, {"id": 694, "r": "Нагрянув в овчарню, волку некогда разбираться в овцах."}, {"id": 695, "r": "Кто живет среди овец – глупеет, а кто среди людей – умнеет."}, {"id": 696, "r": "Упаси нас дать овцам волка в пастухи."}, {"id": 697, "r": "Если посчитать и женоподобных мужчин, то женщин больше."}, {"id": 698, "r": "Вдовушка во сне видит двух мужей: умершего и будущего."}, {"id": 699, "r": "О вдове сплетен всегда с избытком."}, {"id": 700, "r": "Сына вдовы узнают по болтливости."}, {"id": 701, "r": "Щенок ко всем ластится, а вырастет – только к хозяину."}, {"id": 702, "r": "Даже собака больше любит того, кто ей похлебку наливает."}, {"id": 703, "r": "Даже собака остается служить там, где ее кормят."}, {"id": 704, "r": "Не полагайся на то, что собака и огонь далего от тебя."}, {"id": 705, "r": "Подающему на похоронах кажется, что много дал, а получившему – что мало получил."}, {"id": 706, "r": "Родство, держащееся на деньгах, - не родство; тело, держащееся на лекарствах, - "}, {"id": 707, "r": "Кто поспевает за изменениями в жизни, тот выигрывает."}, {"id": 708, "r": "Убыток (материальный) можно возместить, утерянную же честь (совесть) никогда не "}, {"id": 709, "r": "Наблюдай – увидишь, ищи – найдешь."}, {"id": 710, "r": "Неблагодарное занятие – заниматься сватовством."}, {"id": 711, "r": "Трусливый ишак испугался львиной шкуры."}, {"id": 712, "r": "Трусливый мужчина перед женою храбрится."}, {"id": 713, "r": "Трусливого собака сразу признает."}, {"id": 714, "r": "Где много трусости, там много жестокости; где много мужества, там больше спокойс"}, {"id": 715, "r": "Папаху срывают (и уносят) только с трусливого."}, {"id": 716, "r": "Неприятны кокетливый старик и старчески серьезный юноша."}, {"id": 717, "r": "На голову похотливого шайтан садится."}, {"id": 718, "r": "Кокетничать нехорошо, но все же женщина должна быть чуть-чуть кокетливой."}, {"id": 719, "r": "Кокетливая дурнушка ранее других замуж выскакивает."}, {"id": 720, "r": "Кокетка в девках не засиживается."}, {"id": 721, "r": "Потаскуха всех женщин называла “потаскухами” (блудницами)."}, {"id": 722, "r": "Никто не видел глаз муравья, ног змеи и подаяния муллы."}, {"id": 723, "r": "По глазам узнается похотливый человек."}, {"id": 724, "r": "У молодого сил больше, да ума меньше; у старшего сил поменьше, но ума куда больш"}, {"id": 725, "r": "Маленький, мягкий язык победил булатную саблю."}, {"id": 726, "r": "Маленькая искорка все село спалила."}, {"id": 727, "r": "Скверное (некрасивое) слово сердце ранит, хорошее (доброе) слово сердце радует."}, {"id": 728, "r": "Страшен волк, вышедший на охоту."}, {"id": 729, "r": "“Я бы съела во-он того быка, - сказала кошка, - да боюсь его рогами подавиться”."}, {"id": 730, "r": "Сапоги презирают чувяки."}, {"id": 731, "r": "Сапог обошел чувяк."}, {"id": 732, "r": "Пахота начинается с песни."}, {"id": 733, "r": "Сказанное злоязычной женщиной все равно, что оглашенное на базаре."}, {"id": 734, "r": "С деньгами связаны как счастье, так и несчастье."}, {"id": 735, "r": "И счастье бывает ленивым: устанет бегать за дельным человеком и прилепится к лен"}, {"id": 736, "r": "Не будет жить счастливо и благополучно тот, кто сторонится людей."}, {"id": 737, "r": "Дружно уживаются счастье и ум."}, {"id": 738, "r": "Бросили камень в ворону, севшую на быка, а попали в самого быка."}, {"id": 739, "r": "Есть такие: тело бычье, а душа заячья."}, {"id": 740, "r": "Сидя на роге возвращающегося с пахоты быка, муха гордилась: “Я еду с пахоты!”"}, {"id": 741, "r": "Лицо бессовестного человека каменно, как шея быка."}, {"id": 742, "r": "Жены и ссорят братьев, и мирят их."}, {"id": 743, "r": "Женские языки, что пушки."}, {"id": 744, "r": "Сделай десятерым добро: в трудный час хотя бы один из них придет тебе на помощь."}, {"id": 745, "r": "Сделай добро десятерым. Если в ответ девять из них сделают тебе зло и лишь один "}, {"id": 746, "r": "Кто поел и пошел в путь, тот обошел того, кто вышел в путь натощак."}, {"id": 747, "r": "Зайца ест тот, кто его убьет."}, {"id": 748, "r": "Сытый живот (толстое пузо) становится чванливым. Сытая коза волка бодает."}, {"id": 749, "r": "Тронутая инеем тыква бывает слаще."}, {"id": 750, "r": "Лучше промолчи там, где твое слово не будет весомым."}, {"id": 751, "r": "Того, кто ходит с краю, иней накрыл."}, {"id": 752, "r": "“Если пожелать, и козу можно сделать безрогой”, - сказал хозяин и палкою сшиб ро"}, {"id": 753, "r": "Умерла сестра – окна нет; умер брат – рухнула стена дома; умер отец – крыша обру"}, {"id": 754, "r": "Сестра сердцем жалостлива к брату, а сердце брата тянется в лес."}, {"id": 755, "r": "Сорняк вырастает высоким, да плодов на нем не бывает; борода отрастает длинной, "}, {"id": 756, "r": "Береги язык от сплетен, а руки от воровства."}, {"id": 757, "r": "Пытаясь отнять у неимущего, потеряешь, что сам имеешь."}, {"id": 758, "r": "Дождливая погода хороша, когда идет вслед за засухой; солнечная погода хороша, к"}, {"id": 759, "r": "И солнце, и дождь – все хорошо в меру."}, {"id": 760, "r": "Как после непогоды устанавливается ясный день, так и за горем следует счастье."}, {"id": 761, "r": "В бродячую собаку камни швыряют."}, {"id": 762, "r": "И большую башню складывают по камню."}, {"id": 763, "r": "В большой сельский сход может внести разлад один сплетник."}, {"id": 764, "r": "От души сказанное услышал весь город."}, {"id": 765, "r": "Как не останавливают завертевшуюся мельницу, так не прерывают и начатую работу."}, {"id": 766, "r": "Нет проку ремонтировать прогнившее строение."}, {"id": 767, "r": "У всех матерей дочери хорошие, у всех свекровей снохи плохие."}, {"id": 768, "r": "Во сне девушка князя видит, а днем глину месит (шутка)."}, {"id": 769, "r": "Сватайте девушку, у которой мать хорошая; выдавайте дочь за того, у кого отец хо"}, {"id": 770, "r": "Спина, которая согнулась у матери после выдачи дочери замуж, выпрямилась, когда "}, {"id": 771, "r": "Дочери ищи сытное место (замужем), сыну ищи невесту из хорошего рода."}, {"id": 772, "r": "Родившая дочь родит и сына."}, {"id": 773, "r": "Пусть (лучше) от жары борода повылезет, чем от холода палец отморозить."}, {"id": 774, "r": "Семья без согласия, что поражение в бою."}, {"id": 775, "r": "Повезет – не возгордись, не повезет – не переживай."}, {"id": 776, "r": "У щедрого отдающего не убыло, у скупого от сбереженного не прибыло."}, {"id": 777, "r": "Честь и благородство надо оберегать, словно яйцо в руке."}, {"id": 778, "r": "Свалился забор – пропал двор."}, {"id": 779, "r": "Сломался забор – можно новый поставить; потерявший честь – уничтожен."}, {"id": 780, "r": "Уж лучше хотя бы станцевать, чем стоять без дела, подперев плетень."}, {"id": 781, "r": "Удачливый бык волка одолел."}, {"id": 782, "r": "Богатство создают, складывая копейку к копейке."}, {"id": 783, "r": "Гнездо сокола не для вороны, воронье гнездо не для сокола."}, {"id": 784, "r": "Надевшему новую (хорошую) папаху кажется, что все на него и смотрят."}, {"id": 785, "r": "Когда девушке купили новое платье, она стала чаще ходить по воду."}, {"id": 786, "r": "Коршун нес в когтях куропатку, а она кричала: “Я за него замуж выхожу!”"}, {"id": 787, "r": "Не делай того, что подсказывает сердце, не посоветовавшись с головой; и не делай"}, {"id": 788, "r": "Если голова не работает, ногам работы прибавляется."}, {"id": 789, "r": "Носи хорошие шапку и сапоги, ибо друг осматривает тебя с головы, а враг – с ног."}, {"id": 790, "r": "И жизнь не в жизнь, когда карман пуст."}, {"id": 791, "r": "Тот, у кого карман полон денег, кажется людям и умным."}, {"id": 792, "r": "Толстосума больше любят."}, {"id": 793, "r": "Легко наполнить живот, трудно насытить глаза."}, {"id": 794, "r": "Хоть в Китай поезжай, но ума прибавляй."}, {"id": 795, "r": "Не потакай своему желудку."}, {"id": 796, "r": "То, что в кармане, - уйдет, а то, что в голове, - останется."}, {"id": 797, "r": "Если произнести “кицу” (пословицу…), то даже ложь за правду сходит."}, {"id": 798, "r": "“Кица” (пословица…) может разрушить сказанное, “кица” может закрепить сказанное."}, {"id": 799, "r": "У кого сад зарос сорняком, тот в лесу кизил собирал."}, {"id": 800, "r": "Пошла я навестить родителей, имея с горсточку горя, вернулась оттуда с целой оха"}, {"id": 801, "r": "Занозу из ноги можно вытащить, а занозу из языка – невозможно."}, {"id": 802, "r": "У кого обувь бывает в навозе, у того руки бывают в масле."}, {"id": 803, "r": "Ноги далеко уводят человека от материнской груди."}, {"id": 804, "r": "Кочкару (барану) пристала хорошая овца, храброму молодцу – красавица."}, {"id": 805, "r": "Покажи свое мужество, хотя бы пободавшись с бараном."}, {"id": 806, "r": "Нет толку от большой головы, если она пустая."}, {"id": 807, "r": "Голова-то большою бывает и у быка, и у буйвола."}, {"id": 808, "r": "Чем жить курицею, лучше умереть петухом."}, {"id": 809, "r": "Даже курочка гордится, когда яичко снесет."}, {"id": 810, "r": "Рубашка ближе к телу, чем шуба."}, {"id": 811, "r": "Лишь бы было, из чего сшить рубаху, а из чего сделать воротник, у нас найдется."}, {"id": 812, "r": "У кого руки в мозолях, у того язык без мозолей."}, {"id": 813, "r": "Руками ветер не остановишь."}, {"id": 814, "r": "Будь гордым, но не будь кичливым."}, {"id": 815, "r": "Про гордеца говорят: “И там, где легкие, у него тоже сердце”."}, {"id": 816, "r": "Хорошо, когда пашня длинная (большая); хорошо, когда язык короткий."}, {"id": 817, "r": "Решение судьи зависит от взятки."}, {"id": 818, "r": "Приученная к лакомствам скотина не отстает от хозяина."}, {"id": 819, "r": "Лучше свою голову держи в поле, чем у поля вешать лошадиный череп от сглаза."}, {"id": 820, "r": "Труд на поле – от человека, дождь с неба – от бога Дялы."}, {"id": 821, "r": "Незванного пса отправили голодным."}, {"id": 822, "r": "И змее милее свой край, даже если это мусорная куча."}, {"id": 823, "r": "Говорят, чтобы соединить судьбу мужчины и женщины, богу Дяле пришлось износить д"}, {"id": 824, "r": "Красивые речи женщину обманывают."}, {"id": 825, "r": "Из-за одной женщины вражда постигает девятерых мужчин."}, {"id": 826, "r": "Плод, сорванный раньше срока, бывает кислым."}, {"id": 827, "r": "Если вода перекатилась через три камня, значит, она очистилась."}, {"id": 828, "r": "Бывает, раз в три года приходит голод, а раз в семь лет – зараза."}, {"id": 829, "r": "Созревшие фрукты подавай на стол; выросшую дочь выдавай замуж."}, {"id": 830, "r": "То, чего не было суждено, ушло впустую."}, {"id": 831, "r": "Решение суда (местного, медиаторского) влечет за собою долг, долг влечет кривду,"}, {"id": 832, "r": "Дело, переданное в суд (местный), - шут, пляшущий на канате."}, {"id": 833, "r": "Глаз, местным судом объявленный незрячим, оказался видящим."}, {"id": 834, "r": "Бойся не бойся, а что должно случится, все равно случится."}, {"id": 835, "r": "У людей, живущих на камнях, сердца бывают завистливыми."}, {"id": 836, "r": "Даже кипящая вода о чем-то бормочет."}, {"id": 837, "r": "Если мать будет в союзе с выросшими детьми, отцу остается только дом покинуть."}, {"id": 838, "r": "Осторожный не обжегся."}, {"id": 839, "r": "У оберегавшего себя мать не плакала, но и не смеялась много."}, {"id": 840, "r": "Не имеет сына тот, у кого нет хотя бы трех сыновей."}, {"id": 841, "r": "Нет пользы в том, что завтра обещают привезти конфеты, а послезавтра – орехи, по"}, {"id": 842, "r": "Даже когда знаешь, что завтра умрешь, сегодня ты должен жить."}, {"id": 843, "r": "Лучше одно яичко сегодня, чем курица, обещанная на завтра."}, {"id": 844, "r": "Постоянно думающий о завтрашнем дне не пропадет сегодня."}, {"id": 845, "r": "Кто не думает о завтрашнем дне, у того не будет дня сегодняшнего."}, {"id": 846, "r": "Если больной не доживет до утра, то уж пусть лучше умрет сегодня."}, {"id": 847, "r": "Отложенное на завтра осталось на послезавтра, оставленное на послезавтра вообще "}, {"id": 848, "r": "Отложили шитье шубы на завтра, а завтра из нее лишь душегрейка получилась."}, {"id": 849, "r": "Человек свершает лишь то, что ему при рождении было предрешено судьбою."}, {"id": 850, "r": "И лягушка, прыгнув, считает, что она очень далеко прыгнула."}, {"id": 851, "r": "Стремившийся (свершить кровную месть) достиг своего, избегавшего (возмездия) уби"}, {"id": 852, "r": "Твердящий “успею” никогда не успевает."}, {"id": 853, "r": "Тянись к людям, как к очагу, но помни; слишком близко – обожжежься, слишком дале"}, {"id": 854, "r": "У домашнего очага ты горе, а при народе ты посмещище (о плохом хозяине)."}, {"id": 855, "r": "Может ли быть большее горе, чем потомство, которое тебя не слушает."}, {"id": 856, "r": "Даже Камбилеевка (речка) не всегда течет по одному и тому же руслу."}, {"id": 857, "r": "Даже деревья в лесу бывают высокими и низкими."}, {"id": 858, "r": "Собака, бросившаяся отнимать кость у другой (собаки), обронила свою."}, {"id": 859, "r": "Может ошибиться тот, кто другого человека посчитает ничтожным."}, {"id": 860, "r": "Лучше не бери грех на душу – молитвами его не замолишь."}, {"id": 861, "r": "Кому достался дармовой хлеб, тот не знает, как его есть."}, {"id": 862, "r": "Постарел – считай умер, обеднел – умер дважды."}, {"id": 863, "r": "Старому и немощному нужны три ноги (посох нужен)."}, {"id": 864, "r": "Постаревший барс становится собакой."}, {"id": 865, "r": "Состарившись, орел стал питаться лякушками."}, {"id": 866, "r": "Даже ворона привстает, когда другая подлетает."}, {"id": 867, "r": "Гнездо вороны чистым никогда не бывает."}, {"id": 868, "r": "Подружился с вороной и очутился у дохлой собаки."}, {"id": 869, "r": "Коршун, побратавшийся с вороною, стал каркать."}, {"id": 870, "r": "По воронам не стреляют, когда в руках имеется палка (камень)."}, {"id": 871, "r": "Не пристало коршуну быть в стае ворон."}, {"id": 872, "r": "Даже ворона сначала гнездо строит и лишь затем воронят выводит."}, {"id": 873, "r": "Тайно сказанное рано или поздно будет всеми услышано."}, {"id": 874, "r": "Свою тайну даже другу не открывай – и у него есть свой друг."}, {"id": 875, "r": "Говорившему – одно спасибо, промолчавшему – два."}, {"id": 876, "r": "Меньше разговоров, больше дел."}, {"id": 877, "r": "Пустой болтовней гостя не накормишь."}, {"id": 878, "r": "Берегись тех, кто словами шелка стелет, а враньем рубли раздает."}, {"id": 879, "r": "Опьяневший от водки – очнется, пьяный от чурека (изобилия, пресыщения) нет."}, {"id": 880, "r": "Пьяный, как споткнется, так и очнется, опьяневший же от чурека (заевшийся) очнет"}, {"id": 881, "r": "Хоть и горьковат, но сын лучше; хоть и солоновата, но дочь лучше."}, {"id": 882, "r": "Пусть и горькая, но правда все же лучше."}, {"id": 883, "r": "Не познав вкуса горького, не узнаешь вкуса сладкого."}, {"id": 884, "r": "Труд кормит всех людей мира."}, {"id": 885, "r": "Трудом добытое крепко зажато в кулаке; то, что досталось легко, лежит на открыто"}, {"id": 886, "r": "Добытое трудом – дороже, а свое дитя – любимее."}, {"id": 887, "r": "Старую скотину даже воры не уводят."}, {"id": 888, "r": "Старый волк хитрее."}, {"id": 889, "r": "Старое – похвали, молодое – купи."}, {"id": 890, "r": "Старый (бывалый) волк двух овец уносит."}, {"id": 891, "r": "Старый пройдет двуми путями, пока молодой идет одним."}, {"id": 892, "r": "За ложную клятву бог наказывает."}, {"id": 893, "r": "Лучше ходить босиком, чем в тесных чувяках."}, {"id": 894, "r": "Бедняк боялся, что рассол от сыра кончится (и придется чурек есть сухим)."}, {"id": 895, "r": "Бедного и воры не любят."}, {"id": 896, "r": "Богач ли, бедняк ли – последнее его достояние – саван."}, {"id": 897, "r": "Бедного не любят ни в семье, ни в народе."}, {"id": 898, "r": "Голод и бедность – временная непогода; мужество и смелость – несокрушимый Казбек"}, {"id": 899, "r": "Бедняк усы смазывал курдюком (чтобы посчитали его богатым)."}, {"id": 900, "r": "Хорошо бедняку: ему не надо хлев держать на запоре."}, {"id": 901, "r": "У бедняка и посуда чистая, и мух в доме не бывает."}, {"id": 902, "r": "Лишь обеднев, узнаешь, кто был твоим истинным другом."}, {"id": 903, "r": "Неправедно нажитое богатство греховно."}, {"id": 904, "r": "Накапливать грехи – мостить дорогу в ад."}, {"id": 905, "r": "Двор вора бурьяном зарастает."}, {"id": 906, "r": "Вор непременно становится клятвопреступником."}, {"id": 907, "r": "Мясо лучше, даже если оно и жилистое."}, {"id": 908, "r": "Избалованная кошка постель измарала."}, {"id": 909, "r": "Не было ума в молодости, так и к старости (к седине) не прибавится."}, {"id": 910, "r": "Молодой старого не понимает, старый же молодого понимает."}, {"id": 911, "r": "Сколько ни тверди: “Я мужчина” – мужчиной не станешь."}, {"id": 912, "r": "Конь и жена (лучше других) узнают (настоящего) мужчину."}, {"id": 913, "r": "Пока мужчина где-то ходит, чтобы обеспечить семью, жена дома детей к себе приваж"}, {"id": 914, "r": "Если метнется настояший мужчина, он даже сквозь скалу пролетит."}, {"id": 915, "r": "Мужчина находится во власти своего языка."}, {"id": 916, "r": "Мужественному всегда достойные дела достаются, а кокетливому (женоподобному) дос"}, {"id": 917, "r": "Мужчине не приличествует болтать и сплетничать."}, {"id": 918, "r": "Мужчине – ружье, сабля, кинжал; женщине – наперсток, игла, нитки."}, {"id": 919, "r": "Мужчина должен бояться осрамить (опозорить) свою папаху."}, {"id": 920, "r": "Слово настоящего мужчины из стали выковано."}, {"id": 921, "r": "Цена мужчины зависит от него самого."}, {"id": 922, "r": "По одежде мужчины можно узнать, что у него за жена."}, {"id": 923, "r": "Мужское слово должно быть весомым (твердым)."}, {"id": 924, "r": "Молодому нужна невеста, а старику – кровать."}, {"id": 925, "r": "Лучше целый день идти пешком, чем одну минуту разговаривать с глухим."}, {"id": 926, "r": "Того, кто сунулся в берлогу, не осмотревшись, медведь разорвал."}, {"id": 927, "r": "Лишь ублюдок может ткнуть кинжалом (позорное действие)."}, {"id": 928, "r": "Вор на вора не доносит."}, {"id": 929, "r": "Еда вкусна, когда ешь, опережая других."}, {"id": 930, "r": "Непогода с севера – жена, у которой умер муж, - слегка всплакнет и успокоится; н"}, {"id": 931, "r": "Мастерство вора – не мастерство, ловкость вора – не ловкость."}, {"id": 932, "r": "Вору и мир тесен."}, {"id": 933, "r": "Вор вора узнает."}, {"id": 934, "r": "Крыша для вора – синее небо; постель его – черная земля; подушка ему – локоть по"}, {"id": 935, "r": "Хозяин, убитый взломщиком, остался неотомщенным (т.к. вор скрывается); а грабите"}, {"id": 936, "r": "Вор вора хвалит."}, {"id": 937, "r": "Бог рассмеялся, когда вор обворовал вора."}, {"id": 938, "r": "Вор мечтает, чтобы все пристрастились к воровству."}, {"id": 939, "r": "Кизяками большой огонь не разжечь."}, {"id": 940, "r": "Пес не забывает то, что он щенком выучил."}, {"id": 941, "r": "Глазу с бельмом весь мир черным кажется."}, {"id": 942, "r": "Что белая, что черная – свинья, она и есть свинья."}, {"id": 943, "r": "Белые руки чужой труд любят."}, {"id": 944, "r": "Когда встречающий на зурне заиграл, пришедший затанцевал."}, {"id": 945, "r": "Сколь храбрым бы ни был молодец, мужского ему не прибавится (смерть не отодвинет"}, {"id": 946, "r": "Колючка, лишь только пропастет, уже бывает острой."}, {"id": 947, "r": "Частенько повторяя “чуточку подвинься”, человека в пропасть столкнули."}, {"id": 948, "r": "Кто не знает цену малому, тот не сможет оценить большое."}, {"id": 949, "r": "Свечу зажигают до наступления темноты."}, {"id": 950, "r": "Трава, выросшая в яме, не похожа на другую траву."}, {"id": 951, "r": "Глубокая река плавно (величаво) течет."}, {"id": 952, "r": "Из корней конопли вырастают лишь коноплянные стебли."}, {"id": 953, "r": "Огонь горит там, откуда идет дым."}, {"id": 954, "r": "Без дыма очага не бывет, не ошибающихся людей также не бывает."}, {"id": 955, "r": "Говорить там, где тебя никто не слушает, все равно, что играть на зурне среди мо"}, {"id": 956, "r": "Крыша течь перестанет, когда дождь пройдет, а человек от своей никчемности избав"}, {"id": 957, "r": "Молчавший в выигрыше перед говорящим."}, {"id": 958, "r": "Болезнь заставляет охать."}, {"id": 959, "r": "Неблагородный за всю свою жизнь хотя бы раз, но заорет по-ослиному или начнет ва"}, {"id": 960, "r": "Ребро, вынесшее тяготы, гнется, но не ломается."}, {"id": 961, "r": "Мехи раздувают огонь; ученье развивает ум."}, {"id": 962, "r": "Как осел не станет скакуном, так и холоп не станет князем."}, {"id": 963, "r": "Высокая папаха ума не добавляет."}, {"id": 964, "r": "Невозможно свалить высокую гору, как невозможно оболгать правду."}, {"id": 965, "r": "Высокому дереву нужны глубокие корни, а человеку – большая родня."}, {"id": 966, "r": "Как лампа освещает дом, так учение обостряет ум."}, {"id": 967, "r": "Необученный жеребец остался неуком."}, {"id": 968, "r": "Легко угнать бесхозный скот; легко вершить судьбу девушки, не имеющей брата."}, {"id": 969, "r": "Не хватай за бороду ее хозяина, схватив же, не отпускай."}, {"id": 970, "r": "Земля дала благодать тому, кто ее любит."}, {"id": 971, "r": "Будешь копаться в земле – наткнешься на золото."}, {"id": 972, "r": "Даже колышек, вбитый в землю, имеет своего хозяина."}, {"id": 973, "r": "Чтобы земля стала плодородной, ее надо полить хотя бы каплей пота."}, {"id": 974, "r": "Кинул в землю зерно – получил пользу, дал деньги в долг – пожалел."}, {"id": 975, "r": "Чем искать в земле клады, лучше извлекать пользу от самой земли."}, {"id": 976, "r": "Когда в землю ударит огненная головешка (бога грозы Селы), земля начинает парить"}, {"id": 977, "r": "Земля человека кормит, его она и забирает."}, {"id": 978, "r": "Раб не станет князем, как и ишак не станет конем."}, {"id": 979, "r": "Кто болтает лишнее, у того всегда нелады."}, {"id": 980, "r": "Для умеющего вертеться этот мир – накрытый стол, а для не умеющего – горькая жел"}, {"id": 981, "r": "Ищущая собака лучше отсиживающегося волка."}, {"id": 982, "r": "Если кого шепотом похвалить, то он заметно зазнается."}, {"id": 983, "r": "По ушам осла узнали, по запаху – свинью."}, {"id": 984, "r": "Если ишака не узнали по ушам, то узнали по упрямству."}, {"id": 985, "r": "Происходит не то, что мы предполагаем, а то, что нам суждено."}, {"id": 986, "r": "Поссорился с соседом – все равно, что стена дома рухнула."}, {"id": 987, "r": "Трудно одолеть гору, а одолеешь – легко."}, {"id": 988, "r": "Одинокая чинара на вершине горы долго не стоит."}, {"id": 989, "r": "Камень, сорвавшийся с горы, остановился лишь внизу у реки."}, {"id": 990, "r": "Корова, отелившаяся в горах, будет хорошо доиться (пастись) на равнине."}, {"id": 991, "r": "Горы озаряет солнце, человека украшает ум."}, {"id": 992, "r": "Пропадет бесследно сделанное невпопад."}, {"id": 993, "r": "Шагнул, куда не надо, и оказался в грязи."}, {"id": 994, "r": "Нечего играть на гармони, когда вечеринка уже закончилась."}, {"id": 995, "r": "Шуточки до добра не доводят."}, {"id": 996, "r": "Оберегаться и бояться – не одно и то же."}, {"id": 997, "r": "Низкорослый человек мнителен, высокий – неуклюж."}, {"id": 998, "r": "Говаривали: “Если не дадите (чего-то), сколько хочу, то дайте, сколько можете”."}, {"id": 999, "r": "Вовсю хвали галушки, но вовсю уминай мясо."}, {"id": 1000, "r": "Не приставляй кошку охранять крынку молока."}, {"id": 1001, "r": "Храбрый дурак – горе людское."}, {"id": 1002, "r": "Кинжал дурака страшнее кинжала храбреца."}, {"id": 1003, "r": "Даже пес (смерть) боится храброго человека."}, {"id": 1004, "r": "Не надо быть мужчиной, чтобы выпить; мужчиной надо быть, чтобы не опозориться."}, {"id": 1005, "r": "Собутыльник не может быть другом."}, {"id": 1006, "r": "Тот, для кого водка сладка, людям горек."}, {"id": 1007, "r": "Пьяница начисто теряет совесть."}, {"id": 1008, "r": "Питие веселит душу и растранжиривает богатство."}, {"id": 1009, "r": "Солнце выглянет – луна исчезает; выглянет луна – исчезает звезда."}, {"id": 1010, "r": "Чесотка, появившись на западе, дошла до востока."}, {"id": 1011, "r": "Коса – это муж косаря."}, {"id": 1012, "r": "У косаря голенные кости стали монолитными (без костного мозга)."}, {"id": 1013, "r": "В доме косаря будет достаток (жирного, сытного)."}, {"id": 1014, "r": "Кто точит серп, тот ест хлеб; кто точит нож, тот захлебнется в крови."}, {"id": 1015, "r": "Невеста, которую лелеяли, приговаривая: “Да умрем мы вместо тебя”, - стала говор"}, {"id": 1016, "r": "Когда для всех наступят плохие времена, и ты готовься к худшему."}, {"id": 1017, "r": "Кто стремился быть для всех хорошим, тот потерял уважение."}, {"id": 1018, "r": "Удовлетворить желания всех не смог даже сам бог Дяла."}, {"id": 1019, "r": "Самый богатый тот, кто вырастил хорошее потомство."}, {"id": 1020, "r": "“Самое верное существо – собака”, утверждал пастух."}, {"id": 1021, "r": "Не всегда бывает и мулле мовлюд."}, {"id": 1022, "r": "Даже река постоянно не течет по одному и тому же руслу."}, {"id": 1023, "r": "Когда человека похвалят на толщину иголки, он заметно портится."}, {"id": 1024, "r": "Куда иголка, туда и нитка; куда муж, туда и жена."}, {"id": 1025, "r": "Искавший мира – жил, искавший ссоры и войны – погиб."}, {"id": 1026, "r": "Мир – это жизнь людей, война – смерть сыновей."}, {"id": 1027, "r": "Счастье мужчины в странствиях, счастье женщины в детях."}, {"id": 1028, "r": "Хочешь узнать цену кого-то из мужчин – спроси о нем у женщины (жены)."}, {"id": 1029, "r": "Свекровь и невестка из одног кривого ребра сделаны."}, {"id": 1030, "r": "У вышедшей замуж девушки и в отцовском доме должен быть муж (смысл: если побежит"}, {"id": 1031, "r": "Не ужившуюся с родственниками мужа отправили в отцовский дом."}, {"id": 1032, "r": "Мирный человек любит ночь лунную, вор – безлунную."}, {"id": 1033, "r": "Не приобретенное за плату приобрели сладкими речами."}, {"id": 1034, "r": "Хороший гость приходит прямо к ужину."}, {"id": 1035, "r": "Попавшая в мед муха, чем больше бьется, тем больше увязает."}, {"id": 1036, "r": "Ложка, которая привыкла к меду, треснула, когда ее окунули в рассол."}, {"id": 1037, "r": "Вши идут к овчине, деньги идут к деньгам."}, {"id": 1038, "r": "Нет толку, что курдюком мажешь по усам, а не ешь его."}, {"id": 1039, "r": "Ленивую лошадь хвали и быстрее продавай; выросшую дочь хвали и быстрее замуж выд"}, {"id": 1040, "r": "Лентяй – улитка, проворный – волк."}, {"id": 1041, "r": "Ленивый становится шустрым, когда сядет обедать."}, {"id": 1042, "r": "Ленивый бык раньше других угодил в котел."}, {"id": 1043, "r": "У лентяя и собаки ленивые."}, {"id": 1044, "r": "Самое тучное на свете – земля. Самое доброе на свете – сердце матери."}, {"id": 1045, "r": "Как ни много было б добра – глаз не насытится; как ни много было бы красивого – "}, {"id": 1046, "r": "Как ни велико дерево, маленький топор его валит."}, {"id": 1047, "r": "Какую большую папаху не надевай, ума не прибавится."}, {"id": 1048, "r": "Как ни длинна дорога, она заканчивается; как долго ни живи, но час смерти наступ"}, {"id": 1049, "r": "Как ни велико богаство, но если оно постоянно не пополняется, оно вскоре иссякае"}, {"id": 1050, "r": "Сколько бы дожди ни лили, и сколько бы люди ни умирали, земля никогда не насытит"}, {"id": 1051, "r": "Сколько ни блуждай по свету, лишь дома душа находит успокоение."}, {"id": 1052, "r": "Сколько ни ворочаются камни в реке, они и вода не смешиваются."}, {"id": 1053, "r": "Сколько ни зла зима – все же она уходит; как ни долго длится горе – и оно проход"}, {"id": 1054, "r": "Трава к травинке – вырастает копна."}, {"id": 1055, "r": "Хотя мед и сладок, но и его кое-кто не ест (не любит)."}, {"id": 1056, "r": "Когда попросили самое сладкое, принесли язык; когда же попросили самое горькое, "}, {"id": 1057, "r": "И сладкого, и горького, и острого должно быть в меру."}, {"id": 1058, "r": "Горькая правда лучше сладкой лжи."}, {"id": 1059, "r": "Если бы строили языком, башни были бы до самых небес."}, {"id": 1060, "r": "Язык и возносит (честь) человека, он же и унижает его."}, {"id": 1061, "r": "Если хочешь, чтобы твою тайну узнали все, поведай ее по секрету жене."}, {"id": 1062, "r": "Счастье человека невозможно без счастья родной страны."}, {"id": 1063, "r": "Оторвавшийся от родны скинул без могилы."}, {"id": 1064, "r": "Истинную цену своей Родины узнает лишь тот, кто лишился ее."}, {"id": 1065, "r": "Глаз, выколотый всем миром, остался неотомщенным."}, {"id": 1066, "r": "За кем стояла родина, тот выжил; от кого она отреклась – сгинул."}, {"id": 1067, "r": "Несчастлив тот, кто в делах и мыслях не со своей страною."}, {"id": 1068, "r": "Голодный волк ел лед на горных вершинах."}, {"id": 1069, "r": "Не нужны голодному твои умные речи – ты ему стол накрой."}, {"id": 1070, "r": "Голодный не слышит молитвы – он думает об ужине."}, {"id": 1071, "r": "Для проголодавшегося самая вкусная на свете еда, которая первая ему подвернулась"}, {"id": 1072, "r": "Не позволяй готовить еду голодному, а печь разжигать промерзшему."}, {"id": 1073, "r": "Жалкий сирота счастливее того, кто родины лишился."}, {"id": 1074, "r": "Прокисшая каша булькает (говорят о пустобрехе)."}, {"id": 1075, "r": "Прокисшее молоко переспорило свежее."}, {"id": 1076, "r": "Неправедно нажитое что пыль, унесенная ветром."}, {"id": 1077, "r": "Как правду ни таи, она все равно наружу выйдет."}, {"id": 1078, "r": "Наше благополучие – это здоровье."}, {"id": 1079, "r": "Иметь усы и бороду – еще не значит быть мужчиной."}, {"id": 1080, "r": "На чашке с медом много мух собирается."}, {"id": 1081, "r": "Бороды бывают и у козлов, усы бывают и у котов."}, {"id": 1082, "r": "Иблис (шайтан) сыграл на зурне, когда мулла совершил подаяние."}, {"id": 1083, "r": "Лопаясь от переедания, мулла пытался снять пробу с очередного блюда."}, {"id": 1084, "r": "Перед тем, как начать какое-либо дело, хорошее или плохое, человек должен сначал"}, {"id": 1085, "r": "Нет человека, который бы никогда не знал горя."}, {"id": 1086, "r": "Говорят, бог Дяла сказал: “Я могу изменить все, кроме характера одного-единствен"}, {"id": 1087, "r": "Язык сплетника змея поедает (на том свете)."}, {"id": 1088, "r": "“Язык сплетника (доносчика), - говаривал шайтан, - это мой язык”."}, {"id": 1089, "r": "Говорят, пусть у сплетника язык отсохнет, пусть у доносчика во время доноса душа"}, {"id": 1090, "r": "Язык сплетника будут в судный день молоть на мельнице."}, {"id": 1091, "r": "Единственное средство излечить сплетника – вырвать его язык."}, {"id": 1092, "r": "Хоть язык маленький и кругленький, но нет ничего длиннее и острее его."}, {"id": 1093, "r": "Язык острее и кинжала, и сабли."}, {"id": 1094, "r": "У молчуна голова не болит."}, {"id": 1095, "r": "Любители сплетен идут на сельские посиделки."}, {"id": 1096, "r": "Муж любит жену молчаливую."}, {"id": 1097, "r": "Язык острее кинжала."}, {"id": 1098, "r": "Случалось, что долю некоего человека люди поделили (отобрали), хотя у него и был"}, {"id": 1099, "r": "Некогда лиса жаловалась: “Было время – в рот залетали одни перепелки, а теперь и"}, {"id": 1100, "r": "Некогда поговаривали: “Упаси нас бог от сытых муталимов”."}, {"id": 1101, "r": "Некогда говорили: “Не дури меня, рассказывая сны и сказки”."}, {"id": 1102, "r": "Умирающему с голоду не нужны золотые горы."}, {"id": 1103, "r": "Одичавший (бесхозный) конь становится кусачим, без твердой мужской руки жена ста"}, {"id": 1104, "r": "Ходил бок о бок с плохим человеком – и бок прогнил."}, {"id": 1105, "r": "Живот не заболит у того, кто съест долю закапризничавшего за едою."}, {"id": 1106, "r": "Не подует ветер, холода не наступят; не будешь богат, люди любить не будут."}, {"id": 1107, "r": "Не шути с обидчивым человеком."}, {"id": 1108, "r": "Если съесть долю капризного, от нее больше насытишься."}, {"id": 1109, "r": "Для ишака всегда груз найдется."}, {"id": 1110, "r": "Веревка хороша длинная, а речь - короткая."}, {"id": 1111, "r": "Как ни длинна веревка – конец будет; как ни хитра ложь – обнаружится."}, {"id": 1112, "r": "Повод (веревка) оборвался – ишак ушел."}, {"id": 1113, "r": "Даже среди грязи и помоев золото остается золотом."}, {"id": 1114, "r": "Ногтями скребут там, где чешется."}, {"id": 1115, "r": "Зять не станет сыном, сноха не станет дочерью."}, {"id": 1116, "r": "Оставь другим девушку, у которой мать хорошая: за себя сватай девушку, которая с"}, {"id": 1117, "r": "Что мать без дочери, что дочь без матери – обе достойны жалости."}, {"id": 1118, "r": "Всплакнула жена, заплакали дети, а за ними заревел и отец."}, {"id": 1119, "r": "Когда мать бьет ребенка, под руку подушку подкладывает."}, {"id": 1120, "r": "Мать сына вскармливает, отец делает из него мужчину."}, {"id": 1121, "r": "Дочь не насытилась от того, что поела мать; мать же насытилась от того, что поел"}, {"id": 1122, "r": "Да не родит мать одного-единственного сына, но если он родится, пусть и он не жи"}, {"id": 1123, "r": "Не выдать замуж дочь, которую хвалит мать, не сбыть и коня, которого хвалит хозя"}, {"id": 1124, "r": "Глаза, гневно глянувшие на мать, ослепнут."}, {"id": 1125, "r": "Мать любит сына, а сын любит невесту."}, {"id": 1126, "r": "У достойных людей даже пес лает свысока."}, {"id": 1127, "r": "Осуждающий других тем самым себя осуждает."}, {"id": 1128, "r": "Богат настолько, что люди завидуют, да еще жеребенок на лугу пасется."}, {"id": 1129, "r": "Кто считает людей дураками, сам еще больший дурак (ненормальный)."}, {"id": 1130, "r": "Кто захотел одолеть людей, тот сначала разжигает между ними вражду."}, {"id": 1131, "r": "Сделал людям добро – это твое богатство."}, {"id": 1132, "r": "Услужил людям – себе услужил."}, {"id": 1133, "r": "Сколь времени бы ни прошло, а сказанное любезное народу слово будет живо; но вск"}, {"id": 1134, "r": "Не закидывай веревку на шею других, не то она может сдавить твою шею."}, {"id": 1135, "r": "К тому, что сделано другими, относятся легко, то, что делают сами, ценят высоко."}, {"id": 1136, "r": "Другим грозится дышлом, а взамен получает удары ярмом."}, {"id": 1137, "r": "Кто стремился другим навредить, тот сам вреда не избежал."}, {"id": 1138, "r": "Люди могут человека и во главу стола посадить, а могут и в конец стола пересадит"}, {"id": 1139, "r": "Если людская молва утверждает, что я (мужчина) беременный, значит, так оно и ест"}, {"id": 1140, "r": "Когда люди шерсть стирали, лисица хвост полоскала."}, {"id": 1141, "r": "На других и вошь с гнидою увидит, а на себе не видит ослиную голень."}, {"id": 1142, "r": "Плохая курица яйца носит соседям, а по нужде ходит дома."}, {"id": 1143, "r": "Сделанное народом человеку не сломать, сделанное человеком народ сломит."}, {"id": 1144, "r": "Выросший среди людей перехитрил выросшего среди овец."}, {"id": 1145, "r": "У коня, которого одалживают, вся спина язвами покрывается."}, {"id": 1146, "r": "Трудом добытый пятак дороже одолженного рубля."}, {"id": 1147, "r": "Чужое богатство кажется огромным."}, {"id": 1148, "r": "Если ты не заставишь себя уважать, никто уважать тебя не станет."}, {"id": 1149, "r": "Кто других считает хуже себя, тот сам становится ниже их."}, {"id": 1150, "r": "И людям ненавистен юноша, не почитающий своих родителей."}, {"id": 1151, "r": "Будешь людям говорить “бук!” (возглас чванливости), они заставят тебя произнести"}, {"id": 1152, "r": "Кого любят люди, того любит и бог Дяла."}, {"id": 1153, "r": "Если будешь говорить гадости о других, то никто о тебе доброго слова не замолвит"}, {"id": 1154, "r": "Берегись человека, оговаривающего других."}, {"id": 1155, "r": "Пренебрегавший людьми лишился народа."}, {"id": 1156, "r": "Человек без людей – что сокол без крыла."}, {"id": 1157, "r": "Тот не человек, кто не заодно со своим народом."}, {"id": 1158, "r": "Никогда не пропадет тот, кто с людьми находит общий язык."}, {"id": 1159, "r": "Холодно в доме у того, кто перессорился с людьми."}, {"id": 1160, "r": "Умение ладить с людьми – половина богатства (успеха)."}, {"id": 1161, "r": "Добрая людская молва – самое большое богатство."}, {"id": 1162, "r": "Если хочешь поссориться с людьми, дай им в долг."}, {"id": 1163, "r": "Бывалый переспорит начитанного."}, {"id": 1164, "r": "Кто дружит с людьми – богатеет, а кто враждует – беднеет."}, {"id": 1165, "r": "Горе, пережитое вместе с народом, - не горе."}, {"id": 1166, "r": "Не уживающегося с людьми и в родном доме не любят."}, {"id": 1167, "r": "Неуживчивый человек – вода, ушедшая в песок (пропал)."}, {"id": 1168, "r": "Кто людей и мусор принимает за одно и то же, тот сам окажется в навозной куче."}, {"id": 1169, "r": "У кого за дверью есть пасущаяся овца, у того в доме не иссякнет благодать."}, {"id": 1170, "r": "Хорошая жена должна быть такой: ее гонят в дверь, а она возвращается в окно."}, {"id": 1171, "r": "В длинной дороге, на черкесском иноходце, достаточно раз хлестнуть доброго коня;"}, {"id": 1172, "r": "Будет удача, если выйдя в путь, встретишь красную змею (медянку). И не будет уда"}, {"id": 1173, "r": "В дороге нужен товарищ – хотя бы палка в руке."}, {"id": 1174, "r": "Подковы коня проверяют не тогда, когда уже находятся в пути."}, {"id": 1175, "r": "Кто шел по дороге, проделал один путь, а шедший по бездорожью проделал двойной п"}, {"id": 1176, "r": "Сердце матери лежит в груди ее сына, а сердце сына лежит за семью горами."}, {"id": 1177, "r": "Легко попасть на язык сплетников, но нелегко очиститься от сплетен."}, {"id": 1178, "r": "Сплетня, пошедщая по кругу, стала правдой."}, {"id": 1179, "r": "Хлебом, вырванным из чужого рта, не насытишься."}, {"id": 1180, "r": "Не познавшему тяжесть чужого кулака, свой кулак казался кувалдой."}, {"id": 1181, "r": "Севший считать чужое богатство не закончил счет, потому что в лампе керосин зако"}, {"id": 1182, "r": "Кто не боялся вреда от людей, тот не достиг благополучия."}, {"id": 1183, "r": "Кто не сочувствовал чужому горю, остался один на один со своим."}, {"id": 1184, "r": "Люди избегают тех, кто стремится узнать из тайны."}, {"id": 1185, "r": "Не начинай варить кашу в расчете на чужое масло."}, {"id": 1186, "r": "Выпавший из людских сердец (позабытый) разбился насмерть."
