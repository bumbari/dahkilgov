}, {"id": 1187, "r": "Без долгов за собою (кровная месть и пр.) не умер гордый мужчина."}, {"id": 1188, "r": "Чужой конь кажется иноходцем."}, {"id": 1189, "r": "Упаси нас бог Дяла от людей, которые чужую удачу воспринимают как свое поражение"}, {"id": 1190, "r": "Достоинство народа (родни) в его многочисленности."}, {"id": 1191, "r": "Опозорится тот, кто затеет склоку с женщинами."}, {"id": 1192, "r": "Кто не остерегался сплетен, тот ходил оклеветанным."}, {"id": 1193, "r": "Кто хотел греться у чужого очага, замерз."}, {"id": 1194, "r": "Не дай нам бог разбираться в чужих тайнах."}, {"id": 1195, "r": "У того, кто стремился выпрямить дым чужой трубы, свой дым по земле стлался."}, {"id": 1196, "r": "Своя дружина надежнее чужой башни."}, {"id": 1197, "r": "Лучше быть рабом на родной земле, чем князем на чужбине."}, {"id": 1198, "r": "Прежде чем кого-то схватить за бороду, побрейся."}, {"id": 1199, "r": "Не знающий чужеземного врага не узнает друга в своей стране."}, {"id": 1200, "r": "Свой щенок лучше чужого пса."}, {"id": 1201, "r": "Кто мечтал о чужом богатстве, тот свое растерял."}, {"id": 1202, "r": "Чем завидовать чужому добру, лучше свое накапливать."}, {"id": 1203, "r": "Надеявшийся на подаяние лег спать, не поужинав."}, {"id": 1204, "r": "Людским подаянием не насытишься."}, {"id": 1205, "r": "Сам чести лишается тот, кто стремится обесчестить других."}, {"id": 1206, "r": "Надеявшийся на дармовой хлеб остался голодным."}, {"id": 1207, "r": "Несчастен тот, кому люди перестали верить."}, {"id": 1208, "r": "Чужое добро кажется слаще."}, {"id": 1209, "r": "Как бы в гостях жарко печь ни топили, а дома теплее."}, {"id": 1210, "r": "Привыкший в чужих домах быть тамадой, у себя дома начал вести себя как дорогой г"}, {"id": 1211, "r": "Собака своего села лучше жителя чужого села."}, {"id": 1212, "r": "Тяжесть чужого горя познается лишь тогда, когда горе придет к тебе самому."}, {"id": 1213, "r": "Чужое едят глазами, свое – зубами."}, {"id": 1214, "r": "Своя чуречная корка сытнее, чем мясо, съеденное в гостях."}, {"id": 1215, "r": "Своя телка лучше, чем чужая корова."}, {"id": 1216, "r": "Перессорились снохи – перессорились и братья."}, {"id": 1217, "r": "Сильная свинья вырыла съедобный корень, росший посреди укатанной дороги."}, {"id": 1218, "r": "Сила хороша, если у тебя есть голова."}, {"id": 1219, "r": "Нет проку от твоей силы, если ее негде применить."}, {"id": 1220, "r": "Праведно приобретенное – людьми почитаемое, неправедно приобретенное – людям нас"}, {"id": 1221, "r": "На корне крапивы не растут ни другая трава, ни пшеница."}, {"id": 1222, "r": "На одном поле не уживаются крапива и кукуруза."}, {"id": 1223, "r": "Если все матери хорошие, откуда же берутся злые тещи?"}, {"id": 1224, "r": "Без попутчика дорога в два раза труднее."}, {"id": 1225, "r": "И пчела жалит, когда посягнут на ее мед."}, {"id": 1226, "r": "Рука, привыкшая к плугу, сильнее руки, привыкшей к кинжалу."}, {"id": 1227, "r": "Исли всадник имеет седло, у него будет конь; если же он имеет коня, но без седла"}, {"id": 1228, "r": "Червяк боится, что кончится земля и он подохнет с голоду."}, {"id": 1229, "r": "Говорят: если ты лиса, то я лисий хвост."}, {"id": 1230, "r": "Птицу красят перья, человека красят знания."}, {"id": 1231, "r": "И птица любит гнездиться у себя на родине."}, {"id": 1232, "r": "Даже птица не гадит в своем гнезде."}, {"id": 1233, "r": "Лжеца нельзя даже во двор пускать."}, {"id": 1234, "r": "Лгун учится ложной клятве, вор же ищет лжесвидетеля."}, {"id": 1235, "r": "Лгун людям не верит."}, {"id": 1236, "r": "Беги быстрее от лжеца, пока он не сделал тебе какую-нибудь пакость."}, {"id": 1237, "r": "Сказанное на пахоте нашлось на жатве."}, {"id": 1238, "r": "От сорняка избавишься, только вырвав его с корнем."}, {"id": 1239, "r": "Смотри, чтобы и шампур (из дерева) не сгорел, и мясо не осталось сырым."}, {"id": 1240, "r": "Репейник без корня – игрушка для ветра."}, {"id": 1241, "r": "Без корней трава не растет, без труда не бывает достатка."}, {"id": 1242, "r": "Дерево без корней засыхает, человек без Родины – безродный бродяга."}, {"id": 1243, "r": "Каков корень, такова и трава; каково материнское молоко, таков и человек."}, {"id": 1244, "r": "У гостеприимного хозяина и еда кажется вкуснее."}, {"id": 1245, "r": "Дерево с глубокими корнями ветру не свалить, человека с многочисленной родней ни"}, {"id": 1246, "r": "Бесполезно в яйце искать волос."}, {"id": 1247, "r": "Не умеющий играть на гармошке твердит, что гармонь плоха."}, {"id": 1248, "r": "Танцуй, следуя гармошке, пой, следуя мелодии."}, {"id": 1249, "r": "Царская карета зайца поймала."}, {"id": 1250, "r": "У жестокого царя и подданые жестоки."}, {"id": 1251, "r": "Ребенку в люльке больше почета, чем самому падишаху."}, {"id": 1252, "r": "Хороши вместе чувяки и ноговицы, но сапоги лучше."}, {"id": 1253, "r": "Коварного человека дома не любят, а вне дома ненавидят."}, {"id": 1254, "r": "Один подстрекатель десятерых перессорил."}, {"id": 1255, "r": "Бездонную бочку не наполнить."}, {"id": 1256, "r": "Навозному жуку нужен навоз, а пчеле – мед."}, {"id": 1257, "r": "Даже царь засмеялся от радости, увидев гостя с подарком под мышкой."}, {"id": 1258, "r": "Если перевернуть посудину из нее не выльется то, чего в ней нет; если со змею в "}, {"id": 1259, "r": "Мужество не то, чем кичатся на майдане."}, {"id": 1260, "r": "У проводящего время на сельских посиделках поле заросло сорняками."}, {"id": 1261, "r": "С сельских посиделок (бездельников) ничего путного никто не унес."}, {"id": 1262, "r": "Богатство – что весенний снег: лишь солнце глянет – тут и растает."}, {"id": 1263, "r": "Нет толку от богаств, если нет здоровья и покоя."}, {"id": 1264, "r": "Богатство – до обеда, ум – до кончины."}, {"id": 1265, "r": "Где богатство, там и солнце теплее светит."}, {"id": 1266, "r": "Богатство приходит и уходит, а благородство, если оно ушло, уже никогда не верне"}, {"id": 1267, "r": "Труднее совладать с богатством, чем справиться с бедностью."}, {"id": 1268, "r": "Богатство к богатству идет."}, {"id": 1269, "r": "Лишь потом и кровью добывается богатство."}, {"id": 1270, "r": "Учишь наживать богатство, учи его оберегать."}, {"id": 1271, "r": "Пресытившийся богач смотрит на всех свысока."}, {"id": 1272, "r": "Богатством ума, чести и благородства не купишь."}, {"id": 1273, "r": "Не завидуй богатству, завидуй уму."}, {"id": 1274, "r": "Богатства не ценит тот, кто не добыл его своим потом."}, {"id": 1275, "r": "Ослепленный богатством забывает про стыд и благородство."}, {"id": 1276, "r": "Хочешь спастись, ног не жалей."}, {"id": 1277, "r": "Если бы ружье обладало разумом оно бы и гору разнесло."}, {"id": 1278, "r": "Лучше спокойная бедность, чем гложущее душу богатство."}, {"id": 1279, "r": "У терпеливого лопаточная кость не треснула."}, {"id": 1280, "r": "Не верь тихоне, не бойся задиры."}, {"id": 1281, "r": "Спокойствие от бога Дялы, горячность (вспыльчивость) от шайтана."}, {"id": 1282, "r": "Собиравшийся мстить кровник говорил: “Терпение – это хорошая вещь, если б удалос"}, {"id": 1283, "r": "Спокойствие – ключ от рая."}, {"id": 1284, "r": "Нет человека, который бы не ошибся, нет коня, который бы не споткнулся."}, {"id": 1285, "r": "Тот не человек, кого люди не чтут."}, {"id": 1286, "r": "Человека узнаешь, когда от него тебе что-либо понадобится."}, {"id": 1287, "r": "Человек на месте, когда он среди равных себе."}, {"id": 1288, "r": "Свадьбе идет веселье, похоронам приличествует скорбь."}, {"id": 1289, "r": "Женишься или не женишься – в любом случае будешь раскаиваться."}, {"id": 1290, "r": "Женить молодца – стреножить его."}, {"id": 1291, "r": "Напугай человека, и он станет податливее."}, {"id": 1292, "r": "Никому не пожелай из правды делать кривду, а из кривды делать правду."}, {"id": 1293, "r": "Цену человека люди знают."}, {"id": 1294, "r": "Человек – гость человека; душа человека – гость его тела."}, {"id": 1295, "r": "И в небеса, и в морские глубины проникнет человек, но он не сможет проникнуть в "}, {"id": 1296, "r": "Человек привык надеяться на лучшее завтра (живет надеждами)."}, {"id": 1297, "r": "Человек рождается для будущей смерти."}, {"id": 1298, "r": "Река Асса ревет, когда она несет человека."}, {"id": 1299, "r": "Человеческий глаз насытит лишь земля могильная."}, {"id": 1300, "r": "Жизнь человека – не более мига движения глазного века."}, {"id": 1301, "r": "Как течет жизнь человека? День проходит, ночь настает; год проходит, другой наст"}, {"id": 1302, "r": "Тайна остается в сердце, пока язык на нее не донесет."}, {"id": 1303, "r": "То, что суждено, мулла не изменит."}, {"id": 1304, "r": "Человеку нужна учеба, как дождь нужен иссохшей земле."}, {"id": 1305, "r": "Все хорошее и плохое в человеке родом из его дома."}, {"id": 1306, "r": "Собака различает труса и храбреца."}, {"id": 1307, "r": "Негоже, когда на одной ноге сапог, а на другой – чувяк."}, {"id": 1308, "r": "Красота человека – хороший характер."}, {"id": 1309, "r": "Благородство человека узнали за столом."}, {"id": 1310, "r": "Каков человек, таковы и его друзья."}, {"id": 1311, "r": "Плохое слово, сказанное о ком-нибудь, непременно дойдет до него."}, {"id": 1312, "r": "Добро ли, зло ли сделал человек – приходит день, когда ему за них воздается."}, {"id": 1313, "r": "От добрых дел хоть след да останется."}, {"id": 1314, "r": "Сделал доброе дело – себе сделал; поступил дурно – себе навредил."}, {"id": 1315, "r": "Человек из своих странствий привозит ум, а бродячая собака – кость."}, {"id": 1316, "r": "Человек обязан оберегать две вещи: свою душу и свою честь."}, {"id": 1317, "r": "Человек может знать лишь то, что он видит и слышит там, где он бывает."}, {"id": 1318, "r": "Попрошайка собаки не боится – собака его посоха боится."}, {"id": 1319, "r": "На подаяние (пожертвование) нельзя скупиться."}, {"id": 1320, "r": "Лучше спокойная бедность, чем богатство, которое вечно боишься потерять."}, {"id": 1321, "r": "Мой дом – святилище."}, {"id": 1322, "r": "Пока он меня не назвал ишаком, дай-ка я его первым назову."}, {"id": 1323, "r": "Голодные волки темноты дожидаются, а черные вороны утра не дождутся."}, {"id": 1324, "r": "Вечером плакавший утром смеялся."}, {"id": 1325, "r": "“Я иду, убив сделавшего мне доброе дело”, - хвастался человек черной души."}, {"id": 1326, "r": "По “саламу” бывает и ответный “алейкум”. (По привету и ответ)."}, {"id": 1327, "r": "Проклятие в первую очередь настигает того, кто его произнес."}, {"id": 1328, "r": "Благодать покидает дом, в котором звучат проклятия."}, {"id": 1329, "r": "Терпеливый солдат офицером стал."}, {"id": 1330, "r": "Тихоне не верь и вспыльчивого не бойся."}, {"id": 1331, "r": "Надо быть терпеливым; но если даже терпение кончилось, и тогда нельзя горячиться"}, {"id": 1332, "r": "Мужественного человека узнают по его умению быть терпеливым (сдержанным)."}, {"id": 1333, "r": "Лентяй говаривал: “Чем работать один час, лучше спать всю неделю”."}, {"id": 1334, "r": "Кто не понял слова “перестань”, того остановили грубой силой."}, {"id": 1335, "r": "Хочешь спокойной жизни – не ищи ссор и вражды."}, {"id": 1336, "r": "Пропащий тот (козел), кто женщину убьет."}, {"id": 1337, "r": "Головешка (молния) бога Селы величиною с просяное зерно, но валит огромное дерев"}, {"id": 1338, "r": "И жена должна быть слегка кокетливою."}, {"id": 1339, "r": "Жена хороша молодая, а друг – давний."}, {"id": 1340, "r": "Домосед и жене надоедает."}, {"id": 1341, "r": "Хорошая или плохая жена узнается по ее отношению к мужней родне и соседям."}, {"id": 1342, "r": "По одежде мужа можно узнать, какая у него жена."}, {"id": 1343, "r": "Против жены – храбрый лев, против мужчин – трусливый барашек."}, {"id": 1344, "r": "Муж, потакающий во всем жене, кажется женоподобным."}, {"id": 1345, "r": "Жена (женщина) и черта одолела, и дракона прогнала (из сказок)."}, {"id": 1346, "r": "Остерегайся стоячей (тихой) воды."}, {"id": 1347, "r": "Кто рано утром отправился в путь, тот до темноты дошел (до места)."}, {"id": 1348, "r": "Лестницу до неба не построишь, мост через море не наведешь."}, {"id": 1349, "r": "Того, кто не по праву занял почетное место, с позором отправили на свое (непочет"}, {"id": 1350, "r": "Сделай добро благородным людям, и ты приобретешь друзей. Сделай добро плохим люд"}, {"id": 1351, "r": "Легче искру загасить, чем потушить пожар."}, {"id": 1352, "r": "Куда долетит искра, туда дойдет и тепло."}, {"id": 1353, "r": "Нет ничего слаще души; нет ничего быстрее глаз."}, {"id": 1354, "r": "Совместная трапеза людей сближает."}, {"id": 1355, "r": "Не спеши и не забывай (о кровной мести)."}, {"id": 1356, "r": "Внутреннее (не показное) благородство крепче скалистого берега."}, {"id": 1357, "r": "Дружить со вспыльчивым – только ссориться с ним."}, {"id": 1358, "r": "Слишком быстрая река до моря не дотекла."}, {"id": 1359, "r": "Быстрая река берега разрушает."}, {"id": 1360, "r": "Быстрый дождь потоками ушел, а моросящий – землю пропитал."}, {"id": 1361, "r": "Голова кружится у того, кто быстро восходит на гору."}, {"id": 1362, "r": "Горячность продай, спокойствие (рассудительность) купи."}, {"id": 1363, "r": "Нетерпеливость (торопливость, суетливость) душу надорвала, а спокойствие гору од"}, {"id": 1364, "r": "Несдержанность – глупость, сдержанность – разумность (ум)."}, {"id": 1365, "r": "Поспешишь – пожалеешь, промедлишь – тоже пожалеешь."}, {"id": 1366, "r": "В спешке сделанное – горем обернулось."}, {"id": 1367, "r": "У поспешившего плотника стул на двух ножках оказался."}, {"id": 1368, "r": "Даже если бы с небес дождем сыпалось золото, все равно были бы бедные люди."}, {"id": 1369, "r": "Без туч на небе дождь не пойдет, без горя на сердце слезы не польются."}, {"id": 1370, "r": "Легко лишиться чести, трудно ее сохранить."}, {"id": 1371, "r": "Если ты жил в почете, то в почете же и скончаешься."}, {"id": 1372, "r": "Дом, в котором нет достатка, имеет одно преимущество: в нем не водятся мухи и мы"}, {"id": 1373, "r": "Несчастным становится якающий гордец."}, {"id": 1374, "r": "Сон одолевает даже того, кто считает себя самым сильным мужчиной."}, {"id": 1375, "r": "Того, кто “якает”, того люди “тыкают”."}, {"id": 1376, "r": "Чрезмерная жадность привела к тому, что приходится довольствоваться самым малым."}, {"id": 1377, "r": "Подаривший рассчитывает на ответный подарок."}, {"id": 1378, "r": "Болтливый обязательно сболтнет лишнее."}, {"id": 1379, "r": "Не верь тому, то чрезмерно хвалят."}, {"id": 1380, "r": "Тело, которое чрезмерно оберегали, изнежилось."}, {"id": 1381, "r": "Не будь чрезмерно сладким – как яблоко, будут тебя кусать; не будь грубым – отов"}, {"id": 1382, "r": "Слишком вознесшееся упадет, слишком растянувшееся порвется."}, {"id": 1383, "r": "Будешь слишком сладок, всякий тебя съест; будешь слишком горьким (ершистым) – вс"}, {"id": 1384, "r": "Подрались я и пристав: сначала пристав бил меня, потом меня бил пристав."}, {"id": 1385, "r": "Никчемный бездельник подобен бесплодному дереву."}, {"id": 1386, "r": "Чтобы попасть в рай, надо перейти по мосту Сурат."}, {"id": 1387, "r": "Жадина подавился курдюком и умер."}, {"id": 1388, "r": "Со скупцом не водись, потому что он продаст тебя за пару медных грошей."}, {"id": 1389, "r": "То, что не было прощено при примирении, простили при ссоре."}, {"id": 1390, "r": "Начало портиться (дело) – так пусть уж портится до конца."}, {"id": 1391, "r": "Когда правдивое слово положили на весы, ничто не смогло его перевесить."}, {"id": 1392, "r": "Если двойники-духи сговорятся, то свадебный сговор состоится."}, {"id": 1393, "r": "Купленный сегодня друг (за деньги) уже завтра сделается врагом."}, {"id": 1394, "r": "Что можно сделать сегодня, не откладывай на завтра: отложили на завтра лягушке ("}, {"id": 1395, "r": "Сегодня - мальчик, завтра – мужчина; завтра – мужчина, послезавтра – старик; пос"}, {"id": 1396, "r": "Спеши делать добро, словно уже завтра умрешь; спеши жить в свое удовольствие, сл"}, {"id": 1397, "r": "Сегодня солгал (поступил дурно) – завтра поплатился."}, {"id": 1398, "r": "Наседка лучше бездетной жены."}, {"id": 1399, "r": "Уж говорил: “Одного я боюсь: вдруг отделяемый от семьи женатый сын примет меня з"}, {"id": 1400, "r": "Пусть не будет братьев богаче и сильнее тебя; пусть будет больше братьев, равных"}, {"id": 1401, "r": "Надежность во всем – лицо человека."}, {"id": 1402, "r": "Опасен тот, кому нельзя доверять."}, {"id": 1403, "r": "Тот не друг, кому нельзя довериться."}, {"id": 1404, "r": "Подлость не осталась без возмездия."}, {"id": 1405, "r": "Двор подлых (предательских) людей зарастет крапивой."}, {"id": 1406, "r": "От подлости хорошего не жди."}, {"id": 1407, "r": "Хочешь уберечь свой берег Терека – борись за противоположный."}, {"id": 1408, "r": "Терек уносил джейраховца, а тот говорил: “Направляюсь в Буро (Владикавказ)”."}, {"id": 1409, "r": "Старая одежда в услужении у новой (сохраняет новую)."}, {"id": 1410, "r": "Все едино: что старый плетень, что чесоточная лошадь, что волынка, что сулакский"}, {"id": 1411, "r": "Бескрылого сокола и вороны гоняют."}, {"id": 1412, "r": "Птица без крыльев – не птица, человек без родины – не человек."}, {"id": 1413, "r": "Двадцатилетний похож на волка – шустрый, быстрый; сорокалетний похож на барса – "}, {"id": 1414, "r": "Дали желаемое тому, кто отнесся с почтением."}, {"id": 1415, "r": "Много грехов у того, кто муссирует чужие недостатки. Накопивший грехи теряет сты"}, {"id": 1416, "r": "Ружье не разбирает своих и чужих – оно стреляет туда, куда его направляют."}, {"id": 1417, "r": "Ружье убило одного, язык – десятерых."}, {"id": 1418, "r": "Ружье, пистолет (огнестрельное оружие) шуток не знают."}, {"id": 1419, "r": "Чего не достигли силою (саблею и ружьем), того достигли хлебом-солью."}, {"id": 1420, "r": "Язык сделал то, чего не удалось ружью, сабле и кинжалу."}, {"id": 1421, "r": "Стрельнул, когда надо, - ружье; стрельнул, когда не надо, - горе."}, {"id": 1422, "r": "Чем зря вытаскивать саблю из ножен, лучше сжать кулак, который пойдет в дело."}, {"id": 1423, "r": "Кто использует саблю для бритья ,тот рискует остаться без головы."}, {"id": 1424, "r": "Напуганный саблею, палки боялся."}, {"id": 1425, "r": "Поевший соленое воду пил."}, {"id": 1426, "r": "Много соли – плохо, мало соли – тоже плохо."}, {"id": 1427, "r": "Кто потерял вкус соли, тот забыл вкус воды."}, {"id": 1428, "r": "Башню из соли дождь размыл."}, {"id": 1429, "r": "Хлеб да соль укрепляют родство."}, {"id": 1430, "r": "Пришлая мышка местную изгнала."}, {"id": 1431, "r": "Трудно вынести несчастье, но куда труднее вынести нежданно свалившееся счастье."}, {"id": 1432, "r": "Занимавшемуся не своим делом досталось то, чего он не ждал."}, {"id": 1433, "r": "Держи коня для верховой езды, а быка – для пахоты."}, {"id": 1434, "r": "Не страшись угроз и не обманись лестью."}, {"id": 1435, "r": "Прут зеленый – гнется, высохший – ломается."}, {"id": 1436, "r": "Зачем двоеженцу идти на войну: ведь самая большая война у него дома (из народной"}, {"id": 1437, "r": "Соответствуют друг другу: война – войне, мир – миру."}, {"id": 1438, "r": "В войне цари побеждают не мужеством, а умением (военной хитростью)."}, {"id": 1439, "r": "Война не родила сына, она его убила."}, {"id": 1440, "r": "Возвысившееся падет, падшее возвысится."}, {"id": 1441, "r": "Нательная рубашка ближе верхней одежды."}, {"id": 1442, "r": "Без гармошки песня не поется, без прихлопа не танцуется."}, {"id": 1443, "r": "Долю опоздавшего кошка (кошки) съела (съели)."}, {"id": 1444, "r": "И падишах (царь…) не стал падишахом, если за ним народ не стоял."}, {"id": 1445, "r": "Люди, не имеющие наследников, бывают жадными (жестокими)."}, {"id": 1446, "r": "Наследникам лучше оставить доброе имя, чем большое богатство."}, {"id": 1447, "r": "Искавший войну нашел могилу."}, {"id": 1448, "r": "Не делай того, в чем после раскаешься."}, {"id": 1449, "r": "Не отправляйся в путь, не обдумав предстоящее."}, {"id": 1450, "r": "Необдуманный поступок влечет за собою беду."}, {"id": 1451, "r": "Не подумав, не говори, а сказав, не отступай."}, {"id": 1452, "r": "Рыскающая лиса добычливее волка-лежебоки."}, {"id": 1453, "r": "Не отправляйся в дальний путь без друга."}, {"id": 1454, "r": "Дорога становится короче, если рядом хороший товарищ."}, {"id": 1455, "r": "От заразной (чумной) болезни спасся даже тот, кто затаился за столбом."}, {"id": 1456, "r": "Рана, нанесенная ножом, заживет, рана, нанесенная языком, не заживает."}, {"id": 1457, "r": "Идущий в гору должен знать, что ему еще предстоит спуститься под гору."}, {"id": 1458, "r": "Спуск одолевает лишь тот, кто одолел подъем."}, {"id": 1459, "r": "Хочешь, чтобы ишак пошел в гору, - тяни его под гору."}, {"id": 1460, "r": "Пал бык – мясо, сломалась арба – дрова."}, {"id": 1461, "r": "Пыжилась лягушка стать быком и… лопнула."}, {"id": 1462, "r": "Овцу стричь можно много раз, но освежевать – лишь раз."}, {"id": 1463, "r": "Самый жадный (ненасытный) на свете – это человеческий живот."}, {"id": 1464, "r": "Скупой хозяин приговаривал: “Если бы в этом кувшине была брага, я бы наливал ее "}, {"id": 1465, "r": "Даже буркой не скроешь горб."}, {"id": 1466, "r": "Чем бить в бубен, полезнее взбивать маслобойку."}, {"id": 1467, "r": "Не посеешь зерно, не вырастет стебель."}, {"id": 1468, "r": "Кто стремился попасть на морское дно, на дне и остался."}, {"id": 1469, "r": "Горсть толокна, брошенная в море, пропала словно камень, брошенный в воду."}, {"id": 1470, "r": "Когда склочника спросили о чем-то: “Что ты хочешь сказать?”, - он напустился: “А"}, {"id": 1471, "r": "Что с тебя взять: у тебя и хвоста нет, чтобы за него ухватиться; у тебя и рогов "}, {"id": 1472, "r": "Сколько ни вари воду и яйца, они не смешиваются."}, {"id": 1473, "r": "Спросили: “Что случилось?”, - и плохая жена ответила: “Да ничего особенного, это"}, {"id": 1474, "r": "Грозивший, что он сделает что-то страшное, необычное, - ничего не сделал."}, {"id": 1475, "r": "Каков хозяин узнаешь, обозрев его дом и двор."}, {"id": 1476, "r": "Хозяин – овца, гость – волк."}, {"id": 1477, "r": "Хозяин в своем доме – князь."}, {"id": 1478, "r": "Если хозяева хорошие, то и гостиная теплее."}, {"id": 1479, "r": "Благородство хозяина в услужливости гостю, услужливость гостя – в благородстве к"}, {"id": 1480, "r": "Хозяин даже кашу варить не собирался, а гость уже мечтал о мясе с галушками."}, {"id": 1481, "r": "К хорошему хозяину гости чаще ходят."}, {"id": 1482, "r": "У бережливой хозяйки в доме достаток."}, {"id": 1483, "r": "Мулла, не вовремя призывающий к молитве, созывает шайтанов."}, {"id": 1484, "r": "Нет пользы от удачи, если ты не сумеешь ею воспользоваться."}, {"id": 1485, "r": "Прежде чем начать разговор, нужно иметь три вещи: уздечку, путы, нагайку (чтобы "}, {"id": 1486, "r": "Да не собьют нас с толку красивыми речами, да шелковыми словами."}, {"id": 1487, "r": "Болтун в делах негож."}, {"id": 1488, "r": "Лучше кашу есть, чем много болтать."}, {"id": 1489, "r": "Молчаливого дурака приняли за умника."}, {"id": 1490, "r": "Пустой болтовней ни человека не накормишь, ни башню не построишь."}, {"id": 1491, "r": "Не пасуй перед трудным, не оставляй на самотек кажущееся легким."}, {"id": 1492, "r": "Тяжелое дело делай в первую очередь, тогда легкое само собою сделается."}, {"id": 1493, "r": "Кто не прошел через трудности, тот не оценит легкого."}, {"id": 1494, "r": "Боявшийся трудностей добра не заимел."}, {"id": 1495, "r": "Сила народная – бездонное озеро."}, {"id": 1496, "r": "Если не бережешь, все из рук уходит."}, {"id": 1497, "r": "Солнце сожгло слишком рано распустившийся цветок."}, {"id": 1498, "r": "Не вовремя кукарекавший петух угодил в котел."}, {"id": 1499, "r": "Вовремя посеянное вовремя созрело, в детстве выученное на всю жизнь сгодилось."}, {"id": 1500, "r": "Вовремя не сделанное пришлось делать дважды."}, {"id": 1501, "r": "Время уносит горе из сердца."}, {"id": 1502, "r": "Дуплистое дерево легко ветер валит."}, {"id": 1503, "r": "Неправедное слово, хоть очищай его в молоке, все равно останется грязным."}, {"id": 1504, "r": "Неправильно сделанное суда времени не избежит."}, {"id": 1505, "r": "Криво сложенная стена и неправедные дела очень хорошо видны."}, {"id": 1506, "r": "Не дай человеку оступиться: потом трудно вернуть его на правильный путь."}, {"id": 1507, "r": "Лжеца лишь ружье остановит."}, {"id": 1508, "r": "Не водись с лжецом."}, {"id": 1509, "r": "Не лги, правда ведь все равно выйдет наружу."}, {"id": 1510, "r": "Ни пользы, ни счастья не было от неправедно нажитого богатства."}, {"id": 1511, "r": "Врет язык, а достается голове."}, {"id": 1512, "r": "Погнувшийся гвоздь можно разогнуть, сошедшего с пути человека трудно исправить."}, {"id": 1513, "r": "Глаз, смотревший куда не следует, окосел."}, {"id": 1514, "r": "Ложь – растаявший снег, правда – монолитный камень."}, {"id": 1515, "r": "Клеветнику добра не видать."}, {"id": 1516, "r": "От вранья не помрешь, но доверия людей лишишься."}, {"id": 1517, "r": "Несправедливость и из друга делает врага."}, {"id": 1518, "r": "Лживость приносит бесчестье."}, {"id": 1519, "r": "Чем идти неправедным путем, чтобы прослыть хорошим, лучше быть ославленным, но п"}, {"id": 1520, "r": "Непутевую мать лишь ее сын вразумит."}, {"id": 1521, "r": "Сказавшего “не знаю” отпустили, а сказавшего “знаю” задержали."}, {"id": 1522, "r": "“Нет, не знаю” – одно слово, “знаю, видел” – тысяча слов."}, {"id": 1523, "r": "Не говори “не умею”, а говори “не хочу”."}, {"id": 1524, "r": "Носить штаны – еще не значит быть мужчиной."}, {"id": 1525, "r": "Сторож высматривает вора, вор следит за сторожем."}, {"id": 1526, "r": "Не верь тому, что услышал; верь тому, что видел."}, {"id": 1527, "r": "Болезнь, которую лелеяли, стала капризничать."}, {"id": 1528, "r": "Спрашивающий знает больше."}, {"id": 1529, "r": "Если не было шума при падении дерева, то его не было после падения."}, {"id": 1530, "r": "От сидения у реки рыба не появится, от сидения возле поля урожая не будет."}, {"id": 1531, "r": "Живущий у воды ее не ценит."}, {"id": 1532, "r": "Живущий у реки знает и брод через нее."}, {"id": 1533, "r": "Сплетничают даже про сваю, вбитую у реки."}, {"id": 1534, "r": "Бывают и такие жадные, что с воды сметану соберут (как с молока)."}, {"id": 1535, "r": "Вода мельницу крутит, а мельник гарнец (налог с помола) собирает."}, {"id": 1536, "r": "Вода держит рыбу, тело держит человека."}, {"id": 1537, "r": "Дошел до реки – стань рыбой, дошел до горы – стань козой."}, {"id": 1538, "r": "“Попросит (гость) воды напиться – значит сыт, не попросит – значит уразу держит”"}, {"id": 1539, "r": "Мельницу не ставят там, где нет воды."}, {"id": 1540, "r": "Воду берут там, где она есть; ум у того, у кого он есть."}, {"id": 1541, "r": "В смертный час нередко и мужественный человек проявляет слабость."}, {"id": 1542, "r": "Нередко и на дворе хорошего хозяина вырастает плохая собака (плохой потомок)."}, {"id": 1543, "r": "Случается, и ворона перехитрит сокола."}, {"id": 1544, "r": "Даже живя у реки, воду береги (цени)."}, {"id": 1545, "r": "Вкус воды знает только испытывающий жажду."}, {"id": 1546, "r": "Что было, то было; что прошло, то прошло."}, {"id": 1547, "r": "Нельзя перейти через реку, хотя бы капельку не намокнув."}, {"id": 1548, "r": "Без воды и рыба не рыба, без коня и человек (всадник) не всадник."}, {"id": 1549, "r": "Знает тот, кто спрашивает: спрашивает тот, кто знает."}, {"id": 1550, "r": "Красавица любит пококетничать."}, {"id": 1551, "r": "Красавица и в лохмотьях смотрится."}, {"id": 1552, "r": "Речистым быть хорошо, но молчаливым быть лучше."}, {"id": 1553, "r": "Люди любят красноречивого человека."}, {"id": 1554, "r": "Красота – не масло, на хлеб не намажешь."}, {"id": 1555, "r": "Не смотри на красоту, а смотри на характер."}, {"id": 1556, "r": "Богатая осень краше красивой весны."}, {"id": 1557, "r": "Нет ничего дороже красивых (благородных) дел."}, {"id": 1558, "r": "Кто краснобайством пытается представить себя мужчиной, тому пятак цена в ярмароч"}, {"id": 1559, "r": "Красивое слово и снежную гору растопит."}, {"id": 1560, "r": "Ласковое слово и змею из норки выманило."}, {"id": 1561, "r": "Красивая удочка рыбку обманула."}, {"id": 1562, "r": "Приятная беседа дорогу сократила."}, {"id": 1563, "r": "Нелюба красавица, красива любимая."}, {"id": 1564, "r": "Испачканного грязью водой отмоют, испачканного клеветой ничем не очистить."}, {"id": 1565, "r": "Если выбирать, так только то, к чему душа лежит."}, {"id": 1566, "r": "Лук – девять отрав, чеснок – девять лекарств (Лук – девять отрав и одно лекарств"}, {"id": 1567, "r": "Становясь ишаком изо дня в день, стал настоящим ишаком плохой потомок."}, {"id": 1568, "r": "Погнавшись за несбыточным, лишился и того, что могло сбыться."}, {"id": 1569, "r": "Не обещай несбыточного, исполняй обещанное."}, {"id": 1570, "r": "Думающий о несбыточном лишается имеющегося (не знает спокойствия)."}, {"id": 1571, "r": "Будущая мощная птица еще птенчиком по крику узнается."}, {"id": 1572, "r": "Прежде чем начать что-то делать, человек должен поразмыслить."}, {"id": 1573, "r": "Поешь – спать тянет; поспишь – есть охота – ох, как трудно жить."}, {"id": 1574, "r": "Ложки есть у тех, у кого еда водится."}, {"id": 1575, "r": "Жадность с ума сводит."}, {"id": 1576, "r": "Разбогатевшему хозяину батраков не хватает."}, {"id": 1577, "r": "Добычливый хозяин красавцем кажется, а недобычливый – косоглазым."}, {"id": 1578, "r": "Даже мать больше любит того, кто что-нибудь приносит в дом."}, {"id": 1579, "r": "Мудрый тот, кто слушает людей."}, {"id": 1580, "r": "Умнее стал тот, кто вращался среди бывалых людей."}, {"id": 1581, "r": "Трудно сделать что-то полезное, но куда труднее сохранить сделанное."}, {"id": 1582, "r": "Не стыдно чего-то не знать, стыдно не стремиться узнать."}, {"id": 1583, "r": "Лучшее из того, что бы я поел, - молоко; лучшее, что я мог бы сказать – это слов"}, {"id": 1584, "r": "Хоть и утверждаешь, что не скоро замуж пойдешь, всегда одевайся как на смотрины."}, {"id": 1585, "r": "Каждая травинка заключает в себе и лекарство, и отраву: каждый человек – и хорош"}, {"id": 1586, "r": "Каждый день добавляет частицу ума."}, {"id": 1587, "r": "Горе удаляется – каждый день на него ложится лопата земли."}, {"id": 1588, "r": "У каждого слова есть свое место."}, {"id": 1589, "r": "Каждый мастер свою работу лучше знает."}, {"id": 1590, "r": "Любой человек – князь своей души."}, {"id": 1591, "r": "Каждый сам чешет свою чесотку."}, {"id": 1592, "r": "У каждой пташки свое гнездышко."}, {"id": 1593, "r": "Твоей смерти (жизни) соответствует читаемая тебе отходная молитва."}, {"id": 1594, "r": "Чем быть твоим братом, лучше бы я стал твоим шурином (о плохом брате)."}, {"id": 1595, "r": "Твои достоинства люди видят один раз, а недостатки – десятки раз."}, {"id": 1596, "r": "Если не крепко твое слово, то и клятва твоя – не клятва."}, {"id": 1597, "r": "Если люди узнают про твои слабости, тебя съедят."}, {"id": 1598, "r": "Просящий надоел, дающий любим."}, {"id": 1599, "r": "Богачу говорили: “Счастливчик, ты даже лапшу с хлебом ешь”."}, {"id": 1600, "r": "Сказать “сделай” легче, чем сделать самому."}, {"id": 1601, "r": "Любишь просить – умей и давать."}, {"id": 1602, "r": "Чисто сердце, убереженное от черной зависти, как чист и язык, убереженный от спл"}, {"id": 1603, "r": "Лук, хотя и побывал с паломниками в Мекке, каким был горьким, таким и остался."}, {"id": 1604, "r": "К счастью птичек, кошка сотворена бескрылой."}, {"id": 1605, "r": "Прежде чем судить о людях, загляни в свою душу (в свое сердце)."}, {"id": 1606, "r": "Судей, ведущих твое дело, корми получше."}, {"id": 1607, "r": "Глядя на свою овчину, сватайся к овчине, а посватаешься к шелковым рукавам, - ра"}, {"id": 1608, "r": "Не будь дома гостем, а в гостях хозяином."}, {"id": 1609, "r": "Если ты не батрачишь на себя, ты не будешь княжить над другими."}, {"id": 1610, "r": "Если позволишь выдернуть волосок с головы, то потом и головы лишишься."}, {"id": 1611, "r": "Не говори людям того, чего сам не хотел бы услышать."}, {"id": 1612, "r": "Не перекладывай на других то, что можешь сделать сам."}, {"id": 1613, "r": "Став богатым – не возгордись, став бедным – не унижайся."}, {"id": 1614, "r": "Не ходи, куда не звали; не засиживайся, пока не попросили."}, {"id": 1615, "r": "Свое добро береги, чужое оставь в покое."}, {"id": 1616, "r": "Загнутый собачий хвост никогда не разогнется."}, {"id": 1617, "r": "Сделали тебе добро – говори о нем; сам совершил добрый поступок – молчи о нем."}, {"id": 1618, "r": "Не говори всего, что знаешь, но знай все, а чем говоришь."}, {"id": 1619, "r": "Лучше возьми себе ворону, на которой сидишь, чем взять сокола, который сидит на "}, {"id": 1620, "r": "Не вреди другому ради своей пользы: если он об этом и не узнает, то бог Дяла же "}, {"id": 1621, "r": "Продавший мельницу и ушедший на войну погиб; оставшийся при мельнице уцелел."}, {"id": 1622, "r": "Жизнь перетирает (уносит) людей, словно зерно на мельнице."}, {"id": 1623, "r": "Если ты не хозяин дела, доверенного тебе, то по смерти ты не будешь даже хозяино"}, {"id": 1624, "r": "Пьяница валяется в той же луже, что и свинья."}, {"id": 1625, "r": "Поскольку свинья и есть свинья, бог Дяла не дал ей увидеть небо."}, {"id": 1626, "r": "Свинья всегда найдет грязную лужу."}, {"id": 1627, "r": "Свинья в грязи валяется, а плохой человек в черных делах мотается."}, {"id": 1628, "r": "Дай рабу послабление, он и тамадой захочет стать."}, {"id": 1629, "r": "Кабан и медведь в одном лесу пасутся, а вместе не уживаются."}, {"id": 1630, "r": "Чувяк из свиной кожи смазывают свиным жиром."}, {"id": 1631, "r": "Задумал мулла съесть поросенка и говорит ему: “Хоть ты и визжишь, да будет мой о"}, {"id": 1632, "r": "Вскормленный свиным молоком приобретает свинские повадки."}, {"id": 1633, "r": "Богатый ишак и на крышу взберется."}, {"id": 1634, "r": "Сказанное богачом принимается на веру, сказанное бедняком в расчет не берут."}, {"id": 1635, "r": "Поймать – трудно, отпустить – легко."}, {"id": 1636, "r": "И плохой человек слывет хорошим, если он богат."}, {"id": 1637, "r": "Кто раньше, кто позже, но все будем на том свете."}, {"id": 1638, "r": "Слово остается за тем, кто первым его произнес."}, {"id": 1639, "r": "Смотри вперед, когда идешь; оглянись назад, когда говоришь."}, {"id": 1640, "r": "Впереди идущий – мост для идущего следом."}, {"id": 1641, "r": "Как будет крутиться переднее колесо, так закрутится и заднее."}, {"id": 1642, "r": "Дом построил тот, кто сначала огородил свой двор."}, {"id": 1643, "r": "Спереди посмотреть, похож на мужчину; сзади посмотреть, похож на женщину (про по"}, {"id": 1644, "r": "“Некто любит ли меня?” – поинтересовался кто-то, и ему ответили: “Загляни в свое"}, {"id": 1645, "r": "Идущий с мельницы одолел (в споре, в жизненных делах) идущего с войны."}, {"id": 1646, "r": "Кто содержит в чистоте родник, тот пьет чистую воду."}, {"id": 1647, "r": "Вода начинает течь из родников, из них образуется Терек, а Терек наполняет море."}, {"id": 1648, "r": "С потного тела пыль не поднимется."}, {"id": 1649, "r": "Сливу понюхай, грушу откуси три раза, а яблоко возьми в дорогу."}, {"id": 1650, "r": "Если бог Дяла ума не дал, то ниоткуда его не возьмешь."}, {"id": 1651, "r": "Разумный баран не выскочит из своего стада и не запрыгнет в чужое."}, {"id": 1652, "r": "Умного не сразу узнаешь, а дурака – по первым же его словам."}, {"id": 1653, "r": "Умный человек – сдержанный человек."}, {"id": 1654, "r": "Умный человек не будет чванливым."}, {"id": 1655, "r": "Посчитав себя умным, не становись чванливым; посчитав себя храбрым, не стань гор"}, {"id": 1656, "r": "Где ум, там и мужество, а где ум да мужество, там и честь."}, {"id": 1657, "r": "Умного врага остерегайся один раз, а от недалекого друга – десятки раз."}, {"id": 1658, "r": "С умным советуйся, дурака избегай."}, {"id": 1659, "r": "Счастье без ума – не счастье, ум без счастья – не ум."}, {"id": 1660, "r": "Бедный умом бывает “богат” языком."}, {"id": 1661, "r": "Люди будут ценить тебя по уму и благородству."}, {"id": 1662, "r": "Чем дольше жернов крутится, тем быстрее стирается."}, {"id": 1663, "r": "Без зерна не крутятся и жернова."}, {"id": 1664, "r": "На мельнице самый большой шайтан – сам мельник."}, {"id": 1665, "r": "Для сумасшедшего одно лечение – связать его."}, {"id": 1666, "r": "Даже корова, если ее приласкать, больше молока дает."}, {"id": 1667, "r": "У плохой хозяйки всегда дети плачут, когда приходит гость."}, {"id": 1668, "r": "Пришел гость – раньше встань, пришел гость – позже ляг."}, {"id": 1669, "r": "Когда гость соберется уходить, хозяин становится еще любезнее."}, {"id": 1670, "r": "Гость уходит – недостатки гостеприимства остаются."}, {"id": 1671, "r": "Тот, кто умеет достойно принять гостя, тот умеет с людьми ужиться."}, {"id": 1672, "r": "Гость любуется не твоими башнями, а накрытым для него столом."}, {"id": 1673, "r": "Прибыл гость – заодно и хозяин попировал."}, {"id": 1674, "r": "Ни бог Дяла, ни люди не любят того, кто не любит гостя."}, {"id": 1675, "r": "Сорной травой заросла дорога к дому, в который не приходят гости."}, {"id": 1676, "r": "Гость предпочитает хлеб-соль сразу же, чем долго ожидаемую курятину."}, {"id": 1677, "r": "Накрыл гостю стол – и его лошади корму задай."}, {"id": 1678, "r": "Гостям – веселье, хозяйке – горе (большие заботы)."}, {"id": 1679, "r": "Жадный хозяин глаз не сводит со рта гостя."}, {"id": 1680, "r": "Если ты волк, хватай (налетай), если нет – терпи."}, {"id": 1681, "r": "Высокую башню воздвигай в своей стране."}, {"id": 1682, "r": "Не будь настолько несчастным, чтобы не принять совет любящего (чтущего) тебя чел"}, {"id": 1683, "r": "Хоть и разорвут тебя, говори только правду."}, {"id": 1684, "r": "Не садись не на свое место – тебя с него поднимут."}, {"id": 1685, "r": "Прежде чем выйти в путь, найди себе товарища."}, {"id": 1686, "r": "Будучи в гостях, знай свое место."}, {"id": 1687, "r": "Чего желали – не получили; чего боялись, то и произошло."}, {"id": 1688, "r": "Человеку даны глаза, с условием: “Не смотреть туда, куда не положено”."}, {"id": 1689, "r": "Вослед за долгожданным дождем, бывает, и град приходит."}, {"id": 1690, "r": "Советы слушай, но делай то, что считаешь правильным."}, {"id": 1691, "r": "Тот не дурак, кто прислушивается к советам."}, {"id": 1692, "r": "Бывает, счастье и к лежебоке льнет."}, {"id": 1693, "r": "Кто знает тебя, тот тебя и чтит; а кто тебя не знает, тот чтит твою шубу (одежду"}, {"id": 1694, "r": "Ты к земле по-хорошему, и она тебя отблагодарит."}, {"id": 1695, "r": "Я узнаю, кто ты, когда узнаю твоего друга."}, {"id": 1696, "r": "Ты помоги мне, я помогу народу."}, {"id": 1697, "r": "Будь сам хорошим, тогда и люди будут к тебе хорошо относиться."}, {"id": 1698, "r": "Где тебя не знают, там чтят твою шубу, а где тебя знают, там чтят твою голову."}, {"id": 1699, "r": "Ласковый телок двух маток (молоко) сосет."}, {"id": 1700, "r": "Дурака хвали, ему поддакивай и поскорее со двора выпроваживай."}, {"id": 1701, "r": "Будучи в гостях, не ищи недостатков у хозяев."}, {"id": 1702, "r": "В гостях пьет только чай с медом, хотя дома нет и хлебной крошки."}, {"id": 1703, "r": "Благородный человек в гости идет сытым."}, {"id": 1704, "r": "Кто сам не бывал в гостях, тот не сумеет толком гостя принять."}, {"id": 1705, "r": "Не будь сладким, как халва, - иначе все будут есть тебя; не будь горьким, как не"}, {"id": 1706, "r": "Знай: тот, кто сплетничает с тобой о других, с ними сплетничает о тебе."}, {"id": 1707, "r": "“Да не тебя я люблю, а твой кармашек (твою денежку)”, - шутя говорил некто."}, {"id": 1708, "r": "Кто люб тебе, тому и ты люб."}, {"id": 1709, "r": "Если он не причиняет вреда, значит, уже этим приносит пользу."}, {"id": 1710, "r": "Кто идет к тебе с доносом, тот и на тебя будет доносить."}, {"id": 1711, "r": "Пусть у тебя не будет горьких дней, а если придут, тогда узнаешь своих друзей."}, {"id": 1712, "r": "Из корешка черемши вырастает только росток черемши."}, {"id": 1713, "r": "Тебе-то я верю, но не верю тому, кому ты веришь."}, {"id": 1714, "r": "Пусть дорога и извилиста, все же она лучше, чем бездорожье."}, {"id": 1715, "r": "Не та добыча, что в лесу находится, а та, которую домой принесешь."}, {"id": 1716, "r": "Заблудившийся в лесу выйдет на дорогу, сошедшему с ума - ума не вернуть."}, {"id": 1717, "r": "Не откладывай то, что рано или поздно, а делать придется."}, {"id": 1718, "r": "Делающий то, что ему не положено, получил то, чего получить не хотел бы."}, {"id": 1719, "r": "Невысказанное слово сделано из золота."}, {"id": 1720, "r": "Ужин неумехи съедает умелец."}, {"id": 1721, "r": "Если вспомнят о Цагене (фольклорный балагур) один раз, то уж потом упомянут его "}, {"id": 1722, "r": "Необразованный – “лесной мужчина” (мифический персонаж. – И.Д.)"}, {"id": 1723, "r": "Неуч всегда завидует ученому."}, {"id": 1724, "r": "Кто ведет себя неправедно, к тому приходит то, чего он не хотел бы."}, {"id": 1725, "r": "Больной знает, что здоровье – величайшее богатство."}, {"id": 1726, "r": "Цену здоровья узнают только заболевши."}, {"id": 1727, "r": "Нет ни волка без зубов, ни зимы без морозов."}, {"id": 1728, "r": "Лишь когда у самого начнет болет зуб, поймешь состояние мучающегося зубной болью"}, {"id": 1729, "r": "Непонятное вызывает много вопросов."}, {"id": 1730, "r": "Незнающие – пища для знающих."}, {"id": 1731, "r": "Нет человека, который, хотя бы случайно, не ошибался."}, {"id": 1732, "r": "Легче воду носить в сите, чем вразумлять дурака."}, {"id": 1733, "r": "Говорят, некая женщина сказала: “Хоть это и похороны моего единственного сына, н"}, {"id": 1734, "r": "Кошке не уживается с собакой, собака – с волком, а волк – с человеком. Циска т1а"}, {"id": 1735, "r": "Мышь, которая не покидала норы из страха перед кошкой, сдохла от голода."}, {"id": 1736, "r": "Кошка сказала о курдюке: “Даже если б дотянулась, не стала бы тебя есть”."}, {"id": 1737, "r": "Хорошая жена услышит однажды сказанное."}, {"id": 1738, "r": "Вода дважды не течет по одному и тому же месту."}, {"id": 1739, "r": "Раз споткнувшаяся нога споткнется девять раз, единожды совравший прослывет вруно"}, {"id": 1740, "r": "Нога, раз споткнувшись, девять раз споткнется (раз поскользнувшаяся нога посколь"}, {"id": 1741, "r": "Единожды совершивший бесчестный поступок, уже никогда не будет в чести."}, {"id": 1742, "r": "Единожды солгавшему – никто больше не поверит."}, {"id": 1743, "r": "Раз порвавшееся, уже без узла не соединить."}, {"id": 1744, "r": "Одним выстрелом двух зайцев не убить."}, {"id": 1745, "r": "Лисий хвост (или лисенок) хитрее самой лисы."}, {"id": 1746, "r": "Лиса сказала: “Самое лучшее увидеть собаку прежде, чем она увидит тебя”."}, {"id": 1747, "r": "Случайно разбогатевший дурак даже днем лампу жжет, керосин переводит."}, {"id": 1748, "r": "Нет человека, у которого не было бы каких-либо забот."}, {"id": 1749, "r": "Дав взаймы рубль, наживешь друга, а дав взаймы червонец, наживешь врага."}, {"id": 1750, "r": "Речь некоторых хитрецов подобна рыболовному крючку."}, {"id": 1751, "r": "Бывает пичужка с соколиным сердцем."}, {"id": 1752, "r": "Нет такой плотины, какую бы вода со временем не снесла."}, {"id": 1753, "r": "Трудно одиночке среди людей, если он не будет предельно храбрым."}, {"id": 1754, "r": "Поданное одной рукой, забрали другой."}, {"id": 1755, "r": "В одной руке не удержать два арбуза."}, {"id": 1756, "r": "Капля грязи перепортила лохань меда."}, {"id": 1757, "r": "Из-за одной сплетни все село передралось."}, {"id": 1758, "r": "Не танцуют на одной ноге, не хлопают в ладоши одной рукою."}, {"id": 1759, "r": "Даже пальцы одной руки не похожи один на другой."}, {"id": 1760, "r": "Женщина придумает такое, что и десяти мужчинам на ум не придет."}, {"id": 1761, "r": "Из одного камня башню не построить, голос одинокого никому не услышать."}, {"id": 1762, "r": "В один чувяк две ноги не засунешь."}, {"id": 1763, "r": "Не сжать в кулак один палец, не создать дружину из одного всадника."}, {"id": 1764, "r": "Одна искра все село спалила."}, {"id": 1765, "r": "Сколь ни крутись колесо арбы, оно всегда остановится на одной из спиц."}, {"id": 1766, "r": "Одна кошка съела девять коров."}, {"id": 1767, "r": "Счастье покидает ту семью, в которой два хозяина."}, {"id": 1768, "r": "Родственны, подобно тем двум женщинам, что вместе веники сажали (родство двух со"}, {"id": 1769, "r": "Ничем не очистить грязное человеческое сердце."}, {"id": 1770, "r": "Где один терпит неудачу, там другой ее находит."}, {"id": 1771, "r": "Добра (имущества) одного не хватает на двоих."}, {"id": 1772, "r": "Некто сказал: “Когда я знаю, что надо делать, я это хорошо делаю. Когда же не зн"}, {"id": 1773, "r": "Поделился тайной с одним – и она всему миру стала известна."}, {"id": 1774, "r": "Про могилу сказали: “Одному ты просторна, а двоим тесна”."}, {"id": 1775, "r": "Одного можно одолеть, но многих одолеть невозможно."}, {"id": 1776, "r": "По прутику переломили весь веник."}, {"id": 1777, "r": "Одиночка башню не построит."}, {"id": 1778, "r": "У одинокого и ружье не стреляет."}, {"id": 1779, "r": "Одиночество и бедность одинаковы."}, {"id": 1780, "r": "Дом сгорит – зола останется, умрет человек – останется горе."}, {"id": 1781, "r": "Если в доме согласие, то можно смело идти в дальний путь."}, {"id": 1782, "r": "Начала дочь дома скандалы устраивать – надо быстрее ее замуж выдавать."}, {"id": 1783, "r": "Нет уважения в семье – нет его и на людях."}, {"id": 1784, "r": "Намного лучше иметь во дворе бешеного пса, чем брата или сына, которые приносят "}, {"id": 1785, "r": "Настоящим товарищем может быть лишь тот, кто из родных тебе мест."}, {"id": 1786, "r": "Все, что в доме – заботы хозяйки, вне дома – хозяина."}, {"id": 1787, "r": "“Пусть мой домашний (муж) умрет, если я лгу!” – говорила плохая жена (лгунья)."}, {"id": 1788, "r": "Никогда в достатке не будут жить те, кто переводит керосин (на лампу), поздно ло"}, {"id": 1789, "r": "Жадного можно одолеть деньгами, а умного только ум одолеет."}, {"id": 1790, "r": "Жадного даже родная мать не любит."}, {"id": 1791, "r": "Жадный боиться уронить даже гниду с головы."}, {"id": 1792, "r": "Жадный человек не имеет стыда."}, {"id": 1793, "r": "Лучше быть скупердяем, чем транжирой."}, {"id": 1794, "r": "Скупому могилу роют на пядь глубже."}, {"id": 1795, "r": "Жадному не хватало материи на саван."}, {"id": 1796, "r": "У скупого и глаз жадный."}, {"id": 1797, "r": "Жадина даже волос делит пополам."}, {"id": 1798, "r": "С жадным не водись, ибо в тяжелый для тебя день он не поддержит."}, {"id": 1799, "r": "Пища жадной хозяйки бывает пресной (горькой)."}, {"id": 1800, "r": "Скупой хозяин приговаривал: “Сердце начинает болеть у того, кто съест много меда"}, {"id": 1801, "r": "У жадного бывает мало друзей и родственников."}, {"id": 1802, "r": "Внезапно разбогатевший шалеет: деньги разбрасывает, словно овечий помет."}, {"id": 1803, "r": "Нежданно насытившись молоком, ягненок взыгрался."}, {"id": 1804, "r": "Чист лишь тот, кто чист перед своей душою (сам перед собою)."}, {"id": 1805, "r": "Пошел оправдываться, а вернулся очерненным."}, {"id": 1806, "r": "Правдивый и в огне не горит."}, {"id": 1807, "r": "Скотина, которая бегает со двора, угодила в пасть волка."}, {"id": 1808, "r": "Что по селу без дела болтающийся муж, что муж, сиднем дома сидящий, - оба жене н"}, {"id": 1809, "r": "Из дома делает дом (слаженную семью) хозяйка (жена)."}, {"id": 1810, "r": "И лягушка больше любит воду из своего чистого родника."}, {"id": 1811, "r": "Настоящий мужчина не запаникует, даже если загорится его дом."}, {"id": 1812, "r": "Тот построит дом, кто вначале поставил забор; а кто же сразу начал строить дом б"}, {"id": 1813, "r": "Покоя лишится тот, кто начнет дом строить."}, {"id": 1814, "r": "Кошка, которая жалась к очагу, опалилась."}, {"id": 1815, "r": "Жизнь пожирает людей, словно огонь – дрова."}, {"id": 1816, "r": "Привыкший к огню, огня не боится."}, {"id": 1817, "r": "От красной ли коровы или от черной – какая тебе разница, раз молоко белое."}, {"id": 1818, "r": "Мы не можем жить и без огня, и без воды, хотя нет ничего опаснее их."}, {"id": 1819, "r": "Нет дыма там, где нет огня."}, {"id": 1820, "r": "Огонь только огнем зажигают."}, {"id": 1821, "r": "Взбесившегося (ожиревшего) кабана убили на вершине высокой горы."}, {"id": 1822, "r": "Если краснеть и бледнеть не умеет, значит, у него нет совести."}, {"id": 1823, "r": "Не уживаются раскаленное железо и вода."}, {"id": 1824, "r": "Некоторым достаточно прицепить хвост, чтобы они стали настоящими собаками."}, {"id": 1825, "r": "Когда вытащили ложку из навозной жижи и сунули в масло, она треснула."}, {"id": 1826, "r": "Передрались волк с медведем за кувшинчик масла, и мне он достался."}, {"id": 1827, "r": "Плешивая голова не может не чесаться."}, {"id": 1828, "r": "Не начинай дела, обреченного на провал."}, {"id": 1829, "r": "В длинной дороге, достаточно раз хлестнуть хорошего черкесского коня; как бы ни "}, {"id": 1830, "r": "Вспыльчивого не бойся, бойся тихони."}, {"id": 1831, "r": "Волк узнал силу бычьих рогов, когда они ткнулись в его бок."}, {"id": 1832, "r": "Что принял вовнутрь – сила, что взвалил на плечи – груз."}, {"id": 1833, "r": "Несказанное – золото, сказанное – серебро."}, {"id": 1834, "r": "Черное сердце подобно черной подкладке."}, {"id": 1835, "r": "Иным кажется: громко кто-то сказал – напугать хочет; тихо сказал – трусит; промо"}, {"id": 1836, "r": "Лишь мускулистый может быть крепким."}, {"id": 1837, "r": "С сильным не враждуй, с богатым не судись."}, {"id": 1838, "r": "Звуки скрипки идут из рая."}, {"id": 1839, "r": "С каждым проклятием шайтан только жиреет."}, {"id": 1840, "r": "Шайтана перехитрил лишь его детеныш."}, {"id": 1841, "r": "Говорят, шайтан сказал: “Упаси меня бог от людей-шайтанов!”."}, {"id": 1842, "r": "Кто пытался стать шейхом (провидцем), тот стал шайтаном."}, {"id": 1843, "r": "Родимая сторона теплее солнца."}, {"id": 1844, "r": "Доброе дело пропадает, если им попрекают."}, {"id": 1845, "r": "Без нужды не вынимай кинжал из ножен, а вынув, не коли им (по обычаю кинжалом мо"}, {"id": 1846, "r": "Хороший кинжал тот, что лежит в ножнах."}, {"id": 1847, "r": "Точивший кинжал, нашел погибель, пахавший землю, ел булки."}, {"id": 1848, "r": "Гора, которую сам одолел, кажется самой высокой."}, {"id": 1849, "r": "Кто не принимает советы любящих его, тот пойдет неверной дорогой."}, {"id": 1850, "r": "Дела не сделает тот, кто заранее бахвалится."}, {"id": 1851, "r": "Не пропадет тот, кто знает себе цену."}, {"id": 1852, "r": "Человек сам обязан держать ответ за свои ошибки."}, {"id": 1853, "r": "Несчастного (обездоленного) пригласили на пиршество, и он сказал: “Приглашают, ч"}, {"id": 1854, "r": "Болезнь, приобретенная от холода, покидает человека только при его кончине."}, {"id": 1855, "r": "Здоровее будет тот, кто держит ноги в тепле."}, {"id": 1856, "r": "Родная земля милее всех, даже если это клочок, на котором едва обеими ногами ста"}, {"id": 1857, "r": "Подложивший две овчины и одною накрывшийся, спасся; подложивший одну овчину и дв"}, {"id": 1858, "r": "Две снохи на одной арбе перессорились, а две жены одного мужа поладили."}, {"id": 1859, "r": "Две горы не сошлись, а два человека встретились."}, {"id": 1860, "r": "Двое врагов не уживутся под одной крышей."}, {"id": 1861, "r": "Задумал “кец” (шалопай) поужинать в двух местах, но так и лег спать голодным."}, {"id": 1862, "r": "Хотя курица и имеет два крыла, ей все же соколом не взлететь."}, {"id": 1863, "r": "Не всегда танцуют там, где раздаются хлопки."}, {"id": 1864, "r": "Захотелось курочке зараз снести два яичка, да и лопнула."}, {"id": 1865, "r": "Бывает, что в чем-то пригодится и человек, за которого в другой раз ты не дал бы"}, {"id": 1866, "r": "Из двух дураков не сделаешь одного умного; а из двух умных получается трое."}, {"id": 1867, "r": "Кто следил за своим языком, тот уберег свою голову."}, {"id": 1868, "r": "Захотела ворона обменять перья на шерсть и осталась голой."}, {"id": 1869, "r": "Свой глаз – алмазная крупинка."}, {"id": 1870, "r": "Одноглазый в чужом глазу бельмо увидел."}, {"id": 1871, "r": "Даже птичке свое гнездо кажется башней."}, {"id": 1872, "r": "Даже вороне свое грязное гнездо милее."}, {"id": 1873, "r": "Неродной – сыном не станет."}, {"id": 1874, "r": "У того, кто плохо обращался со своими родителями, выросло плохое потомство."}, {"id": 1875, "r": "Богом любимы и сын, и дочь, если они почитают своих родителей."}, {"id": 1876, "r": "Даже в большой опасности нам не нужен человек, пекущийся только о своих удовольс"}, {"id": 1877, "r": "И прут тебе кажется оглоблей, если им ударили тебя."}, {"id": 1878, "r": "Хозяином страны не станет тот, кто не является хозяином в своем доме."}, {"id": 1879, "r": "Большая наука – знать себе подлинную цену."}, {"id": 1880, "r": "Человек должен знать и свое место, и свои возможности."}, {"id": 1881, "r": "Теряет разум тот, кто довольствуется только своим умом."}, {"id": 1882, "r": "Прежде всего, человек сам должен оберегать свое счастье."}, {"id": 1883, "r": "Рубль из своего кармана дороже червонца в чужом."}, {"id": 1884, "r": "У своего плетня и петух, и собака храбрее."}, {"id": 1885, "r": "В моей рубахе нет никого, лучше меня."}, {"id": 1886, "r": "Свой очаг теплее чужого."}, {"id": 1887, "r": "Кто не со своим народом – тот горький сирота."}, {"id": 1888, "r": "В своей норе и мышь себя львом считает."}, {"id": 1889, "r": "Невпопад сказанное слово пропало бесследно."}, {"id": 1890, "r": "Лучше умереть на своей родине, чем жить на чужбине."}, {"id": 1891, "r": "На чужбине гончая лисицу не поймала."}, {"id": 1892, "r": "На родине и солнце светит ярче."}, {"id": 1893, "r": "Кто чтит свою мать, тот чтит Родину."}, {"id": 1894, "r": "Свой хлеб да соль вкуснее чужого мяса с галушками."}, {"id": 1895, "r": "Бог создал этот мир так, что все живое любит своих детенышей."}, {"id": 1896, "r": "Гость тот, кто знает когда приходить в гости и когда уходить."}, {"id": 1897, "r": "Вовремя легший спать избежал трех бед; вовремя вставший трижды был вознагражден."}, {"id": 1898, "r": "Незавершенная в срок работа так и осталась незаконченной."}, {"id": 1899, "r": "К сделанному своим трудом человек относится бережнее."}, {"id": 1900, "r": "Хорошо, когда своя вещь у тебя на виду."}, {"id": 1901, "r": "Несущий горе своей семье опасен для всех."}, {"id": 1902, "r": "Кто у себя в доме ничтожество, тот и вне дома никто."}, {"id": 1903, "r": "Хороша в девичестве – хороша и в замужестве."}, {"id": 1904, "r": "В своем дому – урядник, в чужом доме – “базарник”."}, {"id": 1905, "r": "В своем доме – гость, в чужом доме – старшина (староста села)."}, {"id": 1906, "r": "У себя дома нет чурека, а гостях лучшие куски мяса выбирает."}, {"id": 1907, "r": "Постигли тебя неприятности - ходи гордо; постигли людей неприятности – ходи пону"}, {"id": 1908, "r": "И жена бывает приветливее, когда получит подарок."}, {"id": 1909, "r": "Холодно тому, кто блуждает на чужбине, тепло тому, кто греется у родного очага."}, {"id": 1910, "r": "Кто ни себе, тот и не людям; кто ни себе, и ни людям, тот и не для страны."}, {"id": 1911, "r": "Кто забудет сделанное ему добро, тот забудет и причиненный ему вред."}, {"id": 1912, "r": "Делай добро лишь тому, кто может его оценить."}, {"id": 1913, "r": "Человек нередко забывает сделанное ему добро, но вот сделанное зло – никогда."}, {"id": 1914, "r": "Одинаковы и тот кто знает, что делать и не делает, и тот, кто не знает, что дела"}, {"id": 1915, "r": "Довольствующийся природным умом – ограниченный человек."}, {"id": 1916, "r": "Даже корова знает того, кто ей корм задает."}, {"id": 1917, "r": "Бог Дяла дает больше ума своему любимцу."}, {"id": 1918, "r": "Не все, что есть за душою, надо рассказывать."}, {"id": 1919, "r": "Кто болтает лишнее, пусть не живет и для того, чтобы попросить себе нужное."}, {"id": 1920, "r": "Тому, кто свое горе считает огромным, надо знать, что бывает и более тяжкое горе"}, {"id": 1921, "r": "На своем горбу не видит ишака с арбою, а на чужой голове видит вошь и гниду."}, {"id": 1922, "r": "Знающий свои недостатки не станет распостраняться о чужих."}, {"id": 1923, "r": "Человек не может сказать больше того, что он знает."}, {"id": 1924, "r": "За плату мулла даже для собаки изготовил талисман."}, {"id": 1925, "r": "Незнающий любит давать советы."}, {"id": 1926, "r": "Кто не ценит хотя бы и двухкопеечной услуги, сам не стоит двух копеек."}, {"id": 1927, "r": "Кто не приемлет справедливого замечания, тот лишен стыда."}, {"id": 1928, "r": "Люди не любят кичливого человека."}, {"id": 1929, "r": "Для гостя обхождение ценнее угощения."}, {"id": 1930, "r": "Сам себе враг тот, кто шутит с оружием."}, {"id": 1931, "r": "Тайна двух будет известна всем."}, {"id": 1932, "r": "Пищи, приготовленной на двоих, хватило на троих."}, {"id": 1933, "r": "Без хозяина и поле – не поле, без пастуха и стадо – не стадо."}, {"id": 1934, "r": "И мышь стала кусаться, когда ее стали убивать."}, {"id": 1935, "r": "Сделанное самим кажется милее."}, {"id": 1936, "r": "Пугает всех оглоблею, за что и бывает всеми битым."}, {"id": 1937, "r": "И волк бежит, когда знает, что не победит."}, {"id": 1938, "r": "Как человек кормит корову, так и она кормит человека."}, {"id": 1939, "r": "Холм, который сам одолел, кажется с гору."}, {"id": 1940, "r": "Пусть у меня лучше от жары борода повылезет, чем от холода заболит кончик пальца"}, {"id": 1941, "r": "Продрогшего горячая пища согревает лучше жаркой печки."}, {"id": 1942, "r": "Если волк в год раз не поест мяса ишака, его одолевает чесотка."}, {"id": 1943, "r": "Можно хотя бы и раз в году послушаться совета жены."}, {"id": 1944, "r": "Что сделано быками, съедают лошади; что наработано летом, съедает зима."}, {"id": 1945, "r": "Быкам – ярмо, ишакам – вьючное седло."}, {"id": 1946, "r": "Даже птицы свою родину больше любят."}, {"id": 1947, "r": "И рукам теплее, когда они вместе."}, {"id": 1948, "r": "Как коню нужна плетка, так жене – крепкая мужская рука."}, {"id": 1949, "r": "Дважды сказанное и на мельнице услышали."}, {"id": 1950, "r": "Дважды сказанное и дурак понял, и глухой услышал."}, {"id": 1951, "r": "Умереть, будучи опозоренным, значит умереть дважды."}, {"id": 1952, "r": "Идущий не спеша, ушел далеко."}, {"id": 1953, "r": "Угощение вкуснее, когда хозяин любезнее."}, {"id": 1954, "r": "Пасшемуся у обрыва быку ишак сказал: “Не тянись к пропасти, - ляжешь на мою спин"}, {"id": 1955, "r": "Бывалый на пирах знает законы застолья."}, {"id": 1956, "r": "Каково молоко, таково и масло."}, {"id": 1957, "r": "Язык, выученный с молоком матери, не забывается до кончины."}, {"id": 1958, "r": "Брат, кузен, свояк… разве не лучше, чем чужак."}, {"id": 1959, "r": "Из года в год человек горбится – это земля зовет его к себе."}, {"id": 1960, "r": "Абреки села не основали."}, {"id": 1961, "r": "Самый большой бурдюк – человеческий живот."}, {"id": 1962, "r": "Нет ничего хуже, чем сдружиться с подлецом."}, {"id": 1963, "r": "Когда вороне сказали: “Принеси то, что ты считаешь самым красивым”, - она, говор"}, {"id": 1964, "r": "Нашелся хулитель который даже про самую красивую девушку сказал: “У нее шея длин"}, {"id": 1965, "r": "Даже о самом прекрасном творении нашли повод сказать плохое."}, {"id": 1966, "r": "Самый никудышный хозяин – и тот царь в своем доме."}, {"id": 1967, "r": "Захотевший поссориться с другом попросил у него луку седла (т.е. – в долг)."}, {"id": 1968, "r": "Ишак и тот, кто не обидится (когда есть на что), и тот, кто, обидевшись, со врем"}, {"id": 1969, "r": "Благородный, если он и рассердится, отходчив; неблагородный же постоянно держит "}, {"id": 1970, "r": "Имевший тысячи голов скота и лошадей сгинул, а имевший тысячи родственников, выж"}, {"id": 1971, "r": "Благородного от неблагородного легко отличить."}, {"id": 1972, "r": "Неблагородного видно по его поведению за столом."}, {"id": 1973, "r": "Благородный не говорит о недостатках других людей и не укоряет их в этом."}, {"id": 1974, "r": "Где нет благородства, там нет и мужества; где нет мужества, там нет и благородст"}, {"id": 1975, "r": "Благородство лишь у того, кто ведет себя благородно."}, {"id": 1976, "r": "Благородство сказало: “Вы найдете меня там, где есть стыд и совесть!”."}, {"id": 1977, "r": "На благородном и мешковина хорошо смотрится."}, {"id": 1978, "r": "Благородный человек девять своих дурных поступков исправляет одним благородным; "}, {"id": 1979, "r": "Веди себя благородно и с неблагородным – не ради него, а ради себя."}, {"id": 1980, "r": "У гуляки хозяйство плачет."}, {"id": 1981, "r": "Будешь с другими запанибрата – к тебе отнесутся панибратски."}, {"id": 1982, "r": "Из материи, которой хватает на рубаху, не сошьешь и брюк, если материя ходила по"}, {"id": 1983, "r": "Неук не бывает иноходцем."}, {"id": 1984, "r": "Если даже ты один и в безлюдной пустыне, будь благородным сам для себя."}, {"id": 1985, "r": "Ветер играет прутиком, который одиноко растет на пустоши."}, {"id": 1986, "r": "Никчемный мужчина трезвый – овца, пьяный – волк."}, {"id": 1987, "r": "Никудышный мужчина бывает храбрым с женою."}, {"id": 1988, "r": "Чем дружить с никчемными людьми, лучше враждовать с мужественными."}, {"id": 1989, "r": "Если ты затеешь вражду с ничтожными людьми, то и тебя посчитают ничтожеством."}, {"id": 1990, "r": "С ничтожным человеком не водись, ибо он в лицо тебе будет льстить, а за твоей сп"}, {"id": 1991, "r": "Лучше раньше времени скончаться, чем жить не по совести."}, {"id": 1992, "r": "Стыд да совесть и не купишь, и не продашь."}, {"id": 1993, "r": "Честь и благородство на базаре не продаются и не покупаются."}, {"id": 1994, "r": "Благородства не ищет там, где царят голод и нищета."}, {"id": 1995, "r": "Слова “совесть” и “благородство” мы произносим вместе, т.к. они неразлучны."}, {"id": 1996, "r": "Нуждаешься в чем-то – ищи это."}, {"id": 1997, "r": "Изорвавшийся платок вышел замуж за дырявый чувяк (родня к родне)."}, {"id": 1998, "r": "Погасший во время разжигания костер, в самом начале прервавшееся потомство."}, {"id": 1999, "r": "По одеялу протягивай ноги."}, {"id": 2000, "r": "Что на селе – мешок, то в Буро (Владикавказе) – всего лишь кожаная торба."}, {"id": 2001, "r": "Сделанное селу – осталось, сделанное селом – тоже осталось (неотомщенным)."}, {"id": 2002, "r": "Пес, выросший в центре села, лучше, чем человек, выросший на отшибе."}, {"id": 2003, "r": "У того, кто поссорился со всем селом, очаг потух."}, {"id": 2004, "r": "Волк, враждовавший с селом, издох, село же живет."}, {"id": 2005, "r": "Отданное в долг – ножницы, режущие родство."}, {"id": 2006, "r": "Дай в долг – и друг, и родственник отдалятся от тебя."}, {"id": 2007, "r": "Да не попросят у нас взаймы: дашь, не дашь – все равно родство испорчено."}, {"id": 2008, "r": "Берущему кажется, что у дающего осталось еще много."}, {"id": 2009, "r": "Надо остерегаться того, кто льстит тебе в лицо."}, {"id": 2010, "r": "Бывает: лицом смуглый, а сердцем чистый; лицом белый, а сердцем черный."}, {"id": 2011, "r": "Пришло волку время умирать, он взобрался на курган (от гордости) и там умер."}, {"id": 2012, "r": "Ограда рая сделана из чести и достоинства."}, {"id": 2013, "r": "Как ни прекрасен рай, все же этот мир покидать никто не хочет."}, {"id": 2014, "r": "Ворота рая сделаны из терпения и выдержки."}, {"id": 2015, "r": "Заупрямившаяся лошадь кнута заработала."}, {"id": 2016, "r": "Гордый пес не умирает на своем дворе (хороший пес умер на стороне)."}, {"id": 2017, "r": "Где гордость, там и благородство; где благородство, там и гордость."}, {"id": 2018, "r": "Белая зависть (соревновательность) – от чистого сердца, черная зависть – от гряз"}, {"id": 2019, "r": "Кусочек курдюка сытнее котла каши."}, {"id": 2020, "r": "У засидевшегося волка хвост облез."}, {"id": 2021, "r": "Засидевшаяся в девках одолела мать шайтанов."}, {"id": 2022, "r": "Выигравшему – шапка, проигравшему – пинок."}, {"id": 2023, "r": "Выстрелил и взорвался пистолет у Заки."}, {"id": 2024, "r": "Читающему отходную молитву когда-нибудь ее тоже прочтут."}, {"id": 2025, "r": "Пустая (без зерна) мельница помола не дает, от пустых разговоров пользы не бывае"}, {"id": 2026, "r": "Пустая посуда обычно гремит."}, {"id": 2027, "r": "Полная глиняная посуда лучше, чем золотая да пустая."}, {"id": 2028, "r": "Похвально стремление быть лучше других, но нельзя таить черную итое добро ветер унес."}, {"id": 16, "inh": "Аттаг1адар дите халаг1адар де.", "rus": "Отложи то, что легче сделать, и сделай то, что сделать труднее."}, {"id": 17, "inh": "Ахорхо екханга хьеж.", "rus": "Пазарь всегда ждет хорошей погоды."}, {"id": 18, "inh": "Ахча доацачоа бохча эшац, эхь доацачоа бехк хетац.", "rus": "Безденежному кошелек не нужен, бесстыдному молва не страшна."}, {"id": 19, "inh": "Ахча долча даьна г1улакх ийшадац, зудал долча сага на1алт ийшадац.", "rus": "Богатому забот хватало, интригану проклятий хватало."}, {"id": 20, "inh": "Ахча хьалаха хала дац, ахча бе къовла хала да.", "rus": "Добыть деньги не сложно, куда сложнее их удержать."}, {"id": 21, "inh": "Ахчано воацачох вар вой а, ше воацар-ам хургвац.", "rus": "С деньгам и ничтожество мнит себя величиною, но стать ею ему не дано."}, {"id": 22, "inh": "Ахчано гаргало хотт, ахчано из йоха а ю.", "rus": "Деньги сплачивают родство, и они же рвут узы родства."}, {"id": 23, "inh": "Ахчеи рузкъеи мара кхы х1ама ца гуча нахах б1ехача х1аман юкъера водаш санна вада веза.", "rus": "От людей, ничего, кроме богатства, не видящих, надо бежать, как от самой большой грязи."}, {"id": 24, "inh": "Ахчо сигала бода никъ лехаб.", "rus": "Деньги нашли дорогу на небеса."}, {"id": 25, "inh": "Ахчо хьаькъал совдаккхац, дешаро совдоаккх.", "rus": "Деньги ума не добавляют, его приумножает учение."}, {"id": 26, "inh": "Ахьа х1ама йоаца хьайра санна латт дезал боаца ков.", "rus": "Двор без семьи (большой), что мельница без зерна."}, {"id": 27, "inh": "Ахьар доацаш хьайра йисаянц.", "rus": "Без помола мельница не останется."}, {"id": 28, "inh": "Аькх уха саг къажкъайга тара ва.", "rus": "Доносчик похож на сороку."}, {"id": 29, "inh": "Аькхано баькха сардам чарахьах бода.", "rus": "Проклятие подстреленного зверя настигает охотника."}, {"id": 30, "inh": "Аьл т1а хайнавар аьнна, аьла хилац.", "rus": "Сев на стог, князем не станешь (игра на созвучии слов “князь”, “стог”)."}, {"id": 31, "inh": "Аьлан во1 агара ма валва, берза к1аза къоргара ма яйла, яхь йоацар нанас ма волва.", "rus": "Пусть княжеский сын не выйдет из люльки, пусть волчонок не выползет из логова, пусть мать не родит никчемного сына."}, {"id": 32, "inh": "Аьлан т1а аьла тац.", "rus": "Над князем князь не нужет (не приличествует)."}, {"id": 33, "inh": "Аьл-дит дувцачун т1еххьара мотт хоадабу.", "rus": "Приходит время, когда и сплетника лишают языка."}, {"id": 34, "inh": "Аьл-дитташка ладувг1ар – цомгар, уж ца дувцар – молха.", "rus": "Слушать сплетни – болезнь, не сплетничать – лекарство."}, {"id": 35, "inh": "Аьлча, дехкеваргвола дош ма ала.", "rus": "Не молви слово, о котором потом пожалеешь."}, {"id": 36, "inh": "Аьннар дергдоаца во1-вошеи, яхача яхарг1йоаца йо1-йишеи вай ма кхувлда.", "rus": "Пусть не вырастет у нас непослушный сын или брат и неуживчивая в замужестве дочь или сестра."}, {"id": 37, "inh": "Аьннар хозаргдоаца во1-воша ма кхувла.", "rus": "Да не вырастут у нас непослушные сыновья и братья."}, {"id": 38, "inh": "Аьннача доаца дош – б1еха мух.", "rus": "Слово, которое не сдерживают, – ветры."}, {"id": 39, "inh": "Аьрзе б1ена чура аьшка хьадж йоаг1аш хул.", "rus": "Гнездо орла всегда железом пахнет."}, {"id": 40, "inh": "“Аьрзи я со”, - аьнна, дийнахьа лела яьнна бов аьрзена караяхай.", "rus": "Сова объвила себя орлом и стала летать днем, да тут же и угодила в орлиные когти."}, {"id": 41, "inh": "Аьттув боацчара юха а ваьле, хьай аьттув лаха.", "rus": "Отступись от того, чего не одолеешь (не победишь), и начни искать свою удачу."}, {"id": 42, "inh": "Аьхки б1ехало кхераваьр 1ай корсах кхийрав.", "rus": "Летом напуганный змеею, зимой испугался травяного жгута."}, {"id": 43, "inh": "Аьхки ваьг1ар 1ай иддав.", "rus": "Кто летом отсиживался, тот зимою бегал (в поисках пищи)."}, {"id": 44, "inh": "Аьхки ваг1ачун болар 1ай кадай хиннад.", "rus": "Кто летом отсиживался, у того зимой походка бывает шустрой."}, {"id": 45, "inh": "Аьхки дог1ах иддар 1ай лайх иддав.", "rus": "Кто летом прятался от дождя, тот зимою убе  да и мы не дураки – едим, сделав из хлеба ложки”."}, {"id": 91, "inh": "Берд мел ч1оаг1а бар, аьнна, хиво бохабу.", "rus": "И скалистый берег река подтачивает."}, {"id": 92, "inh": "Берза долаш ж1але царгел ч1оаг1аг1а да.", "rus": "Волчьи десна крепче собачьих зубов."}, {"id": 93, "inh": "Берза ехача бато цогал доакъош де 1омадаьд.", "rus": "Разбитая морда волка научила лису добычу делить."}, {"id": 94, "inh": "Берза когаш кадай децаре, берза къоахкаш ира ецаре, бордз аьнна ц1и мича хургьяр цун.", "rus": "Если бы волк не имел резвых ног и острых зубов, его бы и волком не назвали."}, {"id": 95, "inh": "Берза оаз массанена йовз, берза оаз йоландаь.", "rus": "Волчий вой все узнают, потому что это воет волк."}, {"id": 96, "inh": "Берза оаз тайначахьа д1айода.", "rus": "Волчий вой идет туда, куда ему заблагорассудится."}, {"id": 97, "inh": "Берзах ведда гаьн т1а ваьннав, гаьн т1а яг1аш ча хиннай.", "rus": "Испугался волка и забрался на дерево, а там – медведь сидит."}, {"id": 98, "inh": "Берзах кхерача даь жа хиннадац.", "rus": "Не было овец у того, кто боялся волка."}, {"id": 99, "inh": "Берзах пхьу хиннабац, бордз эшаеш пхьу хул.", "rus": "Волк не станет псом, но пес может стать волкодавом."}, {"id": 100, "inh": "Берзаца летача кома му1аш 1олийгай.", "rus": "Подрался баран с волком, у него рога и отпали."}, {"id": 101, "inh": "Берзо аьннад: “Се товча лата отт со, се эшача яда отт со”.", "rus": "Волк сказал: “Где вижу победу – иду в бой, где вижу поражение – отступаю”."}, {"id": 102, "inh": "Берзо дер де деннача цогала фоарт кагъеннай.", "rus": "Потягавшаяся с волком лисица шею свернула."}, {"id": 103, "inh": "Берзо кхераваьр ж1алех веддав.", "rus": "Напуганный волком бежал от собаки."}, {"id": 104, "inh": "Берзо устаг1а думенгара болабу.", "rus": "Волк овцу начинает поедать с курдюка."}, {"id": 105, "inh": "Берзо ца дихьар цогало дихьад.", "rus": "Чего не смог унести волк, унесла лиса."}, {"id": 106, "inh": "Берзо яьхад комага: “Доттаг1ал таса вай”.", "rus": "Волк пре
