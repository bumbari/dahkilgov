<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Ingush solar ornament — Laduga-Ladoga -->
  <circle cx="50" cy="50" r="48" fill="#1a0a00" stroke="#c8830a" stroke-width="3.5"/>
  <circle cx="50" cy="50" r="40" fill="#c8830a"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#1a0a00" stroke-width="2"/>
  <!-- 8 petals -->
  <g fill="#1a0a00" transform="translate(50,50)">
    <ellipse rx="5.5" ry="17" transform="rotate(0) translate(0,-17)"/>
    <ellipse rx="5.5" ry="17" transform="rotate(45) translate(0,-17)"/>
    <ellipse rx="5.5" ry="17" transform="rotate(90) translate(0,-17)"/>
    <ellipse rx="5.5" ry="17" transform="rotate(135) translate(0,-17)"/>
    <ellipse rx="5.5" ry="17" transform="rotate(180) translate(0,-17)"/>
    <ellipse rx="5.5" ry="17" transform="rotate(225) translate(0,-17)"/>
    <ellipse rx="5.5" ry="17" transform="rotate(270) translate(0,-17)"/>
    <ellipse rx="5.5" ry="17" transform="rotate(315) translate(0,-17)"/>
  </g>
  <circle cx="50" cy="50" r="9" fill="#1a0a00"/>
  <circle cx="50" cy="50" r="5" fill="#c8830a"/>
</svg>
